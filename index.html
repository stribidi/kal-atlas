<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>Kal Atlas — Linked KalOnline Knowledge Base</title>
  <style>
    /* Jade Archive, night reading: the pine rail is unchanged and the content
       surfaces are darkened to sit with it — deep pine-black ground, jade-grey
       panels, warm ivory type and the same copper rules. Item portraits and
       map artwork keep their light plates, because those are picture frames. */
    :root {
      --bg: #0f1a16;
      --panel: #16241f;
      --panel-2: #1b2b25;
      --panel-3: #22342d;
      --line: #31473e;
      --line-soft: #26372f;
      --text: #ece3d1;
      --muted: #a7b6ac;
      --dim: #7e8f84;
      --accent: #6cc6a0;
      --accent-ink: #0a1512;
      --gold: #d2a468;
      --danger: #e2887a;
      --blue: #74b7c7;
      --shadow: 0 14px 34px rgba(0, 0, 0, .38);
      --radius: 13px;
      --radius-sm: 8px;
      --sidebar: 244px;
    }

    * { box-sizing: border-box; }

    html {
      min-height: 100%;
      background: var(--bg);
      scroll-behavior: smooth;
    }

    body {
      min-height: 100vh;
      margin: 0;
      color: var(--text);
      background: var(--bg);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 15px;
      line-height: 1.5;
    }

    button, input, select { font: inherit; }

    a {
      color: var(--text);
      text-decoration: none;
    }

    a:hover { color: var(--accent); }

    button, .button {
      min-height: 40px;
      border: 1px solid var(--line);
      border-radius: var(--radius-sm);
      padding: 8px 13px;
      color: var(--text);
      background: var(--panel-3);
      cursor: pointer;
      transition: border-color .14s ease, color .14s ease, background .14s ease, transform .14s ease;
    }

    button:hover, .button:hover {
      border-color: #5f785f;
      color: var(--accent);
    }

    button:active, .button:active { transform: translateY(1px); }

    button.primary, .button.primary {
      border-color: var(--accent);
      color: var(--accent-ink);
      background: var(--accent);
      font-weight: 750;
    }

    button.ghost, .button.ghost { background: transparent; }

    button.small, .button.small {
      min-height: 30px;
      padding: 4px 9px;
      font-size: 12px;
    }

    :focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }

    .app-shell {
      min-height: 100vh;
      display: grid;
      grid-template-columns: var(--sidebar) minmax(0, 1fr);
    }

    .sidebar {
      position: sticky;
      top: 0;
      align-self: start;
      height: 100vh;
      border-right: 1px solid var(--line-soft);
      padding: 24px 16px 18px;
      background: #0b100e;
      overflow-y: auto;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 11px;
      margin: 0 5px 24px;
    }

    .brand-mark {
      width: 38px;
      height: 38px;
      display: grid;
      place-items: center;
      border: 1px solid var(--accent);
      color: var(--accent);
      font-weight: 900;
      letter-spacing: -.08em;
      box-shadow: inset 0 0 0 4px #111a13;
    }

    .brand strong {
      display: block;
      font-size: 14px;
      letter-spacing: .18em;
    }

    .brand span {
      display: block;
      color: var(--muted);
      font-size: 10px;
      letter-spacing: .12em;
      text-transform: uppercase;
    }

    .nav-label {
      margin: 20px 9px 7px;
      color: var(--dim);
      font-size: 10px;
      font-weight: 800;
      letter-spacing: .13em;
      text-transform: uppercase;
    }

    .nav {
      display: grid;
      gap: 3px;
    }

    .nav a {
      display: flex;
      align-items: center;
      justify-content: space-between;
      min-height: 39px;
      border: 1px solid transparent;
      border-radius: var(--radius-sm);
      padding: 8px 10px;
      color: var(--muted);
      font-size: 13px;
      font-weight: 650;
    }

    .nav a:hover {
      border-color: var(--line);
      color: var(--text);
      background: var(--panel);
    }

    .nav a.active {
      border-color: #41513f;
      color: var(--accent);
      background: var(--panel-2);
    }

    .nav-count {
      color: var(--dim);
      font-size: 11px;
      font-variant-numeric: tabular-nums;
    }

    .sidebar-status {
      margin: 24px 5px 0;
      border-top: 1px solid var(--line-soft);
      padding-top: 15px;
      color: var(--dim);
      font-size: 11px;
    }

    .sidebar-status strong {
      display: block;
      margin-bottom: 3px;
      color: var(--muted);
      font-size: 12px;
    }

    .workspace {
      min-width: 0;
      display: flex;
      flex-direction: column;
    }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 20;
      min-height: 68px;
      display: grid;
      /* The search column may shrink to 120px and the actions may wrap:
         between ~760px and ~1100px wide the old minmax(220px, 640px) plus a
         non-wrapping action row asked for more than the workspace had, and
         the whole bar scrolled sideways. */
      grid-template-columns: minmax(120px, 640px) auto;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      border-bottom: 1px solid var(--line-soft);
      padding: 12px 28px;
      background: rgba(8, 12, 11, .94);
      backdrop-filter: blur(12px);
    }

    .global-search {
      position: relative;
      display: flex;
      align-items: center;
    }

    .global-search input, .filter-input, select {
      width: 100%;
      min-height: 42px;
      border: 1px solid var(--line);
      border-radius: var(--radius-sm);
      padding: 9px 12px;
      color: var(--text);
      background: var(--panel);
    }

    .global-search input { padding-right: 86px; }

    .global-search button {
      position: absolute;
      right: 5px;
      min-height: 32px;
      padding: 4px 11px;
      border-color: transparent;
      color: var(--accent);
      background: transparent;
    }

    .top-actions {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      flex-wrap: wrap;
      gap: 8px;
      min-width: 0;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--dim);
    }

    .status-dot.ready { background: var(--accent); box-shadow: 0 0 0 4px rgba(214, 255, 99, .09); }
    .status-dot.error { background: var(--danger); }

    main {
      width: min(100%, 1540px);
      flex: 1;
      margin: 0 auto;
      padding: 30px clamp(20px, 3vw, 48px) 64px;
    }

    .page-head {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 24px;
      margin-bottom: 26px;
    }

    .eyebrow {
      margin-bottom: 6px;
      color: var(--accent);
      font-size: 11px;
      font-weight: 850;
      letter-spacing: .14em;
      text-transform: uppercase;
    }

    h1, h2, h3, h4 {
      margin-top: 0;
      color: var(--text);
      line-height: 1.15;
      letter-spacing: -.025em;
    }

    h1 {
      max-width: 900px;
      margin-bottom: 8px;
      font-size: clamp(30px, 4vw, 52px);
      font-weight: 790;
    }

    h2 {
      margin-bottom: 13px;
      font-size: 22px;
    }

    h3 {
      margin-bottom: 9px;
      font-size: 16px;
    }

    p { margin: 0 0 13px; }

    .lede {
      max-width: 860px;
      color: var(--muted);
      font-size: 16px;
    }

    .page-actions {
      display: flex;
      flex-wrap: wrap;
      justify-content: flex-end;
      gap: 8px;
    }

    .breadcrumb {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 7px;
      margin-bottom: 14px;
      color: var(--dim);
      font-size: 12px;
    }

    .breadcrumb a { color: var(--muted); }

    .metrics {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 12px;
      margin: 0 0 26px;
    }

    .metric {
      min-height: 112px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 18px;
      background: var(--panel);
      box-shadow: var(--shadow);
    }

    .metric strong {
      display: block;
      margin-bottom: 2px;
      color: var(--accent);
      font-size: 27px;
      font-variant-numeric: tabular-nums;
    }

    .metric span {
      color: var(--muted);
      font-size: 12px;
    }

    .section {
      margin: 0 0 22px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--panel);
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .section-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      border-bottom: 1px solid var(--line-soft);
      padding: 16px 18px;
      background: var(--panel-2);
    }

    .section-head h2, .section-head h3 { margin: 0; }

    .section-body { padding: 18px; }

    body.detail-route main { width: min(100%, 1320px); padding-top: 18px; }
    body.detail-route .breadcrumb { margin-bottom: 8px; }
    body.detail-route .page-head { gap: 14px; margin-bottom: 12px; }
    body.detail-route .page-head h1 {
      margin-bottom: 4px;
      font-size: clamp(25px, 2.7vw, 38px);
    }
    body.detail-route .lede { font-size: 14px; }
    body.detail-route .section { margin-bottom: 12px; }
    body.detail-route .section-head { padding: 10px 13px; }
    body.detail-route .section-head h2 { font-size: 17px; }
    body.detail-route .section-body { padding: 12px 13px; }
    body.detail-route .definition-grid { gap: 7px; }
    body.detail-route th, body.detail-route td { padding-top: 7px; padding-bottom: 7px; }

    .split {
      display: grid;
      grid-template-columns: minmax(0, 1.3fr) minmax(260px, .7fr);
      gap: 20px;
    }

    .directory-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 12px;
    }

    .directory-card {
      display: block;
      min-height: 132px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 17px;
      color: var(--text);
      background: var(--panel-2);
    }

    .directory-card:hover {
      border-color: #647b61;
      color: var(--text);
      background: var(--panel-3);
    }

    .directory-card strong {
      display: block;
      margin-bottom: 7px;
      font-size: 17px;
    }

    .directory-card p {
      margin: 0;
      color: var(--muted);
      font-size: 12px;
    }

    .directory-card .count {
      display: block;
      margin-top: 12px;
      color: var(--accent);
      font-size: 12px;
      font-weight: 750;
    }

    .toolbar {
      display: grid;
      grid-template-columns: minmax(190px, 1fr) repeat(2, minmax(140px, 220px)) auto;
      gap: 9px;
      margin-bottom: 15px;
    }

    .toolbar .button { display: inline-grid; place-items: center; }

    .table-wrap {
      width: 100%;
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
    }

    th {
      border-bottom: 1px solid var(--line);
      padding: 10px 11px;
      color: var(--dim);
      background: #0e1512;
      font-size: 10px;
      font-weight: 800;
      letter-spacing: .08em;
      text-align: left;
      text-transform: uppercase;
      white-space: nowrap;
    }

    td {
      border-bottom: 1px solid var(--line-soft);
      padding: 11px;
      color: var(--muted);
      vertical-align: top;
    }

    tr:last-child td { border-bottom: 0; }
    tbody tr:hover td { background: rgba(255, 255, 255, .015); }

    td a {
      color: var(--text);
      font-weight: 680;
    }

    .number {
      font-variant-numeric: tabular-nums;
      text-align: right;
    }

    .mono, code, pre {
      font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace;
    }

    .mono { font-size: 12px; }

    code {
      border: 1px solid var(--line-soft);
      border-radius: 5px;
      padding: 1px 5px;
      color: var(--gold);
      background: #0c120f;
      font-size: .92em;
    }

    pre {
      max-width: 100%;
      overflow: auto;
      border: 1px solid var(--line);
      border-radius: var(--radius-sm);
      padding: 14px;
      color: #cbd7cf;
      background: #090e0c;
      font-size: 12px;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    .tag-row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 6px;
    }

    /* Client icon set, converted from data\HyperText by tools\client_icons. */
    .icon {
      image-rendering: pixelated;
      vertical-align: middle;
      flex: none;
    }

    .icon-missing {
      opacity: 0.25;
      background: repeating-linear-gradient(45deg, #2a352f 0 3px, transparent 3px 6px);
      border-radius: 3px;
    }

    /* The character sheet, in the KalEncyclopedia idiom: warm leather panel,
       gold rules, label left / value right, two columns. */
    .sheet {
      --sheet-ink: #f3e4c0;
      --sheet-label: #c9a227;
      --sheet-rule: #6d5423;
      background:
        radial-gradient(120% 90% at 12% 0%, #3d3020 0%, #241c12 55%, #1a140d 100%);
      border: 1px solid #6d5423;
      border-radius: 10px;
      padding: 16px 18px;
      color: var(--sheet-ink);
      box-shadow: inset 0 0 0 1px #0d0a06, inset 0 1px 0 #7d6330;
      font-size: 0.9rem;
    }

    .sheet-head {
      display: flex;
      flex-wrap: wrap;
      gap: 8px 22px;
      padding-bottom: 10px;
      border-bottom: 1px solid var(--sheet-rule);
      margin-bottom: 12px;
    }

    .sheet-head b { color: #fff; font-weight: 600; }
    .sheet-head span { color: var(--sheet-label); }

    .sheet-bars { display: grid; gap: 7px; margin-bottom: 14px; }

    .sheet-bar {
      display: grid;
      grid-template-columns: 108px 1fr auto;
      align-items: center;
      gap: 10px;
    }

    .sheet-bar > span:first-child { color: var(--sheet-label); }

    .sheet-bar .track {
      height: 13px;
      border: 1px solid #0d0a06;
      border-radius: 7px;
      background: #120d08;
      overflow: hidden;
    }

    .sheet-bar .fill { height: 100%; border-radius: 6px; }
    .sheet-bar .fill.hp { background: linear-gradient(90deg, #6d1414, #c0392b); }
    .sheet-bar .fill.mp { background: linear-gradient(90deg, #14356d, #2b7ac0); }
    .sheet-bar b { color: #fff; font-variant-numeric: tabular-nums; }

    .sheet-cols {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
      gap: 4px 28px;
    }

    .sheet-line {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      padding: 3px 0;
      border-bottom: 1px dotted #4a3a1c;
    }

    .sheet-line > span { color: var(--sheet-label); }
    .sheet-line > b { color: #fff; font-weight: 600; font-variant-numeric: tabular-nums; }
    .sheet-line small { color: #9c8a63; font-weight: 400; }

    .sheet-section {
      margin-top: 14px;
      padding-top: 10px;
      border-top: 1px solid var(--sheet-rule);
    }

    .sheet-section h4 {
      margin: 0 0 8px;
      font-size: 0.72rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--sheet-label);
    }

    /* Equipment slots, icon first. */
    .slot-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
      gap: 10px;
    }

    .slot {
      display: flex;
      align-items: center;
      gap: 9px;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 7px 9px;
    }

    .slot-icon {
      width: 34px;
      height: 34px;
      display: grid;
      place-items: center;
      border: 1px solid #0d0a06;
      border-radius: 5px;
      background: #120d08;
      flex: none;
    }

    .slot-body { min-width: 0; flex: 1; }
    .slot-body span { display: block; font-size: 0.72rem; color: var(--muted, #8fa39a); }
    .slot-body select { width: 100%; margin-top: 3px; }

    .field-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(190px, 1fr));
      gap: 12px;
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 4px;
      font-size: 0.85rem;
    }

    .field > span {
      color: var(--muted, #8fa39a);
      letter-spacing: 0.02em;
    }

    .field input,
    .field select {
      background: var(--panel);
      color: inherit;
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 7px 9px;
      font: inherit;
      width: 100%;
    }

    .field input[type="checkbox"] {
      width: auto;
      align-self: flex-start;
    }

    .field input:focus,
    .field select:focus {
      outline: 2px solid var(--accent, #6fd3a6);
      outline-offset: 1px;
    }

    .tag {
      display: inline-flex;
      align-items: center;
      min-height: 24px;
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 2px 8px;
      color: var(--muted);
      background: var(--panel-2);
      font-size: 11px;
      white-space: nowrap;
    }

    .tag.accent { border-color: #53643c; color: var(--accent); }
    .tag.gold { border-color: #604d2e; color: var(--gold); }
    .tag.blue { border-color: #31536a; color: var(--blue); }
    .tag.danger { border-color: #693d38; color: var(--danger); }

    .definition-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 1px;
      border: 1px solid var(--line-soft);
      background: var(--line-soft);
    }

    .definition {
      min-height: 86px;
      padding: 13px;
      background: var(--panel);
    }

    .definition dt {
      margin-bottom: 4px;
      color: var(--dim);
      font-size: 10px;
      font-weight: 800;
      letter-spacing: .08em;
      text-transform: uppercase;
    }

    .definition dd {
      margin: 0;
      color: var(--text);
      overflow-wrap: anywhere;
    }

    .callout {
      border-left: 3px solid var(--gold);
      padding: 12px 14px;
      color: var(--muted);
      background: #17150f;
    }

    .callout strong { color: var(--gold); }
    .callout.info { border-left-color: var(--blue); background: #0e161a; }
    .callout.info strong { color: var(--blue); }
    .callout.error { border-left-color: var(--danger); background: #1b1010; }
    .callout.error strong { color: var(--danger); }
    /* Something to notice rather than something wrong. */
    .callout.warn { border-left-color: var(--gold); background: #1c1710; }
    .callout.warn strong { color: var(--gold); }

    .empty {
      border: 1px dashed var(--line);
      border-radius: var(--radius-sm);
      padding: 28px;
      color: var(--dim);
      text-align: center;
    }

    .pagination {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-top: 15px;
      color: var(--dim);
      font-size: 12px;
    }

    .pagination div {
      display: flex;
      gap: 6px;
    }

    .result-list { display: grid; gap: 8px; }

    .result {
      display: grid;
      grid-template-columns: 104px minmax(0, 1fr) auto;
      align-items: center;
      gap: 14px;
      border: 1px solid var(--line-soft);
      border-radius: var(--radius-sm);
      padding: 12px;
      background: var(--panel-2);
    }

    .result:hover { border-color: #4a5f4a; }

    .result-type {
      color: var(--dim);
      font-size: 10px;
      font-weight: 800;
      letter-spacing: .08em;
      text-transform: uppercase;
    }

    .result strong { color: var(--text); }
    .result small { color: var(--muted); }

    .article {
      max-width: 930px;
      color: #c3cec7;
    }

    .article h1, .article h2, .article h3, .article h4 {
      margin-top: 28px;
      scroll-margin-top: 90px;
    }

    .article h1 { font-size: 34px; }
    .article h2 { font-size: 24px; }
    .article h3 { font-size: 18px; }
    .article blockquote {
      margin: 16px 0;
      border-left: 3px solid var(--line);
      padding: 4px 16px;
      color: var(--muted);
    }

    .article li { margin-bottom: 5px; }
    .article img { max-width: 100%; border-radius: var(--radius-sm); }
    .article hr { border: 0; border-top: 1px solid var(--line); margin: 28px 0; }

    .connect {
      max-width: 760px;
      margin: clamp(40px, 9vh, 110px) auto 0;
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: clamp(24px, 5vw, 48px);
      background: var(--panel);
      box-shadow: var(--shadow);
    }

    .connect h1 { font-size: clamp(32px, 6vw, 58px); }

    .connect-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 9px;
      margin: 22px 0;
    }

    .connect-list {
      display: grid;
      gap: 8px;
      margin-top: 22px;
      color: var(--muted);
      font-size: 13px;
    }

    .connect-list div {
      display: grid;
      grid-template-columns: 24px 1fr;
      gap: 8px;
    }

    .progress {
      width: 100%;
      height: 4px;
      margin-top: 20px;
      background: var(--line-soft);
      overflow: hidden;
    }

    .progress span {
      display: block;
      height: 100%;
      width: 0;
      background: var(--accent);
      transition: width .18s ease;
    }

    .loading-line {
      margin-top: 9px;
      color: var(--dim);
      font-size: 12px;
    }

    dialog {
      width: min(720px, calc(100vw - 28px));
      max-height: min(82vh, 850px);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 0;
      color: var(--text);
      background: var(--panel);
      box-shadow: 0 24px 80px rgba(0, 0, 0, .7);
    }

    dialog::backdrop { background: rgba(0, 0, 0, .72); }

    .dialog-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      border-bottom: 1px solid var(--line);
      padding: 15px 18px;
      background: var(--panel-2);
    }

    .dialog-head h2 { margin: 0; font-size: 18px; }
    .dialog-body { max-height: 65vh; overflow: auto; padding: 18px; }

    .kv {
      display: grid;
      grid-template-columns: minmax(130px, .35fr) minmax(0, 1fr);
      gap: 1px;
      background: var(--line-soft);
    }

    .kv > div {
      min-height: 39px;
      padding: 9px 11px;
      background: var(--panel);
      overflow-wrap: anywhere;
    }

    .kv > div:nth-child(odd) {
      color: var(--dim);
      font-size: 11px;
      font-weight: 750;
    }

    .muted { color: var(--muted); }
    .dim { color: var(--dim); }
    .accent { color: var(--accent); }
    .danger { color: var(--danger); }
    .nowrap { white-space: nowrap; }
    .wrap-anywhere { overflow-wrap: anywhere; }
    .hidden { display: none !important; }

    /* Jade Archive: an ivory reading surface framed by a pine-jade rail.
       The faint geometry is decorative only and never sits behind data. */
    .sidebar {
      color: #f4efe2;
      background:
        linear-gradient(150deg, transparent 0 73%, rgba(185, 143, 91, .08) 73% 74%, transparent 74%),
        linear-gradient(30deg, transparent 0 78%, rgba(240, 232, 213, .05) 78% 79%, transparent 79%),
        #143d30;
      border-right-color: #0e2e24;
    }

    .brand-mark {
      border-color: #c49a67;
      color: #f4efe2;
      box-shadow: inset 0 0 0 4px #1d4b3b;
    }

    .brand strong, .sidebar .nav a:hover { color: #fffaf0; }
    .brand span, .sidebar .nav-label, .sidebar .nav-count,
    .sidebar-status, .sidebar-status strong { color: #b7c7bd; }

    .sidebar .nav a { color: #d8e1db; }
    .sidebar .nav a:hover {
      border-color: rgba(240, 232, 213, .22);
      background: rgba(255, 255, 255, .06);
    }
    .sidebar .nav a.active {
      border-color: rgba(196, 154, 103, .72);
      color: #fff7e8;
      background: #205440;
      box-shadow: inset 3px 0 0 #c49a67;
    }
    .sidebar-status { border-top-color: rgba(240, 232, 213, .16); }

    .topbar {
      background: rgba(11, 22, 18, .93);
      box-shadow: 0 7px 24px rgba(0, 0, 0, .3);
    }

    button:hover, .button:hover, .directory-card:hover, .result:hover {
      border-color: #4f7d67;
    }

    th { background: #12201b; color: var(--dim); }
    tbody tr:hover td { background: rgba(108, 198, 160, .055); }
    code { color: var(--gold); background: #101d18; }
    pre { color: #cfdcd3; background: #0c1713; }
    .icon-missing {
      background: repeating-linear-gradient(45deg, #2e3f37 0 3px, transparent 3px 6px);
    }

    .tag.accent { border-color: #3c6a56; }
    .tag.gold { border-color: #6c542f; }
    .tag.blue { border-color: #3a6069; }
    .tag.danger { border-color: #6f4039; }
    .callout { background: #1a2620; }
    .callout.info { background: #14242a; }
    .callout.error { background: #261a18; }
    .article { color: #c8d4cb; }
    dialog { box-shadow: 0 24px 80px rgba(0, 0, 0, .62); }
    dialog::backdrop { background: rgba(4, 12, 9, .72); }

    .status-dot.ready { box-shadow: 0 0 0 4px rgba(108, 198, 160, .12); }

    .item-identity {
      display: grid;
      grid-template-columns: 190px minmax(300px, 520px);
      gap: 14px;
      align-items: stretch;
      justify-content: start;
      margin-bottom: 14px;
    }
    .item-preview {
      min-height: 170px;
      display: grid;
      place-items: center;
      border: 1px solid #bfa77f;
      border-radius: var(--radius);
      background:
        linear-gradient(135deg, rgba(31, 90, 69, .08), transparent 55%),
        #eee7d9;
      box-shadow: inset 0 0 0 1px #fffaf0;
    }
    .item-preview .icon { width: 88px; height: 88px; }
    .kalenc-preview {
      display: block;
      max-width: 172px;
      max-height: 290px;
      width: auto;
      height: auto;
      object-fit: contain;
      image-rendering: auto;
    }
    .item-identity.armor-set .item-preview { min-height: 300px; }
    .item-preview-note {
      display: flex;
      flex-direction: column;
      justify-content: center;
      border-left: 3px solid #b78654;
      padding: 18px 20px;
      color: var(--muted);
      background: var(--panel);
    }
    .item-preview-note strong { color: var(--text); }

    .sim-workspace {
      display: grid;
      grid-template-columns: minmax(350px, .82fr) minmax(590px, 1.38fr);
      gap: 20px;
      align-items: start;
    }
    .sim-column { min-width: 0; }
    .sim-column > .section:last-child { margin-bottom: 0; }
    .sim-threat-column {
      position: sticky;
      top: 88px;
      max-height: calc(100vh - 108px);
      overflow: auto;
      scrollbar-gutter: stable;
    }
    .sim-character-fields {
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }
    .sim-character-fields .field:first-child { grid-column: 1 / -1; }
    .sim-core-slots {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 9px;
    }
    .sim-core-slots .slot:last-child:nth-child(odd) { grid-column: 1 / -1; }
    .sim-advanced { margin-top: 12px; }
    .sim-advanced .slot-grid { margin-top: 12px; }
    .sim-note {
      margin: 0 0 12px;
      color: var(--dim);
      font-size: 12px;
    }

    /* Character Creation: the denser, icon-led KalEncyclopedia workflow
       redrawn as a Jade Archive screen. */
    body {
      background:
        radial-gradient(circle at 84% 8%, rgba(173, 129, 70, .11), transparent 24rem),
        repeating-linear-gradient(135deg, transparent 0 42px, rgba(236, 227, 209, .022) 42px 43px),
        var(--bg);
    }

    .sidebar {
      isolation: isolate;
      overflow: hidden;
    }
    .sidebar::before {
      content: "";
      position: absolute;
      inset: 0;
      z-index: -1;
      pointer-events: none;
      background:
        linear-gradient(180deg, rgba(13, 45, 35, .38), rgba(13, 45, 35, .74) 54%, rgba(13, 45, 35, .26)),
        linear-gradient(90deg, rgba(11, 36, 29, .1), rgba(11, 36, 29, .4));
    }
    .sidebar-illustration {
      position: absolute;
      inset: 0;
      z-index: -2;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: 64% center;
      opacity: .74;
      filter: saturate(.9) contrast(1.04);
      pointer-events: none;
    }

    main::before {
      content: "";
      display: block;
      width: 96px;
      height: 8px;
      margin: -9px 0 21px;
      border-top: 1px solid #aa7c48;
      border-bottom: 1px solid #aa7c48;
      opacity: .7;
    }

    h1, h2, h3, .brand strong {
      font-family: Georgia, "Times New Roman", serif;
    }

    .profile-switcher {
      display: flex;
      align-items: center;
      gap: 7px;
      border-left: 1px solid var(--line-soft);
      padding-left: 12px;
    }
    .profile-switcher label {
      color: var(--muted);
      font-size: 11px;
      white-space: nowrap;
    }
    .profile-switcher select {
      min-width: 132px;
      min-height: 34px;
      padding: 5px 26px 5px 9px;
      color: #f8f5ec;
      background: #1f5a45;
      border-color: #8d704e;
      font-weight: 700;
    }

    .character-tabs {
      display: flex;
      gap: 4px;
      margin: 0 0 18px;
      border-bottom: 1px solid #6d5638;
      padding: 0 8px;
    }
    .character-tabs a {
      position: relative;
      min-width: 106px;
      border: 1px solid transparent;
      border-bottom: 0;
      padding: 10px 15px 9px;
      color: var(--muted);
      text-align: center;
      font-family: Georgia, "Times New Roman", serif;
      font-weight: 700;
    }
    .character-tabs a.active {
      margin-bottom: -1px;
      border-color: #6d5638;
      color: var(--accent);
      background: var(--panel);
      box-shadow: inset 0 3px 0 #c08a4c;
    }

    .character-banner {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      align-items: end;
      gap: 18px;
      margin-bottom: 18px;
      border: 1px solid #6d5638;
      border-radius: var(--radius);
      padding: 16px 18px;
      background:
        linear-gradient(105deg, rgba(24, 74, 57, .96), rgba(22, 66, 51, .9) 58%, rgba(97, 64, 34, .9)),
        #1a4c3b;
      color: #fff8e9;
      box-shadow: var(--shadow);
    }
    .character-banner .field { max-width: 360px; }
    .character-banner .field > span { color: #d7dfd9; }
    .character-banner input {
      color: #fff8e9;
      background: rgba(10, 40, 30, .32);
      border-color: rgba(237, 214, 174, .58);
      font-family: Georgia, "Times New Roman", serif;
      font-size: 20px;
      font-weight: 700;
    }
    .character-banner-actions { display: flex; flex-wrap: wrap; gap: 7px; }
    .character-banner .button {
      border-color: rgba(237, 214, 174, .5);
      color: #fff8e9;
      background: rgba(10, 40, 30, .2);
    }

    .character-layout {
      display: grid;
      grid-template-columns: minmax(310px, .76fr) minmax(520px, 1.24fr);
      gap: 20px;
      align-items: start;
    }

    .equipment-board {
      position: relative;
      min-height: 392px;
      border: 1px solid #5c4830;
      border-radius: var(--radius);
      padding: 16px;
      background:
        radial-gradient(circle at 50% 40%, rgba(108, 198, 160, .07), transparent 34%),
        linear-gradient(135deg, rgba(236, 227, 209, .05), transparent 55%),
        #16241f;
      box-shadow: inset 0 0 0 1px rgba(236, 227, 209, .05);
    }
    .equipment-board::before {
      content: "裝";
      position: absolute;
      inset: 82px 0 auto;
      color: rgba(108, 198, 160, .06);
      font-family: Georgia, serif;
      font-size: 148px;
      line-height: 1;
      text-align: center;
      pointer-events: none;
    }
    .equipment-board-help {
      margin-bottom: 13px;
      color: var(--muted);
      font-size: 12px;
      text-align: center;
    }
    .equipment-slot-grid {
      position: relative;
      display: grid;
      grid-template-columns: repeat(3, minmax(76px, 1fr));
      gap: 10px;
    }
    /* Fill-all-armor: plain dropdowns, deliberately no icons and no cascade. */
    .armor-fill {
      margin-top: 14px;
      border: 1px solid var(--line-soft);
      border-radius: 9px;
      padding: 8px 10px;
      background: rgba(236, 227, 209, .035);
    }
    .armor-fill > summary {
      color: var(--gold);
      font-size: 11.5px;
      font-weight: 700;
      letter-spacing: .04em;
      cursor: pointer;
    }
    .armor-fill-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
      margin: 10px 0 4px;
    }
    .armor-fill-grid .field span { font-size: 10.5px; }
    .armor-fill-grid select { font-size: 12px; padding: 4px 6px; }
    .armor-fill-action { grid-column: 1 / -1; }
    .armor-fill-action .button { width: 100%; }
    .armor-fill p { margin: 4px 0 0; }
    .equipment-slot {
      min-width: 0;
      border: 1px solid #3b5145;
      border-radius: 9px;
      padding: 8px 6px;
      color: var(--text);
      background: rgba(236, 227, 209, .045);
      text-align: center;
      cursor: context-menu;
      box-shadow: 0 4px 12px rgba(0, 0, 0, .2);
    }
    .equipment-slot:hover, .equipment-slot:focus-visible {
      border-color: var(--gold);
      background: rgba(236, 227, 209, .09);
    }
    .equipment-slot .slot-icon {
      width: 48px;
      height: 48px;
      margin: 0 auto 6px;
    }
    .equipment-slot .slot-icon .icon { width: 42px; height: 42px; }
    .equipment-slot strong {
      display: block;
      overflow: hidden;
      color: var(--text);
      font-size: 11px;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .equipment-slot small {
      display: block;
      overflow: hidden;
      color: var(--dim);
      font-size: 10px;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .equipment-config {
      display: grid;
      gap: 13px;
    }
    .equipment-config-summary {
      display: grid;
      grid-template-columns: 62px 1fr;
      gap: 13px;
      align-items: center;
      border-bottom: 1px solid var(--line-soft);
      padding-bottom: 13px;
    }
    .equipment-config-summary .slot-icon { width: 58px; height: 58px; }
    .equipment-config-summary .icon { width: 52px; height: 52px; }
    .equipment-modifier-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
    }

    .point-ledger {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 9px;
      margin-bottom: 16px;
    }
    .point-ledger > div {
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 11px 12px;
      background: var(--panel-2);
    }
    .point-ledger span {
      display: block;
      color: var(--dim);
      font-size: 10px;
      font-weight: 800;
      letter-spacing: .08em;
      text-transform: uppercase;
    }
    .point-ledger strong {
      color: var(--accent);
      font-size: 22px;
    }
    /* An impossible allocation has to be unmissable, not a minus sign the eye
       slides past — the whole first tile turns to the danger colour. */
    .point-ledger.over-budget > div:first-child {
      border-color: var(--danger);
      background: #2a1414;
    }
    .point-ledger.over-budget > div:first-child strong { color: var(--danger); }
    .point-ledger.over-budget > div:first-child span { color: var(--danger); }
    .point-ledger.three { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    /* The four transformation bands of one animal, side by side. */
    .egg-bands {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 12px;
    }
    .egg-band {
      border: 1px solid var(--line);
      border-radius: 9px;
      padding: 10px 12px;
      background: var(--panel-2);
    }
    .egg-band-head {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 8px;
      padding-bottom: 8px;
      border-bottom: 1px solid var(--line-soft);
    }
    .egg-band-head strong { color: var(--gold); font-size: 12.5px; }
    .egg-band-body > div { margin-bottom: 5px; }
    .egg-band-body .mono { font-size: 10.5px; }
    .follow-character { display: flex; align-items: flex-start; gap: 8px; cursor: pointer; }
    .follow-character input { margin-top: 3px; }
    .stat-cost-table { font-size: 12px; }
    .stat-cost-table td.danger { color: var(--danger); font-weight: 700; }

    .skill-columns {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(248px, 1fr));
      gap: 14px;
    }
    .skill-card {
      position: relative;
      display: grid;
      grid-template-columns: 42px minmax(0, 1fr) auto;
      align-items: center;
      gap: 10px;
      border: 1px solid var(--line-soft);
      border-radius: 8px;
      padding: 8px;
      background: var(--panel-2);
    }
    .skill-card.locked { opacity: .54; filter: saturate(.5); }
    .skill-card .icon { width: 38px; height: 38px; }
    .skill-card strong { display: block; font-size: 13px; }
    .skill-grade { color: var(--danger); font-size: 11px; font-weight: 800; }
    .skill-grade.zero { color: var(--dim); }
    .skill-stepper { display: flex; gap: 3px; }
    .skill-stepper button { min-height: 28px; min-width: 28px; padding: 2px 7px; }
    /* ── Skill tree ─────────────────────────────────────────────────────
       One row per unlock level, a line from each prerequisite to what it
       opens. Node positions are set inline from arithmetic, so the only job
       here is to make the boxes and the lines readable. */
    .scope-tabs {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin: 0 0 14px;
    }
    .scope-tab {
      display: inline-flex;
      align-items: baseline;
      gap: 6px;
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 6px 14px;
      color: var(--muted);
      background: var(--panel-2);
      font-size: 12.5px;
      font-weight: 600;
      text-decoration: none;
    }
    .scope-tab:hover { border-color: var(--gold); color: var(--text); }
    .scope-tab.active {
      border-color: var(--gold);
      color: var(--accent-ink);
      background: var(--gold);
    }
    .scope-tab.active .dim { color: rgba(20, 30, 24, .7); }
    .job-tabs { align-items: center; margin-top: -6px; }
    .job-tabs .scope-tab { padding: 4px 11px; font-size: 11.5px; font-weight: 500; }
    .job-tabs-label {
      color: var(--dim);
      font-size: 10px;
      letter-spacing: .08em;
      text-transform: uppercase;
    }
    .skill-tree-wrap { overflow: auto; padding: 2px 0 8px; }
    .skill-tree { position: relative; }
    .skill-tree-edges {
      position: absolute;
      inset: 0;
      overflow: visible;
      pointer-events: none;
    }
    .skill-tree-edges path {
      fill: none;
      stroke: var(--gold);
      stroke-width: 1.6;
      stroke-linecap: round;
      stroke-linejoin: round;
      opacity: .62;
    }
    .skill-edge-head { fill: var(--gold); opacity: .75; }
    .skill-tree-rail {
      position: absolute;
      left: 0;
      right: 0;
      border-top: 1px dotted var(--line-soft);
    }
    .skill-tree-rail span {
      position: absolute;
      top: -8px;
      left: 0;
      padding: 0 5px;
      color: var(--dim);
      background: var(--panel);
      font-size: 9.5px;
      letter-spacing: .05em;
      text-transform: uppercase;
    }
    .skill-node {
      position: absolute;
      display: grid;
      grid-template-columns: 26px minmax(0, 1fr);
      grid-template-rows: auto auto;
      align-items: center;
      gap: 2px 7px;
      width: 148px;
      height: 62px;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 5px 7px;
      background: var(--panel-2);
      box-shadow: 0 2px 6px rgba(0, 0, 0, .25);
    }
    .skill-node:hover { border-color: var(--gold); z-index: 3; }
    .skill-node.locked { opacity: .42; filter: saturate(.35); }
    .skill-node.taken { border-color: var(--accent); }
    .skill-node .icon { width: 26px; height: 26px; grid-row: 1; }
    .skill-node-name {
      grid-column: 2;
      grid-row: 1;
      overflow: hidden;
      color: var(--text);
      font-size: 11px;
      font-weight: 600;
      line-height: 1.15;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .skill-node-name a { color: inherit; text-decoration: none; }
    .skill-node-name a:hover { color: var(--accent); }
    .skill-node-grade {
      grid-column: 1 / -1;
      grid-row: 2;
      color: var(--muted);
      font-size: 10px;
      font-weight: 700;
    }
    .skill-node-grade.zero { color: var(--dim); }
    .skill-node .skill-stepper {
      position: absolute;
      right: 5px;
      bottom: 4px;
    }
    .skill-node .skill-stepper button { min-height: 20px; min-width: 22px; padding: 0 5px; font-size: 11px; }
    .skill-node-need {
      grid-column: 1 / -1;
      overflow: hidden;
      color: var(--dim);
      font-size: 9px;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .skill-node-need.missing { color: var(--danger); }

    .skill-tooltip {
      position: fixed;
      z-index: 80;
      width: min(380px, calc(100vw - 24px));
      border: 1px solid #ad8759;
      border-radius: 7px;
      padding: 13px 15px;
      color: #f5ecda;
      background: rgba(34, 43, 36, .97);
      box-shadow: 0 16px 46px rgba(17, 26, 21, .34);
      pointer-events: none;
    }
    .skill-tooltip strong { display: block; color: #d9b168; }
    .skill-tooltip .tip-grade { color: #90b6ff; }
    .skill-tooltip .tip-next { margin-top: 8px; border-top: 1px solid #70644d; padding-top: 8px; }
    .skill-tooltip small { color: #c7d0ca; }

    .quest-ledger { margin-bottom: 13px; }
    .quest-checklist { columns: 3 300px; column-gap: 12px; }
    .quest-check {
      break-inside: avoid;
      display: grid;
      grid-template-columns: 30px minmax(0, 1fr);
      gap: 7px;
      margin: 0 0 7px;
      border: 1px solid var(--line-soft);
      border-radius: 6px;
      padding: 7px;
      background: var(--panel-2);
    }
    .quest-check.future { opacity: .52; }
    .quest-status {
      width: 25px;
      height: 25px;
      min-height: 25px;
      border-radius: 4px;
      padding: 0;
      color: var(--dim);
      background: var(--panel-3);
    }
    .quest-status.progress { color: #eab97a; background: rgba(210, 164, 104, .2); }
    .quest-status.finished { color: #0a1512; background: var(--accent); }
    .quest-check strong { display: block; font-size: 12px; }
    .quest-check small { color: var(--dim); font-size: 10px; }

    .buff-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
      gap: 9px;
      margin-bottom: 16px;
    }
    .buff-card {
      border: 1px solid var(--line-soft);
      border-radius: 8px;
      padding: 10px;
      background: var(--panel-2);
    }
    .buff-card.active {
      border-color: var(--accent);
      background: rgba(108, 198, 160, .08);
      box-shadow: inset 0 0 0 1px rgba(108, 198, 160, .16);
    }
    .buff-group-title {
      margin: 4px 0 8px;
      color: var(--accent);
      font-family: Georgia, "Times New Roman", serif;
    }
    .buff-toggle {
      display: grid;
      grid-template-columns: auto 46px minmax(0, 1fr);
      align-items: center;
      gap: 8px;
      cursor: pointer;
    }
    .buff-toggle input { accent-color: var(--accent); }
    .buff-toggle strong, .buff-toggle small { display: block; }
    .buff-toggle small { color: var(--dim); font-size: 10px; }
    .buff-icon {
      width: 44px;
      height: 44px;
      display: grid;
      place-items: center;
      border: 1px solid #3b5145;
      border-radius: 5px;
      background: #221a13;
    }
    .buff-icon .icon { width: 42px; height: 42px; }
    .buff-grade { margin-top: 9px; }
    .buff-effect {
      min-height: 35px;
      margin: 8px 0;
      border-left: 2px solid #8a6438;
      padding: 5px 7px;
      color: var(--muted);
      background: rgba(236, 227, 209, .04);
      font-size: 11px;
    }
    .buff-card-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 9px;
      margin-bottom: 9px;
    }
    .buff-card-head input[type="checkbox"] { accent-color: var(--accent); }
    .buff-card .field-grid { grid-template-columns: minmax(0, 1fr) 92px; }

    .mobile-nav { display: none; }

    @media (max-width: 1100px) {
      .metrics { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .directory-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .definition-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .split { grid-template-columns: 1fr; }
      .sim-workspace { grid-template-columns: 1fr; }
      .character-layout { grid-template-columns: 1fr; }
      .sim-threat-column { position: static; max-height: none; overflow: visible; }
    }

    @media (max-width: 760px) {
      .app-shell { display: block; }
      .sidebar { display: none; }
      .mobile-nav {
        display: flex;
        gap: 6px;
        overflow-x: auto;
        border-bottom: 1px solid var(--line-soft);
        padding: 8px 14px;
        background: #143d30;
      }
      .mobile-nav a {
        flex: 0 0 auto;
        border: 1px solid var(--line);
        border-radius: 999px;
        padding: 7px 11px;
        color: var(--muted);
        font-size: 12px;
      }
      .topbar {
        grid-template-columns: 1fr;
        gap: 8px;
        padding: 10px 14px;
      }
      .top-actions { justify-content: space-between; }
      .profile-switcher { border-left: 0; padding-left: 0; }
      .profile-switcher label { display: none; }
      main { padding: 22px 14px 52px; }
      .page-head { display: block; }
      .page-actions { justify-content: flex-start; margin-top: 14px; }
      .metrics { grid-template-columns: 1fr 1fr; }
      .directory-grid { grid-template-columns: 1fr; }
      .toolbar { grid-template-columns: 1fr; }
      .definition-grid { grid-template-columns: 1fr; }
      .result { grid-template-columns: 1fr; gap: 4px; }
      .kv { grid-template-columns: 1fr; }
      .kv > div:nth-child(odd) { border-top: 1px solid var(--line); }
      .item-identity { grid-template-columns: 1fr; }
      .item-preview { min-height: 124px; }
      .sim-core-slots, .sim-character-fields { grid-template-columns: 1fr; }
      .character-tabs { overflow-x: auto; padding: 0; }
      .character-tabs a { flex: 0 0 auto; min-width: 92px; }
      .character-banner { grid-template-columns: 1fr; }
      .point-ledger { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .equipment-modifier-grid { grid-template-columns: 1fr; }
      .quest-checklist { columns: 1; }
      .sim-character-fields .field:first-child,
      .sim-core-slots .slot:last-child:nth-child(odd) { grid-column: auto; }
    }

    @media (max-width: 430px) {
      .metrics { grid-template-columns: 1fr; }
      .connect-actions { display: grid; }
    }

    /* ── Sortable tables ─────────────────────────────────────────────── */
    table.sortable th { padding: 0; }
    table.sortable th.num, table.sortable td.num { text-align: right; }
    .sort-head {
      display: flex;
      align-items: center;
      gap: 5px;
      width: 100%;
      min-height: 0;
      border: 0;
      border-radius: 0;
      padding: 9px 11px;
      color: inherit;
      background: none;
      font: inherit;
      font-size: 10px;
      font-weight: 800;
      letter-spacing: .08em;
      text-transform: uppercase;
      cursor: pointer;
    }
    th.num .sort-head { justify-content: flex-end; }
    .sort-head:hover { color: var(--accent); background: rgba(31, 90, 69, .06); }
    .sort-head .sort-mark {
      width: 8px;
      color: var(--accent);
      font-size: 9px;
      opacity: 0;
    }
    .sort-head:hover .sort-mark { opacity: .4; }
    .sort-head .sort-mark::before { content: "\25B2"; }
    .sort-head.sorted { color: var(--accent); }
    .sort-head.sorted .sort-mark { opacity: 1; }
    .sort-head.sorted.desc .sort-mark::before { content: "\25BC"; }

    /* ── Compact entity pages ────────────────────────────────────────── */
    .detail-grid {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(250px, 330px);
      gap: 14px;
      align-items: start;
    }
    .detail-grid > .detail-side { position: sticky; top: 78px; }
    @media (max-width: 1080px) {
      .detail-grid { grid-template-columns: 1fr; }
      .detail-grid > .detail-side { position: static; }
    }

    .panel {
      margin: 0 0 12px;
      border: 1px solid var(--line);
      border-radius: var(--radius-sm);
      padding: 12px 14px 13px;
      background: var(--panel);
    }
    .panel:last-child { margin-bottom: 0; }
    .panel > h3 {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 12px;
      margin: 0 0 9px;
      color: var(--gold);
      font-size: 10.5px;
      font-weight: 800;
      letter-spacing: .1em;
      text-transform: uppercase;
    }
    .panel > h3 .panel-aside {
      color: var(--dim);
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0;
      text-transform: none;
    }
    .panel .table-wrap { margin: 0 -14px -13px; }
    .panel .table-wrap th:first-child .sort-head,
    .panel .table-wrap td:first-child { padding-left: 14px; }
    .panel .table-wrap td:last-child { padding-right: 14px; }

    .stat-lines {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
      gap: 0 26px;
    }
    .stat-line {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 12px;
      border-bottom: 1px dotted var(--line-soft);
      padding: 3px 0;
    }
    .stat-line > span { color: var(--muted); font-size: 12.5px; }
    .stat-line > b {
      color: var(--text);
      font-weight: 650;
      font-variant-numeric: tabular-nums;
      text-align: right;
    }
    .stat-line small { color: var(--dim); font-weight: 400; }

    .provenance-foot {
      margin-top: 18px;
      border-top: 1px solid var(--line-soft);
      padding-top: 10px;
    }
    .provenance-foot > summary {
      color: var(--dim);
      font-size: 12px;
      cursor: pointer;
    }
    .provenance-foot > summary:hover { color: var(--accent); }
    .provenance-body {
      margin-top: 10px;
      color: var(--muted);
      font-size: 12.5px;
    }
    .provenance-body > * + * { margin-top: 8px; }

    .entity-hero {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 12px;
    }
    .entity-hero .entity-portrait {
      display: grid;
      place-items: center;
      width: 88px;
      height: 88px;
      flex: none;
      border: 1px solid #bfa77f;
      border-radius: var(--radius-sm);
      background: linear-gradient(135deg, rgba(31, 90, 69, .08), transparent 55%), #eee7d9;
    }
    .entity-hero .entity-portrait .icon { width: 64px; height: 64px; image-rendering: pixelated; }
    .entity-hero .entity-portrait .kalenc-preview { max-width: 84px; max-height: 84px; }
    .entity-hero.tall .entity-portrait { width: 176px; height: 250px; }
    .entity-hero.tall .entity-portrait .kalenc-preview { max-width: 168px; max-height: 242px; }

    /* Leading identity column on the directory tables: the client icon for an
       item, the KalEncyclopedia portrait for a monster. */
    .icon-col {
      width: 44px;
      padding-right: 0 !important;
      text-align: center;
      vertical-align: middle;
    }
    .icon-col .icon { image-rendering: pixelated; }
    .icon-col .monster-icon { image-rendering: auto; }

    .cell-icon {
      display: inline-flex;
      align-items: center;
      gap: 7px;
    }
    .cell-icon .icon { flex: none; image-rendering: pixelated; }
    .icon-monster-blank {
      display: inline-block;
      border: 1px dashed var(--line-soft);
      border-radius: 4px;
      opacity: .5;
    }
    .monster-icon {
      border-radius: 3px;
      object-fit: cover;
      image-rendering: auto;
      background: #ddd6c7;
    }
    .entity-hero .entity-portrait .monster-icon {
      width: auto;
      height: auto;
      max-width: 84px;
      max-height: 64px;
    }
    /* gameagit's artwork is a tall rectangle where KalEncyclopedia's is a wide
       one, so the frame takes the shape of whichever picture it is holding
       instead of a square the tall one spills out of. */
    .entity-hero.portrait-art .entity-portrait { width: 104px; height: 150px; }
    /* gameagit's artwork is taller than it is wide, so it is shown whole rather
       than cropped to KalEncyclopedia's landscape frame. */
    .monster-icon.tall { object-fit: contain; background: transparent; }
    .entity-hero .entity-portrait .monster-icon.tall {
      max-width: calc(100% - 10px);
      max-height: calc(100% - 10px);
    }
    /* The guide author's own NPC screenshots — the only pictures of these
       characters the project has. */
    .npc-photo {
      width: auto;
      border: 1px solid var(--line-soft);
      border-radius: 4px;
      object-fit: cover;
      background: #1a1710;
      vertical-align: middle;
    }
    .npc-photo.large { max-width: 100%; height: auto; border-radius: 6px; }
    .npc-hero { align-items: flex-start; }
    .map-legend li .npc-photo { flex: 0 0 auto; }
    .link-list .npc-photo { margin-right: 6px; }

    /* ── Character Creation: the artifact's density ─────────────────── */
    .sim-workspace {
      grid-template-columns: minmax(340px, 400px) minmax(0, 1fr);
      gap: 16px;
    }
    .sim-column > .panel { margin-bottom: 14px; }
    .sim-character-fields { gap: 8px; grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .sim-character-fields .field:first-child { grid-column: auto; }
    .sim-character-fields .field > span { font-size: 10.5px; }
    .sim-character-fields input, .sim-character-fields select { padding: 5px 7px; }
    .sim-threat-column { top: 78px; }
    #simSheetPanel .sheet { margin-bottom: 14px; }
    .sheet-breakdown { margin-top: 10px; }
    .sheet-breakdown > summary { color: var(--muted); font-size: 12px; cursor: pointer; }
    .modifier-ledger { margin: 4px 0 12px; padding-left: 18px; }
    .modifier-ledger li { font-size: 12px; line-height: 1.5; margin-bottom: 6px; }
    .sheet-breakdown h4 { margin: 10px 0 2px; font-size: 12px; letter-spacing: .04em;
      text-transform: uppercase; color: var(--muted); }
    .monster-search { width: 100%; margin-bottom: 10px; }

    /* Monster comparison, collapsed: title and search only, and the width it
       was holding goes back to the character panels, which flow into columns. */
    .threat-toggle {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      min-height: 0;
      border: 0;
      border-radius: 0;
      padding: 0;
      color: inherit;
      background: none;
      font: inherit;
      letter-spacing: inherit;
      text-transform: inherit;
      cursor: pointer;
    }
    .threat-toggle:hover { color: var(--accent); background: none; }
    .threat-caret { display: inline-block; font-size: 9px; transition: transform .15s ease; }
    .threat-panel.open .threat-caret { transform: rotate(90deg); }
    .threat-panel:not(.open) .monster-search { margin-bottom: 0; }

    .sim-workspace.threats-collapsed { grid-template-columns: minmax(0, 1fr); }
    .sim-workspace.threats-collapsed > .sim-column:first-child {
      columns: 3 340px;
      column-gap: 16px;
    }
    .sim-workspace.threats-collapsed > .sim-column:first-child > * {
      break-inside: avoid;
      margin-bottom: 14px;
    }
    .sim-workspace.threats-collapsed .sim-threat-column {
      position: static;
      max-height: none;
      overflow: visible;
    }

    .equipment-board-help { display: none; }
    .equipment-board { padding: 0; }
    .equipment-board::before { display: none; }
    .equipment-slot-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(168px, 1fr));
      gap: 7px;
    }
    .equipment-slot {
      display: flex;
      align-items: center;
      gap: 8px;
      min-height: 0;
      padding: 5px 7px;
      text-align: left;
    }
    .equipment-slot .slot-icon {
      display: grid;
      place-items: center;
      width: 34px;
      height: 34px;
      flex: none;
      border-radius: 5px;
    }
    .equipment-slot .slot-icon .icon { width: 30px; height: 30px; image-rendering: pixelated; }
    .equipment-slot-body { min-width: 0; flex: 1; }
    .equipment-slot strong {
      display: block;
      overflow: hidden;
      color: var(--text);
      font-size: 12px;
      font-weight: 650;
      white-space: nowrap;
      text-overflow: ellipsis;
    }
    .equipment-slot small {
      display: block;
      overflow: hidden;
      color: var(--dim);
      font-size: 10.5px;
      white-space: nowrap;
      text-overflow: ellipsis;
    }
    .equipment-slot.filled strong { color: var(--accent); }

    /* ── Cascading slot menu ─────────────────────────────────────────── */
    .slot-menu {
      position: fixed;
      z-index: 60;
      min-width: 210px;
      max-width: 320px;
      max-height: 82vh;
      overflow-y: auto;
      border: 1px solid var(--line);
      border-radius: var(--radius-sm);
      background: var(--panel);
      box-shadow: 0 18px 42px rgba(34, 48, 40, .22);
      font-size: 12.5px;
    }
    .slot-menu-head {
      border-bottom: 1px solid var(--line-soft);
      padding: 7px 11px;
      color: var(--gold);
      font-size: 10px;
      font-weight: 800;
      letter-spacing: .1em;
      text-transform: uppercase;
    }
    .slot-menu-list { margin: 0; padding: 4px 0; list-style: none; }
    /* Submenus are `fixed`, not `absolute`, and placed by openSubmenu().
       A scrolling list clips its own absolutely-positioned descendants — that
       is what made a third-level branch (Talisman of Protection → Multiple
       stats) render only as scrollbars on its parent. A fixed element escapes
       an ancestor's overflow, so each level scrolls independently and none of
       them can crop the next. */
    .slot-menu-list .slot-menu-list {
      position: fixed;
      z-index: 61;
      top: 0;
      left: 0;
      display: none;
      min-width: 190px;
      max-width: 340px;
      max-height: 74vh;
      overflow-y: auto;
      border: 1px solid var(--line);
      border-radius: var(--radius-sm);
      background: var(--panel);
      box-shadow: 0 16px 36px rgba(34, 48, 40, .22);
    }
    .slot-menu-item.has-children.open > .slot-menu-list { display: block; }
    .slot-menu-item {
      position: relative;
      display: flex;
      align-items: center;
      gap: 7px;
      padding: 5px 11px;
      color: var(--text);
      cursor: pointer;
    }
    .slot-menu-item:hover, .slot-menu-item:focus-visible {
      color: var(--accent);
      background: rgba(31, 90, 69, .08);
      outline: none;
    }
    .slot-menu-item > span:not(.slot-menu-arrow):not(.slot-menu-tick) {
      flex: 1;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .slot-menu-arrow { color: var(--dim); font-size: 10px; }
    .slot-menu-tick { width: 11px; color: var(--accent); font-size: 11px; }
    .slot-menu-item.checked, .slot-menu-item.marked { color: var(--accent); font-weight: 650; }
    .slot-menu-item.marked > .slot-menu-arrow { color: var(--accent); }
    .slot-menu-item.disabled { color: var(--dim); cursor: not-allowed; opacity: .55; }
    .slot-menu-item.disabled:hover { background: none; }
    .slot-menu-sep { margin: 4px 0; border-top: 1px solid var(--line-soft); }

    /* ── Buffs, compact enough to sit under the inventory ───────────── */
    .buff-group + .buff-group { margin-top: 4px; }
    .buff-group > summary {
      padding: 4px 0;
      color: var(--muted);
      font-size: 11.5px;
      font-weight: 650;
      cursor: pointer;
    }
    .buff-group > summary .dim { margin-left: 6px; font-weight: 400; }
    .buff-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
      gap: 6px;
      margin: 6px 0 8px;
    }
    .buff-card {
      display: grid;
      grid-template-columns: 1fr auto;
      align-items: center;
      gap: 4px 6px;
      border: 1px solid var(--line-soft);
      border-radius: 6px;
      padding: 5px 7px;
      background: var(--panel-2);
    }
    .buff-card.active { border-color: var(--accent); background: rgba(31, 90, 69, .07); }
    .buff-toggle {
      display: flex;
      align-items: center;
      gap: 6px;
      min-width: 0;
      cursor: pointer;
    }
    .buff-toggle input { flex: none; accent-color: var(--accent); }
    .buff-icon { display: grid; place-items: center; width: 24px; height: 24px; flex: none; }
    .buff-icon .icon { width: 24px; height: 24px; image-rendering: pixelated; }
    .buff-name {
      overflow: hidden;
      font-size: 11px;
      font-weight: 600;
      white-space: nowrap;
      text-overflow: ellipsis;
    }
    select.buff-grade { min-height: 0; padding: 2px 4px; font-size: 10.5px; }
    .buff-effect {
      grid-column: 1 / -1;
      overflow: hidden;
      color: var(--dim);
      font-size: 10px;
      white-space: nowrap;
      text-overflow: ellipsis;
    }

    .panel.wide { padding: 0; }
    .panel.wide .table-wrap { margin: 0; }
    .panel.wide .table-wrap th:first-child .sort-head,
    .panel.wide .table-wrap td:first-child { padding-left: 14px; }

    /* ── Quest maps ──────────────────────────────────────────────────── */
    .quest-layout {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(300px, 420px);
      gap: 14px;
      align-items: start;
    }
    .quest-map-column { position: sticky; top: 78px; }
    @media (max-width: 1180px) {
      .quest-layout { grid-template-columns: 1fr; }
      .quest-map-column { position: static; }
    }

    /* ── Quest cards ─────────────────────────────────────────────────── */
    .quest-progress {
      align-self: center;
      color: var(--muted);
      font-size: 13px;
    }
    .quest-progress b { color: var(--accent); font-size: 18px; }

    .quest-cards { display: grid; gap: 10px; }
    .qcard {
      border: 1px solid var(--line);
      border-radius: var(--radius-sm);
      background: var(--panel);
      transition: opacity .2s ease, border-color .2s ease, background .2s ease;
    }
    .qcard-head {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      padding: 9px 12px;
    }
    .qcard.open > .qcard-head { border-bottom: 1px solid var(--line-soft); }
    .qcard-head h4 { margin: 0; font-size: 15px; }
    .qcard-lvl {
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 1px 9px;
      color: var(--muted);
      font-size: 11px;
      white-space: nowrap;
    }
    .qcard-rewards { color: var(--dim); font-size: 11.5px; }
    .qcard-toggle {
      min-height: 26px;
      min-width: 26px;
      margin-left: auto;
      padding: 0 6px;
      color: var(--dim);
      background: none;
      border-color: transparent;
    }
    /* Done: struck through, faded, and folded shut. The visitor can still open
       it — the strike-through and the fade stay, because the state is the
       quest's, not the card's. */
    .qcard.done { border-color: var(--line-soft); opacity: .62; }
    .qcard.done .qcard-head h4 a,
    .qcard.done .qcard-head h4 { text-decoration: line-through; }
    .qcard.done .qcard-head h4 a { color: var(--muted); }
    .qcard.done .qcard-lvl, .qcard.done .qcard-rewards { opacity: .8; }
    .qcard.done:hover { opacity: .95; }
    .qcard-body { padding: 11px 12px 12px; }
    .qcard-foot {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 10px;
    }
    .qcard-foot .button { margin-left: auto; }

    /* The telegraphic route: one box per stop, arrows between them. */
    .route-diagram {
      display: flex;
      align-items: stretch;
      flex-wrap: wrap;
      gap: 6px 3px;
    }
    .stop {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 5px;
      width: 152px;
      border: 1px solid var(--line-soft);
      border-radius: 8px;
      padding: 8px 7px;
      background: var(--panel-2);
      text-align: center;
    }
    .stop.kill { border-style: dashed; }
    .stop-arrow { align-self: center; color: var(--gold); font-size: 15px; }
    .stop-chip {
      border-radius: 999px;
      padding: 1px 9px;
      color: var(--accent);
      background: var(--panel-3);
      font-size: 10px;
      font-weight: 800;
      letter-spacing: .06em;
      text-transform: uppercase;
    }
    .stop-chip.kill { color: var(--danger); }
    .stop-name { color: var(--text); font-size: 11.5px; font-weight: 650; line-height: 1.25; }
    .stop-do {
      display: -webkit-box;
      overflow: hidden;
      -webkit-box-orient: vertical;
      -webkit-line-clamp: 4;
      color: var(--muted);
      font-size: 10.5px;
      line-height: 1.3;
    }
    .stop-mobs {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 4px;
    }
    .stop-mob {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
      max-width: 64px;
      color: var(--muted);
      font-size: 9.5px;
      line-height: 1.15;
    }
    .stop-mob:hover { color: var(--accent); }
    .stop-mob .monster-icon, .stop-mob .icon-monster-blank { border-radius: 4px; }
    .stop-more { align-self: center; color: var(--dim); font-size: 10px; }
    /* Monsters the quest tags that no single step can claim. Deliberately not
       styled as a stop: it is not a place in the route. */
    .route-loose {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      margin: 8px 0 0;
      border-top: 1px dotted var(--line-soft);
      padding: 8px 2px 0;
    }
    .route-loose-label {
      color: var(--dim);
      font-size: 10.5px;
      text-transform: uppercase;
      letter-spacing: .06em;
    }
    .route-loose .stop-mobs { justify-content: flex-start; }

    @media (max-width: 560px) {
      .stop { width: 100%; }
      .stop-arrow { transform: rotate(90deg); }
    }

    /* ── The two ways into the quests ───────────────────────────────────
       Deliberately large: the whole point is that a first-time visitor cannot
       miss that there are two of these. */
    .view-switch {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 12px;
      margin: 0 0 18px;
    }
    .view-card {
      display: flex;
      align-items: center;
      gap: 14px;
      border: 2px solid var(--line);
      border-radius: var(--radius);
      padding: 14px 16px;
      color: var(--text);
      background: var(--panel-2);
      text-decoration: none;
      transition: border-color .14s ease, background .14s ease, transform .14s ease;
    }
    .view-card:hover { border-color: var(--gold); background: var(--panel-3); }
    .view-card.active {
      border-color: var(--gold);
      background: linear-gradient(180deg, rgba(168, 111, 62, .22), transparent);
      box-shadow: inset 0 0 0 1px rgba(168, 111, 62, .4);
    }
    .view-card.disabled { opacity: .45; pointer-events: none; }
    .view-card-icon {
      flex: 0 0 auto;
      display: grid;
      place-items: center;
      width: 40px;
      height: 40px;
      border: 1px solid var(--line);
      border-radius: 50%;
      color: var(--gold);
      background: var(--panel);
      font-size: 18px;
    }
    .view-card.active .view-card-icon { border-color: var(--gold); }
    .view-card-body { display: flex; flex-direction: column; gap: 3px; }
    .view-card-body strong { font-size: 15px; letter-spacing: .01em; }
    .view-card-body small { color: var(--muted); font-size: 11.5px; line-height: 1.35; }

    /* ── Walkthrough ────────────────────────────────────────────────── */
    .wt-progress {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
      margin: 0 0 16px;
    }
    .wt-bar {
      flex: 1 1 200px;
      min-width: 160px;
      height: 9px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: var(--panel-2);
      overflow: hidden;
    }
    .wt-bar span { display: block; height: 100%; background: var(--accent); transition: width .25s ease; }
    .wt-stage {
      margin: 0 0 16px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 14px 16px;
      background: var(--panel);
    }
    .wt-stage-head { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
    .wt-stage-head h4 { margin: 0; color: var(--gold); font-size: 15px; }
    .wt-stage-lvl {
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 1px 8px;
      color: var(--muted);
      font-size: 11px;
    }
    .wt-where { margin: 5px 0 0; color: var(--muted); font-size: 12.5px; }
    .wt-combo { margin: 10px 0 4px; font-size: 12.5px; }
    .wt-quest {
      margin: 12px 0 0;
      border-top: 1px dotted var(--line-soft);
      padding: 10px 0 2px;
    }
    .wt-quest.done { opacity: .55; }
    .wt-quest.done .wt-quest-head h5 { text-decoration: line-through; }
    .wt-quest-head { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .wt-quest-head h5 { margin: 0; font-size: 13.5px; }
    .wt-route-name { margin-left: auto; color: var(--dim); font-size: 10.5px; }
    .wt-note {
      margin: 6px 0 0;
      border-left: 2px solid var(--gold);
      padding: 2px 0 2px 8px;
      color: var(--muted);
      font-size: 12px;
    }
    .wt-start { margin: 6px 0 0; color: var(--muted); font-size: 12px; }
    .wt-steps { margin: 8px 0 0; padding: 0; list-style: none; }
    .wt-step {
      display: flex;
      align-items: center;
      gap: 8px;
      border-bottom: 1px dotted var(--line-soft);
      padding: 3px 0;
      font-size: 12.5px;
    }
    .wt-step:last-child { border-bottom: 0; }
    .wt-step-text { color: var(--muted); }
    .wt-step.action .wt-step-text { color: var(--text); }
    .wt-assets { display: flex; flex-wrap: wrap; gap: 10px; margin: 9px 0 0; }
    .wt-asset {
      display: inline-flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      max-width: 120px;
      color: var(--muted);
      font-size: 11px;
      line-height: 1.2;
      text-align: center;
    }
    .wt-asset a { color: var(--muted); text-decoration: none; }
    .wt-asset a:hover { color: var(--accent); }
    .wt-asset-plain { padding: 0 4px; color: var(--dim); }

    /* ── Look closer ────────────────────────────────────────────────────
       A picture enlarges under the pointer and enlarges further when clicked.
       The frame keeps its own size in the layout; only the picture inside it
       grows, so nothing reflows when it does. */
    .zoom-frame {
      position: relative;
      z-index: 1;
      display: grid;
      place-items: center;
      min-height: 0;
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 0;
      background: #1a1710;
      cursor: zoom-in;
      overflow: visible;
    }
    .zoom-frame img {
      display: block;
      transition: transform .18s ease, box-shadow .18s ease;
      transform-origin: center center;
    }
    .zoom-frame.item { width: 62px; height: 62px; }
    .zoom-frame.item img { width: 56px; height: 56px; image-rendering: pixelated; }
    .zoom-frame.monster { width: 62px; height: 94px; }
    .zoom-frame.monster img { width: auto; height: 92px; max-width: 60px; object-fit: contain; }
    .zoom-frame.photo { width: 76px; height: 57px; flex: none; }
    .zoom-frame.photo img { width: 74px; height: 55px; object-fit: cover; border-radius: 4px; }
    .zoom-frame:hover, .zoom-frame:focus-visible { z-index: 6; border-color: var(--gold); }
    .zoom-frame:hover img, .zoom-frame:focus-visible img {
      transform: scale(2.2);
      box-shadow: 0 10px 28px rgba(0, 0, 0, .65);
    }
    .zoom-frame.zoomed { z-index: 20; cursor: zoom-out; border-color: var(--accent); }
    .zoom-frame.zoomed img, .zoom-frame.zoomed:hover img {
      transform: scale(4.4);
      box-shadow: 0 18px 46px rgba(0, 0, 0, .78);
    }
    .zoom-frame.monster.zoomed img, .zoom-frame.monster.zoomed:hover img { transform: scale(3.4); }
    .choice-note { margin: 10px 0 0; font-size: 12.5px; }
    .choice-list { margin: 7px 0 0; padding: 0; list-style: none; }
    .choice-list li {
      display: flex;
      align-items: baseline;
      gap: 7px;
      padding: 2px 0;
    }
    .choice-list .mono { color: var(--muted); font-size: 11.5px; }
    .choice-list .choice-arrow { color: var(--dim); }
    .choice-list a { color: var(--accent); text-decoration: none; }
    .choice-list a:hover { text-decoration: underline; }
    .wt-reward { margin: 7px 0 0; color: var(--muted); font-size: 12px; }
    .wt-reward span {
      margin-right: 6px;
      color: var(--dim);
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: .06em;
    }
    .wt-warn { margin: 5px 0 0; color: var(--danger); font-size: 11.5px; }
    .wt-teleports { margin: 0; padding: 0; list-style: none; font-size: 12.5px; }
    .wt-teleports li {
      display: flex;
      align-items: center;
      gap: 8px;
      border-bottom: 1px dotted var(--line-soft);
      padding: 3px 0;
      color: var(--muted);
    }

    .map-filter-row {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
      margin-bottom: 12px;
      font-size: 11px;
    }
    .filter-chip {
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 3px 11px;
      color: var(--muted);
      background: var(--panel);
      font-size: 11.5px;
    }
    .filter-chip:hover { border-color: var(--accent); color: var(--accent); }
    .filter-chip.active {
      border-color: var(--accent);
      color: var(--accent-ink);
      background: var(--accent);
    }

    .map-tabs { display: flex; gap: 4px; flex-wrap: wrap; margin-bottom: 9px; }
    .map-tab {
      min-height: 0;
      border-radius: 5px;
      padding: 3px 8px;
      font-size: 11px;
      font-weight: 600;
    }
    .map-tab.active { border-color: var(--accent); color: var(--accent-ink); background: var(--accent); }
    .map-tab.active .dim { color: rgba(248, 245, 236, .7); }
    .map-tab .dim { margin-left: 4px; font-weight: 400; }
    .map-view.hidden { display: none; }
    .map-name { margin-bottom: 7px; color: var(--muted); font-size: 12px; }
    .map-wrap {
      position: relative;
      overflow: hidden;
      width: 100%;
      border: 2px solid var(--gold);
      border-radius: 7px;
      background: #1a1710;
    }
    .map-wrap img { display: block; width: 100%; height: 100%; object-fit: contain; }
    /* A missing image must not collapse the box, or every percentage-placed
       pin piles up at the top of a zero-height container. */
    .map-wrap.image-missing img { display: none; }
    /* Pins are positioned by percentage so they stay correct at any width;
       the translate keeps the dot centred on the point, and must be repeated
       inside the flash keyframes or the animation would undo it. */
    .map-pin {
      position: absolute;
      display: grid;
      place-items: center;
      width: 19px;
      height: 19px;
      min-height: 0;
      padding: 0;
      transform: translate(-50%, -50%);
      border: 1px solid #fffaf0;
      border-radius: 50%;
      color: #fff;
      background: rgba(31, 90, 69, .88);
      font-size: 9px;
      font-weight: 700;
      line-height: 1;
    }
    .map-pin:hover { border-color: var(--gold); background: var(--gold); color: #241b12; }
    /* The global `button:active { transform: translateY(1px) }` replaces the
       centring translate outright, which threw a 19px pin half its own size
       south-east the instant it was pressed — far enough that the pointer ended
       up outside the round hit area and the click never landed. Press feedback
       has to keep the translate and change only the scale. */
    .map-pin:active { transform: translate(-50%, -50%) scale(.92); }
    .map-pin.flash { z-index: 5; animation: pinFlash 2.6s ease-out; }
    /* The pin the page is actually about. Every other pin in the town stays
       drawn, because a player reads a map to see what else is nearby. */
    .map-pin.focus {
      z-index: 4;
      border-color: var(--gold);
      color: #241b12;
      background: var(--gold);
      box-shadow: 0 0 0 3px rgba(168, 111, 62, .35);
    }
    @keyframes pinFlash {
      0%   { box-shadow: 0 0 0 0 rgba(168, 111, 62, 1);  background: var(--gold); color: #241b12; transform: translate(-50%, -50%) scale(1.7); }
      60%  { box-shadow: 0 0 0 20px rgba(168, 111, 62, 0); background: var(--gold); color: #241b12; transform: translate(-50%, -50%) scale(1.7); }
      100% { box-shadow: 0 0 0 0 rgba(168, 111, 62, 0);  background: rgba(31, 90, 69, .88); color: #fff; transform: translate(-50%, -50%) scale(1); }
    }
    .map-missing {
      margin: 0 0 9px;
      border: 1px dashed var(--line);
      border-radius: var(--radius-sm);
      padding: 10px 12px;
      color: var(--dim);
      font-size: 12px;
    }
    .map-credit {
      margin: 7px 0 0;
      color: var(--dim);
      font-size: 11px;
    }
    .map-credit a { color: var(--muted); text-decoration: underline; }
    .map-credit a:hover { color: var(--accent); }

    .map-legend {
      max-height: 210px;
      overflow-y: auto;
      margin: 9px 0 0;
      padding: 0;
      list-style: none;
      font-size: 12px;
    }
    .map-legend li {
      display: flex;
      align-items: baseline;
      gap: 7px;
      border-bottom: 1px dotted var(--line-soft);
      padding: 2px 0;
      color: var(--muted);
    }
    .map-legend-pin, .pin-tag {
      min-height: 0;
      border-radius: 4px;
      padding: 1px 6px;
      color: var(--accent);
      background: var(--panel-2);
      font-size: 10.5px;
      font-weight: 700;
    }
    .map-legend li.focus { color: var(--text); font-weight: 600; }
    .map-legend-pin.focus { color: #241b12; background: var(--gold); }
    .map-legend li a { color: var(--muted); }
    .map-legend li a:hover { color: var(--accent); }
    .map-legend-pin.flash, .pin-tag.flash { animation: tagFlash 2.6s ease-out; }
    @keyframes tagFlash {
      0%   { box-shadow: 0 0 0 0 rgba(168, 111, 62, 1);  background: var(--gold); color: #241b12; }
      60%  { box-shadow: 0 0 0 11px rgba(168, 111, 62, 0); background: var(--gold); color: #241b12; }
      100% { box-shadow: 0 0 0 0 rgba(168, 111, 62, 0);  background: var(--panel-2); color: var(--accent); }
    }
    .pin-tag-row { display: flex; gap: 4px; flex-wrap: wrap; }
    .pin-tag-city { margin-right: 3px; color: var(--gold); }
    .pin-tag.field, .pin-tag.action {
      color: var(--dim);
      background: var(--panel-3);
      cursor: default;
    }

    .route-steps { margin: 0; padding-left: 20px; font-size: 13px; }
    .route-steps li {
      display: flex;
      align-items: baseline;
      gap: 8px;
      border-bottom: 1px dotted var(--line-soft);
      padding: 4px 0;
      color: var(--muted);
    }
    .route-steps li:last-child { border-bottom: 0; }
    .route-steps.plain { list-style: decimal; }
    .route-steps .tag-row { margin-top: 5px; }

    .xp-band {
      display: inline-block;
      min-width: 26px;
      border-radius: 3px;
      padding: 0 5px;
      font-weight: 700;
      text-align: center;
    }
    .xp-band.dead { color: var(--dim); background: rgba(135, 144, 135, .14); }
    .xp-band.cold { color: #35618c; background: rgba(53, 97, 140, .14); }
    .xp-band.cool { color: #2f7355; background: rgba(47, 115, 85, .14); }
    .xp-band.even { color: #8a6a1f; background: rgba(168, 132, 31, .18); }
    .xp-band.warm { color: #a2601f; background: rgba(162, 96, 31, .16); }
    .xp-band.hot  { color: #a8402f; background: rgba(168, 64, 47, .16); }
