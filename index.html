      (state.indexes.monsters || []).forEach(row => {
        // A Forest/dungeon collision record ranks on its own legacy row, so
        // both sides of "Devil Troop of Desire" appear, told apart by the
        // legacy name. Everything else still dedupes by display name.
        const override = state.indexes.legacyVariantsByRecordId?.get(String(row.message_id));
        const key = override ? `record~${row.message_id}` : normalizeName(row.text);
        if (seen.has(key)) return;
        seen.add(key);
        const variants = (override || legacyMonsterVariants(row.text))
          .filter(monsterHasCombatStats);
        if (!variants.length) { unresolved += 1; return; }
        covered += 1;
        variants.forEach(legacy => out.push(Object.assign({
          bango: row,
          // A family member keeps its own legacy name, so the three levels of
          // Gigantic Species Shock Trooper are told apart in the ranking.
          label: variants.length > 1 || override ? legacy.mon_name : row.text
        }, simVersus(sheet, build, legacy))));
      });
      return { rows: out, unresolved, covered, names: seen.size };
    }

    // --- Presentation ---------------------------------------------------

    // --- Client icons ---------------------------------------------------
    //
    // assets\icons\*.png is converted from the client's own data\HyperText
    // bitmaps by tools\client_icons\extract_icons.py. Names are the values
    // already in our tables: a Bango item's `bango_image`, a skill's `sk_pic`.
    // Resolution is asynchronous, so markup emits a placeholder and
    // hydrateIcons fills in the object URL afterwards.

    const ICON_ROOT = "assets/icons";
    const THEME_ART = "assets/theme/jade-archive-dragon.png";
    const iconUrlCache = new Map();
    let themeArtUrl = "";

    function iconTag(name, label = "", size = 32, fallback = "") {
      if (!name) return `<span class="icon icon-missing" style="width:${size}px;height:${size}px;display:inline-block"></span>`;
      return `<img class="icon" data-icon="${escapeAttr(String(name).toLowerCase())}"`
        + (fallback ? ` data-icon-fallback="${escapeAttr(String(fallback).toLowerCase())}"` : "")
        + ` width="${size}" height="${size}" alt="${escapeAttr(label)}"`
        + ` title="${escapeAttr(label)}">`;
    }

    /* ===================================================================
       3D model viewer

       KalEncyclopedia's item page has a Show 3D button that loads the
       client's own mesh and texture. This is the same feature: the models are
       converted offline by tools/client_models/convert_models.py into a
       compact binary, and drawn here with plain WebGL — no library, matching
       the project's one-file, no-build-step rule.

       Only weapons have models. Armour is shown as the full-set portrait,
       which is what the original did too.
       =================================================================== */
    async function loadModelCatalogue() {
      try {
        const text = await state.source.read("assets/models/MODELS.json");
        const parsed = JSON.parse(text);
        state.models = parsed;
        // Normalized item name -> model key. Name, never id: the converter
        // reads the legacy item table, whose ita_azon space is unrelated to
        // Bango's — only 2 of 704 ids name the same item — so an id join
        // would put every model on the wrong weapon.
        state.models.byName = new Map();
        Object.entries(parsed.models || {}).forEach(([key, entry]) =>
          (entry.items || []).forEach(name => state.models.byName.set(String(name), key)));
      } catch (error) {
        state.models = null;
      }
    }

    function modelForItem(id) {
      const row = state.indexes.itemsById.get(String(id));
      if (!row) return null;
      const key = state.models?.byName?.get(normalizeName(row.ita_name));
      return key ? { key, ...state.models.models[key] } : null;
    }

    /* The .mdl layout, written by the converter:
         u32 magic, u32 vertexCount, u32 indexCount, u32 reserved
         f32 positions[3n], f32 normals[3n], f32 uvs[2n], u16 indices[m]  */
    function decodeModel(buffer) {
      const header = new Uint32Array(buffer, 0, 4);
      const vertexCount = header[1];
      const indexCount = header[2];
      let offset = 16;
      const positions = new Float32Array(buffer, offset, vertexCount * 3);
      offset += vertexCount * 12;
      const normals = new Float32Array(buffer, offset, vertexCount * 3);
      offset += vertexCount * 12;
      const uvs = new Float32Array(buffer, offset, vertexCount * 2);
      offset += vertexCount * 8;
      const indices = new Uint16Array(buffer.slice(offset, offset + indexCount * 2));
      return { positions, normals, uvs, indices, vertexCount, indexCount };
    }

    const MODEL_VERTEX_SHADER = `
      attribute vec3 aPosition; attribute vec3 aNormal; attribute vec2 aUv;
      uniform mat4 uModel; uniform mat4 uProjection;
      varying vec3 vNormal; varying vec2 vUv;
      void main() {
        vNormal = mat3(uModel) * aNormal;
        vUv = aUv;
        gl_Position = uProjection * uModel * vec4(aPosition, 1.0);
      }`;

    const MODEL_FRAGMENT_SHADER = `
      precision mediump float;
      uniform sampler2D uTexture; uniform bool uHasTexture;
      varying vec3 vNormal; varying vec2 vUv;
      void main() {
        vec3 normal = normalize(vNormal);
        // Two fixed lights: a warm key from the front-right and a cool fill,
        // so an untextured mesh still reads as a solid object.
        float key = max(dot(normal, normalize(vec3(0.5, 0.7, 0.9))), 0.0);
        float fill = max(dot(normal, normalize(vec3(-0.6, -0.2, -0.5))), 0.0);
        vec3 base = uHasTexture ? texture2D(uTexture, vUv).rgb : vec3(0.72, 0.63, 0.48);
        gl_FragColor = vec4(base * (0.34 + 0.72 * key + 0.20 * fill), 1.0);
      }`;

    function compileShader(gl, type, source) {
      const shader = gl.createShader(type);
      gl.shaderSource(shader, source);
      gl.compileShader(shader);
      if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
        throw new Error(gl.getShaderInfoLog(shader) || "shader failed to compile");
      }
      return shader;
    }

    function modelMatrix(rotationX, rotationY, scale, centre) {
      const cx = Math.cos(rotationX), sx = Math.sin(rotationX);
      const cy = Math.cos(rotationY), sy = Math.sin(rotationY);
      // Rotate Y then X, scale to fit, and translate the mesh's own centre to
      // the origin first so it spins about itself rather than about (0,0,0).
      const m = [
        cy * scale, sy * sx * scale, -sy * cx * scale, 0,
        0, cx * scale, sx * scale, 0,
        sy * scale, -cy * sx * scale, cy * cx * scale, 0,
        0, 0, -3.2, 1
      ];
      const [tx, ty, tz] = centre;
      m[12] -= m[0] * tx + m[4] * ty + m[8] * tz;
      m[13] -= m[1] * tx + m[5] * ty + m[9] * tz;
      m[14] -= m[2] * tx + m[6] * ty + m[10] * tz;
      return new Float32Array(m);
    }

    function perspective(aspect) {
      const f = 1 / Math.tan(Math.PI / 8);
      const near = 0.1, far = 100;
      return new Float32Array([
        f / aspect, 0, 0, 0,
        0, f, 0, 0,
        0, 0, (far + near) / (near - far), -1,
        0, 0, (2 * far * near) / (near - far), 0
      ]);
    }

    async function startModelViewer(canvas, entry) {
      const gl = canvas.getContext("webgl", { antialias: true, alpha: true });
      if (!gl) throw new Error("This browser has no WebGL.");
      const buffer = await (await state.source.file(entry.mesh)).arrayBuffer();
      const mesh = decodeModel(buffer);

      let minimum = [Infinity, Infinity, Infinity];
      let maximum = [-Infinity, -Infinity, -Infinity];
      for (let i = 0; i < mesh.vertexCount; i += 1) {
        for (let axis = 0; axis < 3; axis += 1) {
          const value = mesh.positions[i * 3 + axis];
          if (value < minimum[axis]) minimum[axis] = value;
          if (value > maximum[axis]) maximum[axis] = value;
        }
      }
      const centre = minimum.map((value, axis) => (value + maximum[axis]) / 2);
      const extent = Math.max(...maximum.map((value, axis) => value - minimum[axis]), 0.001);
      const scale = 2.1 / extent;

      const program = gl.createProgram();
      gl.attachShader(program, compileShader(gl, gl.VERTEX_SHADER, MODEL_VERTEX_SHADER));
      gl.attachShader(program, compileShader(gl, gl.FRAGMENT_SHADER, MODEL_FRAGMENT_SHADER));
      gl.linkProgram(program);
      if (!gl.getProgramParameter(program, gl.LINK_STATUS)) {
        throw new Error(gl.getProgramInfoLog(program) || "shader program failed to link");
      }
      gl.useProgram(program);

      const bind = (data, size, name) => {
        const vbo = gl.createBuffer();
        gl.bindBuffer(gl.ARRAY_BUFFER, vbo);
        gl.bufferData(gl.ARRAY_BUFFER, data, gl.STATIC_DRAW);
        const location = gl.getAttribLocation(program, name);
        gl.enableVertexAttribArray(location);
        gl.vertexAttribPointer(location, size, gl.FLOAT, false, 0, 0);
      };
      bind(mesh.positions, 3, "aPosition");
      bind(mesh.normals, 3, "aNormal");
      bind(mesh.uvs, 2, "aUv");
      const ibo = gl.createBuffer();
      gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, ibo);
      gl.bufferData(gl.ELEMENT_ARRAY_BUFFER, mesh.indices, gl.STATIC_DRAW);

      let hasTexture = false;
      if (entry.texture) {
        try {
          const blob = await state.source.file(entry.texture);
          const image = await createImageBitmap(blob);
          const texture = gl.createTexture();
          gl.bindTexture(gl.TEXTURE_2D, texture);
          gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, true);
          gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, image);
          gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
          gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.REPEAT);
          gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.REPEAT);
          hasTexture = true;
        } catch (error) {
          // An unreadable texture is not worth failing the whole viewer for.
        }
      }
      gl.uniform1i(gl.getUniformLocation(program, "uHasTexture"), hasTexture ? 1 : 0);
      gl.uniform1i(gl.getUniformLocation(program, "uTexture"), 0);

      gl.enable(gl.DEPTH_TEST);
      gl.clearColor(0, 0, 0, 0);

      const view = { rotationX: -0.25, rotationY: 0.7, spinning: true };
      const uModel = gl.getUniformLocation(program, "uModel");
      const uProjection = gl.getUniformLocation(program, "uProjection");

      const draw = () => {
        const width = canvas.clientWidth || 320;
        const height = canvas.clientHeight || 260;
        const ratio = Math.min(window.devicePixelRatio || 1, 2);
        if (canvas.width !== width * ratio || canvas.height !== height * ratio) {
          canvas.width = width * ratio;
          canvas.height = height * ratio;
        }
        gl.viewport(0, 0, canvas.width, canvas.height);
        gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);
        gl.uniformMatrix4fv(uProjection, false, perspective(width / height));
        gl.uniformMatrix4fv(uModel, false,
          modelMatrix(view.rotationX, view.rotationY, scale, centre));
        gl.drawElements(gl.TRIANGLES, mesh.indexCount, gl.UNSIGNED_SHORT, 0);
      };

      let frame = 0;
      const loop = () => {
        if (!canvas.isConnected) return cancelAnimationFrame(frame);
        if (view.spinning) view.rotationY += 0.012;
        draw();
        frame = requestAnimationFrame(loop);
      };
      loop();

      let dragging = false, lastX = 0, lastY = 0;
      canvas.onpointerdown = event => {
        dragging = true; view.spinning = false;
        lastX = event.clientX; lastY = event.clientY;
        canvas.setPointerCapture(event.pointerId);
      };
      canvas.onpointermove = event => {
        if (!dragging) return;
        view.rotationY += (event.clientX - lastX) * 0.01;
        view.rotationX = Math.max(-1.5, Math.min(1.5,
          view.rotationX + (event.clientY - lastY) * 0.01));
        lastX = event.clientX; lastY = event.clientY;
      };
      canvas.onpointerup = () => { dragging = false; };
      return { mesh, hasTexture, toggleSpin: () => (view.spinning = !view.spinning) };
    }

    function modelViewerHtml(entry) {
      return `<div class="model-viewer">
        <canvas data-model-canvas aria-label="Rotatable 3D model"></canvas>
        <div class="model-viewer-bar">
          <span class="dim">${prettyNumber(entry.triangles)} triangles</span>
          <button type="button" class="button small" data-model-spin>Pause</button>
        </div>
      </div>`;
    }

    async function wireModelViewer(root, entry) {
      if (!root || typeof root.querySelector !== "function") return;
      const canvas = root.querySelector("[data-model-canvas]");
      if (!canvas) return;
      try {
        const viewer = await startModelViewer(canvas, entry);
        const button = root.querySelector("[data-model-spin]");
        if (button) button.onclick = () => {
          const spinning = viewer.toggleSpin();
          button.textContent = spinning ? "Pause" : "Spin";
        };
      } catch (error) {
        canvas.replaceWith(Object.assign(document.createElement("p"), {
          className: "dim", textContent: `The model could not be drawn: ${error.message}`
        }));
      }
    }

    /* Monster pictures, from two sources and never blended.

       First choice is KalEncyclopedia's monster ImageList, selected exactly as
       frmMonsters does it: imgMonst.Images(mon_pic - 1), where mon_pic = -1
       means the original tool showed nothing. That covers 100 of the 527
       distinct Bango monster names.

       Second choice is gameagit.com's own monster artwork, ingested by
       tools/gameagit_icons and joined to Bango names in MONSTER_ICONS.json.
       It covers another 98, and the two are shaped differently — 100x75 wide
       against roughly 141x218 tall — so each picture is sized from its own
       recorded dimensions instead of being squashed into the other's box.

       Both joins are by exact normalized name, never by id: the Bango
       monstername ids and the legacy mon_azon ids are different spaces and only
       13 of 283 coincide, so an id join would silently show the wrong monster. */
    const MONSTER_PORTRAIT_RATIO = 100 / 75;
    const MONSTER_ICONS_PATH = "analysis/monster_icons/MONSTER_ICONS.json";

    async function loadMonsterIcons() {
      try {
        const parsed = JSON.parse(await state.source.read(MONSTER_ICONS_PATH));
        state.monsterIcons = {
          credit: parsed.credit || null,
          byName: new Map(Object.entries(parsed.icons || {})
            .map(([name, entry]) => [normalizeName(name), entry]))
        };
      } catch (error) {
        state.monsterIcons = null;
      }
    }

    function monsterPortraitName(id, name = "") {
      // Variants of one family share a picture; take the first that has one.
      const pic = legacyMonsterVariantsForRecord(id, name)
        .map(row => Number(row?.mon_pic))
        .find(value => Number.isFinite(value) && value >= 1);
      if (!pic) return "";
      return `kalenc-monster-${String(pic - 1).padStart(3, "0")}`;
    }

    function monsterFallbackPicture(name = "") {
      return state.monsterIcons?.byName.get(normalizeName(name)) || null;
    }

    function monsterHasPicture(name = "") {
      return Boolean(monsterPortraitName("", name) || monsterFallbackPicture(name));
    }

    // Named where these pictures are shown, because they are gameagit.com's
    // work and not this project's. Only where one is actually being shown: a
    // monster that has KalEncyclopedia's own portrait is not their artwork.
    function monsterPictureCredit(names) {
      const list = [names].flat().filter(name =>
        !monsterPortraitName("", name) && monsterFallbackPicture(name));
      const credit = state.monsterIcons?.credit;
      if (!list.length || !credit?.name) return "";
      return `Monster artwork by ${credit.url
        ? `<a href="${escapeAttr(credit.url)}" target="_blank" rel="noopener noreferrer"
             >${escapeHtml(credit.name)}</a>`
        : `<strong>${escapeHtml(credit.name)}</strong>`}.`;
    }

    function monsterIconTag(id, name = "", height = 32) {
      const portrait = monsterPortraitName(id, name);
      if (portrait) {
        return `<img class="icon monster-icon" data-icon="${escapeAttr(portrait)}"
          width="${Math.round(height * MONSTER_PORTRAIT_RATIO)}" height="${height}"
          alt="${escapeAttr(name)}" title="${escapeAttr(name)}">`;
      }
      const fallback = monsterFallbackPicture(name);
      if (fallback) {
        const ratio = Number(fallback.width) && Number(fallback.height)
          ? Number(fallback.width) / Number(fallback.height) : MONSTER_PORTRAIT_RATIO;
        return `<img class="icon monster-icon tall"
          data-project-file="${escapeAttr(fallback.file)}"
          width="${Math.round(height * ratio)}" height="${height}"
          alt="${escapeAttr(name)}" title="${escapeAttr(name)}">`;
      }
      return `<span class="icon icon-monster-blank"
        style="width:${Math.round(height * MONSTER_PORTRAIT_RATIO)}px;height:${height}px"
        aria-hidden="true"></span>`;
    }

    function previewImageTag(name, fallback, label = "") {
      if (!name) return iconTag(fallback, label, 88);
      return `<img class="kalenc-preview" data-icon="${escapeAttr(String(name).toLowerCase())}"${
        fallback ? ` data-icon-fallback="${escapeAttr(String(fallback).toLowerCase())}"` : ""
      } alt="${escapeAttr(label)}" title="${escapeAttr(label)}">`;
    }

    /* Any image at an arbitrary project path — map artwork, not the icon
       library. Goes through state.source for the same reason icons do: on the
       local-folder path there is no URL to point at, only a file handle. */
    /* Fetch a page's pictures a few at a time rather than one after another.

       The loop used to be strictly sequential, which was invisible while a page
       showed a dozen icons. The walkthrough shows 276 NPC photographs, and its
       map — last in the markup — was left waiting behind every one of them: over
       HTTP the map had not appeared nine seconds in. A small pool keeps the
       order-independence without opening three hundred connections at once. */
    const HYDRATE_CONCURRENCY = 8;

    async function inPool(items, worker) {
      const queue = [...items];
      const runners = Array.from({ length: Math.min(HYDRATE_CONCURRENCY, queue.length) },
        async () => {
          while (queue.length) await worker(queue.shift());
        });
      await Promise.all(runners);
    }

    async function hydrateProjectImages(root) {
      if (!root || typeof root.querySelectorAll !== "function") return;
      if (!state.source || typeof state.source.file !== "function") return;
      const pending = [...root.querySelectorAll("img[data-project-file]")]
        .filter(image => !image.getAttribute("src"));
      await inPool(pending, async image => {
        const path = image.dataset.projectFile;
        if (!iconUrlCache.has(path)) {
          try {
            iconUrlCache.set(path, URL.createObjectURL(await state.source.file(path)));
          } catch (error) {
            iconUrlCache.set(path, null);
          }
        }
        const url = iconUrlCache.get(path);
        if (url) image.setAttribute("src", url);
        else image.closest(".map-wrap")?.classList.add("image-missing");
      });
    }

    async function hydrateIcons(root) {
      if (!root || typeof root.querySelectorAll !== "function") return;
      if (!state.source || typeof state.source.file !== "function") return;
      hydrateProjectImages(root);
      const pending = [...root.querySelectorAll("img[data-icon]")]
        .filter(image => !image.getAttribute("src"));
      await inPool(pending, async image => {
        const primary = image.dataset.icon;
        const fallback = image.dataset.iconFallback || "";
        const candidates = [primary, fallback].filter(Boolean);
        let url = null;
        for (const key of candidates) {
          if (!iconUrlCache.has(key)) {
            try {
              const file = await state.source.file(`${ICON_ROOT}/${key}.png`);
              iconUrlCache.set(key, URL.createObjectURL(file));
            } catch (error) {
              iconUrlCache.set(key, null);
            }
          }
          url = iconUrlCache.get(key);
          if (url) break;
        }
        if (url) image.setAttribute("src", url);
        else image.classList.add("icon-missing");
      });
    }

    function skillIconFallback(row) {
      const legacyPic = state.indexes.legacySkillPicByName?.get(normalizeName(row?.sk_megn));
      return legacyPic == null ? "" : `kalenc-skill-${String(legacyPic).padStart(3, "0")}`;
    }

    function skillIconTag(row, size = 32) {
      return iconTag(row?.sk_pic || skillIconFallback(row), row?.sk_megn || row?.bango_key || "",
        size, row?.sk_pic ? skillIconFallback(row) : "");
    }

    function legacyItemForBango(row) {
      const candidates = state.indexes.legacyItemsGroupedByName?.get(normalizeName(row?.ita_name)) || [];
      if (!candidates.length) return null;
      const sameClass = candidates.filter(candidate =>
        canonicalItemClass(candidate.ita_class) === canonicalItemClass(row.ita_class));
      const sameGrade = sameClass.filter(candidate =>
        displayGrade(candidate.ita_grade) === displayGrade(row.ita_grade));
      const clientType = parseJson(row.bango_class_json, [])[1] || "";
      const legacyType = ({ upperarmor: "armor", helmet: "helmet", gauntlet: "gloves",
        boots: "boots", lowerarmor: "shorts", shield: "shield" })[clientType] || "";
      const sameType = sameGrade.filter(candidate => normalizeName(candidate.ita_type) === legacyType);
      return sameType[0] || sameGrade[0] || sameClass[0] || candidates[0];
    }

    function canonicalItemClass(name) {
      const normalized = normalizeName(name);
      return normalized === "mage" ? "magician" : normalized;
    }

    function kalencItemPreviewName(row, legacyItem) {
      const itemClass = parseJson(row.bango_class_json, []);
      const isArmorPiece = itemClass[0] === "defense"
        && new Set(["upperarmor", "helmet", "gauntlet", "boots", "lowerarmor"]).has(itemClass[1]);
      const armorCode = state.indexes.legacyArmorPreviewByClassGrade?.get(
        `${canonicalItemClass(row.ita_class)}~${displayGrade(row.ita_grade)}`);
      if (armorCode && isArmorPiece) {
        return `kalenc-armor-preview-${armorCode}`;
      }
      if (!legacyItem) return "";
      // `ita_pic`, not `ita_pic2`. KalEncyclopedia's item form fills its list
      // from `SELECT ita_class,ita_grade,ita_type,ita_name,ita_lvllim ×4,
      // ita_rev,ita_price,ita_pic,ita_azon` and then reads
      // imgWeapons.Images(SubItems(10)) — subitem 10 of that select is
      // `ita_pic`. The count confirms it: all 311 non-blank `ita_pic` values
      // fall in 0–182 and the exported ImageList holds exactly 183 pictures,
      // while `ita_pic2` runs to 261 (it indexes the talisman list instead).
      const picture = Number(legacyItem.ita_pic);
      if (Number.isInteger(picture) && picture >= 0 && picture < 183) {
        return `kalenc-item-preview-${String(picture).padStart(3, "0")}`;
      }
      return "";
    }

    async function hydrateThemeArt() {
      if (!el.sidebarIllustration || el.sidebarIllustration.getAttribute?.("src")) return;
      if (!state.source || typeof state.source.file !== "function") return;
      try {
        if (!themeArtUrl) {
          const file = await state.source.file(THEME_ART);
          themeArtUrl = URL.createObjectURL(file);
        }
        el.sidebarIllustration.setAttribute("src", themeArtUrl);
      } catch (error) {
        // The interface remains fully usable when an older bundle lacks the
        // decorative art asset.
      }
    }

    // The equipment picker is keyed by legacy `ita_azon`; icons are named by
    // the Bango item's `bango_image`. The two ID spaces are unrelated, so this
    // joins on the normalized name and returns "" rather than a wrong icon
    // when there is no Bango twin.
    function iconNameForEquipment(item) {
      const byName = state.indexes.bangoItemsByName;
      const match = byName && byName.get(normalizeName(item.name));
      return match ? (match.bango_image || "") : "";
    }

    // --- Presentation ---------------------------------------------------

    // The KalEncyclopedia character sheet, rebuilt: label left, value right,
    // two columns, HP and MP as bars, resistances in their own band.
    function simCharacterSheet(build, sheet) {
      const f = sheet.final;
      const line = (label, value, note = "") => `<div class="sheet-line">
        <span>${escapeHtml(label)}</span>
        <b>${value}${note ? ` <small>${note}</small>` : ""}</b></div>`;
      const gearNote = slot => {
        const gear = sheet.gear[slot] || 0;
        const buff = sheet.buffs[slot] || 0;
        const passive = sheet.passives?.[slot] || 0;
        return [
          gear ? `${gear > 0 ? "+" : ""}${prettyNumber(gear)} gear` : "",
          buff ? `${buff > 0 ? "+" : ""}${prettyNumber(buff)} buff` : "",
          passive ? `${passive > 0 ? "+" : ""}${prettyNumber(passive)} passive` : ""
        ].filter(Boolean).join(" · ");
      };
      const bar = (label, value, kind) => `<div class="sheet-bar">
        <span>${escapeHtml(label)}</span>
        <div class="track"><div class="fill ${kind}" style="width:100%"></div></div>
        <b>${prettyNumber(value)}/${prettyNumber(value)}</b></div>`;

      return `<div class="sheet">
        <div class="sheet-head">
          <div><span>Job</span> <b>${escapeHtml(build.cls)}</b></div>
          <div><span>Level</span> <b>${prettyNumber(build.level)}</b></div>
          <div><span>Points spent</span> <b>${prettyNumber(
            PRIMARY_STATS.reduce((total, stat) => total + (Number(build[stat]) || 0), 0))}</b></div>
          <div><span>Provenance</span> <b>BANGO-MEASURED</b></div>
        </div>
        <div class="sheet-bars">
          ${bar("Health Point", f.HP, "hp")}
          ${bar("Magic Point", f.MP, "mp")}
        </div>
        <div class="sheet-cols">
          <div>
            ${PRIMARY_STATS.map(stat => line(stat, prettyNumber(f[stat]), gearNote(stat))).join("")}
          </div>
          <div>
            ${line("Attack Point", `${prettyNumber(f.PDMin)}~${prettyNumber(f.PDMax)}`)}
            ${line("Magic Attack Point", `${prettyNumber(f.MDMin)}~${prettyNumber(f.MDMax)}`)}
            ${line("On Target Point", prettyNumber(f.OTP), gearNote("OTP"))}
            ${line("Evasion Point", prettyNumber(f.Evasion), gearNote("Evasion"))}
            ${line("Defense", prettyNumber(f.Defense), gearNote("Defense") || "no modifier")}
            ${line("Absorption Rate", `${prettyNumber(f.Absorb)}%`, gearNote("Absorb") || "no modifier")}
          </div>
        </div>
        <div class="sheet-section">
          <h4>Resistance</h4>
          <div class="sheet-cols">
            <div>
              ${line("Fire Resistance", prettyNumber(f.Fire))}
              ${line("Ice Resistance", prettyNumber(f.Ice))}
              ${line("Lightning Resistance", prettyNumber(f.Lightening))}
            </div>
            <div>
              ${line("Non Elemental Resistance", prettyNumber(f.NonElemental))}
              ${line("Curse Resistance", prettyNumber(f.Curse))}
            </div>
          </div>
        </div>
      </div>`;
    }

    function simProvenanceBanner() {
      return `<div class="callout info" style="margin-bottom:14px">
        <strong>The character sheet is measured; the combat numbers are not.</strong>
        Derived stats carry <span class="tag accent">BANGO-MEASURED</span> — every formula
        reproduced a real level-38 Magician sheet exactly on 2026-07-25, so this half is
        tier 2, the highest authority the project holds.
        The hit and damage pipeline is <span class="tag gold">ORIG-2006</span>, the decompiled
        Inixsoft engine, and monster stats are the <span class="tag gold">tier-5 legacy
        export</span> of an unrecorded game version. <strong>Neither of those two is Bango</strong>,
        and Bango's own monster combat stats have never been recovered — so anything involving a
        monster is a hypothesis about Bango, not a statement about it.
        A monster's on-target point, evasion and attack are also <strong>derived</strong>: the
        stored columns are additive macros, and the Strength/Agility/level terms
        (<span class="tag gold">REIMPL</span>) are added to them before any comparison here.
      </div>`;
    }

    function simMissing(reason) {
      return `<div class="callout"><strong>Simulator unavailable.</strong> ${escapeHtml(reason)}
        Regenerate it with <code>python tools\\knowledge_base_site\\build_combat_fixture.py</code>
        and reconnect the folder. Nothing is computed from restated constants.</div>`;
    }

    function simWorking(build, sheet) {
      const b = sheet.final;
      const level = sheet.level;
      const str = b.Strength, agi = b.Agility, int_ = b.Intelligence, wis = b.Wisdom;
      return {
        OTP: `Fix(0.277778 × ${str}) + Fix(${agi} ÷ 8)`,
        Evasion: `Fix(${agi} ÷ 3)`,
        // The measured/REIMPL form the sheet actually computes — the
        // KALENC-2011 form (Fix((str−10)×11÷30) … + 2) reads 1 high at
        // Strength 8–9, exactly where the default character sits.
        PDMin: `1 + Fix((11×${str}−80)÷30) + Fix((${agi}−5)÷11) + Fix(7×${level}÷10)`,
        PDMax: `Fix((${str}−5)×8÷15) + Fix((${agi}+17)×11÷47) + ${level} − 3`,
        MDMin: `Fix((${int_}−8)×7÷12) + Fix(${wis}÷7)`,
        MDMax: `Fix(${int_}×7÷12) + Fix(${wis}×0.31249) − 3`,
        HP: `Fix((52×${level}÷3×${simBandAt("hp_level_coefficient_by_level", level)}`
          + ` + ${b.Health}²×q + 115))`
          + (simBandAt("late_health_band_by_level", level)
            ? ` + level-50 Health bonus (band ${simBandAt("late_health_band_by_level", level)})` : ""),
        MP: `Fix(8×${level} + ${wis}²×q + ${wis} + 140)`
          + ` + ${level}×${simBandAt("mp_level_band_by_level", level)}×2`,
        Fire: `Fix(${int_} ÷ 9)`, Ice: `Fix(${int_} ÷ 9)`,
        Lightening: `Fix(${int_} ÷ 9)`
      };
    }

    function simSheetTable(build, sheet) {
      const working = simWorking(build, sheet);
      const order = state.combat.stat_slots;
      const rows = order.map(slot => {
        const base = sheet.base[slot] || 0;
        const gear = sheet.gear[slot] || 0;
        const buffs = (sheet.buffs[slot] || 0) + (sheet.passives?.[slot] || 0);
        const final = sheet.final[slot] || 0;
        if (!base && !gear && !buffs && !final) return "";
        const alternatives = [];
        if (sheet.kalenc[slot] !== undefined && sheet.kalenc[slot] !== base) {
          alternatives.push(`KALENC-2011 would read ${prettyNumber(sheet.kalenc[slot])}`);
        }
        if (sheet.reimpl[slot] !== undefined && sheet.reimpl[slot] !== base) {
          alternatives.push(`REIMPL would read ${prettyNumber(sheet.reimpl[slot])}`);
        }
        const disagreement = alternatives.length
          ? `<br><small class="dim">${escapeHtml(alternatives.join(" · "))}</small>` : "";
        return `<tr>
          <td><strong>${escapeHtml(slot)}</strong>${disagreement}</td>
          <td>${prettyNumber(base)}</td>
          <td>${gear ? prettyNumber(gear) : "<span class=\"dim\">—</span>"}</td>
          <td><strong>${prettyNumber(final)}</strong></td>
          <td>${buffs ? prettyNumber(buffs) : "<span class=\"dim\">—</span>"}</td>
          <td><small class="mono dim">${escapeHtml(working[slot] || "")}</small></td>
        </tr>`;
      }).join("");
      return `<div class="table-wrap"><table>
        <thead><tr><th>Stat</th><th>Base</th><th>Gear</th><th>Final</th>
          <th>Buffs &amp; passives</th><th>Working</th></tr></thead>
        <tbody>${rows}</tbody></table></div>`;
    }

    // What each file source would have said, against what play actually showed.
    function simDisagreementPanel(sheet) {
      const slots = ["PDMin", "PDMax", "MDMin", "MDMax", "OTP", "Evasion",
                     "NonElemental", "Curse"];
      const rows = slots.map(slot => {
        const measured = sheet.base[slot];
        if (measured === undefined) return null;
        const kalenc = sheet.kalenc[slot] !== undefined ? sheet.kalenc[slot]
          : (["NonElemental", "Curse"].includes(slot) ? null : measured);
        const reimpl = sheet.reimpl[slot] !== undefined ? sheet.reimpl[slot] : null;
        const kalencOff = kalenc !== null && kalenc !== measured;
        const reimplOff = reimpl !== null && reimpl !== measured;
        if (!kalencOff && !reimplOff && kalenc !== null && reimpl !== null) return null;
        return { slot, measured, kalenc, reimpl, kalencOff, reimplOff };
      }).filter(Boolean);

      if (!rows.length) {
        return `<div class="callout info"><strong>Both file sources agree with the measurement
          on every derived stat at this build.</strong> That agreement is the corroboration —
          the reimplementation was single-source until the 2011 simulator was read, and neither
          was checked against play until 2026-07-25.</div>`;
      }
      const cell = (value, wrong) => value === null
        ? "<span class=\"dim\">does not derive it</span>"
        : `${prettyNumber(value)}${wrong ? " <span class=\"tag gold\">off</span>" : ""}`;
      return `<div class="callout" style="margin-bottom:14px"><strong>Where the file sources
        part company, and which one play agreed with.</strong> The measured column is what the
        game showed on a naked level-38 Magician. Magic went to KalEncyclopedia; minimum physical
        damage and the two extra resistances went to the reimplementation. Neither source was
        right about everything.</div>
        <div class="table-wrap"><table>
        <thead><tr><th>Stat</th><th>Measured (used)</th><th>KALENC-2011</th><th>REIMPL</th></tr></thead>
        <tbody>${rows.map(row => `<tr>
          <td><strong>${escapeHtml(row.slot)}</strong></td>
          <td><strong>${prettyNumber(row.measured)}</strong></td>
          <td>${cell(row.kalenc, row.kalencOff)}</td>
          <td>${cell(row.reimpl, row.reimplOff)}</td>
        </tr>`).join("")}</tbody></table></div>
        <p class="dim"><small>PDMin only separates the two sources at Strength 8 and 9 across the
          whole 0–250 range. The observed character had Strength 8, which is the only reason one
          screenshot could settle it.</small></p>`;
    }

    const SIM_CORE_SLOTS = ["Boots", "Shorts", "Chest", "Hood / Helmet", "Gloves", "Weapon"];

    function simSlotLabel(rawSlot) {
      const labels = {
        boots: "Boots", lowerarmor: "Shorts", upperarmor: "Chest",
        helmet: "Hood / Helmet", gauntlet: "Gloves", wand: "Weapon",
        stick: "Weapon", bow: "Weapon", sword: "Weapon", weapon: "Weapon",
        necklace: "Necklace", ring: "Ring", trinket: "Trinket",
        mask: "Mask", standard: "Standard"
      };
      const key = normalizeName(rawSlot);
      return labels[key] || String(rawSlot || "Other").replace(/^./, letter => letter.toUpperCase());
    }

    function simCanonicalSlot(category, rawSlot) {
      if (normalizeName(category) === "weapon") return "Weapon";
      const label = simSlotLabel(rawSlot);
      return SIM_CORE_SLOTS.includes(label) ? label : `Other · ${label}`;
    }

    function simWearableClass(item, build) {
      return !item.cls || item.cls === "All"
        || normalizeName(item.cls) === normalizeName(build.cls)
        || (build.cls === "Magician" && normalizeName(item.cls) === "mage");
    }

    function simWearable(item, build) {
      return simWearableClass(item, build)
        && (!item.levelLimit || item.levelLimit <= Number(build.level));
    }

    function simStatsSignature(item) {
      return Object.entries(item.stats || {})
        .sort(([left], [right]) => left.localeCompare(right))
        .map(([slot, value]) => `${slot}:${value}`).join("|");
    }

    function simGroupedOptions(build, slot, filter = () => true) {
      const armour = slot !== "Weapon" && SIM_CORE_SLOTS.includes(slot);
      const groups = new Map();
      state.indexes.equippableItems
        .filter(item => item.slot === slot && simWearable(item, build) && filter(item))
        .forEach(item => {
          const grade = displayGrade(item.grade);
          const identity = armour
            ? `${grade}|${simStatsSignature(item)}`
            : `${grade}|${normalizeName(item.name)}|${simStatsSignature(item)}`;
          if (!groups.has(identity)) groups.set(identity, []);
          groups.get(identity).push(item);
        });
      const options = [...groups.values()].map(items => ({
        items,
        item: items[0],
        grade: items[0].gradeNumber,
        gradeLabel: displayGrade(items[0].grade)
      })).sort((left, right) =>
        left.grade - right.grade || left.item.name.localeCompare(right.item.name));
      const variantsByGrade = new Map();
      options.forEach(option => variantsByGrade.set(option.gradeLabel,
        (variantsByGrade.get(option.gradeLabel) || 0) + 1));
      return options.map(option => ({
        ...option,
        label: armour && variantsByGrade.get(option.gradeLabel) === 1
          ? option.gradeLabel
          : variantsByGrade.get(option.gradeLabel) === 1
            ? option.gradeLabel
            : `${option.gradeLabel} — ${option.item.name}`
      }));
    }

    function simSlotControl(build, slot, options, label = slot) {
      const chosen = String(build.items[slot] || "");
      const chosenInOptions = options.some(option =>
        option.items.some(item => item.id === chosen));
      const chosenItem = chosenInOptions ? state.indexes.equippableById.get(chosen) : null;
      if (!options.length && !chosenItem) return "";
      return `<div class="slot" data-sim-slot="${escapeAttr(slot)}">
        <div class="slot-icon">${iconTag(chosenItem ? chosenItem.icon : "",
          chosenItem ? chosenItem.name : `${label} — empty`)}</div>
        <div class="slot-body"><span>${escapeHtml(label)}</span>
        <select data-sim-item="${escapeAttr(slot)}">
          <option value="">— none —</option>
          ${options.map(option => {
            const selected = option.items.some(item => item.id === chosen);
            const value = selected ? chosen : option.item.id;
            return `<option value="${escapeAttr(value)}"${selected ? " selected" : ""}>${
              escapeHtml(option.label)}</option>`;
          }).join("")}
        </select></div></div>`;
    }

    function simGearControls(build) {
      const ix = state.indexes;
      if (!ix.equippableItems || !ix.equippableItems.length) {
        return `<div class="callout"><strong>No decoded item vectors.</strong>
          The current Bango equipment table was not found, so only manual overrides are available.</div>`;
      }
      const definitions = [
        ["Hood / Helmet", "Hood / Helmet"], ["Other · Necklace", "Protection talisman"],
        ["Pet", "Pet"], ["Chest", "Chest"], ["Weapon", "Weapon"],
        ["Other · Shield", "Shield"], ["Gloves", "Gloves"], ["Other · Ring", "Ring"],
        ["Animal", "Animal"], ["Shorts", "Shorts"], ["Boots", "Boots"],
        ["Other · Trinket", "Trinket"]
      ];
      return `<div class="equipment-board">
        <p class="equipment-board-help"><strong>Right-click</strong> a slot to configure everything
          that belongs to it. Click is the touch and keyboard fallback.</p>
        <div class="equipment-slot-grid">${definitions.map(([slot, label]) =>
          characterEquipmentSlot(build, slot, label)).join("")}</div>
        ${armorFillControlsHtml(build)}
      </div>`;
    }

    /* Five armor pieces, one set of choices.

       Configuring a full set through the slot menus is the same five decisions
       made five times over. This is the same set of choices made once: no icon
       and no cascade, just the four things that actually differ between one
       armor set and the next. It writes through the same build fields the slot
       menu writes, so nothing here is a parallel model. */
    const ARMOR_FILL_SLOTS = ["Hood / Helmet", "Chest", "Gloves", "Shorts", "Boots"];
    // The original enables Bead of Fire from G46 up, and only on the five
    // pieces — never on a shield.
    const BEAD_OF_FIRE_MIN_GRADE = 46;

    /* ===================================================================
       Bead of Fire — per piece, and as a set.  [KALENC-2011]

       Read out of KalEncyclopedia's `frmSkills`, methods
       `MenuItem_Armor_BoF_Click` and `MenuItem_Armor_SetBonus`. All three
       effects write the same shape — `n||n||n` into the 27-slot vector, so
       slots 0, 2 and 4 — which is Strength, Intelligence and Agility, and
       they are added to the gear vector.

         per piece   n by the piece's own grade, from BEAD_AMOUNT_BY_GRADE
         full set    a further flat 5, whatever the grade, when all five
                     pieces share one grade and all five carry a bead
         half set    a further n by grade, when Boots, Gloves and Shorts
                     share one grade and all three carry a bead

       Full is tested first; half is the fallback, never both. Bango's own
       `Bead of Fire` record (`inititem.dat` 942/1029/1165) carries
       `specialty [Str 0][Int 0][Dex 0]` — the same three stats, zeroed in the
       client because the server supplies the values. That corroborates which
       stats, not the amounts, and none of this is confirmed on Bango.

       One guard in the original's full-set path compares its weapon EB-level
       cell against "- Nothing -"; that cell defaults to "0" and never holds
       that string, so the guard cannot fire. It is not reproduced.
       =================================================================== */
    const BEAD_AMOUNT_BY_GRADE = { 46: 1, 50: 2, 55: 3, 60: 4, 65: 5, 70: 6 };
    const BEAD_HALF_SET_BY_GRADE = { 46: 2, 50: 1, 55: 1, 60: 3, 65: 3, 70: 2 };
    const BEAD_FULL_SET_AMOUNT = 5;
    const BEAD_STATS = ["Strength", "Intelligence", "Agility"];
    // Not the same five as ARMOR_FILL_SLOTS: the half set is these three only.
    const BEAD_HALF_SET_SLOTS = ["Boots", "Gloves", "Shorts"];

    function slotHasBead(build, slot) {
      return (build.equipmentMods?.[slot] || {}).equip === "Bead of Fire";
    }

    function slotGradeNumber(build, slot) {
      const item = state.indexes.equippableById.get(String(build.items?.[slot] || ""));
      return item ? gradeNumber(item.grade) : null;
    }

    /* Which set, if either, the five armor pieces currently form. Returns the
       reference grade too, because the half-set amount depends on it. */
    function beadSetState(build) {
      const beaded = slot => slotHasBead(build, slot) && slotGradeNumber(build, slot) != null;
      const grade = slotGradeNumber(build, "Boots");
      if (grade == null) return { kind: "none" };
      const sameGrade = slots => slots.every(slot => slotGradeNumber(build, slot) === grade);
      if (ARMOR_FILL_SLOTS.every(beaded) && sameGrade(ARMOR_FILL_SLOTS)) {
        return { kind: "full", grade, amount: BEAD_FULL_SET_AMOUNT };
      }
      if (BEAD_HALF_SET_SLOTS.every(beaded) && sameGrade(BEAD_HALF_SET_SLOTS)) {
        const amount = BEAD_HALF_SET_BY_GRADE[grade];
        // A grade with no row in the source scores nothing and is named —
        // a counted "+0" would read as "the set does nothing" instead of
        // "nothing was recorded for this grade".
        if (amount == null) return { kind: "half-unscored", grade };
        return { kind: "half", grade, amount };
      }
      return { kind: "none" };
    }

    /* Every beaded piece, plus whichever set bonus they form. `unscored` names
       the pieces whose grade is not on the original's ladder — a G63 armor can
       carry a bead in the menu but the source table has no row for it, and a
       silent zero would read as "the bead does nothing" rather than "this
       grade is not in the source". */
    function beadVector(build) {
      const stats = {};
      const add = amount => BEAD_STATS.forEach(stat => {
        if (amount) stats[stat] = (stats[stat] || 0) + amount;
      });
      const scored = [];
      const unscored = [];
      ARMOR_FILL_SLOTS.forEach(slot => {
        if (!slotHasBead(build, slot)) return;
        const grade = slotGradeNumber(build, slot);
        // No item in the slot: the empty-slot ledger line owns that case.
        if (grade == null) return;
        const amount = BEAD_AMOUNT_BY_GRADE[grade] || 0;
        if (amount) { scored.push({ slot, grade, amount }); add(amount); }
        else unscored.push({ slot, grade });
      });
      const set = beadSetState(build);
      add(set.amount || 0);
      return { stats, scored, unscored, set };
    }

    function armorFillState() {
      state.armorFill ||= { grade: "", defense: 0, bead: false, prefix: "" };
      return state.armorFill;
    }

    // A grade is offered when at least one of the five pieces has an item at it.
    function armorFillGrades(build) {
      const grades = new Map();
      ARMOR_FILL_SLOTS.forEach(slot => {
        equipmentOptionsForSlot(build, slot).forEach(option => {
          const label = option.gradeLabel || "—";
          grades.set(label, Math.max(grades.get(label) || 0, 1));
        });
      });
      return [...grades.keys()].sort((left, right) =>
        (gradeNumber(right) ?? -1) - (gradeNumber(left) ?? -1));
    }

    function armorFillControlsHtml(build) {
      const fill = armorFillState();
      const grades = armorFillGrades(build);
      if (!grades.length) return "";
      const gradeValue = grades.includes(fill.grade) ? fill.grade : "";
      const beadAllowed = (gradeNumber(gradeValue) ?? 0) >= BEAD_OF_FIRE_MIN_GRADE;
      return `<details class="armor-fill"${state.armorFillOpen ? " open" : ""}>
        <summary>Fill all five armor pieces at once</summary>
        <div class="armor-fill-grid">
          <label class="field"><span>Grade</span>
            <select data-armor-fill="grade">
              <option value="">— choose —</option>
              ${grades.map(grade => `<option value="${escapeAttr(grade)}"${
                grade === gradeValue ? " selected" : ""}>${escapeHtml(grade)}</option>`).join("")}
            </select></label>
          <label class="field"><span>Talisman of Defense</span>
            <select data-armor-fill="defense">
              ${Array.from({ length: 11 }, (_, amount) => `<option value="${amount}"${
                Number(fill.defense || 0) === amount ? " selected" : ""
              }>${amount ? `+${amount} Defense` : "— none —"}</option>`).join("")}
            </select></label>
          <label class="field"><span>Bead of Fire</span>
            <select data-armor-fill="bead"${beadAllowed ? "" : " disabled"}>
              <option value="no"${fill.bead && beadAllowed ? "" : " selected"}>No</option>
              <option value="yes"${fill.bead && beadAllowed ? " selected" : ""}>Yes</option>
            </select></label>
          <label class="field"><span>${escapeHtml(
            prefixFamilyForSlot("Chest")?.name || "Prefix")}</span>
            <select data-armor-fill="prefix">
              <option value="">— no prefix —</option>
              ${prefixOptionsHtml("Chest", null, fill.prefix)}
            </select></label>
          <div class="armor-fill-action">
            <button type="button" class="button small" data-armor-fill-apply${
              gradeValue ? "" : " disabled"}>Apply to all five</button>
          </div>
        </div>
        <p class="dim"><small>${beadAllowed
          ? "Writes grade, defense talisman, Bead of Fire and prefix onto Hood / Helmet, Chest, Gloves, Shorts and Boots."
          : `Writes grade, defense talisman and prefix onto Hood / Helmet, Chest, Gloves, Shorts and Boots. Bead of Fire needs G${BEAD_OF_FIRE_MIN_GRADE} or better, as in the original.`}
          A piece with nothing at the chosen grade is left as it is and named below.</small></p>
        ${state.armorFillReport ? `<div class="callout${
          state.armorFillReport.missed.length ? " warn" : " info"}">
          <strong>${escapeHtml(state.armorFillReport.applied)} of ${ARMOR_FILL_SLOTS.length} filled.</strong>
          ${state.armorFillReport.missed.length
            ? ` Nothing this character can wear at ${escapeHtml(state.armorFillReport.grade)} for
              ${escapeHtml(state.armorFillReport.missed.join(", "))}.`
            : ""}</div>` : ""}
      </details>`;
    }

    function applyArmorFill() {
      const fill = armorFillState();
      const build = currentBuild();
      if (!fill.grade) return;
      build.items ||= {};
      build.prefixes ||= {};
      build.equipmentMods ||= {};
      const missed = [];
      let applied = 0;
      ARMOR_FILL_SLOTS.forEach(slot => {
        const option = equipmentOptionsForSlot(build, slot)
          .find(entry => entry.gradeLabel === fill.grade);
        if (!option) {
          // A set can exist at this grade and still be unwearable: the five
          // G46 BeeDan DaeChangEau pieces ask for character level 35, 37, 39,
          // 41 and 43. Saying "no item" would be a lie — say which level.
          const gated = (state.indexes.equippableItems || []).filter(item =>
            item.slot === slot && displayGrade(item.grade) === fill.grade
            && simWearableClass(item, build));
          const lowest = Math.min(...gated.map(item => Number(item.levelLimit) || 0));
          missed.push(gated.length && Number.isFinite(lowest)
            ? `${slot} (needs level ${lowest})` : slot);
          return;
        }
        build.items[slot] = option.item.id;
        build.equipmentMods[slot] ||= {};
        build.equipmentMods[slot].defense = Number(fill.defense) || 0;
        build.equipmentMods[slot].equip =
          fill.bead && (gradeNumber(fill.grade) ?? 0) >= BEAD_OF_FIRE_MIN_GRADE
            ? "Bead of Fire" : "";
        const allowed = new Set(prefixOptionsForSlot(slot, option.item).map(prefix => prefix.id));
        if (fill.prefix && allowed.has(String(fill.prefix))) build.prefixes[slot] = fill.prefix;
        else delete build.prefixes[slot];
        applied += 1;
      });
      state.armorFillReport = { applied, missed, grade: fill.grade };
      state.armorFillOpen = true;
      saveBuild();
      refreshSimResults({ refreshGear: true });
    }

    function equipmentModifierSummary(mods) {
      if (!mods) return "";
      const parts = [];
      if (Number(mods.enhancementLevel)) parts.push(`EB +${mods.enhancementLevel}`);
      if (Number(mods.otp)) parts.push(`+${mods.otp} OTP`);
      if (Number(mods.physical)) parts.push(`+${mods.physical} atk`);
      if (Number(mods.magical)) parts.push(`+${mods.magical} m.atk`);
      if (Number(mods.defense)) parts.push(`+${mods.defense} def`);
      if (mods.stone) parts.push(`${mods.stone} Lv${mods.stoneLevel || 1}`);
      if (mods.equip) parts.push(mods.equip);
      if (mods.dragonName) {
        parts.push(mods.dragonStat
          ? `${mods.dragonName} +${mods.dragonPercent || 0}% / +${mods.dragonRStat || 0} ${mods.dragonStat}`
          : mods.dragonName);
      }
      if (mods.animalGrade) parts.push(`G${mods.animalGrade}`);
      else if (mods.animal) parts.push("no grade set");
      if (mods.petSource) parts.push(mods.petSource);
      return parts.join(" · ");
    }

    /* Every slot needs a picture even when it is empty, and the virtual slots
       (animal, pet) have no equippable item to take one from — so they fall
       back to the client's own animal and pet icons. */
    const SLOT_PLACEHOLDER_ICONS = {
      "Hood / Helmet": "slotbg_helmet", "Chest": "slotbg_upper", "Gloves": "slotbg_gauntlet",
      "Shorts": "slotbg_lower", "Boots": "slotbg_boots", "Weapon": "slotbg_weapon",
      "Other · Shield": "slotbg_shield", "Animal": "slotbg_pet", "Pet": "slotbg_pet"
      // The client ships no empty-slot art for the three accessory slots, so
      // those stay blank rather than borrowing another slot's picture.
    };
    /* Animal transforms and pets, recovered from frmSkills rather than guessed.

       The animal picture is chosen by the first letter of its name and then by
       a grade band: `imgOther.Images(base + Fix((grade - 1) / 10))`, capped at
       band 3. Each animal therefore has four pictures — an egg and three grown
       stages — and the bases are 4, 8, 12 and 17. Index 16 belongs to none of
       them, which is exactly why Eagle starts at 17 and not 16.

       The client's own `pet00N` icons, which this used to point at, are the four
       guardian pets in field and PvP variants. They carry no animal transforms
       at all, so Bird was showing a dragon and Tiger a tortoise. */
    const ANIMAL_ICON_BASE = { Bird: 4, Panther: 8, Tiger: 12, Eagle: 17 };
    const ANIMAL_ICON_BANDS = 4;
    // Pets are one picture per guardian per variant: field 21, 23, 25, 27 and
    // PvP 22, 24, 26, 28. Zamogeon and KalCash share the same eight pictures.
    const PET_ICON_INDEX = {
      "Black Tortoise": 21, "Blue Dragon": 23, "Red Bird": 25, "White Tiger": 27
    };

    function kalencOtherIcon(index) {
      return `kalenc-other-${String(index).padStart(3, "0")}`;
    }

    function animalIconName(animal, grade) {
      const base = ANIMAL_ICON_BASE[animal];
      if (base == null) return "";
      const band = Math.min(ANIMAL_ICON_BANDS - 1,
        Math.max(0, Math.trunc(((Number(grade) || 1) - 1) / 10)));
      return kalencOtherIcon(base + band);
    }

    function petIconName(pet, source = "") {
      const index = PET_ICON_INDEX[String(pet).trim()];
      if (index == null) return "";
      // The PvP variant of each guardian is the next picture along.
      return kalencOtherIcon(/pvp/i.test(String(source)) ? index + 1 : index);
    }

    function equipmentSlotIcon(build, slot) {
      const item = state.indexes.equippableById.get(String(build.items?.[slot] || ""));
      if (item?.icon) return item.icon;
      const mods = build.equipmentMods?.[slot] || {};
      if (slot === "Animal" && mods.animal) {
        return animalIconName(mods.animal, mods.animalGrade) || SLOT_PLACEHOLDER_ICONS[slot];
      }
      if (slot === "Pet" && mods.pet) {
        return petIconName(mods.pet, mods.petSource) || SLOT_PLACEHOLDER_ICONS[slot];
      }
      return SLOT_PLACEHOLDER_ICONS[slot] || "";
    }

    function characterEquipmentSlot(build, slot, label) {
      const item = state.indexes.equippableById.get(String(build.items?.[slot] || ""));
      const prefix = state.indexes.prefixById.get(String(build.prefixes?.[slot] || ""));
      const mods = build.equipmentMods?.[slot] || {};
      const name = item?.name || mods.animal || mods.pet || "";
      const detail = [
        item ? displayGrade(item.grade) : "",
        prefix ? prefix.name : "",
        equipmentModifierSummary(mods)
      ].filter(Boolean).join(" · ");
      return `<button class="equipment-slot${name ? " filled" : ""}" type="button"
          data-equipment-slot="${escapeAttr(slot)}"
          title="${escapeAttr([label, name, detail].filter(Boolean).join(" — "))}"
          aria-label="Configure ${escapeAttr(label)}">
        <span class="slot-icon">${iconTag(equipmentSlotIcon(build, slot),
          name || `${label} — empty`, 34)}</span>
        <span class="equipment-slot-body">
          <strong>${escapeHtml(name || label)}</strong>
          <small>${escapeHtml(name ? (detail || label) : "Empty")}</small>
        </span>
      </button>`;
    }

    function simManualControls(build) {
      return `<details><summary>Manual overrides — type totals the data cannot supply</summary>
        <div class="callout info" style="margin:12px 0">
          <strong>Use these for anything still undecoded.</strong> Beads of Fire, armour set and
          half-set bonuses, elemental stones, DragonScroll and the animal are now counted on the
          sheet, and so are the passive skills whose effect names a stat this sheet has.
          <b>EB <code>+N</code> is still not on the sheet</b> — KalEncyclopedia does not put it
          there either, and the recovered Bango <code>+1…+15</code> grid does not say which of its
          three bands applies to which item, so nothing here would be better than a guess. The
          <a href="#/weapon-calculator">weapon calculator</a> does model EB, which is where the
          original models it too. Pet percentages stay typed in below.</div>
        <div class="field-grid">${state.combat.stat_slots.map(slot => `
          <label class="field"><span>${escapeHtml(slot)}</span>
          <input type="number" step="1" data-sim-manual="${escapeAttr(slot)}"
            value="${escapeAttr(build.manual[slot] ?? "")}" placeholder="0"></label>`).join("")}
        </div></details>`;
    }

    function simNormalizeBuildItems(build) {
      const normalized = {};
      Object.entries(build.items || {}).forEach(([slot, itemId]) => {
        const item = state.indexes.equippableById.get(String(itemId));
        normalized[item ? item.slot : slot] = itemId;
      });
      build.items = normalized;
      return build;
    }

    function equipmentOptionsForSlot(build, slot) {
      if (slot === "Animal" || slot === "Pet") return [];
      return simGroupedOptions(build, slot, () => true);
    }

    function equipmentSelectOptions(build, slot) {
      const chosen = String(build.items?.[slot] || "");
      return equipmentOptionsForSlot(build, slot).map(option => {
        const selected = option.items.some(item => item.id === chosen);
        const value = selected ? chosen : option.item.id;
        const imperial = /\bimperial\b/i.test(option.item.name || "") ? " · Imperial" : "";
        return `<option value="${escapeAttr(value)}"${selected ? " selected" : ""}>${
          escapeHtml(`${option.label}${imperial}`)}</option>`;
      }).join("");
    }

    const ARMOR_EQUIPMENT_SLOTS = new Set([
      "Hood / Helmet", "Chest", "Gloves", "Shorts", "Boots", "Other · Shield"
    ]);
    const ACCESSORY_EQUIPMENT_SLOTS = new Set([
      "Other · Necklace", "Other · Ring", "Other · Trinket"
    ]);
    const PREFIX_STAT_LABELS = {
      Strength: "Strength", Health: "Health", Intelligence: "Intelligence",
      Wisdom: "Wisdom", Agility: "Agility", HP: "HP", MP: "MP", OTP: "OTP",
      Evasion: "Evasion", PDMin: "Min physical attack", PDMax: "Max physical attack",
      MDMin: "Min magical attack", MDMax: "Max magical attack",
      Defense: "Defense", Absorb: "Absorption"
    };

    /* The compact form the equipment menu uses. A full row reads
       "Health +2 · Agility +1 · On target point +1 — Revenge's", which is wide
       enough that the menu clipped the talisman's own name off the end — so the
       one thing you are choosing between became the one thing you could not
       see. The menu row is the name first, then the effects abbreviated:
       `Rev: Wis+1;Agi+2;OTP+1`. Full names and full effect text stay on the
       slot summary, the prefix page and the talisman page. */
    const PREFIX_STAT_SHORT = {
      Strength: "Str", Health: "Hea", Intelligence: "Int", Wisdom: "Wis",
      Agility: "Agi", HP: "HP", MP: "MP", OTP: "OTP", Evasion: "Eva",
      PDMin: "PMin", PDMax: "PMax", MDMin: "MMin", MDMax: "MMax",
      Defense: "Def", Absorb: "Abs", Fire: "Fire", Ice: "Ice",
      Lightening: "Ltn", NonElemental: "NonEl", Curse: "Cur"
    };
    // One fixed order, so a column of prefixes can be read down rather than
    // each row parsed on its own.
    const PREFIX_STAT_ORDER = ["Strength", "Health", "Intelligence", "Wisdom", "Agility",
      "HP", "MP", "OTP", "Evasion", "PDMin", "PDMax", "MDMin", "MDMax",
      "Defense", "Absorb", "Fire", "Ice", "Lightening", "NonElemental", "Curse"];

    function prefixStatEntries(prefix) {
      const stats = prefix?.stats || {};
      const known = PREFIX_STAT_ORDER.filter(stat => stats[stat] !== undefined);
      const rest = Object.keys(stats).filter(stat => !PREFIX_STAT_ORDER.includes(stat));
      return [...known, ...rest].map(stat => [stat, stats[stat]]);
    }

    function prefixEffectText(prefix) {
      return prefixStatEntries(prefix).map(([stat, value]) =>
        `${PREFIX_STAT_LABELS[stat] || stat} ${Number(value) >= 0 ? "+" : ""}${prettyNumber(value)}`
      ).join(" · ");
    }

    function prefixShortEffect(prefix) {
      return prefixStatEntries(prefix).map(([stat, value]) =>
        `${PREFIX_STAT_SHORT[stat] || stat}${Number(value) >= 0 ? "+" : ""}${prettyNumber(value)}`
      ).join(";");
    }

    // Three letters of the talisman's own name, so the name leads the row.
    // A leading "The" is dropped because it identifies nothing.
    function prefixShortName(prefix) {
      const name = String(prefix?.name || "").trim().replace(/^the\s+/i, "");
      const letters = name.replace(/[^A-Za-z0-9]/g, "").slice(0, 3);
      return letters || name.slice(0, 3) || "?";
    }

    function prefixMenuLabel(prefix) {
      return `${prefixShortName(prefix)}: ${prefixShortEffect(prefix)}`;
    }

    function prefixGroupName(prefix) {
      const keys = Object.keys(prefix.stats || {});
      if (keys.includes("PDMin") || keys.includes("PDMax")) return "Physical attack";
      if (keys.includes("MDMin") || keys.includes("MDMax")) return "Magical attack";
      if (keys.length === 1) return PREFIX_STAT_LABELS[keys[0]] || keys[0];
      return "Multiple stats";
    }

    function prefixFamilyIds(family) {
      return state.indexes.prefixFamilyIds?.[family]
        || ({ weapon: WEAPON_PREFIX_FLOOR, armor: ARMOR_PREFIX_FLOOR,
              accessory: ACCESSORY_PREFIX_FLOOR })[family];
    }

    function prefixFamilyForSlot(slot) {
      if (slot === "Weapon") return {
        name: "Talisman of Intensification", ids: prefixFamilyIds("weapon")
      };
      if (ARMOR_EQUIPMENT_SLOTS.has(slot)) return {
        name: "Talisman of Protection", ids: prefixFamilyIds("armor")
      };
      if (ACCESSORY_EQUIPMENT_SLOTS.has(slot)) return {
        name: "Talisman of Wonder", ids: prefixFamilyIds("accessory")
      };
      return null;
    }

    /* Is the Weapon slot a magic weapon? With no weapon chosen the class
       answers, which is what the amount branch beside it already did — so a
       Magician with an empty slot was being offered the physical-attack
       prefixes under a menu headed "Mag. attack". (Invisible until the
       attack/magic attributes started decoding at all.) */
    function weaponIsMagic(item, build = null) {
      if (item) return item.rawSlot === "wand";
      return (build || currentBuild())?.cls === "Magician";
    }

    function prefixOptionsForSlot(slot, item = null) {
      const family = prefixFamilyForSlot(slot);
      if (!family) return [];
      const magic = slot === "Weapon" ? weaponIsMagic(item) : false;
      return state.indexes.prefixOptions.filter(prefix => {
        if (!family.ids.has(prefix.id)) return false;
        const group = prefixGroupName(prefix);
        if (slot === "Weapon" && magic && group === "Physical attack") return false;
        if (slot === "Weapon" && !magic && group === "Magical attack") return false;
        return true;
      });
    }

    /* The keyboard/touch fallback for the same list, and it has to agree with
       the cascading menu — same grouping, same smallest-first order. */
    function prefixOptionsHtml(slot, item, selectedId) {
      return prefixBranchesForSlot(slot, item, selectedId)
        .filter(branch => branch.children)
        .map(branch => `<optgroup label="${escapeAttr(branch.label)}">
          ${branch.children.map(child => `<option value="${escapeAttr(child.prefix)}"${
            child.checked ? " selected" : ""}>${escapeHtml(child.label)}</option>`).join("")}
        </optgroup>`).join("");
    }

    function talismanAmountOptions(value, unit) {
      return Array.from({ length: 11 }, (_, amount) => `<option value="${amount}"${
        Number(value || 0) === amount ? " selected" : ""
      }>${amount ? `+${amount} ${escapeHtml(unit)}` : "— none —"}</option>`).join("");
    }

    function equipmentDialogHtml(build, slot) {
      const item = state.indexes.equippableById.get(String(build.items?.[slot] || ""));
      const mods = build.equipmentMods?.[slot] || {};
      const virtual = slot === "Animal" || slot === "Pet";
      const prefixFamily = prefixFamilyForSlot(slot);
      const isWeapon = slot === "Weapon";
      const isArmor = ARMOR_EQUIPMENT_SLOTS.has(slot);
      const isMagicWeapon = isWeapon && weaponIsMagic(item, build);
      const label = slot.replace(/^Other · /, "");
      const dragonNames = ["Imoogi", "Shadow Dragon", "Sky Dragon", "Ancient Dragon",
        "Storm Dragon", "Violent Dragon", "Thunder Dragon"];
      const animalNames = ["Bird", "Panther", "Tiger", "Eagle"];

      const modifierFields = isWeapon ? `
        <label class="field"><span>Talisman of Accuracy</span>
          <select data-equipment-mod="otp">${talismanAmountOptions(mods.otp, "OTP")}</select></label>
        ${isMagicWeapon ? `
          <label class="field"><span>Talisman of Magic</span>
            <select data-equipment-mod="magical">${talismanAmountOptions(mods.magical, "min/max magical attack")}</select></label>
        ` : `
          <label class="field"><span>Talisman of Attack</span>
            <select data-equipment-mod="physical">${talismanAmountOptions(mods.physical, "min/max physical attack")}</select></label>
        `}
      ` : (isArmor ? `
        <label class="field"><span>Talisman of Defense</span>
          <select data-equipment-mod="defense">${talismanAmountOptions(mods.defense, "Defense")}</select></label>
      ` : "");
      const animalField = slot === "Animal" ? `
        <label class="field"><span>Animal</span><select data-equipment-mod="animal">
          <option value="">— no animal —</option>
          ${animalNames.map(name => `<option value="${escapeAttr(name)}"${
            mods.animal === name ? " selected" : ""}>${escapeHtml(name)}</option>`).join("")}
        </select></label>
        <label class="field"><span>Grade</span><select data-equipment-mod="animalGrade">
          <option value="0">— none —</option>
          ${Array.from({ length: 80 }, (_, index) => index + 1).map(grade =>
            `<option value="${grade}"${Number(mods.animalGrade || 0) === grade
              ? " selected" : ""}>G${String(grade).padStart(2, "0")}</option>`).join("")}
        </select></label>` : "";
      const petField = slot === "Pet" ? `
        <label class="field"><span>Pet kind</span><select data-equipment-mod="petSource">
          <option value="">— no pet —</option>
          ${PET_SOURCES.map(name => `<option value="${escapeAttr(name)}"${
            mods.petSource === name ? " selected" : ""}>${escapeHtml(name)}</option>`).join("")}
        </select></label>
        <label class="field"><span>Guardian</span><select data-equipment-mod="pet">
          <option value="">— none —</option>
          ${PET_GUARDIANS.map(name => `<option value="${escapeAttr(name)}"${
            mods.pet === name ? " selected" : ""}>${escapeHtml(name)}</option>`).join("")}
        </select></label>` : "";
      return `<div class="equipment-config">
        <div class="equipment-config-summary">
          <span class="slot-icon">${iconTag(item?.icon || "", item?.name || `${label} — empty`, 52)}</span>
          <div><strong>${escapeHtml(item?.name || label)}</strong><br>
            <span class="dim">${item
              ? `${displayGrade(item.grade)} · required level ${item.levelLimit || "—"}`
              : "No item selected"}</span></div>
        </div>
        ${virtual ? "" : `<label class="field"><span>Grade / version${
          slot === "Weapon" ? " / Imperial" : ""}</span>
          <select data-equipment-item="${escapeAttr(slot)}">
            <option value="">— none —</option>${equipmentSelectOptions(build, slot)}
          </select></label>
        <label class="field"><span>${escapeHtml(prefixFamily?.name || "Talisman")} — prefix and exact effect</span>
          <select data-equipment-prefix="${escapeAttr(slot)}">
            <option value="">— no prefix —</option>
            ${prefixOptionsHtml(slot, item, build.prefixes?.[slot])}
          </select></label>`}
        ${animalField}${petField}
        <div class="equipment-modifier-grid">
          ${modifierFields}
          ${!isWeapon ? "" : `<label class="field"><span>EB level</span>
            <select data-equipment-mod="enhancementLevel">
              ${Array.from({ length: 16 }, (_, level) => `<option value="${level}"${
                Number(mods.enhancementLevel || 0) === level ? " selected" : ""
              }>+${level}</option>`).join("")}
            </select></label>
          <label class="field"><span>Elemental enhancement</span>
            <select data-equipment-mod="element">
              ${["", "Fire", "Ice", "Lightning"].map(name => `<option value="${name}"${
                mods.element === name ? " selected" : ""
              }>${name || "— none —"}</option>`).join("")}
            </select></label>
          <label class="field"><span>Element level</span>
            <select data-equipment-mod="elementLevel">
              ${[0, 1, 2, 3].map(level => `<option value="${level}"${
                Number(mods.elementLevel || 0) === level ? " selected" : ""
              }>${level ? `Level ${level}` : "—"}</option>`).join("")}
            </select></label>
          <label class="field"><span>Dragon scroll</span>
            <select data-equipment-mod="dragonName">
              <option value="">— no scroll —</option>
              ${dragonNames.map(name => `<option value="${escapeAttr(name)}"${
                mods.dragonName === name ? " selected" : ""}>${escapeHtml(name)}</option>`).join("")}
            </select></label>
          <label class="field"><span>Dragon scroll stat</span>
            <select data-equipment-mod="dragonStat">
              <option value="">—</option>
              ${PRIMARY_STATS.map(name => `<option value="${escapeAttr(name)}"${
                mods.dragonStat === name ? " selected" : ""}>${escapeHtml(name)}</option>`).join("")}
            </select></label>`}
        </div>
        ${virtual ? `<div class="callout info"><strong>Legacy selector.</strong> The choices above
          reproduce the KalEncyclopedia list. Bango pet/animal stat mappings are not registered, so
          the selection is saved but does not change totals.</div>` : `
        <div class="callout info"><strong>KalEncyclopedia hierarchy.</strong> Prefix choices are
          filtered to ${escapeHtml(prefixFamily?.name || "this equipment category")} and every name
          shows its decoded stat effect. Accuracy, Attack, Magic and Defense talismans change the
          sheet by the selected amount. EB, elemental and dragon-scroll controls exist only on the
          weapon; those three choices remain excluded from totals until their Bango application
          mapping is registered.</div>`}
      </div>`;
    }

    /* ===================================================================
       Equipment slot menu

       KalEncyclopedia configures a slot through a cascading right-click
       menu, and that is the interaction being reproduced here — not a form.
       The tree per slot, recovered from frmSkills:

         Weapon   Grade > <grade> > <weapon>, Prefix > <family> > <prefix>,
                  On target point > +0..+7, Phys./Mag. attack > +0..+18,
                  EB Lvl > 0..18, Elemental stones > Lvl 1|2|3 > <stone>,
                  DragonScroll > <scroll> > <percentage and stat>
         Armor    Grade, Prefix, Defense > +0..+10, Equip > Bead of Fire,
                  DragonScroll
         Accessory  Prefix > <family> > <prefix>, and the item list
         Animal   Grade > 1..80, then the four animals
         Pet      the eight pets

       Only the leaves write to the build; a branch just opens.
       =================================================================== */
    const ELEMENTAL_STONE_LEVELS = [1, 2, 3];
    const DRAGON_SCROLLS = ["Imoogi", "Shadow Dragon", "Sky Dragon", "Ancient Dragon",
      "Storm Dragon", "Violent Dragon", "Thunder Dragon"];
    // Resistance-stat bonus per scroll tier. Weapons and chest reach 5 at
    // Thunder; shorts share the chest percentages but not its top tier; the
    // remaining pieces cap at 4.
    const DRAGON_SCROLL_RSTAT = {
      weapon: [1, 1, 2, 2, 3, 3, 5],
      chest: [1, 1, 2, 2, 3, 3, 5],
      shorts: [1, 1, 1, 2, 2, 3, 5],
      other: [1, 1, 1, 2, 2, 3, 4]
    };
    const ANIMALS = ["Bird", "Panther", "Tiger", "Eagle"];
    // frmSkills' own pet menu has two levels: where the pet came from, then
    // which of the four guardians it is. Flattening them into one list, as this
    // used to, offered "Zamogeon - Field Pet" as if it were a creature.
    const PET_SOURCES = ["Zamogeon - Field Pet", "Zamogeon - PvP Pet",
      "KalCash - Field Pet", "KalCash - PvP Pet"];
    const PET_GUARDIANS = ["Black Tortoise", "Blue Dragon", "Red Bird", "White Tiger"];

    function elementalStones() {
      return (state.optional.legacyItems || []).filter(row => String(row.ita_itype) === "9");
    }

    function dragonScrollRow(slot) {
      if (slot === "Weapon") return "weapon";
      if (slot === "Chest") return "chest";
      if (slot === "Shorts") return "shorts";
      return "other";
    }

    /* Weapons carry two percentage steps per scroll tier; armor carries the
       next two. The stat bonus comes from the per-slot ladder above. */
    function dragonScrollLeaves(slot, scrollIndex) {
      const isWeapon = slot === "Weapon";
      const first = isWeapon ? scrollIndex * 2 + 1 : scrollIndex * 2 + 3;
      const rstat = DRAGON_SCROLL_RSTAT[dragonScrollRow(slot)][scrollIndex];
      const kind = isWeapon ? "Dmg" : "Def";
      return [first, first + 1].flatMap(percent => PRIMARY_STATS.map(stat => ({
        label: `+${percent}% ${kind} · +${rstat} ${stat}`,
        set: { dragonName: DRAGON_SCROLLS[scrollIndex], dragonStat: stat,
          dragonPercent: percent, dragonRStat: rstat }
      })));
    }

    function amountBranch(label, key, mods, max, format = value => `+${value}`) {
      return {
        label,
        children: Array.from({ length: max + 1 }, (_, value) => ({
          label: format(value),
          checked: Number(mods[key] || 0) === value,
          set: { [key]: value }
        }))
      };
    }

    /* What a prefix is worth, for ordering. The names carry no order at all —
       "Healthy" sorts before "Hearty" alphabetically whatever they give — so a
       family is listed by the size of its effect instead, smallest first. */
    function prefixMagnitude(prefix) {
      return Object.values(prefix.stats || {})
        .reduce((total, value) => total + (Number(value) || 0), 0);
    }

    function prefixBranchesForSlot(slot, item, selectedId) {
      const groups = new Map();
      prefixOptionsForSlot(slot, item).forEach(prefix =>
        mapPush(groups, prefixGroupName(prefix), prefix));
      const ordered = [...groups.entries()].sort(([left], [right]) =>
        // Single-stat families first, in alphabetical order; the mixed bag last.
        (left === "Multiple stats") - (right === "Multiple stats")
        || left.localeCompare(right));
      return [
        { label: "— No prefix —", checked: !selectedId, prefix: "" },
        ...ordered.map(([group, prefixes]) => ({
          label: group,
          children: [...prefixes]
            .sort((left, right) => prefixMagnitude(left) - prefixMagnitude(right)
              || String(left.name).localeCompare(String(right.name)))
            .map(prefix => ({
              label: prefixMenuLabel(prefix),
              checked: String(selectedId || "") === prefix.id,
              prefix: prefix.id
            }))
        }))
      ];
    }

    function gradeBranchForSlot(build, slot, emptyLabel) {
      const chosen = String(build.items?.[slot] || "");
      const byGrade = new Map();
      equipmentOptionsForSlot(build, slot).forEach(option =>
        mapPush(byGrade, displayGrade(option.item.grade) || "—", option));
      const grades = [...byGrade.entries()].sort(([left], [right]) =>
        (gradeNumber(right) ?? -1) - (gradeNumber(left) ?? -1));
      return {
        label: "Grade",
        children: [
          { label: emptyLabel, checked: !chosen, item: "" },
          ...grades.map(([grade, options]) => {
            // A grade with one item needs no third level; several distinct
            // weapons in one grade do.
            if (options.length === 1) {
              const item = options[0].item;
              return { label: `${grade} — ${item.name}`, checked: item.id === chosen, item: item.id };
            }
            return {
              label: grade,
              marked: options.some(option => option.items.some(entry => entry.id === chosen)),
              children: options.map(option => ({
                label: option.item.name,
                checked: option.items.some(entry => entry.id === chosen),
                item: option.item.id
              }))
            };
          })
        ]
      };
    }

    function slotMenuModel(build, slot) {
      const item = state.indexes.equippableById.get(String(build.items?.[slot] || ""));
      const mods = build.equipmentMods?.[slot] || {};
      const isWeapon = slot === "Weapon";
      const isArmor = ARMOR_EQUIPMENT_SLOTS.has(slot);
      const isMagicWeapon = isWeapon && weaponIsMagic(item, build);

      if (slot === "Animal") {
        return [
          {
            label: "Grade",
            children: Array.from({ length: 80 }, (_, index) => index + 1).map(grade => ({
              label: `G${String(grade).padStart(2, "0")}`,
              checked: Number(mods.animalGrade || 0) === grade,
              set: { animalGrade: grade }
            }))
          },
          { separator: true },
          { label: "— No animal —", checked: !mods.animal, set: { animal: "" } },
          ...ANIMALS.map(name => ({
            label: name, checked: mods.animal === name, set: { animal: name }
          }))
        ];
      }

      if (slot === "Pet") {
        return [
          { label: "— No pet —", checked: !mods.pet,
            set: { pet: "", petSource: "" } },
          ...PET_SOURCES.map(source => ({
            label: source,
            marked: mods.petSource === source,
            children: PET_GUARDIANS.map(guardian => ({
              label: guardian,
              checked: mods.petSource === source && mods.pet === guardian,
              set: { pet: guardian, petSource: source }
            }))
          }))
        ];
      }

      const branches = [gradeBranchForSlot(build, slot,
        isWeapon ? "— No weapon —" : isArmor ? "— No armor —" : "— Nothing —")];

      const prefixFamily = prefixFamilyForSlot(slot);
      if (prefixFamily) {
        branches.push({
          label: prefixFamily.name,
          children: prefixBranchesForSlot(slot, item, build.prefixes?.[slot])
        });
      }

      if (isWeapon) {
        branches.push(amountBranch("On target point", "otp", mods, 7));
        branches.push(isMagicWeapon
          ? amountBranch("Mag. attack", "magical", mods, 18)
