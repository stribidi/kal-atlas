    .xp-band.peak { color: #7a3b8c; background: rgba(122, 59, 140, .16); }

    tr.total-row td { border-top: 2px solid var(--line); border-bottom: 0; }
    tr.current-row { background: rgba(31, 90, 69, .08); }
    tr.current-row td { color: var(--text); font-weight: 650; }

    .talisman-rolls {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
      gap: 12px;
    }
    .talisman-roll {
      border: 1px solid var(--line-soft);
      border-radius: var(--radius-sm);
      padding: 10px 12px;
      background: var(--panel-2);
    }
    .talisman-roll-head {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 6px;
    }
    .talisman-roll .stat-lines { grid-template-columns: 1fr; }
    .talisman-props {
      margin: 0;
      color: var(--text);
      font-size: 13px;
      white-space: pre-wrap;
    }

    .item-flavour {
      margin: 10px 0 0;
      color: var(--muted);
      font-size: 12.5px;
      font-style: italic;
    }

    .versus-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 4px 26px;
    }
    .panel h4 {
      margin: 12px 0 5px;
      color: var(--muted);
      font-size: 10.5px;
      font-weight: 800;
      letter-spacing: .09em;
      text-transform: uppercase;
    }
    .panel h4:first-child, .versus-grid h4 { margin-top: 0; }

    .model-viewer { margin: -2px 0 0; }
    .model-viewer canvas {
      display: block;
      width: 100%;
      height: 240px;
      border: 1px solid #bfa77f;
      border-radius: var(--radius-sm);
      background:
        radial-gradient(circle at 50% 38%, rgba(255, 250, 240, .85), transparent 62%),
        linear-gradient(160deg, #efe8da, #ded5c3);
      cursor: grab;
      touch-action: none;
    }
    .model-viewer canvas:active { cursor: grabbing; }
    .model-viewer-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-top: 7px;
      font-size: 11.5px;
    }

    .link-list { margin: 0; padding: 0; list-style: none; }
    .link-list li { padding: 3px 0; border-bottom: 1px dotted var(--line-soft); font-size: 13px; }
    .link-list li:last-child { border-bottom: 0; }
    .link-list small { display: block; color: var(--dim); font-size: 11.5px; }

    /* ── Night surfaces, last word ───────────────────────────────────────
       Rules that have to sit at the end because the light-surface versions
       they replace are declared further down the sheet than the palette
       block. Ink that used to be dark on a pale tint is inverted here; a
       tint left alone would put near-black text on a near-black panel. */
    .sort-head:hover { color: var(--accent); background: rgba(108, 198, 160, .07); }
    .map-tab.active .dim { color: rgba(10, 21, 18, .68); }
    .xp-band.dead { color: var(--dim); background: rgba(126, 143, 132, .14); }
    .xp-band.cold { color: #7fb3dd; background: rgba(127, 179, 221, .13); }
    .xp-band.cool { color: #6cc6a0; background: rgba(108, 198, 160, .13); }
    .xp-band.even { color: #d8b761; background: rgba(216, 183, 97, .14); }
    .xp-band.warm { color: #e0a26a; background: rgba(224, 162, 106, .14); }
    .xp-band.hot  { color: #e2887a; background: rgba(226, 136, 122, .14); }
    .xp-band.peak { color: #c193d8; background: rgba(193, 147, 216, .14); }
    tr.current-row { background: rgba(108, 198, 160, .1); }
    .slot-menu, .slot-menu-list .slot-menu-list {
      box-shadow: 0 18px 42px rgba(0, 0, 0, .55);
    }
    .slot-menu-item:hover, .slot-menu-item:focus-visible {
      background: rgba(108, 198, 160, .1);
    }
    .map-pin { border-color: #f6efe0; }
    /* Portraits, item previews and the model stage keep a light plate: the
       client's artwork is drawn to sit on one, and a dark plate loses the
       outlines. They read as framed pictures rather than as page surface. */
    .entity-hero .entity-portrait, .item-preview {
      border-color: #7c6647;
      background:
        linear-gradient(135deg, rgba(31, 90, 69, .1), transparent 55%),
        #e6dcc8;
      box-shadow: inset 0 0 0 1px rgba(255, 250, 240, .5);
    }
    .model-viewer canvas { border-color: #7c6647; }
    .monster-icon { background: #cfc7b6; }
  </style>
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" aria-label="Primary navigation">
      <img class="sidebar-illustration" id="sidebarIllustration" alt="" aria-hidden="true">
      <a class="brand" href="#/home">
        <span class="brand-mark">K</span>
        <span><strong>KAL ATLAS</strong><span>Linked knowledge base</span></span>
      </a>
      <div id="desktopNav"></div>
      <div class="sidebar-status" id="sidebarStatus">
        <strong>Waiting for data</strong>
        Select the project folder to begin.
      </div>
    </aside>

    <div class="workspace">
      <nav class="mobile-nav" id="mobileNav" aria-label="Mobile navigation"></nav>
      <header class="topbar">
        <form class="global-search" id="globalSearch">
          <label class="hidden" for="globalSearchInput">Search every entity</label>
          <input id="globalSearchInput" name="q" type="search" autocomplete="off"
                 placeholder="Search monsters, items, quests, skills, NPCs…">
          <button type="submit">Search</button>
        </form>
        <div class="top-actions">
          <div class="profile-switcher" id="profileSwitcher"></div>
          <span class="status-dot" id="statusDot" aria-hidden="true"></span>
          <span class="dim" id="topStatus">Not connected</span>
          <button class="small ghost" type="button" data-action="reconnect">Reconnect</button>
        </div>
      </header>

      <main id="main" tabindex="-1"></main>
    </div>
  </div>

  <input class="hidden" id="folderInput" type="file" webkitdirectory multiple>

  <dialog id="evidenceDialog">
    <div class="dialog-head">
      <h2 id="evidenceTitle">Source evidence</h2>
      <button class="small ghost" type="button" data-action="close-dialog">Close</button>
    </div>

    function escapeHtml(value) {
      return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function escapeAttr(value) {
      return escapeHtml(value).replaceAll("`", "&#096;");
    }

    function normalizeName(value) {
      return String(value ?? "")
        .normalize("NFKD")
        .replace(/[\u0300-\u036f]/g, "")
        .toLowerCase()
        .replace(/[^a-z0-9]+/g, "");
    }

    /* normalizeName with the word boundaries kept.

       Dropping every separator is what lets `Sae-Ryu` in a pin label and
       `[Sae-Ryu]` in a client string meet as `saeryu` \u2014 but it also lets a
       short name meet the middle of an unrelated word. `Chang` matched
       "information interchange" and put an NPC from the level-1 town on a
       level-79 goblin quest.

       So the normalized text carries, per character, whether a separator or
       the start of the string preceded it. An alias then has to begin where a
       word begins and end where one ends. A hyphenated name still matches
       across the hyphen, because the alias spans those words too. */
    function normalizedSpans(value) {
      const text = [];
      const wordStart = [];
      let afterSeparator = true;
      for (const character of String(value ?? "").normalize("NFKD")
        .replace(/[\u0300-\u036f]/g, "").toLowerCase()) {
        if (/[a-z0-9]/.test(character)) {
          text.push(character);
          wordStart.push(afterSeparator);
          afterSeparator = false;
        } else {
          afterSeparator = true;
        }
      }
      return { text: text.join(""), wordStart };
    }

    function spansContainWord(spans, alias) {
      if (!alias) return false;
      for (let at = spans.text.indexOf(alias); at !== -1;
        at = spans.text.indexOf(alias, at + 1)) {
        const end = at + alias.length;
        if (spans.wordStart[at] && (end === spans.text.length || spans.wordStart[end])) {
          return true;
        }
      }
      return false;
    }

    function displayGrade(value) {
      const number = Number(String(value ?? "").replace(/[^\d]/g, ""));
      return number ? `G${number}` : "—";
    }

    function normalizePath(value) {
      return String(value ?? "").replaceAll("\\", "/").replace(/^\.?\//, "");
    }

    function prettyNumber(value) {
      const number = Number(value);
      return Number.isFinite(number) ? number.toLocaleString("en-US") : String(value ?? "—");
    }

    /* The route guide writes emphasis into its own prose ("<b>Devil Troop Of
       Hatred</b>"). Escaping everything and then re-allowing exactly those two
       tags keeps the emphasis without letting a source file inject markup. */
    function cleanHtmlText(value) {
      return escapeHtml(String(value ?? ""))
        .replace(/&lt;(\/?)(b|strong|i|em)&gt;/g, "<$1$2>");
    }

    function cleanText(value) {
      return String(value ?? "")
        .replaceAll("#n", "\n")
        .replaceAll("&#x20;", " ")
        .trim();
    }

    function parseJson(value, fallback = []) {
      if (value === "" || value == null) return fallback;
      try { return JSON.parse(value); }
      catch { return fallback; }
    }

    function routeHref(type, id = "", query = "") {
      const suffix = id === "" ? "" : `/${encodeURIComponent(String(id))}`;
      return `#/${type}${suffix}${query ? `?${query}` : ""}`;
    }

    function entityLink(type, id, label, extraClass = "") {
      if (id == null || id === "") return escapeHtml(label || "Unknown");
      return `<a class="${escapeAttr(extraClass)}" href="${routeHref(type, id)}">${escapeHtml(label || id)}</a>`;
    }

    function sourceButton(row, label = "Evidence") {
      const id = `ev-${++state.evidenceCounter}`;
      state.evidence.set(id, row);
      return `<button class="small ghost" type="button" data-action="show-evidence" data-evidence-id="${id}">${escapeHtml(label)}</button>`;
    }

    function provenanceTag(row) {
      const value = row?.provenance || "derived view";
      const className = value === "bango-file" ? "accent" : value.includes("legacy") ? "gold" : "blue";
      return `<span class="tag ${className}">${escapeHtml(value)}</span>`;
    }

    function tags(values, className = "") {
      return values.filter(value => value !== "" && value != null)
        .map(value => `<span class="tag ${className}">${escapeHtml(value)}</span>`).join("");
    }

    /* ── Dense reading surfaces ─────────────────────────────────────────
       `section` wraps a heading and a body in a full card and is right for a
       table or a workspace. Most of what an entity page shows is a dozen
       short label/value pairs, and a card each turns that into a page of
       mostly empty boxes. `panel` and `statLines` are the compact pair:
       one light frame, values on a tight baseline grid. */
    function panel(title, body, options = {}) {
      if (!body) return "";
      return `<section class="panel${options.wide ? " wide" : ""}">
        ${title ? `<h3>${escapeHtml(title)}${options.aside || ""}</h3>` : ""}
        ${body}</section>`;
    }

    function statLines(entries) {
      const rows = entries
        .filter(([, value]) => value !== "" && value != null)
        .map(([label, value, note]) => `<div class="stat-line">
          <span>${escapeHtml(label)}</span>
          <b>${value}${note ? ` <small>${note}</small>` : ""}</b></div>`).join("");
      return rows ? `<div class="stat-lines">${rows}</div>` : "";
    }

    /* Everything a player does not need in order to play — source lines,
       join methods, authority notes — collapses into one disclosure at the
       foot of the page instead of interrupting the content. */
    function provenanceFooter(body) {
      if (!body) return "";
      return `<details class="provenance-foot">
        <summary>Where this data comes from</summary>
        <div class="provenance-body">${body}</div></details>`;
    }

    function definitionGrid(entries) {
      const cells = entries.filter(([, value]) => value !== "" && value != null).map(([label, value]) => `
        <div class="definition">
          <dt>${escapeHtml(label)}</dt>
          <dd>${value}</dd>
        </div>`).join("");
      return cells ? `<dl class="definition-grid">${cells}</dl>` : "";
    }

    function emptyState(message) {
      return `<div class="empty">${escapeHtml(message)}</div>`;
    }

    function safeId(value) {
      return String(value ?? "").toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "");
    }

    function parseCsv(text) {
      const source = String(text ?? "").replace(/^\uFEFF/, "");
      const rows = [];
      let row = [];
      let field = "";
      let quoted = false;

      for (let i = 0; i < source.length; i += 1) {
        const char = source[i];
        if (quoted) {
          if (char === '"') {
            if (source[i + 1] === '"') {
              field += '"';
              i += 1;
            } else {
              quoted = false;
            }
          } else {
            field += char;
          }
          continue;
        }

        if (char === '"' && field === "") {
          quoted = true;
        } else if (char === ",") {
          row.push(field);
          field = "";
        } else if (char === "\n") {
          row.push(field.replace(/\r$/, ""));
          rows.push(row);
          row = [];
          field = "";
        } else {
          field += char;
        }
      }

      if (field !== "" || row.length) {
        row.push(field.replace(/\r$/, ""));
        rows.push(row);
      }

      while (rows.length && rows[rows.length - 1].every(cell => cell === "")) rows.pop();
      if (!rows.length) return [];
      const headers = rows.shift().map(header => header.trim());
      return rows.map((cells, rowIndex) => {
        const result = { __rowIndex: rowIndex };
        headers.forEach((header, index) => { result[header] = cells[index] ?? ""; });
        return result;
      });
    }

    async function openDb() {
      if (!("indexedDB" in window)) return null;
      return new Promise((resolve, reject) => {
        const request = indexedDB.open("kal-atlas", 1);
        request.onupgradeneeded = () => request.result.createObjectStore("handles");
        request.onsuccess = () => resolve(request.result);
        request.onerror = () => reject(request.error);
      });
    }

    async function rememberHandle(handle) {
      try {
        const db = await openDb();
        if (!db) return;
        await new Promise((resolve, reject) => {
          const request = db.transaction("handles", "readwrite").objectStore("handles").put(handle, "project");
          request.onsuccess = resolve;
          request.onerror = () => reject(request.error);
        });
        db.close();
      } catch {
        // Persistence is a convenience only; folder input remains available.
      }
    }

    async function recalledHandle() {
      try {
        const db = await openDb();
        if (!db) return null;
        const handle = await new Promise((resolve, reject) => {
          const request = db.transaction("handles", "readonly").objectStore("handles").get("project");
          request.onsuccess = () => resolve(request.result || null);
          request.onerror = () => reject(request.error);
        });
        db.close();
        return handle;
      } catch {
        return null;
      }
    }

    class DirectorySource {
      constructor(handle) {
        this.handle = handle;
      }

      async read(path) {
        const parts = normalizePath(path).split("/").filter(Boolean);
        let current = this.handle;
        for (let index = 0; index < parts.length - 1; index += 1) {
          current = await current.getDirectoryHandle(parts[index]);
        }
        const fileHandle = await current.getFileHandle(parts.at(-1));
        const file = await fileHandle.getFile();
        return file.text();
      }

      // Binary reads for the client icon set. `read` navigates by path and does
      // not consult `list`, so icons need no place in the directory walk.
      async file(path) {
        const parts = normalizePath(path).split("/").filter(Boolean);
        let current = this.handle;
        for (let index = 0; index < parts.length - 1; index += 1) {
          current = await current.getDirectoryHandle(parts[index]);
        }
        return (await current.getFileHandle(parts.at(-1))).getFile();
      }

      async list() {
        const result = new Set();
        const walk = async (handle, prefix, depth = 0) => {
          if (depth > 6) return;
          for await (const [name, child] of handle.entries()) {
            const path = normalizePath(prefix ? `${prefix}/${name}` : name);
            if (child.kind === "file") {
              if (/\.(csv|md)$/i.test(name)) result.add(path);
            } else if (
              path === "bango_data" ||
              path === "data" ||
              path === "analysis" ||
              path === "analysis/quest_route_101" ||
              path === "research" ||
              path === "research/bango_gitbook" ||
              path === "research/bango_gitbook/pages" ||
              path.startsWith("research/bango_gitbook/pages/")
            ) {
              await walk(child, path, depth + 1);
            }
          }
        };
        await walk(this.handle, "");
        return [...result].sort();
      }
    }

    // Serving the same single file from any static host. There is no directory
    // enumeration over HTTP, so the file list ships as SITE_MANIFEST.json and
    // is generated by tools\knowledge_base_site\build_site_manifest.py.
    class HttpSource {
      constructor(base, files) {
        this.base = base;
        this.files = files;
      }

      url(path) {
        return this.base + normalizePath(path).split("/").map(encodeURIComponent).join("/");
      }

      async read(path) {
        const response = await fetch(this.url(path), { cache: "no-store" });
        if (!response.ok) throw new Error(`${response.status} ${response.statusText}`);
        return response.text();
      }

      async file(path) {
        const response = await fetch(this.url(path), { cache: "no-store" });
        if (!response.ok) throw new Error(`${response.status} ${response.statusText}`);
        return response.blob();
      }

      async list() {
        return this.files;
      }
    }

    // A deployed bundle puts index.html at the site root beside the data; in
    // the project it sits two levels down. Try both rather than hard-code one,
    // so the same file works either way.
    function httpBaseCandidates() {
      const here = new URL(".", location.href);
      return [here.href, new URL("../../", here).href];
    }

    async function tryHttpConnect() {
      if (!/^https?:$/.test(location.protocol)) return false;
      for (const base of httpBaseCandidates()) {
        try {
          const response = await fetch(base + "SITE_MANIFEST.json", { cache: "no-store" });
          if (!response.ok) continue;
          const manifest = await response.json();
          if (!Array.isArray(manifest.files) || !manifest.files.length) continue;
          await loadProject(new HttpSource(base, manifest.files), "web");
          return true;
        } catch (error) {
          // Try the next candidate; a missing manifest is not an error here.
        }
      }
      return false;
    }

    class FileListSource {
      constructor(files) {
        this.files = new Map();
        for (const file of files) {
          const raw = normalizePath(file.webkitRelativePath || file.name);
          const markers = ["bango_data/", "data/", "analysis/", "research/", "assets/"];
          const positions = markers.map(marker => raw.indexOf(marker)).filter(index => index >= 0);
          const path = positions.length ? raw.slice(Math.min(...positions)) : file.name;
          this.files.set(path, file);
        }
      }

      async read(path) {
        const file = this.files.get(normalizePath(path));
        if (!file) throw new Error(`Missing file: ${path}`);
        return file.text();
      }

      async file(path) {
        const file = this.files.get(normalizePath(path));
        if (!file) throw new Error(`Missing file: ${path}`);
        return file;
      }

      async list() {
        return [...this.files.keys()].filter(path => /\.(csv|md)$/i.test(path)).sort();
      }
    }

    function setStatus(message, mode = "") {
      el.topStatus.textContent = message;
      el.statusDot.className = `status-dot ${mode}`.trim();

    function renderLoading(message, progress = 0) {
      state.loading = true;

          <div class="loading-line">${escapeHtml(message)}</div>
        </section>`;
    }

    function renderConnect(error = "") {
      state.loading = false;
      setStatus(error ? "Connection failed" : "Not connected", error ? "error" : "");
      el.main.innerHTML = `
        <section class="connect">
          <div class="eyebrow">One-file local encyclopedia</div>
          <h1>Your KalOnline data, fully connected.</h1>
          <p class="lede">Select the <strong>Kalonline Assistant</strong> project folder. Kal Atlas reads its current CSVs in place, so a Bango refresh appears here without rebuilding or copying the data into the site.</p>
          ${error ? `<div class="callout error"><strong>Could not load the folder.</strong><br>${escapeHtml(error)}</div>` : ""}
          <div class="connect-actions">
            <button class="primary" type="button" data-action="pick-folder">Select project folder</button>
            <button class="ghost" type="button" data-action="fallback-folder">Use compatibility picker</button>
          </div>
          <div class="connect-list">
            <div><span class="accent">01</span><span>Every monster, item, skill, quest, NPC, prefix, enhancement row and article receives a stable address.</span></div>
            <div><span class="accent">02</span><span>Bango-current fields stay separate from legacy fallback values and carry their source line.</span></div>
            <div><span class="accent">03</span><span>No upload occurs. The browser reads files only after you select the local folder.</span></div>
          </div>
        </section>`;
      renderNavigation();
    }

    async function connectWithDirectoryPicker() {
      if (!window.showDirectoryPicker) {
        el.folderInput.click();
        return;
      }
      try {
        const handle = await window.showDirectoryPicker({ mode: "read", id: "kal-atlas-project" });
        await rememberHandle(handle);
        await loadProject(new DirectorySource(handle), "folder handle");
      } catch (error) {
        if (error?.name !== "AbortError") renderConnect(error.message || String(error));
      }
    }

    async function tryReconnect() {
      const handle = await recalledHandle();
      if (!handle) return false;
      try {
        const permission = await handle.queryPermission({ mode: "read" });
        if (permission !== "granted") return false;
        await loadProject(new DirectorySource(handle), "remembered folder");
        return true;
      } catch {
        return false;
      }
    }

    async function readCsvFrom(source, path) {
      return parseCsv(await source.read(path));
    }

    async function loadProject(source, sourceKind) {
      state.ready = false;
      state.loading = true;
      state.source = source;
      state.sourceKind = sourceKind;
      state.tables = {};
      state.optional = {};
      state.combat = null;
      state.indexes = {};
      state.articles = [];
      state.zones = [];
      state.rawTables.clear();
      state.evidence.clear();
      state.loadWarnings = [];
      state.lastError = "";

      try {
        renderLoading("Indexing available CSV and reference files…", 4);
        state.availableFiles = await source.list();
        const requiredEntries = Object.entries(CORE_FILES);
        const optionalEntries = Object.entries(OPTIONAL_CSV_FILES);
        const total = requiredEntries.length + optionalEntries.length + 1;
        let completed = 0;

        for (const [key, path] of requiredEntries) {
          renderLoading(`Reading ${path}`, 5 + (completed / total) * 72);
          const rows = await readCsvFrom(source, path);
          state.tables[key] = rows;
          state.rawTables.set(path, rows);
          completed += 1;
          await new Promise(resolve => setTimeout(resolve, 0));
        }

        for (const [key, path] of optionalEntries) {
          renderLoading(`Checking ${path}`, 5 + (completed / total) * 72);
          try {
            const rows = await readCsvFrom(source, path);
            state.optional[key] = rows;
            state.rawTables.set(path, rows);
          } catch (error) {
            state.optional[key] = [];
            state.loadWarnings.push(`${path}: ${error.message}`);
          }
          completed += 1;
          await new Promise(resolve => setTimeout(resolve, 0));
        }

        renderLoading("Reading the combat fixture…", 79);
        await loadCombatFixture();
        await loadServerProfile();
        await loadQuestMaps();
        await loadMonsterIcons();
        await loadModelCatalogue();
        renderLoading("Reading registered reference articles…", 81);
        await loadArticles();
        renderLoading("Building reciprocal entity links…", 89);
        buildIndexes();
        renderLoading("Preparing search and routes…", 96);
        buildSearchIndex();

        state.ready = true;
        state.loading = false;
        state.snapshotLabel = `${prettyNumber(state.tables.drops.length)} Bango drop rows`;
        setStatus("Bango data connected", "ready");
        renderNavigation();
        if (!location.hash || location.hash === "#") location.hash = "#/home";
        renderRoute();
      } catch (error) {
        state.lastError = error?.message || String(error);
        renderConnect(state.lastError);
      }
    }

    /* Server rates live in one project file so they are set once, off the
       website, and every derived table follows. Absent or malformed, the
       defaults are the KalEncyclopedia baseline of 1× and nothing silently
       scales. */
    const DEFAULT_SERVER_PROFILE = {
      server_name: "", experience_rate: 1, experience_rate_confirmed: false,
      drop_rate_multiplier: 1, geons_rate: 1, egg_experience_per_day: 4800,
      egg_experience_per_day_confirmed: false
    };

    async function loadServerProfile() {
      state.server = { ...DEFAULT_SERVER_PROFILE };
      try {
        const text = await state.source.read("analysis/server_profile/SERVER_PROFILE.json");
        Object.assign(state.server, JSON.parse(text));
      } catch (error) {
        state.loadWarnings.push("analysis/server_profile/SERVER_PROFILE.json: using 1× defaults");
      }
    }

    function serverRate(field) {
      const value = Number(state.server?.[field]);
      return Number.isFinite(value) && value > 0 ? value : 1;
    }

    function unconfirmedRateNote(field, label) {
      const rate = serverRate(field);
      if (rate === 1) return "";
      const confirmed = state.server?.[`${field}_confirmed`];
      return `<p class="dim" style="margin:0 0 10px"><small>Scaled by the project's
        <strong>${prettyNumber(rate)}×</strong> ${escapeHtml(label)}${confirmed
          ? "" : ", which has not been confirmed in play"}.</small></p>`;
    }

    // The fixture carries the [ORIG] lookup tables and the per-level band
    // arrays. Nothing in this file restates a game constant: if the fixture is
    // missing, the build simulator says so and refuses to compute.
    async function loadCombatFixture() {
      try {
        const text = await state.source.read(COMBAT_FIXTURE_PATH);
        const parsed = JSON.parse(text);
        const required = ["tables", "class_order", "hp_quadratic", "mp_quadratic",
                          "stat_slots", "hp_level_coefficient_by_level",
                          "mp_level_band_by_level", "late_health_band_by_level"];
        const missing = required.filter(key => !parsed[key]);
        if (missing.length) throw new Error(`missing keys: ${missing.join(", ")}`);
        state.combat = parsed;
      } catch (error) {
        state.combat = null;
        state.loadWarnings.push(`${COMBAT_FIXTURE_PATH}: ${error.message}`);
      }
    }

    async function loadArticles() {
      const articlePaths = new Set(ROOT_ARTICLES);
      for (const path of state.availableFiles) {
        if (path.startsWith("research/bango_gitbook/pages/") && path.endsWith(".md")) {
          articlePaths.add(path);
        }
      }

      for (const path of [...articlePaths].sort()) {
        try {
          const text = await state.source.read(path);
          const heading = text.match(/^#\s+(.+)$/m)?.[1]?.trim();
          state.articles.push({
            path,
            title: heading || path.split("/").at(-1).replace(/\.md$/i, "").replaceAll("-", " "),
            text,
            kind: path.startsWith("research/bango_gitbook/") ? "Official Bango documentation" : "Project reference"
          });
        } catch (error) {
          if (ROOT_ARTICLES.includes(path)) state.loadWarnings.push(`${path}: ${error.message}`);
        }
      }

      const geography = state.articles.find(article => article.path === "Detailed_World_Geography_and_Navigation.md");
      state.zones = geography ? parseZones(geography.text) : [];
    }

    function parseZones(markdown) {
      const lines = String(markdown ?? "").split(/\r?\n/);
      const zones = [];
      for (let index = 0; index < lines.length; index += 1) {
        const match = lines[index].match(/^- \*\*Zone ([^\[]+)\[([^\]]+)\]:\*\*\s*(.+)$/);
        if (!match) continue;
        const mobLine = lines.slice(index + 1, index + 4).find(line => /\*Mobs:\*/.test(line)) || "";
        const mobText = mobLine.replace(/^.*\*Mobs:\*\s*/, "").replace(/\.$/, "");
        const mobLabels = /not provided/i.test(mobText)
          ? []
          : mobText.split(/,\s*/).map(value => value.trim()).filter(Boolean);
        zones.push({
          id: match[1].trim(),
          coordinates: match[2].trim(),
          description: match[3].trim(),
          mobText,
          mobLabels,
          sourcePath: geographyPath()
        });
      }
      return zones;
    }

    function geographyPath() {
      return "Detailed_World_Geography_and_Navigation.md";
    }

    function mapPush(map, key, value) {
      if (!map.has(key)) map.set(key, []);
      map.get(key).push(value);
    }

    function firstBy(rows, key) {
      const map = new Map();
      for (const row of rows) if (!map.has(String(row[key]))) map.set(String(row[key]), row);
      return map;
    }

    function groupedBy(rows, key) {
      const map = new Map();
      for (const row of rows) {
        const value = typeof key === "function" ? key(row) : row[key];
        mapPush(map, String(value), row);
      }
      return map;
    }

    function skillId(row) {
      return `${row.bango_key}~${row.bango_definition_ordinal || 1}`;
    }

    function skillByKey(key) {
      return state.indexes.skillsByKey.get(String(key))?.[0] || null;
    }

    function npcIdentity(row, nameCounts = state.indexes.npcNameCounts) {
      const raw = String(row?.text || "").trim();
      const normalized = normalizeName(raw);
      const bracketNames = [...raw.matchAll(/\[([^\]]+)\]/g)]
        .map(match => match[1].trim()).filter(Boolean);
      const commaName = raw.includes(",") ? raw.split(",").at(-1).replace(/[\[\]]/g, "").trim() : "";
      const aliases = new Set([...bracketNames, commaName].map(normalizeName)
        .filter(value => value.length >= 3));
      if (!aliases.size && normalized.length >= 5 && (nameCounts?.get(normalized) || 0) === 1) {
        aliases.add(normalized);
      }
      return {
        aliases: [...aliases],
        named: aliases.size > 0,
        display: aliases.size
          ? raw
          : `${raw || "Unnamed actor"} — generic actor (string ${row?.message_id || "?"})`
      };
    }

    function npcAliases(row, nameCounts) {
      return npcIdentity(row, nameCounts).aliases;
    }

    function npcDisplayName(row) {
      return npcIdentity(row).display;
    }

    /* Zone rosters.

       The geography guide writes a roster the way a player says it out loud:
       once "Demon Soldier" has been named, the entries after it drop the
       family word and read "Shock Trooper", "Flag Bearer", "Water Dragon".
       Resolving those by substring is what put Gigantic Species Shock Trooper
       — a level 64-66 mob from a different part of the map — into three Demon
       zones, and Great Armored Knight, Frenzy Demon Flag Bearer, Dungeon Mad
       Knight and eleven others with them: 30 monster-to-zone claims the guide
       never made.

       A roster entry now resolves exactly two ways. Either it is a monster's
       own name, or it is that name with a prefix another entry in the same
       roster has already spelled out — and then only when exactly one monster
       answers to the result. Two readings of one shorthand is a question, not
       a match. Anything unresolved is printed as unmatched on the zone page
       rather than being attached to whatever it happens to read like. */

    // The guide's own qualifiers: a colour parenthetical, a leading "All" and
    // a trailing "types" are how it writes a group, not part of a name.
    function zoneLabelBase(label) {
      return String(label ?? "")
        .replace(/\([^)]*\)/g, " ")
        .replace(/^\s*all\s+/i, " ")
        .replace(/\s+types?\s*$/i, " ")
        .trim();
    }

    function zoneLabelExactMatches(label, monstersByName) {
      for (const key of [normalizeName(label), normalizeName(zoneLabelBase(label))]) {
        if (key && monstersByName.has(key)) return monstersByName.get(key);
      }
      return [];
    }

    function resolveZoneRoster(labels, monstersByName) {
      const entries = labels.map(label => ({
        label, matches: zoneLabelExactMatches(label, monstersByName), how: "name"
      }));

      // Every leading word run of an entry that did match is a family prefix
      // this roster has spelled out for itself. Nothing outside it is used.
      const prefixes = new Set();
      for (const entry of entries) {
        if (!entry.matches.length) continue;
        const words = zoneLabelBase(entry.label).split(/\s+/).filter(Boolean);
        for (let count = 1; count < words.length; count += 1) {
          prefixes.add(words.slice(0, count).join(" "));
        }
      }

      for (const entry of entries) {
        if (entry.matches.length) continue;
        const base = zoneLabelBase(entry.label);
        if (!base) continue;
        const candidates = new Map();
        for (const prefix of prefixes) {
          const key = normalizeName(`${prefix} ${base}`);
          if (monstersByName.has(key)) candidates.set(key, monstersByName.get(key));
        }
        if (candidates.size !== 1) continue;
        entry.matches = [...candidates.values()][0];
        entry.how = "shorthand";
        entry.reading = entry.matches[0]?.text || "";
      }
      return entries;
    }

    // Bango names its item and prefix attributes in its own vocabulary. This is
    // the only place that vocabulary is translated into the project's 27 stat
    // slots. `attack` and `magic` carry a min/max pair; everything else is a
    // single value. Attributes with no stat meaning (buff, quest, teleport,
    // refresh, aspeed and the rest) are deliberately not mapped — they are not
    // dropped silently, they simply are not sheet stats.
    //
    // THE KEYS ARE MATCHED CASE-INSENSITIVELY, and that is not tidiness. The
    // two client files disagree on capitalisation for the same attribute:
    // `inititem.dat` writes `Str`, `Attack`, `Magic`, while `prefix.dat` writes
    // `str`, `attack`, `magic` on every one of its rows, and `int`/`wis`/`dex`
    // in the +N grid where the named prefixes use `Int`/`Wis`/`Dex`. Matching
    // exactly silently dropped 115 `str`, 105 `attack` and 101 `magic` prefix
    // rows — which is why "Man's" (str+1, Hth+2) used to decode as Health only
    // and every attack/magic talisman decoded to nothing at all.
    const BANGO_ATTRIBUTE_SLOTS = {
      str: ["Strength"], hth: ["Health"], int: ["Intelligence"],
      wis: ["Wisdom"], dex: ["Agility"],
      hp: ["HP"], mp: ["MP"], hit: ["OTP"], dodge: ["Evasion"],
      defense: ["Defense"], absorb: ["Absorb"],
      resistfire: ["Fire"], resistice: ["Ice"], resistlitning: ["Lightening"],
      resistpalsy: ["NonElemental"], resistcurse: ["Curse"],
      attack: ["PDMin", "PDMax"], magic: ["MDMin", "MDMax"]
    };

    /* Which prefixes a slot can carry.

       These three lists are a floor, not the answer: `prefixFamilyIds()` unions
       them with what the data actually says, because the hand-made armor list
       was missing five prefixes a player really can have. Two sources add to it.

       1. A talisman item's own `Changeprefix` attribute, which reads
          `[family, chance, prefix, chance, prefix]` — the family it applies to,
          then the good result and its chance, then the **second-chance** result
          and its chance. Talisman of Protection (items 319–326) names
          Feathery/Man's/Wisdom's/Despotic/Revenge's/Prideful/Ruinous/Glorious as
          the good outcomes and Forced/Healthy/Fictional/Fixed/Agile — the five
          single-stat +1 prefixes — as the second chance. Only the good half was
          listed here, which is why armor showed two branches and no +1 prefixes.
       2. What armor and weapons are actually seen carrying in the legacy drop
          table (`drp_rev`): armor drops with Ablaze, Predictive, Keen, Instant
          and the rest, up to Health 6 and Wisdom 6, so the single-stat prefixes
          on armor are not limited to the talismans' +1 second chance. */
    const WEAPON_PREFIX_FLOOR = new Set([
      ...Array.from({ length: 10 }, (_, index) => index + 1).filter(id => id !== 4),
      ...Array.from({ length: 10 }, (_, index) => index + 11).filter(id => id !== 14),
      ...Array.from({ length: 10 }, (_, index) => index + 21).filter(id => id !== 24),
      ...Array.from({ length: 10 }, (_, index) => index + 31).filter(id => id !== 34),
      ...Array.from({ length: 10 }, (_, index) => index + 41).filter(id => id !== 44),
      51, 52, 53, 54, 55, 58, 59, 60, 61, 62, 63, 64, 66, 67,
      ...Array.from({ length: 25 }, (_, index) => index + 68).filter(id =>
        ![83, 84, 85, 86, 87].includes(id))
    ].map(String));
    const ARMOR_PREFIX_FLOOR = new Set([56, 57, 65, 83, 84, 85, 86, 87].map(String));
    const ACCESSORY_PREFIX_FLOOR = new Set([
      1, 3, 4, 5, 6, 7, 11, 13, 14, 15, 16, 17,
      21, 23, 24, 25, 26, 27, 31, 33, 34, 35, 36, 37,
      41, 43, 44, 45, 46, 47, 93, 94, 95, 96, 97, 98, 99, 100, 101, 102
    ].map(String));
    // The client's own word for each family, as `Changeprefix` writes it.
    const PREFIX_FAMILY_KEYS = { weapon: "weapon", armor: "defense", accessory: "ornament" };
    // Attack and magic min/max belong to a weapon. A prefix carrying them can
    // never be an armor or accessory prefix, whatever a name join suggests —
    // "Fierce" is both prefix 47 (Agility 7) and prefix 54 (attack 3/3).
    const WEAPON_ONLY_STATS = ["PDMin", "PDMax", "MDMin", "MDMax"];

    function isWeaponOnlyPrefix(prefix) {
      return WEAPON_ONLY_STATS.some(stat => (prefix?.stats || {})[stat] !== undefined);
    }

    /* The union of the floor above, the talisman `Changeprefix` outcomes and
       the prefixes seen on dropped equipment of that kind. */
    function buildPrefixFamilyIds(ix, tables, optional) {
      const families = {
        weapon: new Set(WEAPON_PREFIX_FLOOR),
        armor: new Set(ARMOR_PREFIX_FLOOR),
        accessory: new Set(ACCESSORY_PREFIX_FLOOR)
      };
      const byKey = new Map(Object.entries(PREFIX_FAMILY_KEYS)
        .map(([family, key]) => [key, family]));
      const add = (family, id) => {
        const prefix = ix.prefixById.get(String(id));
        if (!prefix) return;
        if (family !== "weapon" && isWeaponOnlyPrefix(prefix)) return;
        families[family].add(String(id));
      };

      for (const row of tables.itemAttributes || []) {
        if (row.attribute !== "Changeprefix") continue;
        const values = parseJson(row.values_json, []);
        const family = byKey.get(String(values[0] || ""));
        if (!family) continue;
        // Index 2 is the good outcome, index 4 the second chance. Both are real
        // prefixes a player can end up wearing.
        [values[2], values[4]].forEach(id => { if (id) add(family, id); });
      }

      // Legacy `ita_itype`: 1 armor, 3 weapon. `drp_rev` writes the prefix name
      // with its punctuation stripped ("Mans", "Wisdoms"), so the join is by
      // normalized name, never by id (standing rule 17).
      const prefixIdsByName = new Map();
      ix.prefixOptions.forEach(prefix =>
        mapPush(prefixIdsByName, normalizeName(prefix.name), prefix.id));
      const legacyItemType = new Map((optional.legacyItems || [])
        .map(row => [String(row.ita_azon), String(row.ita_itype || "")]));
      for (const row of optional.legacyDrops || []) {
        const family = ({ 1: "armor", 3: "weapon" })[legacyItemType.get(String(row.drp_item))];
        if (!family) continue;
        const name = normalizeName(row.drp_rev || "");
        if (!name || /^\d+$/.test(String(row.drp_rev).trim())) continue;
        (prefixIdsByName.get(name) || []).forEach(id => add(family, id));
      }
      ix.prefixFamilyIds = families;
    }

    function bangoAttributeStats(rows) {
      const stats = {};
      rows.forEach(row => {
        const slots = BANGO_ATTRIBUTE_SLOTS[String(row.attribute || "").toLowerCase()];
        if (!slots) return;
        const values = parseJson(row.values_json, []);
        slots.forEach((slot, index) => {
          const raw = Number(values[index]);
          if (!Number.isFinite(raw) || raw === 0) return;
          stats[slot] = (stats[slot] || 0) + raw;
        });
      });
      return stats;
    }

    function buildIndexes() {
      const t = state.tables;
      const o = state.optional;
      const ix = state.indexes = {};

      ix.itemsById = firstBy(t.items, "ita_azon");
      ix.itemAttributes = groupedBy(t.itemAttributes, "ita_azon");
      ix.dropsByItem = groupedBy(t.drops, "drp_item");
      ix.dropsByMonster = groupedBy(t.drops, "drp_monst");

      const monsterMessages = t.messages.filter(row => row.namespace === "monstername");
      const npcMessages = t.messages.filter(row => row.namespace === "npcname");
      ix.monsters = monsterMessages;
      ix.npcs = npcMessages;
      ix.monstersById = firstBy(monsterMessages, "message_id");
      ix.monsterDefinitions = groupedBy(monsterMessages, "message_id");
      ix.npcsById = firstBy(npcMessages, "message_id");
      ix.npcDefinitions = groupedBy(npcMessages, "message_id");
      ix.npcNameCounts = new Map();
      npcMessages.forEach(npc => {
        const key = normalizeName(npc.text);
        ix.npcNameCounts.set(key, (ix.npcNameCounts.get(key) || 0) + 1);
      });

      ix.skillsById = new Map(t.skills.map(row => [skillId(row), row]));
      ix.skillsByKey = groupedBy(t.skills, "bango_key");
      ix.skillSchedules = new Map(t.skillSchedules.map(row => [
        `${row.bango_key}~${row.bango_definition_ordinal || 1}`, row
      ]));
      // First token of a Bango skill record's grade field: the job-branch
      // availability mask, decoded and proven against the legacy planner's
      // position column in tools\bango_branch_mask\ (170 of 173 matched
      // player skills agree; the 3 that differ are Bango's own availability
      // moves, and Bango wins). Keyed like skillSchedules.
      ix.branchMaskBySkillKey = new Map(t.skills.map(row => {
        const grade = parseJson(row.bango_grade_json, []);
        return [`${row.bango_key}~${row.bango_definition_ordinal || 1}`,
          grade.length ? String(grade[0]) : ""];
      }));
      ix.skillPrerequisites = groupedBy(t.skillPrerequisites, "skill_key");
      ix.skillDependents = groupedBy(t.skillPrerequisites, "prerequisite_skill_key");
      ix.playerSkillsByScope = groupedBy(
        t.skills.filter(row => ["common", "knight", "archer", "mage", "thief", "shaman"]
          .includes(scopeForSkill(row))),
        row => scopeForSkill(row)
      );

      ix.questsById = firstBy(t.quests, "que_id");
      ix.questsSorted = t.quests.slice().sort((left, right) =>
        (Number(left.que_lvl) || 0) - (Number(right.que_lvl) || 0)
        || String(left.que_name || "").localeCompare(String(right.que_name || "")));
      ix.questSteps = groupedBy(t.questSteps, "que_id");
      ix.questItems = groupedBy(t.questStepItems, "que_id");
      ix.questsByItem = groupedBy(t.questStepItems, "item_id");
      ix.monsterQuestsByMonster = groupedBy(t.monsterQuests, "monster_id");
      ix.monsterQuestsByQuest = groupedBy(t.monsterQuests, "quest_id");

      ix.prefixesById = firstBy(t.prefixes, "pre_azon");
      ix.prefixesByName = new Map(
        t.prefixes
          .filter(row => row.pre_name)
          .map(row => [normalizeName(row.pre_name), row])
      );
      ix.prefixAttributes = groupedBy(t.prefixAttributes, "pre_azon");
      ix.enhancementById = new Map(t.enhancementBonuses.map(row => [
        `${row.stat_family}~${row.application_band}~${row.enhancement_level}`, row
      ]));
      ix.enhancementGroups = groupedBy(t.enhancementBonuses, row =>
        `${row.stat_family}~${row.application_band}`);

      // The walkthrough names monsters in prose, so it needs a name lookup as
      // well as the id one. First definition wins; several ids can share a name.
      ix.monstersByName = new Map();
      monsterMessages.forEach(row => {
        const key = normalizeName(row.text);
        if (key && !ix.monstersByName.has(key)) ix.monstersByName.set(key, row);
      });
      ix.legacyItemsById = firstBy(o.legacyItems || [], "ita_azon");
      ix.legacyMonstersById = firstBy(o.legacyMonsters || [], "mon_azon");
      ix.positionsByClass = groupedBy(o.positions || [], "po_class");
      ix.positionsById = firstBy(o.positions || [], "po_azon");
      ix.positionsByName = new Map((o.positions || [])
        .map(row => [normalizeName(row.po_megn), row]));
      ix.legacyItemsByName = new Map((o.legacyItems || []).map(row => [normalizeName(row.ita_name), row]));
      ix.legacyItemsGroupedByName = groupedBy(o.legacyItems || [], row => normalizeName(row.ita_name));
      ix.legacyArmorPreviewByClassGrade = new Map();
      // KalEncyclopedia stores one synthetic `ita_itype = 0` / type `All`
      // row per armor set. Its `ita_pic` is the exact full-set portrait code
      // (`ita_a05`, `ita_k05`, `ita_m05`, `ita_t05`). A piece mesh instead
      // ends in `_a01.gb` for every class and grade; deriving the portrait from
      // that suffix put Archer G8 on almost every armor page.
      (o.legacyItems || []).filter(row => String(row.ita_itype) === "0").forEach(row => {
        const code = String(row.ita_pic || "")
          .match(/^ita_([akmt]\d{2})$/i)?.[1]?.toLowerCase();
        if (code) ix.legacyArmorPreviewByClassGrade.set(
          `${canonicalItemClass(row.ita_class)}~${displayGrade(row.ita_grade)}`, code);
      });
      ix.legacySkillPicByName = new Map((o.legacySkills || [])
        .filter(row => row.sk_megn && row.sk_pic !== "")
        .map(row => [normalizeName(row.sk_megn), String(row.sk_pic)]));
      // Item IDs are not shared between the two sources — Short Iron Sword is
      // Bango index 1 and legacy ID 174 — so the icon lookup for a legacy-keyed
      // equipment row has to go through the name, not the id.
      ix.bangoItemsByName = new Map(t.items.map(row => [normalizeName(row.ita_name), row]));
      // Bango's string table drops the rank number the legacy export keeps in
      // the name: "Gigantic Species Shock Trooper 1", "… 2" and "… 3" are all
      // just "Gigantic Species Shock Trooper" to the client. Joining on the
      // exact name alone silently loses 42 whole families — 142 Bango records
      // — and every one of them is a level ladder, so no single row can stand
      // in for the group. Each family is kept as an ordered list and shown as
      // one monster with several recorded variants.
      ix.legacyMonsterVariants = new Map();
      for (const row of o.legacyMonsters || []) {
        mapPush(ix.legacyMonsterVariants, normalizeName(row.mon_name), row);
      }
      for (const row of o.legacyMonsters || []) {
        const stem = String(row.mon_name ?? "").trim().match(/^(.*\S)\s+\d+$/);
        if (!stem) continue;
        const key = normalizeName(stem[1]);
        // A rank-stripped name must never shadow a monster that owns that
        // exact name. No legacy row does today; the guard keeps it that way.
        const owned = (ix.legacyMonsterVariants.get(key) || [])
          .some(other => normalizeName(other.mon_name) === key);
        if (!owned) mapPush(ix.legacyMonsterVariants, key, row);
      }
      for (const family of ix.legacyMonsterVariants.values()) {
        family.sort((a, b) => legacyVariantRank(a) - legacyVariantRank(b));
      }
      // Equipment comes from the Bango tables, not the legacy decode: Bango is
      // the current authority for what exists, its ITEM_ATTRIBUTES carry the
      // full stat set, and every one of its items has an icon file.
      const attributesById = groupedBy(t.itemAttributes || [], "ita_azon");
      const prefixAttributesById = groupedBy(t.prefixAttributes || [], "pre_azon");
      const EQUIPPABLE = new Set(["weapon", "defense", "ornament"]);
      ix.equippableItems = t.items.map(row => {
        const classes = parseJson(row.bango_class_json, []);
        if (!EQUIPPABLE.has(String(classes[0] || ""))) return null;
        const rawSlot = String(classes[1] || classes[0] || "other");
        const category = String(classes[0] || "");
        return {
          id: String(row.ita_azon),
          name: row.ita_name,
          slot: simCanonicalSlot(category, rawSlot),
          rawSlot,
          category,
          cls: row.ita_class || "",
          grade: String(row.ita_grade || ""),
          gradeNumber: Number(String(row.ita_grade || "").replace(/[^\d]/g, "")) || 0,
          levelLimit: Number(row.ita_lvllim) || 0,
          icon: row.bango_image || "",
          stats: bangoAttributeStats(attributesById.get(String(row.ita_azon)) || [])
        };
      }).filter(Boolean).sort((a, b) => a.name.localeCompare(b.name));
      ix.equippableSlots = [...new Set(ix.equippableItems.map(item => item.slot))];
      ix.equippableById = new Map(ix.equippableItems.map(item => [item.id, item]));

      ix.prefixOptions = t.prefixes.map(row => ({
        id: String(row.pre_azon),
        name: row.pre_name || `Prefix ${row.pre_azon}`,
        stats: bangoAttributeStats(prefixAttributesById.get(String(row.pre_azon)) || [])
      })).filter(prefix => Object.keys(prefix.stats).length
          && !/^\+\d+$/.test(prefix.name)
          && !/^<unresolved prefixname:/i.test(prefix.name))
        .sort((a, b) => a.name.localeCompare(b.name));
      ix.prefixById = new Map(ix.prefixOptions.map(prefix => [prefix.id, prefix]));
      buildPrefixFamilyIds(ix, t, o);
      ix.legacyDropsByPairName = new Map();
      // Talismans have no Bango item id of their own to key on, so their drop
      // list is indexed inside the legacy id space they belong to.
      ix.legacyDropsByItemId = new Map();

      // Bango renamed some items relative to the legacy export's translation
      // ("JuckAh Big Steel Sword" is legacy "Red Big Steel Sword"), so those
      // pairs never meet on a name key and their rates read as unavailable.
      // The alias map pairs each such Bango name with the legacy name it was
      // renamed from — every row evidence-gated by drop signature, item
      // structure or spelling (tools\item_rename_join\). Rows whose note asks
      // for amount matching (money: legacy drp_rev is the dropped amount)
      // are honoured in currentRateRows.
      ix.aliasNamesByLegacyName = new Map();
      ix.aliasLegacyNameByBangoName = new Map();
      ix.amountMatchedAliasNames = new Set();
      for (const row of o.itemAliases || []) {
        const bangoName = String(row.bango_item_name || "").trim();
        const legacyKey = normalizeName(row.legacy_item_name);
        if (!bangoName || !legacyKey) continue;
        mapPush(ix.aliasNamesByLegacyName, legacyKey, bangoName);
        ix.aliasLegacyNameByBangoName.set(normalizeName(bangoName),
          String(row.legacy_item_name || "").trim());
        if (/amount/i.test(String(row.note || ""))) {
          ix.amountMatchedAliasNames.add(normalizeName(bangoName));
        }
      }

      for (const row of o.legacyDrops || []) {
        const item = ix.legacyItemsById.get(String(row.drp_item));
        const monster = ix.legacyMonstersById.get(String(row.drp_monst));
        if (!item || !monster) continue;
        const enriched = { ...row, __item: item, __monster: monster,
          mon_name: monster.mon_name, mon_lvl: monster.mon_lvl };
        mapPush(ix.legacyDropsByPairName, dropPairKey(monster.mon_name, item.ita_name), enriched);
        for (const aliasName of ix.aliasNamesByLegacyName.get(normalizeName(item.ita_name)) || []) {
          mapPush(ix.legacyDropsByPairName, dropPairKey(monster.mon_name, aliasName), enriched);
        }
        // The guarded rank-family rule the stats join uses, applied to rates
        // as well: Bango's "Minister of the Royal Tomb" is legacy "… 1/2/3",
        // and refusing for rates the same join the Stats panel already shows
        // left 2,468 Bango rows reading "no confirmed rate" beside their
        // joined stats. Each ranked row keeps its own name as the variant.
        const stem = String(monster.mon_name ?? "").trim().match(/^(.*\S)\s+\d+$/);
        if (stem) {
          const stemKey = normalizeName(stem[1]);
          const owned = (ix.legacyMonsterVariants.get(stemKey) || [])
            .some(other => normalizeName(other.mon_name) === stemKey);
          if (!owned) {
            mapPush(ix.legacyDropsByPairName, dropPairKey(stem[1], item.ita_name), enriched);
            for (const aliasName of ix.aliasNamesByLegacyName.get(normalizeName(item.ita_name)) || []) {
              mapPush(ix.legacyDropsByPairName, dropPairKey(stem[1], aliasName), enriched);
            }
          }
        }
        mapPush(ix.legacyDropsByItemId, String(row.drp_item), enriched);
      }
      // Fourteen names cover a Forest monster and its Doggebi-dungeon twin
      // under one Bango string, where the legacy export keeps them apart with
      // a trailing "D1" ("Devil Troop of Desire" Lv 40 is Bango record 52 and
      // legacy 43; "Devil Troop of Desire D1" Lv 52 is Bango record 205 and
      // legacy 69). A name join cannot split them, so those records are
      // resolved by their own drop tables — the record-to-legacy pairing that
      // maximizes drop-list overlap, accepted only when it strictly beats the
      // swap. Same rule, evidence and tests in tools\monster_d1_disambiguation\.
      ix.legacyVariantsByRecordId = buildD1Overrides(ix, t, o, monsterMessages);
      ix.rateMappedDropRows = t.drops.filter(row => currentRateRows(row).length).length;
      ix.rateVariantRows = t.drops.reduce((total, row) => total + currentRateRows(row).length, 0);

      ix.routeByBangoQuest = groupedBy(
        (o.routeReconciliation || []).filter(row => row.bango_que_id),
        "bango_que_id"
      );
      ix.routeStepsByOrdinal = groupedBy(o.routeSteps || [], "route_ordinal");
      ix.routeNpcs = o.routeNpcs || [];

      ix.questNpcs = new Map();
      ix.npcQuests = new Map();
      const npcMatchers = npcMessages
        .map(npc => ({ npc, aliases: npcAliases(npc, ix.npcNameCounts) }))
        .filter(matcher => matcher.aliases.length);
      for (const quest of t.quests) {
        const combined = normalizedSpans([
          quest.que_name,
          quest.que_text,
          ...(ix.questSteps.get(String(quest.que_id)) || []).map(step => step.step_text)
        ].join(" "));
        for (const matcher of npcMatchers) {
          if (matcher.aliases.some(alias => spansContainWord(combined, alias))) {
            mapPush(ix.questNpcs, String(quest.que_id), matcher.npc);
            mapPush(ix.npcQuests, String(matcher.npc.message_id), quest);
          }
        }
      }

      // One name can hold several client string IDs, and each of them has its
      // own monster page, so a roster entry attaches the zone to all of them.
      const monstersGroupedByName = groupedBy(monsterMessages, row => normalizeName(row.text));
      ix.monsterZones = new Map();
      for (const zone of state.zones) {
        zone.monsterMatches = resolveZoneRoster(zone.mobLabels, monstersGroupedByName);
        for (const entry of zone.monsterMatches) {
          // A Forest/dungeon collision: the geography guide's roster names
          // the monster without the "D1", so the record resolved to the
          // legacy "X D1" row is a different creature standing somewhere
          // else and is not attached here. See buildD1Overrides.
          entry.matches = entry.matches.filter(monster => {
            const override = ix.legacyVariantsByRecordId.get(String(monster.message_id));
            return !override
              || normalizeName(override[0].mon_name) === normalizeName(monster.text);
          });
          for (const monster of entry.matches) {
            mapPush(ix.monsterZones, String(monster.message_id), zone);
          }
        }
      }

      ix.articleByPath = new Map(state.articles.map(article => [article.path, article]));
      // Article mentions are resolved on demand. Precomputing exact-name mentions
      // for every entity would repeatedly scan all documents during startup.
      ix.articleMentions = new Map();
    }

      return `<section class="section">

        <div class="section-body">${body}</div>
      </section>`;
    }

    function pagination(total, page, pageSize, sectionName, query) {
      const pages = Math.max(1, Math.ceil(total / pageSize));
      const current = Math.max(1, Math.min(page, pages));
      const params = new URLSearchParams(query);
      const href = target => {
        params.set("page", target);
        return `#/${sectionName}?${params}`;
      };
      return `<div class="pagination">
        <span>${prettyNumber(total)} results · page ${current} of ${pages}</span>
        <div>
          ${current > 1 ? `<a class="button small ghost" href="${href(current - 1)}">Previous</a>` : ""}
          ${current < pages ? `<a class="button small ghost" href="${href(current + 1)}">Next</a>` : ""}
        </div>
      </div>`;
    }

    function filterToolbar(route, query, options = {}) {
      const q = query.get("q") || "";

          ${(options.selectOptions || []).map(value =>
            `<option value="${escapeAttr(value)}" ${String(value) === selectValue ? "selected" : ""}>${escapeHtml(value)}</option>`
          ).join("")}

      return `<form class="toolbar" data-filter-route="${escapeAttr(route)}">
        <input class="filter-input" name="q" type="search" value="${escapeAttr(q)}" placeholder="${escapeAttr(options.placeholder || "Filter this list…")}">
        ${select}
        ${options.extra || ""}
        <button class="primary" type="submit">Apply</button>
      </form>`;
    }

    function renderSearch(query) {
      const q = query.get("q") || "";
      el.globalSearchInput.value = q;
      const normalized = normalizeName(q);
      const tokens = String(q).toLowerCase().trim().split(/\s+/).filter(Boolean);
      let results = [];
      if (normalized.length >= 2) {
        results = state.indexes.searchDocs.map(doc => {
          const title = normalizeName(doc.title);
          let score = 0;
          if (title === normalized) score += 100;
          else if (title.startsWith(normalized)) score += 45;
          else if (title.includes(normalized)) score += 24;
          if (doc.normalized.includes(normalized)) score += 8;
          score += tokens.filter(token => doc.search.toLowerCase().includes(token)).length * 2;
          return { ...doc, score };
        }).filter(doc => doc.score > 0)
          .sort((a, b) => b.score - a.score || a.title.localeCompare(b.title))
          .slice(0, 250);
      }
      el.main.innerHTML = `

          eyebrow: "Cross-entity lookup",
