        <p class="dim"><small>One level point is granted at each level from 2 onward. Finished Bango
          quests supply the quest total. The omitted/free post-60 bands remain unverified for Bango
          and are not granted silently.</small></p>`)}
        ${section(`${build.cls} skills available by level ${build.level}`, rows.length ? `
          <div class="skill-columns">${rows.map(({ row, schedule }) => {
            const key = String(row.bango_key);
            const grade = Number(profile.skills?.[key]) || 0;
            const max = availableSkillGrade(schedule, build.level);
            const minimum = skillMinimumGrade(row);
            const prerequisites = skillPrerequisiteState(profile, row);
            const locked = prerequisites.missing.length > 0;
            return `<div class="skill-card${locked ? " locked" : ""}" data-skill-card="${escapeAttr(skillId(row))}"
                data-skill-tip="${escapeAttr(skillTooltipHtml(row, schedule, grade, build))}">
              ${skillIconTag(row, 38)}
              <div><strong>${escapeHtml(row.sk_megn || key)}</strong>
                <span class="skill-grade${grade ? "" : " zero"}">Grade ${grade} / ${max}</span>
                ${locked ? `<small class="danger">Needs ${prerequisites.missing.map(edge =>
                  `${escapeHtml(edge.prerequisite_skill_name)} G${escapeHtml(edge.required_grade)}`).join(", ")}</small>` : ""}
              </div>
              <div class="skill-stepper">
                <button class="small" type="button" data-skill-down="${escapeAttr(key)}"${
                  grade <= minimum ? " disabled" : ""}>−</button>
                <button class="small" type="button" data-skill-up="${escapeAttr(key)}"${
                  grade >= max || locked || ledger.available <= 0 ? " disabled" : ""}>+</button>
              </div>
            </div>`;
          }).join("")}</div>` : emptyState("No Bango-resolved skill schedule is available at this level."))}`;
    }

    function questState(profile, questId) {
      return profile.quests?.[String(questId)] || "not-started";
    }

    function questCanChange(profile, quest, build) {
      if ((Number(quest.que_lvl) || 0) > Number(build.level)) return false;
      const prerequisite = String(quest.bango_prerequisite || "");
      return !prerequisite || questState(profile, prerequisite) === "finished";
    }

    function questStatusButton(profile, quest, compact = false) {
      const status = questState(profile, quest.que_id);
      const allowed = questCanChange(profile, quest, currentBuild());
      const symbol = status === "finished" ? "✓" : status === "progress" ? "•" : "";
      const title = status === "finished" ? "Finished" : status === "progress"
        ? "In progress" : "Not started";
      return `<button type="button" class="quest-status ${
        status === "progress" ? "progress" : status === "finished" ? "finished" : ""}"
        data-quest-status="${escapeAttr(quest.que_id)}" title="${title}; click to change"
        aria-label="${title}; click to change"${
          allowed ? "" : " disabled"}>${symbol || (compact ? "○" : "")}</button>`;
    }

    function renderCharacterQuestsHtml(profile, build) {
      const totals = characterQuestTotals(profile);
      const visible = state.indexes.questsSorted;
      const finished = visible.filter(quest => questState(profile, quest.que_id) === "finished").length;
      return `${section("Quest points", `
        <div class="point-ledger quest-ledger">
          <div><span>Finished</span><strong>${prettyNumber(finished)}</strong></div>
          <div><span>Skill points</span><strong>${prettyNumber(totals.skillPoints)}</strong></div>
          <div><span>Contribution</span><strong>${prettyNumber(totals.contribution)}</strong></div>
          <div><span>Character level</span><strong>${prettyNumber(build.level)}</strong></div>
        </div>
        <div class="tag-row">
          <button type="button" class="button small" data-action="finish-available-quests">Finish all available</button>
          <button type="button" class="button small ghost" data-action="reset-all-quests">Set all to not started</button>
          <span class="tag">○ not started</span><span class="tag gold">• in progress</span>
          <span class="tag accent">✓ finished</span>
        </div>`)}
        ${section("Bango quest checklist", `<div class="quest-checklist">${visible.map(quest => {
          const future = !questCanChange(profile, quest, build)
            && questState(profile, quest.que_id) === "not-started";
          return `<div class="quest-check${future ? " future" : ""}">
            ${questStatusButton(profile, quest)}
            <div><strong>[${escapeHtml(quest.que_lvl || "—")}] ${entityLink("quest", quest.que_id, quest.que_name)}</strong>
              <small>${prettyNumber(quest.bango_skill_points)} SP · ${prettyNumber(quest.bango_contribution)} contribution${
                quest.bango_prerequisite ? ` · requires quest ${escapeHtml(quest.bango_prerequisite)}` : ""}</small></div>
          </div>`;
        }).join("")}</div>`)}`;
    }

    function buffEffectLabel(definition, grade, build) {
      if (definition.displayOnly) return definition.displayOnly;
      const effects = registeredBuffEffects(definition, grade, build);
      const text = Object.entries(effects).map(([stat, value]) =>
        `${PREFIX_STAT_LABELS[stat] || stat} ${Number(value) >= 0 ? "+" : ""}${prettyNumber(value)}`
      ).join(" · ");
      return text || "No current-sheet effect could be resolved.";
    }

    /* Buffs live on the Stats tab, beside the sheet they change. Each one is
       its own icon button with a grade selector, small enough that the whole
       set fits under the inventory rather than needing a tab of its own. */
    function simBuffPanelHtml(profile) {
      const groups = new Map();
      const build = currentBuild();
      const classGroup = ({ Magician: "Mage", Knight: "Knight", Archer: "Archer" })[build.cls] || "";
      REGISTERED_BUFFS.forEach(definition => mapPush(groups, definition.group, definition));
      const ordered = [...groups.entries()].sort(([left], [right]) =>
        (right === classGroup) - (left === classGroup) || left.localeCompare(right));
      const activeCount = REGISTERED_BUFFS
        .filter(definition => activeBuffState(profile, definition.key).enabled).length;

      return panel("Buffs", ordered.map(([group, definitions]) => `
        <details class="buff-group"${group === classGroup ? " open" : ""}>
          <summary>${escapeHtml(group)}
            <span class="dim">${definitions.length}</span></summary>
          <div class="buff-grid">${definitions.map(definition => {
            const skill = registeredBuffSkill(definition);
            const selected = activeBuffState(profile, definition.key);
            const maxGrade = registeredBuffMaxGrade(definition);
            const grade = Math.max(1, Math.min(maxGrade, Number(selected.grade) || 1));
            const name = definition.name || skill?.sk_megn || definition.key;
            const effect = buffEffectLabel(definition, grade, build);
            return `<div class="buff-card${selected.enabled ? " active" : ""}"
                title="${escapeAttr(`${name} — ${effect}`)}">
              <label class="buff-toggle">
                <input type="checkbox" data-buff-field="enabled" data-buff-key="${escapeAttr(definition.key)}"${
                  selected.enabled ? " checked" : ""}>
                <span class="buff-icon">${iconTag(
                  definition.icon || skill?.sk_pic || skillIconFallback(skill),
                  name, 30, definition.icon ? (skill?.sk_pic || skillIconFallback(skill)) : ""
                )}</span>
                <span class="buff-name">${escapeHtml(name)}</span>
              </label>
              <select class="buff-grade" data-buff-field="grade"
                data-buff-key="${escapeAttr(definition.key)}" aria-label="${escapeAttr(`${name} grade`)}">
                ${Array.from({ length: maxGrade }, (_, index) => index + 1).map(value =>
                  `<option value="${value}"${grade === value ? " selected" : ""}>G${value}</option>`
                ).join("")}
              </select>
              <div class="buff-effect">${escapeHtml(effect)}</div>
            </div>`;
          }).join("")}</div>
        </details>`).join(""),
        { aside: `<span class="panel-aside">${activeCount} active</span>` });
    }

    function renderBuild() {
      if (!simReady()) {
        el.main.innerHTML = pageHeader({ eyebrow: "Character Creation", title: "Character Creation" })
          + simMissing("The combat fixture was not found or is incomplete.");
        return;
      }
      loadProfiles();
      const params = routeInfo().query;
      if (params.get("b")) {
        try {
          activeProfile().build = decodeBuild(params.get("b"));
          state.build = activeProfile().build;
          saveBuild();
        } catch (error) { /* a malformed share link falls back to the stored build */ }
      }
      const tab = CHARACTER_TABS.includes(params.get("tab")) ? params.get("tab") : "stats";
      const profile = activeProfile();
      const build = simNormalizeBuildItems(currentBuild());
      normalizeCharacterPosition(build);
      normalizeSkillAllocations(profile, build);
      persistProfiles();
      const body = tab === "skills" ? renderCharacterSkillsHtml(profile, build)
        : tab === "quests" ? renderCharacterQuestsHtml(profile, build)
        : renderCharacterStatsHtml(profile, build);

      el.main.innerHTML = `
        ${pageHeader({
          eyebrow: "Character Creation",
          title: profile.name,
          lede: `${escapeHtml(build.cls)} · level ${prettyNumber(build.level)}${
            build.position ? ` · ${escapeHtml(build.position)}` : ""}`,
          crumbs: [["Overview", "#/home"], ["Character Creation", ""]]
        })}
        ${characterBanner(profile)}
        ${characterTabs(tab)}
        ${body}`;
      wireCharacterWorkspace(tab);
    }

    function wireCharacterWorkspace(tab) {
      if (typeof el.main.querySelector !== "function"
          || typeof el.main.querySelectorAll !== "function") return;
      const nameInput = el.main.querySelector("[data-character-name]");
      if (nameInput) nameInput.oninput = event => {
        activeProfile().name = event.currentTarget.value.trimStart() || "Unnamed character";
        persistProfiles();
        renderProfileSwitcher();
      };
      if (tab === "stats") {
        wireSimControls();
        el.main.querySelectorAll("[data-equipment-slot]").forEach(control => {
          control.onclick = event => openSlotMenu(control.dataset.equipmentSlot, event);
          control.oncontextmenu = event => {
            event.preventDefault();
            openSlotMenu(control.dataset.equipmentSlot, event);
          };
        });
        el.main.querySelectorAll("[data-buff-field]").forEach(control => {
          control.oninput = onBuffChange;
          control.onchange = onBuffChange;
        });
      } else if (tab === "skills") {
        el.main.querySelectorAll("[data-skill-up]").forEach(control => {
          control.onclick = () => changeSkillGrade(control.dataset.skillUp, 1);
        });
        el.main.querySelectorAll("[data-skill-down]").forEach(control => {
          control.onclick = () => changeSkillGrade(control.dataset.skillDown, -1);
        });
        el.main.querySelectorAll("[data-skill-card]").forEach(card => {
          card.onmouseenter = event => showSkillTooltip(event.currentTarget, event);
          card.onmousemove = event => positionSkillTooltip(event);
          card.onmouseleave = hideSkillTooltip;
          card.onfocusin = event => showSkillTooltip(event.currentTarget, event);
          card.onfocusout = hideSkillTooltip;
        });
      }
    }

    function showSkillTooltip(card, event) {
      el.skillTooltip.innerHTML = card.dataset.skillTip || "";
      if (el.skillTooltip.classList) el.skillTooltip.classList.remove("hidden");
      else el.skillTooltip.className = "";
      positionSkillTooltip(event);
    }

    function positionSkillTooltip(event) {
      if (el.skillTooltip.classList?.contains("hidden")
          || String(el.skillTooltip.className || "").includes("hidden")) return;
      const x = Math.min(window.innerWidth - el.skillTooltip.offsetWidth - 12,
        (event.clientX || 20) + 16);
      const y = Math.min(window.innerHeight - el.skillTooltip.offsetHeight - 12,
        (event.clientY || 20) + 16);
      el.skillTooltip.style.left = `${Math.max(12, x)}px`;
      el.skillTooltip.style.top = `${Math.max(12, y)}px`;
    }

    function hideSkillTooltip() {
      if (el.skillTooltip.classList) el.skillTooltip.classList.add("hidden");
      else el.skillTooltip.className = "skill-tooltip hidden";
    }

    function resetInvalidDependents(profile, prerequisiteKey) {
      const edges = state.indexes.skillDependents.get(String(prerequisiteKey)) || [];
      edges.forEach(edge => {
        const dependentKey = String(edge.skill_key);
        if (!(Number(profile.skills?.[dependentKey]) > 0)) return;
        if ((Number(profile.skills?.[prerequisiteKey]) || 0) >= Number(edge.required_grade)) return;
        profile.skills[dependentKey] = 0;
        resetInvalidDependents(profile, dependentKey);
      });
    }

    function changeSkillGrade(key, direction) {
      const profile = activeProfile();
      const build = currentBuild();
      const row = skillByKey(key);
      if (!row) return;
      const current = Number(profile.skills?.[key]) || 0;
      const minimum = skillMinimumGrade(row);
      if (direction > 0) {
        const schedule = state.indexes.skillSchedules.get(skillId(row));
        const max = availableSkillGrade(schedule, build.level);
        const ledger = characterSkillLedger(profile, build);
        const prerequisites = skillPrerequisiteState(profile, row);
        if (current >= max || ledger.available <= 0 || prerequisites.missing.length) return;
        profile.skills[key] = current + 1;
      } else {
        if (current <= minimum) return;
        profile.skills[key] = current - 1;
        resetInvalidDependents(profile, key);
      }
      persistProfiles();
      renderBuild();
    }

    function cycleQuestStatus(questId) {
      const profile = activeProfile();
      const quest = state.indexes.questsById.get(String(questId));
      if (!quest || !questCanChange(profile, quest, currentBuild())) return;
      const current = questState(profile, questId);
      profile.quests[String(questId)] = current === "not-started" ? "progress"
        : current === "progress" ? "finished" : "not-started";
      if (profile.quests[String(questId)] === "not-started") {
        delete profile.quests[String(questId)];
      }
      persistProfiles();
      renderRoute();
    }

    function finishAvailableQuests() {
      const profile = activeProfile();
      let changed = true;
      while (changed) {
        changed = false;
        for (const quest of state.indexes.questsSorted) {
          if (questState(profile, quest.que_id) === "finished") continue;
          if (!questCanChange(profile, quest, currentBuild())) continue;
          profile.quests[String(quest.que_id)] = "finished";
          changed = true;
        }
      }
      persistProfiles();
      renderBuild();
    }

    function resetAllQuests() {
      activeProfile().quests = {};
      persistProfiles();
      renderBuild();
    }

    function onBuffChange(event) {
      const profile = activeProfile();
      const key = event.currentTarget.dataset.buffKey;
      const field = event.currentTarget.dataset.buffField;
      let buff = profile.buffs.find(entry => entry.key === key);
      if (!buff) {
        buff = { key, enabled: false, grade: 1 };
        profile.buffs.push(buff);
      }
      buff[field] = field === "enabled" ? event.currentTarget.checked
        : field === "grade" ? (Number(event.currentTarget.value) || 1)
        : event.currentTarget.value;
      persistProfiles();
      // Buffs sit beside the sheet now, so only the panels change — a full
      // re-render would collapse the group the player is working in.
      refreshSimResults({ refreshBuffs: true });
    }

    function onSimInput(event) {
      const target = event.currentTarget;
      const build = currentBuild();
      const field = target.dataset.simField;
      let refreshGear = false;
      if (field) {
        if (target.type === "checkbox") build[field] = target.checked;
        else if (field === "cls" || field === "position") build[field] = target.value;
        else build[field] = Number(target.value) || 0;
        refreshGear = field === "cls" || field === "level";
        if (field === "cls") build.position = "";
        if (refreshGear || field === "position") {
          normalizeCharacterPosition(build);
          normalizeSkillAllocations(activeProfile(), build);
        }
      } else if (target.dataset.simItem) {
        if (target.value) build.items[target.dataset.simItem] = target.value;
        else delete build.items[target.dataset.simItem];
        refreshGear = true;
      } else if (target.dataset.simPrefix) {
        if (target.value) build.prefixes[target.dataset.simPrefix] = target.value;
        else delete build.prefixes[target.dataset.simPrefix];
      } else if (target.dataset.simManual) {
        const value = Number(target.value);
        if (target.value === "" || !Number.isFinite(value) || value === 0) {
          delete build.manual[target.dataset.simManual];
        } else {
          build.manual[target.dataset.simManual] = value;
        }
      }
      saveBuild();
      if (refreshGear || field === "position") {
        renderBuild();
        return;
      }
      refreshSimResults({ refreshGear });
    }

    function refreshSimResults({ refreshGear = false, refreshBuffs = false } = {}) {
      const build = simNormalizeBuildItems(currentBuild());
      const gearHost = document.getElementById("simGearHost");
      const buffHost = document.getElementById("simBuffPanel");
      const sheetHost = document.getElementById("simSheetPanel");
      const threatHost = document.getElementById("simThreatPanel");
      const supplementalHost = document.getElementById("simSupplemental");
      // Re-rendering the buff panel would close every open group, so its
      // markup is left alone unless the caller asks for it.
      const openBuffGroups = buffHost
        ? [...buffHost.querySelectorAll("details.buff-group")].map(node => node.open) : [];
      if (refreshGear && gearHost) {
        gearHost.innerHTML = panel("Inventory", simGearControls(build));
      }
      if (refreshBuffs && buffHost) {
        buffHost.innerHTML = simBuffPanelHtml(activeProfile());
        buffHost.querySelectorAll("details.buff-group").forEach((node, index) => {
          if (openBuffGroups[index] !== undefined) node.open = openBuffGroups[index];
        });
      }
      if (sheetHost) sheetHost.innerHTML = simSheetPanelHtml(build);
      if (threatHost) threatHost.innerHTML = simThreatPanelHtml(build);
      if (supplementalHost) supplementalHost.innerHTML = simSupplementalHtml(build);
      wireCharacterWorkspace("stats");
      [gearHost, buffHost, sheetHost, threatHost, supplementalHost]
        .forEach(host => hydrateIcons(host));
    }

    function simSheetPanelHtml(build) {
      const sheet = simSheet(build);
      return simCharacterSheet(build, sheet) + `
        <details class="sheet-breakdown"><summary>Full stat breakdown</summary>
          <div style="margin-top:10px">${simSheetTable(build, sheet)}</div>
        </details>`;
    }

    function simThreatPanelHtml(build) {
      const sheet = simSheet(build);
      const threats = threatRows(sheet, build);
      return panel("Monsters versus this build", `
        <input class="monster-search" type="search" id="simMonsterSearch"
          placeholder="Search monsters — e.g. Devil Soldier"
          value="${escapeAttr(state.monsterQuery || "")}" aria-label="Search monsters">
        <div id="simMonsterList">${simMonsterList(sheet, build, state.monsterQuery || "")}</div>`,
        { aside: `<span class="panel-aside">${prettyNumber(threats.rows.length)} with stats</span>` });
    }

    function simSupplementalHtml(build) {
      const sheet = simSheet(build);
      return provenanceFooter(`
        <p>The character sheet is measured: every formula reproduces a real level-38 Magician
          sheet exactly. The hit and damage numbers use the original 2006 combat engine against
          a legacy monster export — neither of those is Bango, so anything involving a monster
          is an estimate for this server, not a fact about it.</p>
        <p>Share this build: <code class="mono">#/build?b=${escapeHtml(encodeBuild(build))}</code></p>
        <div>${simDisagreementPanel(sheet)}</div>`);
    }

    // The four readings Rafael asked for, per monster, both directions.
    function simMonsterList(sheet, build, query) {
      const needle = String(query || "").trim().toLowerCase();
      let rows = threatRows(sheet, build).rows;
      if (needle) rows = rows.filter(row => row.bango.text.toLowerCase().includes(needle));
      rows.sort((a, b) => a.monsterLevel - b.monsterLevel);
      if (!rows.length) {
        return emptyState(needle
          ? `No monster with combat stats matches “${escapeHtml(query)}”.`
          : "No monster resolves to a legacy row with combat stats.");
      }
      const shown = rows.slice(0, 60);
      return `<div class="table-wrap"><table>
        <thead><tr>
          <th>Monster</th><th>Lv</th>
          <th>You evade</th><th>It deals you</th>
          <th>You hit</th><th>You deal (melee)</th><th>You deal (magic)</th>
        </tr></thead>
        <tbody>${shown.map(row => `<tr>
          <td>${entityLink("monster", row.bango.message_id, row.bango.text)}</td>
          <td>${prettyNumber(row.monsterLevel)}</td>
          <td><strong>${prettyNumber(row.evasion)}%</strong>
            <br><small class="dim">it hits ${prettyNumber(row.incomingHit)}%</small></td>
          <td>${prettyNumber(row.physicalMin)}–${prettyNumber(row.physicalMax)}
            <br><small class="dim">avg ${row.perSwing.toFixed(1)}/swing</small></td>
          <td><strong>${prettyNumber(row.outgoingHit)}%</strong></td>
          <td>${prettyNumber(row.dealtPhysicalMin)}–${prettyNumber(row.dealtPhysicalMax)}
            <br><small class="dim">avg ${row.dealtPhysicalExpected.toFixed(1)}/swing</small></td>
          <td>${row.bestMagicElement
            ? `${prettyNumber(row.bestMagicMin)}–${prettyNumber(row.bestMagicMax)}
               <br><small class="dim">${escapeHtml(row.bestMagicElement)}, no miss</small>`
            : "<span class=\"dim\">no resistance data</span>"}</td>
        </tr>`).join("")}</tbody></table></div>
        ${rows.length > shown.length ? `<p class="dim"><small>Showing the first
          ${prettyNumber(shown.length)} of ${prettyNumber(rows.length)} matches, by level.
          Narrow the search to see the rest.</small></p>` : ""}`;
    }

    function wireSimControls() {
      if (typeof el.main.querySelectorAll !== "function") return;
      el.main.querySelectorAll("[data-sim-field],[data-sim-item],[data-sim-prefix],[data-sim-manual]")
        .forEach(control => { control.oninput = onSimInput; });
      const search = document.getElementById("simMonsterSearch");
      if (search) {

    function renderThreats() {
      if (!simReady()) {
        el.main.innerHTML = pageHeader({ eyebrow: "Simulator", title: "Monster threat table" })
          + simMissing("The combat fixture was not found or is incomplete.");
        return;
      }
      const build = currentBuild();
      const sheet = simSheet(build);
      const params = routeInfo().query;
      const sort = params.get("sort") || "perSecond";
      const search = (params.get("q") || "").trim().toLowerCase();
      const maxLevel = Number(params.get("maxlv") || 0);

      const { rows, unresolved } = threatRows(sheet, build);
      let visible = rows;
      if (search) visible = visible.filter(row => row.bango.text.toLowerCase().includes(search));
      if (maxLevel > 0) visible = visible.filter(row => row.monsterLevel <= maxLevel);
      const sorters = {
        perSecond: (a, b) => (b.perSecond || 0) - (a.perSecond || 0),
        perSwing: (a, b) => b.perSwing - a.perSwing,
        evasion: (a, b) => b.evasion - a.evasion,
        outgoing: (a, b) => b.outgoingHit - a.outgoingHit,
        level: (a, b) => a.monsterLevel - b.monsterLevel,
        survival: (a, b) => (a.survivalSwings ?? Infinity) - (b.survivalSwings ?? Infinity)
      };
      visible = visible.slice().sort(sorters[sort] || sorters.perSecond);

      const sortLink = (key, label) => `<a class="button ${sort === key ? "" : "ghost"} small"
        href="${routeHref("threats", "", new URLSearchParams({
          sort: key, q: search, maxlv: maxLevel || ""
        }).toString())}">${escapeHtml(label)}</a>`;

      el.main.innerHTML = `
        ${pageHeader({
          eyebrow: "Simulator",
          title: "Monster threat table",
          lede: `${escapeHtml(build.cls)} level ${prettyNumber(build.level)} · ${prettyNumber(sheet.final.HP)} HP · ${prettyNumber(sheet.final.Evasion)} evasion · ${prettyNumber(sheet.final.Defense)} defence · ${prettyNumber(sheet.final.Absorb)}% absorb.`,
          crumbs: [["Overview", "#/home"], ["Build simulator", "#/build"], ["Threat table", ""]],
          actions: `<a class="button ghost" href="${routeHref("build")}">← Edit build</a>`
        })}
        ${simProvenanceBanner()}
        ${section("Coverage", `<p>${prettyNumber(rows.length)} of
          ${prettyNumber((state.indexes.monsters || []).length)} Bango monsters resolve to a legacy
          row carrying the fields this needs. The other ${prettyNumber(unresolved)} have
          <strong>no combat stats in any registered source</strong> and are omitted rather than
          shown as zero.</p>`)}
        ${section("Ranking", `
          <div class="tag-row" style="margin-bottom:12px">
            ${sortLink("perSecond", "Damage / second")}
            ${sortLink("perSwing", "Damage / swing")}
            ${sortLink("survival", "Swings to kill you")}
            ${sortLink("evasion", "Your evasion")}
            ${sortLink("outgoing", "Your hit chance")}
            ${sortLink("level", "Level")}
          </div>
          ${visible.length ? threatTable(visible) : emptyState("No monster matches this filter.")}`)}`;
    }

    function monsterCombatPanel(bangoRow, legacy) {
      if (!simReady()) return simMissing("The combat fixture was not found.");
      if (!monsterHasCombatStats(legacy)) {
        return emptyState("This monster has no combat stats in any registered source, so nothing is computed for it.");
      }
      const build = currentBuild();
      const sheet = simSheet(build);
      const versus = simVersus(sheet, build, legacy);
      const magicTable = rows => `<div class="table-wrap"><table>
        <thead><tr><th>Element</th><th class="num">Resistance</th><th class="num">Damage</th></tr></thead>
        <tbody>${rows.map(([element, entry]) => `<tr>
          <td>${escapeHtml(element)}</td><td class="num">${prettyNumber(entry.resist)}%</td>
          <td class="num">${prettyNumber(entry.min)}–${prettyNumber(entry.max)}</td></tr>`).join("")}</tbody>
        </table></div>`;
      return `
        <p class="dim" style="margin:-2px 0 10px;font-size:12px">Against
          <a href="${routeHref("build")}">${escapeHtml(build.cls)} level ${prettyNumber(build.level)}</a>
          · <a href="${routeHref("threats")}">compare every monster</a></p>
        <div class="versus-grid">
          <div>
            <h4>It attacks you</h4>
            ${statLines([
              ["You evade", `${prettyNumber(versus.evasion)}%`],
              ["It hits you", `${prettyNumber(versus.incomingHit)}%`],
              ["Damage per hit", `${prettyNumber(versus.physicalMin)}–${prettyNumber(versus.physicalMax)}`],
              ["Average per swing", versus.perSwing.toFixed(1)],
              ["Average per second", versus.perSecond === null ? "—" : versus.perSecond.toFixed(1)],
              ["Swings to kill you", versus.survivalSwings === null ? "never" : String(Math.floor(versus.survivalSwings))]
            ])}
          </div>
          <div>
            <h4>You attack it</h4>
            ${statLines([
              ["You hit it", `${prettyNumber(versus.outgoingHit)}%`],
              ["Attack type", escapeHtml(versus.attackType)],
              ["Damage per hit", `${prettyNumber(versus.dealtPhysicalMin)}–${prettyNumber(versus.dealtPhysicalMax)}`],
              ["Average per swing", versus.dealtPhysicalExpected.toFixed(1)],
              ["Its defence", prettyNumber(Number(legacy.mon_def1) || 0)],
              ["Its absorb", `${prettyNumber(Number(legacy.mon_absorb) || 0)}%`]

            of your resistances are shown.</small></p>` : ""}`;

    /* Skill costs are stored as reverse-Polish expressions over the grade.
       A bare number is the value; anything longer depends on the grade and is
       shown as the expression rather than a wrong single number. The internal
       verification status becomes a plain "not confirmed" note. */
    function formulaField(label, value, status = "") {
      const parsed = parseJson(value, []);
      if (!parsed.length) return "";
      const literal = parsed.length === 1 && Number.isFinite(Number(parsed[0]));
      const unconfirmed = String(status).includes("unverified");
      return `<div class="definition"><dt>${escapeHtml(label)}</dt><dd>${
        literal ? `<b>${prettyNumber(parsed[0])}</b>`
          : `<span class="mono">${escapeHtml(parsed.join(" "))}</span>`
      }${unconfirmed ? `<br><small class="dim">not confirmed</small>` : ""}</dd></div>`;
    }

    /* ===================================================================
       Levels — KalEncyclopedia's frmLevels, both tabs.

       Players: the XP table with a running total, and the monster-XP
       calculator whose seven level-difference bands are the reason the tool
       was useful. Eggs: ExpToLvl = 6553.6 x n, and the day count that follows
       from the server's egg XP rate.
       =================================================================== */
    const MONSTER_XP_BANDS = [
      { min: -Infinity, max: -11, factor: 0, tone: "dead" },
      { min: -10, max: -8, factor: 0.5, tone: "cold" },
      { min: -7, max: -5, factor: 0.75, tone: "cool" },
      { min: -4, max: 0, factor: 1, tone: "even" },
      { min: 1, max: 5, factor: 1.25, tone: "warm" },
      { min: 6, max: 10, factor: 1.5, tone: "hot" },
      { min: 11, max: Infinity, factor: 2, tone: "peak" }
    ];
    const XP_STONE_MULTIPLIER = 1.3;

    function monsterXpBand(difference) {
      return MONSTER_XP_BANDS.find(band => difference >= band.min && difference <= band.max);
    }

    function playerLevelTable() {
      if (state.indexes.playerLevels) return state.indexes.playerLevels;
      const rate = serverRate("experience_rate");
      let total = 0;
      state.indexes.playerLevels = (state.optional.levelPlayers || []).map(row => {
        const level = Number(String(row.lpl_id).replace(/\D/g, ""));
        const need = Math.round((Number(String(row.lpl_exp).replace(/[^\d]/g, "")) || 0) * rate);
        total += need;
        return { level, need, total };
      }).filter(row => row.level > 0).sort((left, right) => left.level - right.level);
      return state.indexes.playerLevels;
    }

    function renderLevels(query) {
      const tab = query.get("tab") === "eggs" ? "eggs" : "players";
      const levels = playerLevelTable();
      const selected = Number(query.get("level"))
        || Number(currentBuild()?.level) || levels[0]?.level || 1;
      const below = Number(query.get("below") ?? 12);
      const above = Number(query.get("above") ?? 12);

      el.main.innerHTML = `
        ${pageHeader({
          eyebrow: "Tables",
          title: "Levelling",
          lede: "How much experience each level needs, and which monsters actually give it to you.",
          crumbs: [["Overview", "#/home"], ["Levelling", ""]]
        })}
        <nav class="character-tabs" aria-label="Levelling tables">
          <a class="${tab === "players" ? "active" : ""}" href="#/levels?tab=players">Players</a>
          <a class="${tab === "eggs" ? "active" : ""}" href="#/levels?tab=eggs">Eggs</a>
        </nav>
        ${tab === "eggs" ? renderEggTable() : renderPlayerLevels(levels, selected, below, above)}`;

      el.main.querySelectorAll("[data-level-input]").forEach(control => {
        control.onchange = () => {
          const params = new URLSearchParams({
            tab: "players",
            level: el.main.querySelector("[data-level-input='level']")?.value || selected,
            below: el.main.querySelector("[data-level-input='below']")?.value ?? below,
            above: el.main.querySelector("[data-level-input='above']")?.value ?? above
          });
          location.hash = `#/levels?${params}`;
        };
      });
    }

    function renderPlayerLevels(levels, selected, below, above) {
      const row = levels.find(entry => entry.level === selected) || levels[0];
      const need = row?.need || 0;
      const rate = serverRate("experience_rate");

      const monsters = (state.optional.legacyMonsters || [])
        .filter(monster => {
          const level = Number(monster.mon_lvl);
          // Group 18 is the quest group; the original tool leaves it out of
          // the XP list because you cannot farm it.
          return Number.isFinite(level) && String(monster.mon_group) !== "18"
            && level >= selected - below && level <= selected + above;
        })
        .map(monster => {
          const difference = Number(monster.mon_lvl) - selected;
          const band = monsterXpBand(difference);
          const base = Number(monster.mon_exp) || 0;
          const experience = Math.trunc(base * band.factor * rate);
          const stone = Math.trunc(base * XP_STONE_MULTIPLIER * band.factor * rate);
          return {
            monster, difference, band, experience, stone,
            kills: experience > 0 ? Math.trunc(need / experience) + 1 : null,
            stoneKills: stone > 0 ? Math.trunc(need / stone) + 1 : null
          };
        });

      return `
        ${panel("Experience per level", `
          ${unconfirmedRateNote("experience_rate", "server experience rate")}
          ${sortableTable("levelTable", [
            { key: "level", label: "Level", align: true,
              sort: entry => entry.level,
              cell: entry => entry.level === selected
                ? `<b>${entry.level}</b>`
                : `<a href="#/levels?tab=players&level=${entry.level}&below=${below}&above=${above}">${entry.level}</a>` },
            { key: "need", label: "To next level", align: true,
              sort: entry => entry.need, cell: entry => prettyNumber(entry.need) },
            { key: "total", label: "Total from level 1", align: true,
              sort: entry => entry.total, cell: entry => prettyNumber(entry.total) }
          ], levels, { defaultSort: { key: "level", dir: "asc" } })}`,
          { wide: true })}
        ${panel(`Monsters worth killing at level ${selected}`, `
          <div class="field-grid" style="grid-template-columns:repeat(3,minmax(0,1fr));margin-bottom:12px">
            <label class="field"><span>Your level</span>
              <input type="number" min="1" max="${levels.at(-1)?.level || 99}"
                data-level-input="level" value="${selected}"></label>
            <label class="field"><span>Levels below</span>
              <input type="number" min="0" max="40" data-level-input="below" value="${below}"></label>
            <label class="field"><span>Levels above</span>
              <input type="number" min="0" max="40" data-level-input="above" value="${above}"></label>
          </div>
          <p class="dim" style="margin:0 0 10px"><small>Experience is scaled by how far the
            monster is from you: nothing more than 10 levels below, half from 8–10 below,
            three quarters from 5–7 below, full within 4, and up to double above you.
            <strong>Kills</strong> is how many it takes to reach level ${selected + 1}.</small></p>
          ${monsters.length ? sortableTable("levelMonsterTable", [
            { key: "monster", label: "Monster",
              sort: entry => entry.monster.mon_name,
              cell: entry => `<span class="cell-icon">${monsterIconTag("",
                entry.monster.mon_name, 24)}${escapeHtml(entry.monster.mon_name)}</span>` },
            { key: "level", label: "Level", align: true,
              sort: entry => Number(entry.monster.mon_lvl),
              cell: entry => `<span class="xp-band ${entry.band.tone}">${
                escapeHtml(entry.monster.mon_lvl)}</span>` },
            { key: "diff", label: "Vs. you", align: true,
              sort: entry => entry.difference,
              cell: entry => entry.difference > 0 ? `+${entry.difference}` : String(entry.difference) },
            { key: "xp", label: "Experience", align: true,
              sort: entry => entry.experience,
              cell: entry => entry.experience ? prettyNumber(entry.experience)
                : `<span class="dim">none</span>` },
            { key: "kills", label: "Kills to level", align: true,
              sort: entry => entry.kills ?? "",
              cell: entry => entry.kills === null ? `<span class="dim">never</span>`
                : prettyNumber(entry.kills) },
            { key: "stone", label: "With XP stone", align: true,
              sort: entry => entry.stoneKills ?? "",
              cell: entry => entry.stoneKills === null ? `<span class="dim">never</span>`
                : `${prettyNumber(entry.stoneKills)} <small class="dim">${
                  prettyNumber(entry.stone)} xp</small>` },
            { key: "hp", label: "Its HP", align: true,
              sort: entry => Number(entry.monster.mon_hp) || "",
              cell: entry => prettyNumber(entry.monster.mon_hp || 0) }
          ], monsters, { defaultSort: { key: "kills", dir: "asc" } })
            : emptyState("No monster sits in that level window.")}`,
          { wide: false })}`;
    }

    function renderEggTable() {
      const perDay = Number(state.server?.egg_experience_per_day) || 4800;
      const rows = (state.optional.levelEggs || []).map((row, index) => {
        const grade = Number(String(row.leg_id).replace(/\D/g, "")) || index + 1;
        // 6553.6 x n, exactly as frmLevels computes it.
        const experience = Math.round(6553.6 * (index + 1));
        const [strength, health, agility] = String(row.leg_stat || "").split("/")
          .map(value => value.trim());
        return { grade, experience, days: experience / perDay, strength, health, agility };
      });
      return panel("Animal eggs", `
        <p class="dim" style="margin:0 0 10px"><small>Each grade needs
          ${prettyNumber(Math.round(6553.6))} × its number in experience. Days assume
          ${prettyNumber(perDay)} experience a day${state.server?.egg_experience_per_day_confirmed
            ? "" : ", which has not been confirmed on this server"}.</small></p>
        ${sortableTable("eggTable", [
          { key: "grade", label: "Grade", align: true,
            sort: row => row.grade, cell: row => `G${String(row.grade).padStart(2, "0")}` },
          { key: "xp", label: "Experience to level", align: true,
            sort: row => row.experience, cell: row => prettyNumber(row.experience) },
          { key: "days", label: "Days", align: true,
            sort: row => row.days, cell: row => row.days.toFixed(2) },
          { key: "str", label: "Strength", align: true,
            sort: row => Number(row.strength) || "", cell: row => escapeHtml(row.strength || "—") },
          { key: "hea", label: "Health", align: true,
            sort: row => Number(row.health) || "", cell: row => escapeHtml(row.health || "—") },
          { key: "agi", label: "Agility", align: true,
            sort: row => Number(row.agility) || "", cell: row => escapeHtml(row.agility || "—") }
        ], rows, { defaultSort: { key: "grade", dir: "asc" } })}`, { wide: true });
    }

    /* ===================================================================
       Weapon calculator — KalEncyclopedia's frmRevis.

       Two answers: what an enhanced weapon actually hits for, and what it
       costs to get there. Both formulas are the ones in the original:
         EB chance = 10 + Fix(EB / 2)  percent
         EB min    = Fix(min + EB x 0.05 x min + 3 x bonus)
         EB max    = Fix(max + EB x 0.10 x max + 3 x bonus)
       and the cost model sums the per-step talisman ladders.
       =================================================================== */
    const ATTACK_TALISMAN_STEPS = [1, 1, 1, 1, 2, 2, 2, 2, 3, 5, 7, 15, 50, 100, 500, 2000, 10000];
    const ACCURACY_TALISMAN_STEPS = [1, 2, 3, 7, 12, 200, 1000];
    const TALISMAN_BONUS_LADDER = [0, 1, 2, 4, 6, 9, 12, 16, 20, 25, 30, 35, 41, 47, 54, 61, 69];
    const REVISION_STONES_BY_BONUS = {
      4: 1, 6: 1, 9: 2, 12: 2, 16: 3, 20: 4, 25: 5, 30: 6,
      35: 10, 41: 14, 47: 18, 54: 22, 61: 26, 69: 30
    };
    const ELITE_TALISMAN_COUNT = [
      [/^(Disti|Steel|Break|Decis|Magic)/, 5], [/^Legen/, 4], [/^The K/, 7]
    ];
    const WEAPON_CALC_DEFAULTS = {
      intensification: 750000, accuracy: 190000, polishing: 650000, revision: 10000
    };

    function enhancementLadder() {
      return (state.optional.enhancementLadder || []).map(row => ({
        level: Number(String(row.eb_lvl).replace(/\D/g, "")) || 0,
        revision: Number(String(row.eb_rev).replace(/[^\d]/g, "")) || 0,
        cumulative: Number(String(row.eb_srev).replace(/[^\d]/g, "")) || 0,
        // Prices are written with a thousands dot: "1.500" is 1500.
        price: Number(String(row.eb_price).replace(/[^\d]/g, "")) || 0
      })).filter(row => row.level).sort((left, right) => left.level - right.level);
    }

    function weaponCalcState() {
      state.weaponCalc ||= {
        weaponId: "", attackStep: 0, accuracyStep: 0, enhancement: 0,
        prefixName: "", ...WEAPON_CALC_DEFAULTS
      };
      return state.weaponCalc;
    }

    function weaponCalcOptions() {
      return (state.indexes.equippableItems || [])
        .filter(item => item.slot === "Weapon")
        .sort((left, right) => (gradeNumber(right.grade) ?? 0) - (gradeNumber(left.grade) ?? 0)
          || String(left.name).localeCompare(String(right.name)));
    }

    function renderWeaponCalculator() {
      const calc = weaponCalcState();
      const options = weaponCalcOptions();
      const weapon = state.indexes.equippableById.get(String(calc.weaponId)) || options[0];
      const ladder = enhancementLadder();
      const stats = weapon?.stats || {};
      const bonus = TALISMAN_BONUS_LADDER[calc.attackStep] || 0;
      const isMagic = weapon?.rawSlot === "wand";
      const baseMin = Number(isMagic ? stats.MDMin : stats.PDMin) || 0;
      const baseMax = Number(isMagic ? stats.MDMax : stats.PDMax) || 0;

      const ebChance = Math.round(10 + Math.trunc(calc.enhancement / 2));
      const ebMin = Math.round(Math.trunc(baseMin + calc.enhancement * 0.05 * baseMin + 3 * bonus));
      const ebMax = Math.round(Math.trunc(baseMax + calc.enhancement * 0.10 * baseMax + 3 * bonus));

      const attackTalismans = ATTACK_TALISMAN_STEPS.slice(0, calc.attackStep)
        .reduce((total, value) => total + value, 0);
      const accuracyTalismans = ACCURACY_TALISMAN_STEPS.slice(0, calc.accuracyStep)
        .reduce((total, value) => total + value, 0);
      const revisionStones = ladder.slice(0, calc.enhancement)
        .reduce((total, row) => total + row.revision, 0);
      const enhancementPrice = ladder.slice(0, calc.enhancement)
        .reduce((total, row) => total + row.price, 0);
      const polishAttack = Math.max(attackTalismans - 4, 0);
      const polishAccuracy = Math.max(accuracyTalismans - 1, 0);
      const eliteCount = ELITE_TALISMAN_COUNT
        .find(([pattern]) => pattern.test(calc.prefixName))?.[1] || 0;

      // 3,825 Geons is the Talisman of Attack price the original hard-codes;
      // everything else is a price the player sets.
      const attackCost = attackTalismans * 3825 + polishAttack * calc.polishing;
      const accuracyCost = accuracyTalismans * calc.accuracy + polishAccuracy * calc.polishing;
      const enhancementCost = revisionStones * calc.revision + enhancementPrice;
      const eliteCost = eliteCount * calc.intensification;

      const stoneReturn = REVISION_STONES_BY_BONUS[bonus] || 0;
      const number = (label, key, value, max, extra = "") => `<label class="field">
        <span>${escapeHtml(label)}</span>
        <input type="number" min="0"${max ? ` max="${max}"` : ""} data-weapon-calc="${key}"
          value="${escapeAttr(value)}"${extra}></label>`;

      el.main.innerHTML = `
        ${pageHeader({
          eyebrow: "Calculators",
          title: "Weapon calculator",
          lede: "What an enhanced weapon hits for, and what reaching that costs.",
          crumbs: [["Overview", "#/home"], ["Weapon calculator", ""]]
        })}
        <div class="detail-grid">
          <div>
            ${panel("The weapon", `
              <div class="field-grid" style="grid-template-columns:repeat(2,minmax(0,1fr))">
                <label class="field" style="grid-column:1/-1"><span>Weapon</span>
                  <select data-weapon-calc="weaponId">${options.map(item =>
                    `<option value="${escapeAttr(item.id)}"${item.id === weapon?.id ? " selected" : ""}>${
                      escapeHtml(`${displayGrade(item.grade)} — ${item.name}`)}</option>`).join("")}
                  </select></label>
                <label class="field"><span>${isMagic ? "Magic" : "Physical"} attack talisman</span>
                  <select data-weapon-calc="attackStep">${TALISMAN_BONUS_LADDER.map((value, step) =>
                    `<option value="${step}"${step === calc.attackStep ? " selected" : ""}>+${value}</option>`
                  ).join("")}</select></label>
                <label class="field"><span>Accuracy talisman</span>
                  <select data-weapon-calc="accuracyStep">${
                    Array.from({ length: ACCURACY_TALISMAN_STEPS.length + 1 }, (_, step) =>
                    `<option value="${step}"${step === calc.accuracyStep ? " selected" : ""}>+${step}</option>`
                  ).join("")}</select></label>
                <label class="field"><span>EB level</span>
                  <select data-weapon-calc="enhancement">${
                    Array.from({ length: (ladder.at(-1)?.level || 16) + 1 }, (_, level) =>
                    `<option value="${level}"${level === calc.enhancement ? " selected" : ""}>+${level}</option>`
                  ).join("")}</select></label>
                <label class="field"><span>Intensification prefix</span>
                  <select data-weapon-calc="prefixName">
                    <option value="">— none —</option>
                    ${["Distinct", "Steely", "Breakthroughs", "Decisional", "Magical Powers",
                       "Legendary", "The King, GuhBalHans"].map(name =>
                      `<option value="${escapeAttr(name)}"${
                        calc.prefixName === name ? " selected" : ""}>${escapeHtml(name)}</option>`
                    ).join("")}</select></label>
              </div>`)}
            ${panel("What it hits for", weapon ? `
              ${statLines([
                ["Base damage", `${prettyNumber(baseMin)}–${prettyNumber(baseMax)}`],
                ["Talisman bonus", `+${bonus}`],
                ["EB chance", `${ebChance}%`],
                ["EB damage", `<b>${prettyNumber(ebMin)}–${prettyNumber(ebMax)}</b>`]
              ])}
              <p class="dim" style="margin:10px 0 0"><small>EB fires on ${ebChance}% of hits.
                ${stoneReturn ? `Destroying a +${bonus} weapon returns
                ${stoneReturn} revision stone${stoneReturn === 1 ? "" : "s"}.` : ""}</small></p>`
              : emptyState("No weapon is selected."))}
            ${panel("What it costs", `
              <div class="table-wrap"><table>
                <thead><tr><th>Step</th><th>What you need</th><th class="num">Geons</th></tr></thead>
                <tbody>
                  <tr><td>Attack</td>
                    <td>${prettyNumber(attackTalismans)} talismans${polishAttack
                      ? ` · ${prettyNumber(polishAttack)} polishing stones` : ""}</td>
                    <td class="num">${prettyNumber(attackCost)}</td></tr>
                  <tr><td>Accuracy</td>
                    <td>${prettyNumber(accuracyTalismans)} talismans${polishAccuracy
                      ? ` · ${prettyNumber(polishAccuracy)} polishing stones` : ""}</td>
                    <td class="num">${prettyNumber(accuracyCost)}</td></tr>
                  <tr><td>Enhancement</td>
                    <td>${prettyNumber(revisionStones)} revision stones</td>
                    <td class="num">${prettyNumber(enhancementCost)}</td></tr>
                  <tr><td>Intensification</td>
                    <td>${eliteCount ? `${eliteCount} talismans` : "—"}</td>
                    <td class="num">${prettyNumber(eliteCost)}</td></tr>
                  <tr class="total-row"><td colspan="2"><b>Total</b></td>
                    <td class="num"><b>${prettyNumber(
                      attackCost + accuracyCost + enhancementCost + eliteCost)}</b></td></tr>
                </tbody></table></div>
              <h4>Prices you pay</h4>
              <div class="field-grid" style="grid-template-columns:repeat(2,minmax(0,1fr))">
                ${number("Talisman of Intensification", "intensification", calc.intensification)}
                ${number("Talisman of Accuracy", "accuracy", calc.accuracy)}
                ${number("Polishing stone", "polishing", calc.polishing)}
                ${number("Revision stone", "revision", calc.revision)}
              </div>`)}
          </div>
          <div class="detail-side">
            ${panel("Enhancement ladder", `<div class="table-wrap"><table>
              <thead><tr><th class="num">+</th><th class="num">Stones</th>
                <th class="num">Total</th><th class="num">Geons</th></tr></thead>
              <tbody>${ladder.map(row => `<tr${row.level === calc.enhancement
                ? ` class="current-row"` : ""}>
                <td class="num">+${row.level}</td><td class="num">${prettyNumber(row.revision)}</td>
                <td class="num">${prettyNumber(row.cumulative)}</td>
                <td class="num">${prettyNumber(row.price)}</td></tr>`).join("")}</tbody>
            </table></div>`)}
            ${panel("Stones returned if it breaks", `<div class="table-wrap"><table>
              <thead><tr><th class="num">Bonus</th><th class="num">Stones</th></tr></thead>
              <tbody>${Object.entries(REVISION_STONES_BY_BONUS).map(([value, stones]) =>
                `<tr${Number(value) === bonus ? ` class="current-row"` : ""}>
                  <td class="num">+${value}</td><td class="num">${stones}</td></tr>`).join("")}
              </tbody></table></div>`)}
          </div>
        </div>
        ${provenanceFooter(`<p>Both formulas and every ladder above come from KalEncyclopedia's
          own weapon calculator. Bango may have retuned them; nothing here has been measured
          in play.</p>`)}`;

      el.main.querySelectorAll("[data-weapon-calc]").forEach(control => {
        control.onchange = event => {
          const key = event.currentTarget.dataset.weaponCalc;
          calc[key] = key === "weaponId" || key === "prefixName"
            ? event.currentTarget.value
            : Number(event.currentTarget.value) || 0;
          renderWeaponCalculator();
        };
      });
    }

    /* ===================================================================
       Game system — KalEncyclopedia's frmMix: the mixing stones and their
       per-level effects, the Imperial and upgrade recipes, honour rewards

    function stoneEffectLines(row) {
      const slots = state.combat?.stat_slots || [];
      // Each comma-separated group is one stone level; inside a group the
      // pipe positions are the same 27-slot stat vector used everywhere.
      return String(row.ita_rev || "").split(",").map((vector, index) => {
        const effects = vector.split("|")
          .map((value, slot) => [slots[slot] || `slot ${slot}`, value])
          .filter(([, value]) => value !== "" && value != null)
          .map(([stat, value]) => `${stat} ${Number(value) >= 0 ? "+" : ""}${value}`);
        return { level: index + 1, effects };
      }).filter(entry => entry.effects.length);
    }

    function resolveMarkdownLink(url, currentPath) {
      const raw = String(url || "").trim().replaceAll("&amp;", "&");
      if (/^https?:\/\//i.test(raw)) return { href: raw, external: true };
      if (raw.startsWith("#")) return { href: raw, external: false };

      let clean = raw.split("#")[0].split("?")[0].replace(/^\/+/, "");
      const gitbookPrefix = "kalonline-2012-content/";
      if (clean.startsWith(gitbookPrefix)) {
        clean = `research/bango_gitbook/pages/${clean.slice(gitbookPrefix.length)}`;
      } else if (!clean.includes("/") && state.indexes.articleByPath.has(clean)) {
        return { href: routeHref("article", clean), external: false };
      } else if (!clean.startsWith("research/")) {
        const base = currentPath.split("/").slice(0, -1);
        for (const part of clean.split("/")) {
          if (part === "..") base.pop();
          else if (part !== ".") base.push(part);
        }
        clean = base.join("/");
      }

      clean = clean.replace(/\.html$/i, ".md");
      if (state.indexes.articleByPath.has(clean)) {
        return { href: routeHref("article", clean), external: false };
      }
      return { href: raw || "#", external: false };
    }

    function inlineMarkdown(text, currentPath) {
      let value = escapeHtml(text);
      const codeTokens = [];
      value = value.replace(/`([^`]+)`/g, (_, content) => {
        const token = `@@CODE${codeTokens.length}@@`;
        codeTokens.push(`<code>${content}</code>`);
        return token;
      });
      value = value.replace(/\[([^\]]+)\]\(([^)]+)\)/g, (_, label, url) => {
        const resolved = resolveMarkdownLink(url, currentPath);
        return `<a href="${escapeAttr(resolved.href)}"${resolved.external ? ' target="_blank" rel="noreferrer"' : ""}>${label}</a>`;
      });
      value = value.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
      value = value.replace(/__([^_]+)__/g, "<strong>$1</strong>");
      value = value.replace(/(^|[\s(])\*([^*\n]+)\*/g, "$1<em>$2</em>");
      value = value.replace(/(^|[\s(])_([^_\n]+)_/g, "$1<em>$2</em>");
      codeTokens.forEach((token, index) => { value = value.replace(`@@CODE${index}@@`, token); });
      return value;
    }

    function renderMarkdown(markdown, currentPath) {
      const lines = cleanText(markdown).split(/\r?\n/);
      const output = [];
      let index = 0;
      let inCode = false;
      let code = [];

      const isBoundary = line =>
        !line.trim() ||
        /^#{1,6}\s/.test(line) ||
        /^```/.test(line) ||
        /^>\s?/.test(line) ||
        /^[-*+]\s+/.test(line) ||
        /^\d+\.\s+/.test(line) ||
        /^---+$/.test(line.trim());

      while (index < lines.length) {
        const line = lines[index];
        if (/^```/.test(line)) {
          if (inCode) {
            output.push(`<pre>${escapeHtml(code.join("\n"))}</pre>`);
            code = [];
            inCode = false;
          } else {
            inCode = true;
          }
          index += 1;
          continue;
        }
        if (inCode) {
          code.push(line);
          index += 1;
          continue;
        }
        if (!line.trim()) {
          index += 1;
          continue;
        }
        if (/^---+$/.test(line.trim())) {
          output.push("<hr>");
          index += 1;
          continue;
        }
        const heading = line.match(/^(#{1,6})\s+(.+)$/);
        if (heading) {
          const level = Math.min(4, heading[1].length);
          const title = heading[2].replace(/\s+\{#[^}]+\}\s*$/, "");
          output.push(`<h${level} id="${safeId(title)}">${inlineMarkdown(title, currentPath)}</h${level}>`);
          index += 1;
          continue;
        }
        if (line.includes("|") && lines[index + 1] && /^\s*\|?[\s:|-]+\|[\s:|-|]*$/.test(lines[index + 1])) {
          const headers = line.replace(/^\||\|$/g, "").split("|");
          index += 2;
          const body = [];
          while (index < lines.length && lines[index].includes("|") && lines[index].trim()) {
            body.push(lines[index].replace(/^\||\|$/g, "").split("|"));
            index += 1;
          }
          output.push(`<div class="table-wrap"><table><thead><tr>${headers.map(cell => `<th>${inlineMarkdown(cell.trim(), currentPath)}</th>`).join("")}</tr></thead>
            <tbody>${body.map(row => `<tr>${row.map(cell => `<td>${inlineMarkdown(cell.trim(), currentPath)}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`);
          continue;
        }
        if (/^>\s?/.test(line)) {
          const quote = [];
          while (index < lines.length && /^>\s?/.test(lines[index])) {
            quote.push(lines[index].replace(/^>\s?/, ""));
            index += 1;
          }
          output.push(`<blockquote>${quote.map(item => inlineMarkdown(item, currentPath)).join("<br>")}</blockquote>`);
          continue;
        }
        if (/^[-*+]\s+/.test(line)) {
          const items = [];
          while (index < lines.length && /^[-*+]\s+/.test(lines[index])) {
            items.push(lines[index].replace(/^[-*+]\s+/, ""));
            index += 1;
          }
          output.push(`<ul>${items.map(item => `<li>${inlineMarkdown(item, currentPath)}</li>`).join("")}</ul>`);
          continue;
        }
        if (/^\d+\.\s+/.test(line)) {
          const items = [];
          while (index < lines.length && /^\d+\.\s+/.test(lines[index])) {
            items.push(lines[index].replace(/^\d+\.\s+/, ""));
            index += 1;
          }
          output.push(`<ol>${items.map(item => `<li>${inlineMarkdown(item, currentPath)}</li>`).join("")}</ol>`);
          continue;
        }

        const paragraph = [line.trim()];
        index += 1;
        while (index < lines.length && !isBoundary(lines[index]) && !(lines[index].includes("|") && lines[index + 1] && /^\s*\|?[\s:|-]+\|/.test(lines[index + 1]))) {
          paragraph.push(lines[index].trim());
          index += 1;
        }
        output.push(`<p>${inlineMarkdown(paragraph.join(" "), currentPath)}</p>`);
      }
      if (inCode) output.push(`<pre>${escapeHtml(code.join("\n"))}</pre>`);
      return output.join("\n");
    }

    function relationForCell(column, value, row) {
      const text = String(value ?? "");

      const monsterColumns = new Set(["drp_monst", "monster_id"]);
      const questColumns = new Set(["que_id", "quest_id", "bango_que_id", "bango_prerequisite"]);
      const prefixColumns = new Set(["pre_azon", "prefix_id"]);
      if (itemColumns.has(column) && state.indexes.itemsById.has(text)) {
        return entityLink("item", text, state.indexes.itemsById.get(text).ita_name || text);
      }
      if (monsterColumns.has(column) && state.indexes.monstersById.has(text)) {
        return entityLink("monster", text, state.indexes.monstersById.get(text).text);
      }
      if (questColumns.has(column) && state.indexes.questsById.has(text)) {
        return entityLink("quest", text, state.indexes.questsById.get(text).que_name);
      }
      if (prefixColumns.has(column) && state.indexes.prefixesById.has(text)) {
        const prefix = state.indexes.prefixesById.get(text);
        return entityLink("prefix", text, prefix.pre_name || text);
      }
      if (["bango_key", "skill_key", "prerequisite_skill_key"].includes(column)) {
        const skill = skillByKey(text);
        if (skill) return entityLink("skill", skillId(skill), skill.sk_megn || text);
      }
      if (column === "message_id" && row.namespace === "monstername" && state.indexes.monstersById.has(text)) {
        return entityLink("monster", text, row.text || text);
      }
      if (column === "message_id" && row.namespace === "npcname" && state.indexes.npcsById.has(text)) {
        return entityLink("npc", text, row.text || text);
      }
      return "";
    }

      return `<span class="${text.length > 36 ? "mono wrap-anywhere" : ""}" title="${escapeAttr(text)}">${escapeHtml(clipped)}</span>`;
    }

        /(^|_)(id|azon|key|name|text|level|lvl|item|monst|quest|family|band|value|flag)$/.test(key) ||
        ["namespace", "provenance", "source_file", "source_line"].includes(key)

        const headers = usefulHeaders(rows);
        el.main.innerHTML = `
          ${pageHeader({
            eyebrow: csvCategory(path),
            title: path.split("/").at(-1),
            lede: `<span class="mono">${escapeHtml(path)}</span> · ${prettyNumber(rows.length)} rows`,
            crumbs: [["Overview", "#/home"], ["Raw data", "#/data"], [path, ""]]
          })}
          ${filterToolbar("table", query, { placeholder: "Search any visible or hidden cell…" }).replace('data-filter-route="table"', `data-filter-route="table/${encodeURIComponent(path)}"`)}
          <section class="section"><div class="table-wrap"><table>
            <thead><tr><th>Record</th>${headers.map(header => `<th>${escapeHtml(header)}</th>`).join("")}</tr></thead>
            <tbody>${shown.map(row => `<tr>
              <td>${entityLink("record", `${path}~${row.__rowIndex}`, `#${Number(row.__rowIndex) + 1}`)}</td>
              ${headers.map(header => `<td>${cellValue(header, row[header], row)}</td>`).join("")}
            </tr>`).join("")}</tbody>
          </table></div><div class="section-body">${pagination(filtered.length, page, pageSize, `table/${encodeURIComponent(path)}`, query)}</div></section>`;
      } catch (error) {
        renderNotFound("readable CSV table", `${path}: ${error.message}`);
      }
    }

    async function renderRecord(id) {
      const separator = String(id).lastIndexOf("~");
      if (separator < 0) return renderNotFound("raw record", id);
      const path = id.slice(0, separator);
      const rowIndex = Number(id.slice(separator + 1));
      if (!Number.isInteger(rowIndex)) return renderNotFound("raw record", id);
      if (!state.availableFiles.includes(path) || !path.endsWith(".csv")) {
        return renderNotFound("raw record", id);
      }
      renderLoading(`Reading record ${rowIndex + 1} from ${path}`, 55);
      try {
        const rows = await tableForPath(path);
        const row = rows[rowIndex];
        if (!row) return renderNotFound("raw record", id);
        const fields = Object.entries(row).filter(([key]) => key !== "__rowIndex");
        el.main.innerHTML = `
          ${pageHeader({
            eyebrow: "Raw source record",
            title: `${path.split("/").at(-1)} · row ${rowIndex + 1}`,
            lede: `<span class="mono">${escapeHtml(path)}</span>`,
            crumbs: [["Overview", "#/home"], ["Raw data", "#/data"], [path, routeHref("table", path)], [`row ${rowIndex + 1}`, ""]],
            actions: sourceButton(row)
          })}
          <section class="section"><div class="section-body"><div class="kv">
            ${fields.map(([key, value]) => `<div>${escapeHtml(key)}</div><div>${cellValue(key, value, row, 10000)}</div>`).join("")}
          </div></div></section>`;
      } catch (error) {
        renderNotFound("raw record", `${id}: ${error.message}`);
      }
    }

    function renderSources() {
      const authority = state.tables.authority;
      const csvPaths = state.availableFiles.filter(path => path.endsWith(".csv"));
      el.main.innerHTML = `
        ${pageHeader({
          eyebrow: "Authority and provenance",
          title: "Sources",
          lede: "Live player observation outranks registered server/client files. Inside the recovered data, Bango-current client tables supersede the legacy CSVs only for the fields they actually expose.",
          crumbs: [["Overview", "#/home"], ["Sources", ""]]
        })}
        ${section("Active runtime source", definitionGrid([
          ["Connection", escapeHtml(state.sourceKind)],
          ["Generated Bango CSVs", prettyNumber(csvPaths.filter(path => path.startsWith("bango_data/")).length)],
          ["Legacy CSVs", prettyNumber(csvPaths.filter(path => path.startsWith("data/")).length)],
          ["Derived-analysis CSVs", prettyNumber(csvPaths.filter(path => path.startsWith("analysis/")).length)],
          ["Reference articles", prettyNumber(state.articles.length)]
        ]))}
        ${section("Legacy-to-Bango authority matrix", `
          <div class="table-wrap"><table><thead><tr><th>Legacy table</th><th>Verdict</th><th>Bango source</th><th>Exact scope</th></tr></thead>
          <tbody>${authority.map(row => `<tr>
            <td><span class="mono">${escapeHtml(row.legacy_csv)}</span></td>
            <td>${tags([row.verdict], row.verdict.includes("superseded") ? "accent" : "gold")}</td>
            <td>${escapeHtml(row.bango_source || "—")}</td>
            <td>${escapeHtml(row.scope)}</td>
          </tr>`).join("")}</tbody></table></div>
        `)}
        ${section("Drop-probability decision", `
          <div class="callout info"><strong>What the site will and will not say.</strong>
            <p><code>bango_data/DROPS.csv</code> is the current authority for monster–item association, literal value and flag. Its empty legacy chance columns are not a parsing miss.</p>
            <p>Rafael's externally confirmed 2026-07-26 premise establishes that Bango uses the KalEncyclopedia rates. For each current association, the site joins the normalized monster and item names to <code>data/DROPS.csv</code>, expands every <code>drp_rev</code> variant, and computes <code>(chance1 ÷ 100) × (chance2 ÷ 100)</code>.</p>
            <p>No pair match means “rate not mapped”; the site never copies a chance across names or treats the native Bango value as a probability. Official Bango documentation remains additional source-linked evidence.</p>
          </div>
        `)}`;
    }

    function renderNotFound(kind, id) {
      el.main.innerHTML = `
        ${pageHeader({
          eyebrow: "Route not resolved",
          title: `No ${kind} found`,
          lede: `The current connected data has no addressable ${escapeHtml(kind)} for <code>${escapeHtml(id)}</code>.`,
          crumbs: [["Overview", "#/home"], ["Not found", ""]]
        })}
        <div class="empty"><p>The site refuses to invent a record for a missing join.</p><a class="button primary" href="#/search">Search the atlas</a></div>`;
    }

    async function renderRoute() {
      renderNavigation();
      hideSkillTooltip();
      state.evidence.clear();
      state.evidenceCounter = 0;
      const route = routeInfo();
      if (document.body?.classList) {
        document.body.classList.toggle("detail-route",
          ["item", "monster", "skill", "quest", "npc", "zone", "prefix", "class", "talisman"]
            .includes(route.section));
      }
      if (!state.ready) {
        if (!state.loading) renderConnect(state.lastError);
        return;
      }
      try {
        switch (route.section) {
          case "home": renderHome(); break;
          case "search": renderSearch(route.query); break;
          case "items": renderItems(route.query); break;
          case "item": renderItem(route.id); break;
          case "monsters": renderMonsters(route.query); break;
          case "monster": renderMonster(route.id); break;
          case "build": renderBuild(); break;
          case "threats": renderBuild(); break;
          case "skills": renderSkills(route.query); break;
          case "skill": renderSkill(route.id); break;
          case "quests": renderQuests(route.query); break;
          case "quest": renderQuest(route.id); break;
          case "npcs": renderNpcs(route.query); break;
          case "npc": renderNpc(route.id); break;
          case "zones": renderZones(route.query); break;
          case "zone": renderZone(route.id); break;
          case "talismans": renderTalismans(route.query); break;
          case "talisman": renderTalisman(route.id); break;
          case "levels": renderLevels(route.query); break;
          case "weapon-calculator": renderWeaponCalculator(); break;
          case "system": renderGameSystem(); break;
          case "prefix": renderPrefix(route.id); break;
          case "class": renderClass(route.id); break;
          case "articles": renderArticles(route.query); break;
          case "article": renderArticle(route.id); break;
          case "sources": renderSources(); break;
          default: renderNotFound("route", route.section); break;
        }
        el.main.focus({ preventScroll: true });
        window.scrollTo({ top: 0, behavior: "auto" });
        // Icons resolve from the connected folder after the markup is in place.
        hydrateIcons(el.main);
        hydrateThemeArt();
      } catch (error) {
        console.error(error);
        renderNotFound("renderable page", `${route.section}: ${error.message}`);
      }
    }

    function showEvidence(id) {
      const row = state.evidence.get(id);
      if (!row) return;
      const entries = Object.entries(row).filter(([key]) => key !== "__rowIndex");
      el.evidenceTitle.textContent = row.source_file ? `Evidence · ${row.source_file}` : "Source evidence";
      el.evidenceBody.innerHTML = `<div class="kv">${entries.map(([key, value]) =>
        `<div>${escapeHtml(key)}</div><div>${cellValue(key, typeof value === "object" ? JSON.stringify(value, null, 2) : value, row, 10000)}</div>`
      ).join("")}</div>`;
      el.evidenceDialog.showModal();
    }

    document.addEventListener("click", async event => {
      const sortControl = event.target.closest("[data-sort-table]");
      if (sortControl) {
        applyTableSort(sortControl.dataset.sortTable, sortControl.dataset.sortKey,
          sortControl.dataset.sortDir);
        return;
      }
      const questControl = event.target.closest("[data-quest-status]");
      if (questControl) {
        cycleQuestStatus(questControl.dataset.questStatus);
        return;
      }
      const control = event.target.closest("[data-action]");
      if (!control) return;
      const action = control.dataset.action;
      if (action === "pick-folder" || action === "reconnect") {
        await connectWithDirectoryPicker();
      } else if (action === "fallback-folder") {
        el.folderInput.click();
      } else if (action === "show-evidence") {
        showEvidence(control.dataset.evidenceId);
      } else if (action === "close-dialog") {
        el.evidenceDialog.close();
      } else if (action === "close-equipment") {
        el.equipmentDialog.close();
      } else if (action === "new-character") {
        createCharacter(false);
      } else if (action === "duplicate-character") {
        createCharacter(true);
      } else if (action === "delete-character") {
        if (state.profiles.characters.length > 1
            && globalThis.confirm(`Delete ${activeProfile().name} from this browser?`)) {
          deleteActiveCharacter();
        }
      } else if (action === "finish-available-quests") {
        finishAvailableQuests();
      } else if (action === "reset-all-quests") {
        resetAllQuests();
      }
    });

    document.addEventListener("submit", event => {
      event.preventDefault();
      const form = event.target;
      if (form === el.globalSearch) {
        const q = new FormData(form).get("q")?.toString().trim() || "";
        location.hash = q ? `#/search?q=${encodeURIComponent(q)}` : "#/search";
        return;
      }
      const route = form.dataset.filterRoute;
      if (!route) return;
      const params = new URLSearchParams();
      for (const [key, value] of new FormData(form)) {
        if (String(value).trim()) params.set(key, String(value).trim());
      }
      location.hash = `#/${route}${params.size ? `?${params}` : ""}`;
    });

    el.folderInput.addEventListener("change", async () => {
      const files = [...el.folderInput.files];
      if (!files.length) return;
      await loadProject(new FileListSource(files), "compatibility folder selection");
      el.folderInput.value = "";
    });

    el.evidenceDialog.addEventListener("click", event => {
      if (event.target === el.evidenceDialog) el.evidenceDialog.close();
    });
    el.equipmentDialog.addEventListener("click", event => {
      if (event.target === el.equipmentDialog) el.equipmentDialog.close();
    });

    window.addEventListener("hashchange", renderRoute);

    async function boot() {
      loadProfiles();
      renderProfileSwitcher();
      renderConnect();
      // Served from a web host, the manifest is there and the page connects
      // itself. Opened from disk, it falls back to the remembered folder handle
      // and then to the picker. The same file covers all three.
      const online = await tryHttpConnect();
      if (online) return;
      const reconnected = await tryReconnect();
      if (!reconnected && !state.ready) renderConnect();
    }

    boot();
  </script>
</body>
</html>
