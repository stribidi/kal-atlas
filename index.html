          Number(selected.grade) || 1));
        Object.entries(registeredBuffEffects(definition, grade, build)).forEach(([stat, value]) => {
          result[stat] = (result[stat] || 0) + value;
        });
      });
      return result;
    }

    function simSheet(build) {
      const gear = simGearVector(build);
      const buffs = simBuffVector(build);
      const level = Number(build.level) || 1;
      const finalPrimary = {};
      PRIMARY_STATS.forEach(stat => {
        finalPrimary[stat] = (Number(build[stat]) || 0) + (gear[stat] || 0)
          + (buffs[stat] || 0);
      });

      const base = simDerived(finalPrimary.Strength, finalPrimary.Health,
        finalPrimary.Intelligence, finalPrimary.Wisdom, finalPrimary.Agility, level);
      PRIMARY_STATS.forEach(stat => { base[stat] = Number(build[stat]) || 0; });
      base.HP = simMaxHp(level, base.Health, build.cls, 0, build.doubleHp);
      base.MP = simMaxMp(level, base.Wisdom, build.cls, 0);
      base.Defense = 0;
      base.Absorb = 0;

      const final = {};
      state.combat.stat_slots.forEach(slot => {
        final[slot] = (base[slot] || 0) + (gear[slot] || 0) + (buffs[slot] || 0);
      });
      PRIMARY_STATS.forEach(stat => { final[stat] = finalPrimary[stat]; });
      final.HP = simMaxHp(level, finalPrimary.Health, build.cls,
        gear["HP%"] || 0, build.doubleHp) + (gear.HP || 0) + (buffs.HP || 0);
      final.MP = simMaxMp(level, finalPrimary.Wisdom, build.cls,
        gear["Mana%"] || 0) + (gear.MP || 0) + (buffs.MP || 0);

      ["PDMin", "PDMax", "MDMin", "MDMax"].forEach(slot => {
        final[slot] = simApplyMultipliers(final[slot],
          Number(build.questPercent) || 0, Number(build.petDamage) || 0);
      });
      final.Defense = simApplyMultipliers(final.Defense,
        Number(build.questPercent) || 0, Number(build.petDefense) || 0);
      final.Evasion = simApplyMultipliers(final.Evasion, 0,
        Number(build.petEvasion) || 0);

      const reimpl = simReimplDerived(finalPrimary.Strength, finalPrimary.Health,
        finalPrimary.Intelligence, finalPrimary.Wisdom, finalPrimary.Agility, level);
      const kalenc = simKalencDerived(finalPrimary.Strength, finalPrimary.Health,
        finalPrimary.Intelligence, finalPrimary.Wisdom, finalPrimary.Agility, level);
      return { base, gear, buffs, final, reimpl, kalenc, level };
    }

    // --- Combat pipeline, [ORIG] ---------------------------------------

    function simLevelHitTerm(difference) {
      const table = state.combat.tables.add_otp_by_level;
      const clamped = Math.max(-100, Math.min(100, difference));
      const value = table[Math.min(Math.abs(clamped), table.length - 1)];
      return clamped < 0 ? -value : value;
    }

    function simHitChanceFromTotal(total) {
      const table = state.combat.tables.hit_chance;
      const clamped = Math.max(-41, Math.min(41, total));
      return clamped < 0 ? 100 - table[Math.abs(clamped)] : table[clamped];
    }

    function simHitChance(attackerLevel, defenderLevel, attackerHit, defenderDodge) {
      return simHitChanceFromTotal(
        simLevelHitTerm(attackerLevel - defenderLevel) + attackerHit - defenderDodge);
    }

    function simPhysicalFinal(damage, attackerLevel, defenderLevel, defense, absorb) {
      const table = state.combat.tables.add_defense_by_level;
      const difference = attackerLevel - defenderLevel;
      const value = table[Math.min(Math.abs(difference), table.length - 1)];
      let revised = damage + (difference < 0 ? -value : value);
      revised -= defense;
      if (revised <= 0) return 0;
      revised -= simCdiv(revised * absorb, 100);
      return Math.max(0, revised);
    }

    function simMagicFinal(value, attackerLevel, defenderLevel, resistPercent) {
      const difference = attackerLevel - defenderLevel;
      const effective = Math.max(0,
        resistPercent - simCdiv(difference * Math.abs(difference), 6));
      const multiplier = effective >= 100 ? 0 : 100 - effective;
      let revised = simCdiv(multiplier * value, 100);
      revised += simCdiv(difference * Math.abs(difference), 4);
      return Math.max(0, revised);
    }

    // --- Build state ----------------------------------------------------

    function currentBuild() {
      loadProfiles();
      state.build = activeProfile().build;
      return state.build;
    }

    function saveBuild() {
      const profile = activeProfile();
      profile.build = state.build || profile.build;
      persistProfiles();
      // Retain the old single-build key as a backward-compatible export for
      // builds saved by earlier Kal Atlas versions.
      try { localStorage.setItem(BUILD_STORAGE_KEY, JSON.stringify(profile.build)); }
      catch (error) { /* private mode: the build simply does not persist */ }
    }

    function encodeBuild(build) {
      const json = JSON.stringify(build);
      return btoa(String.fromCharCode(...new TextEncoder().encode(json)))
        .replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
    }

    function decodeBuild(text) {
      const padded = text.replace(/-/g, "+").replace(/_/g, "/");
      const binary = atob(padded + "=".repeat((4 - padded.length % 4) % 4));
      const bytes = Uint8Array.from(binary, char => char.charCodeAt(0));
      return Object.assign({}, DEFAULT_BUILD, JSON.parse(new TextDecoder().decode(bytes)));
    }

    // --- Monsters -------------------------------------------------------

    const MONSTER_COMBAT_FIELDS = ["mon_otp", "mon_eva", "mon_minatt", "mon_maxatt",
      "mon_def1", "mon_def2", "mon_absorb", "mon_attspd", "mon_lvl"];

    function monsterHasCombatStats(row) {
      return Boolean(row) && MONSTER_COMBAT_FIELDS.every(field =>
        String(row[field] ?? "").trim() !== "");
    }

    function simVersus(sheet, build, legacy) {
      const monsterLevel = Number(legacy.mon_lvl);
      const level = sheet.level;
      const incomingHit = simHitChance(monsterLevel, level,
        Number(legacy.mon_otp), sheet.final.Evasion);
      const rawMin = Number(legacy.mon_minatt);
      const rawMax = Number(legacy.mon_maxatt);
      const landed = [rawMin, rawMax].map(raw => simPhysicalFinal(
        raw, monsterLevel, level, sheet.final.Defense, sheet.final.Absorb));
      const physicalMin = Math.min(...landed);
      const physicalMax = Math.max(...landed);
      const average = (physicalMin + physicalMax) / 2;
      const cooldown = Number(legacy.mon_attspd) || 0;
      const perSwing = average * incomingHit / 100;

      const result = {
        legacy, monsterLevel,
        incomingHit, evasion: 100 - incomingHit,
        physicalMin, physicalMax, average, perSwing, cooldown,
        perSecond: cooldown > 0 ? perSwing * 1000 / cooldown : null,
        outgoingHit: simHitChance(level, monsterLevel, sheet.final.OTP,
          Number(legacy.mon_eva)),
        survivalSwings: perSwing > 0 ? sheet.final.HP / perSwing : null
      };

      // What you deal to it. Archers strike at range so they meet mon_def2;
      // everyone else meets mon_def1 (KalOnline_Engine_Formulas.md section 3).
      const farAttacker = build.cls === "Archer";
      const monsterDefense = Number(farAttacker ? legacy.mon_def2 : legacy.mon_def1) || 0;
      const monsterAbsorb = Number(legacy.mon_absorb) || 0;
      result.attackType = farAttacker ? "ranged" : "melee";
      const dealt = [sheet.final.PDMin, sheet.final.PDMax].map(value =>
        simPhysicalFinal(value, level, monsterLevel, monsterDefense, monsterAbsorb));
      result.dealtPhysicalMin = Math.min(...dealt);
      result.dealtPhysicalMax = Math.max(...dealt);
      result.dealtPhysicalAverage = (result.dealtPhysicalMin + result.dealtPhysicalMax) / 2;
      result.dealtPhysicalExpected = result.dealtPhysicalAverage * result.outgoingHit / 100;

      // Magic ignores defence and absorb; only the monster's resistance in the
      // chosen element applies. mon_res1..5 are stored points, divided by 10 by
      // the original final-resist accessor before use.
      result.dealtMagic = {};
      [["fire", "mon_res1"], ["ice", "mon_res2"], ["lightning", "mon_res3"],
       ["non-elemental", "mon_res4"], ["curse", "mon_res5"]].forEach(([element, column]) => {
        const raw = String(legacy[column] ?? "").trim();
        if (raw === "") return;
        const resist = simCdiv(Number(raw), 10);
        const values = [sheet.final.MDMin, sheet.final.MDMax].map(value =>
          simMagicFinal(value, level, monsterLevel, resist));
        result.dealtMagic[element] = {
          resist, min: Math.min(...values), max: Math.max(...values)
        };
      });
      const best = Object.entries(result.dealtMagic)
        .sort((a, b) => b[1].max - a[1].max)[0];
      if (best) {
        result.bestMagicElement = best[0];
        result.bestMagicMin = best[1].min;
        result.bestMagicMax = best[1].max;
        // No hit-chance term: CMagic::Excute never calls CheckHit, so magic
        // does not miss. Resistance is the whole mitigation.
        result.bestMagicAverage = (best[1].min + best[1].max) / 2;
      }

      const magicMin = String(legacy.mon_mag1 ?? "").trim();
      const magicMax = String(legacy.mon_mag2 ?? "").trim();
      if (magicMin !== "" && magicMax !== "" && Number(magicMax) > 0) {
        result.magic = {};
        [["Fire", "Fire"], ["Ice", "Ice"], ["Lightning", "Lightening"]]
          .forEach(([label, slot]) => {
            const resist = sheet.final[slot] || 0;
            const values = [Number(magicMin), Number(magicMax)].map(value =>
              simMagicFinal(value, monsterLevel, level, resist));
            result.magic[label] = {
              resist, min: Math.min(...values), max: Math.max(...values)
            };
          });
        const worst = Object.values(result.magic)
          .reduce((a, b) => (b.max > a.max ? b : a));
        result.magicWorstMax = worst.max;
      }
      return result;
    }

    // Every Bango monster that resolves to a legacy row carrying combat stats.
    function threatRows(sheet, build) {
      const out = [];
      let unresolved = 0;
      (state.indexes.monsters || []).forEach(row => {
        const legacy = state.indexes.legacyMonstersByName.get(normalizeName(row.text));
        if (!monsterHasCombatStats(legacy)) { unresolved += 1; return; }
        out.push(Object.assign({ bango: row }, simVersus(sheet, build, legacy)));
      });
      return { rows: out, unresolved };
    }

    // --- Presentation ---------------------------------------------------

    // --- Client icons ---------------------------------------------------
    //
    // assets\icons\*.png is converted from the client's own data\HyperText
    // bitmaps by tools\client_icons\extract_icons.py. Names are the values
    // already in our tables: a Bango item's `bango_image`, a skill's `sk_pic`.
    // Resolution is asynchronous, so markup emits a placeholder and
    // hydrateIcons fills in the object URL afterwards.

    const ICON_ROOT = "assets/icons";
    const THEME_ART = "assets/theme/jade-archive-dragon.png";
    const iconUrlCache = new Map();
    let themeArtUrl = "";

    function iconTag(name, label = "", size = 32, fallback = "") {
      if (!name) return `<span class="icon icon-missing" style="width:${size}px;height:${size}px;display:inline-block"></span>`;
      return `<img class="icon" data-icon="${escapeAttr(String(name).toLowerCase())}"`
        + (fallback ? ` data-icon-fallback="${escapeAttr(String(fallback).toLowerCase())}"` : "")
        + ` width="${size}" height="${size}" alt="${escapeAttr(label)}"`
        + ` title="${escapeAttr(label)}">`;
    }

    /* Monster portraits. The Bango client names monsters but ships no 2D
       artwork for them, so the picture comes from KalEncyclopedia's monster
       ImageList, selected exactly as frmMonsters does it:
       imgMonst.Images(mon_pic - 1). mon_pic = -1 means the original tool
       showed nothing, and neither does this. The join to a Bango monster is
       the same exact normalized name used everywhere else. */
    const MONSTER_PORTRAIT_RATIO = 100 / 75;

    function monsterPortraitName(id, name = "") {
      // Name, never id: the Bango monstername ids and the legacy mon_azon ids
      // are different spaces — only 13 of 283 coincide — so an id join would
      // silently show the wrong monster.
      const legacy = state.indexes.legacyMonstersByName?.get(normalizeName(name));
      const pic = Number(legacy?.mon_pic);
      if (!Number.isFinite(pic) || pic < 1) return "";
      return `kalenc-monster-${String(pic - 1).padStart(3, "0")}`;
    }

    function monsterIconTag(id, name = "", height = 32) {
      const width = Math.round(height * MONSTER_PORTRAIT_RATIO);
      const portrait = monsterPortraitName(id, name);
      if (!portrait) {
        return `<span class="icon icon-monster-blank"
          style="width:${width}px;height:${height}px" aria-hidden="true"></span>`;
      }
      return `<img class="icon monster-icon" data-icon="${escapeAttr(portrait)}"
        width="${width}" height="${height}" alt="${escapeAttr(name)}"
        title="${escapeAttr(name)}">`;
    }

    function previewImageTag(name, fallback, label = "") {
      if (!name) return iconTag(fallback, label, 88);
      return `<img class="kalenc-preview" data-icon="${escapeAttr(String(name).toLowerCase())}"${
        fallback ? ` data-icon-fallback="${escapeAttr(String(fallback).toLowerCase())}"` : ""
      } alt="${escapeAttr(label)}" title="${escapeAttr(label)}">`;
    }

    /* Any image at an arbitrary project path — map artwork, not the icon
       library. Goes through state.source for the same reason icons do: on the
       local-folder path there is no URL to point at, only a file handle. */
    async function hydrateProjectImages(root) {
      if (!root || typeof root.querySelectorAll !== "function") return;
      if (!state.source || typeof state.source.file !== "function") return;
      for (const image of root.querySelectorAll("img[data-project-file]")) {
        if (image.getAttribute("src")) continue;
        const path = image.dataset.projectFile;
        if (!iconUrlCache.has(path)) {
          try {
            iconUrlCache.set(path, URL.createObjectURL(await state.source.file(path)));
          } catch (error) {
            iconUrlCache.set(path, null);
          }
        }
        const url = iconUrlCache.get(path);
        if (url) image.setAttribute("src", url);
        else image.closest(".map-wrap")?.classList.add("image-missing");
      }
    }

    async function hydrateIcons(root) {
      if (!root || typeof root.querySelectorAll !== "function") return;
      if (!state.source || typeof state.source.file !== "function") return;
      hydrateProjectImages(root);
      const pending = [...root.querySelectorAll("img[data-icon]")]
        .filter(image => !image.getAttribute("src"));
      for (const image of pending) {
        const primary = image.dataset.icon;
        const fallback = image.dataset.iconFallback || "";
        const candidates = [primary, fallback].filter(Boolean);
        let url = null;
        for (const key of candidates) {
          if (!iconUrlCache.has(key)) {
            try {
              const file = await state.source.file(`${ICON_ROOT}/${key}.png`);
              iconUrlCache.set(key, URL.createObjectURL(file));
            } catch (error) {
              iconUrlCache.set(key, null);
            }
          }
          url = iconUrlCache.get(key);
          if (url) break;
        }
        if (url) image.setAttribute("src", url);
        else image.classList.add("icon-missing");
      }
    }

    function skillIconFallback(row) {
      const legacyPic = state.indexes.legacySkillPicByName?.get(normalizeName(row?.sk_megn));
      return legacyPic == null ? "" : `kalenc-skill-${String(legacyPic).padStart(3, "0")}`;
    }

    function skillIconTag(row, size = 32) {
      return iconTag(row?.sk_pic || skillIconFallback(row), row?.sk_megn || row?.bango_key || "",
        size, row?.sk_pic ? skillIconFallback(row) : "");
    }

    function legacyItemForBango(row) {
      const candidates = state.indexes.legacyItemsGroupedByName?.get(normalizeName(row?.ita_name)) || [];
      if (!candidates.length) return null;
      const sameClass = candidates.filter(candidate =>
        normalizeName(candidate.ita_class) === normalizeName(row.ita_class));
      const sameGrade = sameClass.filter(candidate =>
        displayGrade(candidate.ita_grade) === displayGrade(row.ita_grade));
      return sameGrade[0] || sameClass[0] || candidates[0];
    }

    function kalencItemPreviewName(row, legacyItem) {
      if (!legacyItem) return "";
      const armorCode = state.indexes.legacyArmorPreviewByClassGrade?.get(
        `${normalizeName(row.ita_class)}~${displayGrade(row.ita_grade)}`);
      if (armorCode && parseJson(row.bango_class_json, [])[0] === "defense") {
        return `kalenc-armor-preview-${armorCode}`;
      }
      const picture = Number(legacyItem.ita_pic2);
      if (Number.isInteger(picture) && picture >= 0 && picture < 183) {
        return `kalenc-item-preview-${String(picture).padStart(3, "0")}`;
      }
      return "";
    }

    async function hydrateThemeArt() {
      if (!el.sidebarIllustration || el.sidebarIllustration.getAttribute?.("src")) return;
      if (!state.source || typeof state.source.file !== "function") return;
      try {
        if (!themeArtUrl) {
          const file = await state.source.file(THEME_ART);
          themeArtUrl = URL.createObjectURL(file);
        }
        el.sidebarIllustration.setAttribute("src", themeArtUrl);
      } catch (error) {
        // The interface remains fully usable when an older bundle lacks the
        // decorative art asset.
      }
    }

    // The equipment picker is keyed by legacy `ita_azon`; icons are named by
    // the Bango item's `bango_image`. The two ID spaces are unrelated, so this
    // joins on the normalized name and returns "" rather than a wrong icon
    // when there is no Bango twin.
    function iconNameForEquipment(item) {
      const byName = state.indexes.bangoItemsByName;
      const match = byName && byName.get(normalizeName(item.name));
      return match ? (match.bango_image || "") : "";
    }

    // --- Presentation ---------------------------------------------------

    // The KalEncyclopedia character sheet, rebuilt: label left, value right,
    // two columns, HP and MP as bars, resistances in their own band.
    function simCharacterSheet(build, sheet) {
      const f = sheet.final;
      const line = (label, value, note = "") => `<div class="sheet-line">
        <span>${escapeHtml(label)}</span>
        <b>${value}${note ? ` <small>${note}</small>` : ""}</b></div>`;
      const gearNote = slot => {
        const gear = sheet.gear[slot] || 0;
        const buff = sheet.buffs[slot] || 0;
        return [
          gear ? `${gear > 0 ? "+" : ""}${prettyNumber(gear)} gear` : "",
          buff ? `${buff > 0 ? "+" : ""}${prettyNumber(buff)} buff` : ""
        ].filter(Boolean).join(" · ");
      };
      const bar = (label, value, kind) => `<div class="sheet-bar">
        <span>${escapeHtml(label)}</span>
        <div class="track"><div class="fill ${kind}" style="width:100%"></div></div>
        <b>${prettyNumber(value)}/${prettyNumber(value)}</b></div>`;

      return `<div class="sheet">
        <div class="sheet-head">
          <div><span>Job</span> <b>${escapeHtml(build.cls)}</b></div>
          <div><span>Level</span> <b>${prettyNumber(build.level)}</b></div>
          <div><span>Points spent</span> <b>${prettyNumber(
            PRIMARY_STATS.reduce((total, stat) => total + (Number(build[stat]) || 0), 0))}</b></div>
          <div><span>Provenance</span> <b>BANGO-MEASURED</b></div>
        </div>
        <div class="sheet-bars">
          ${bar("Health Point", f.HP, "hp")}
          ${bar("Magic Point", f.MP, "mp")}
        </div>
        <div class="sheet-cols">
          <div>
            ${PRIMARY_STATS.map(stat => line(stat, prettyNumber(f[stat]), gearNote(stat))).join("")}
          </div>
          <div>
            ${line("Attack Point", `${prettyNumber(f.PDMin)}~${prettyNumber(f.PDMax)}`)}
            ${line("Magic Attack Point", `${prettyNumber(f.MDMin)}~${prettyNumber(f.MDMax)}`)}
            ${line("On Target Point", prettyNumber(f.OTP), gearNote("OTP"))}
            ${line("Evasion Point", prettyNumber(f.Evasion), gearNote("Evasion"))}
            ${line("Defense", prettyNumber(f.Defense), gearNote("Defense") || "no modifier")}
            ${line("Absorption Rate", `${prettyNumber(f.Absorb)}%`, gearNote("Absorb") || "no modifier")}
          </div>
        </div>
        <div class="sheet-section">
          <h4>Resistance</h4>
          <div class="sheet-cols">
            <div>
              ${line("Fire Resistance", prettyNumber(f.Fire))}
              ${line("Ice Resistance", prettyNumber(f.Ice))}
              ${line("Lightning Resistance", prettyNumber(f.Lightening))}
            </div>
            <div>
              ${line("Non Elemental Resistance", prettyNumber(f.NonElemental))}
              ${line("Curse Resistance", prettyNumber(f.Curse))}
            </div>
          </div>
        </div>
      </div>`;
    }

    function simProvenanceBanner() {
      return `<div class="callout info" style="margin-bottom:14px">
        <strong>The character sheet is measured; the combat numbers are not.</strong>
        Derived stats carry <span class="tag accent">BANGO-MEASURED</span> — every formula
        reproduced a real level-38 Magician sheet exactly on 2026-07-25, so this half is
        tier 2, the highest authority the project holds.
        The hit and damage pipeline is <span class="tag gold">ORIG-2006</span>, the decompiled
        Inixsoft engine, and monster stats are the <span class="tag gold">tier-5 legacy
        export</span> of an unrecorded game version. <strong>Neither of those two is Bango</strong>,
        and Bango's own monster combat stats have never been recovered — so anything involving a
        monster is a hypothesis about Bango, not a statement about it.
      </div>`;
    }

    function simMissing(reason) {
      return `<div class="callout"><strong>Simulator unavailable.</strong> ${escapeHtml(reason)}
        Regenerate it with <code>python tools\\knowledge_base_site\\build_combat_fixture.py</code>
        and reconnect the folder. Nothing is computed from restated constants.</div>`;
    }

    function simWorking(build, sheet) {
      const b = sheet.final;
      const level = sheet.level;
      const str = b.Strength, agi = b.Agility, int_ = b.Intelligence, wis = b.Wisdom;
      return {
        OTP: `Fix(0.277778 × ${str}) + Fix(${agi} ÷ 8)`,
        Evasion: `Fix(${agi} ÷ 3)`,
        PDMin: `Fix((${str}−10)×11÷30) + Fix((${agi}−5)÷11) + Fix(${level}×7÷10) + 2`,
        PDMax: `Fix((${str}−5)×8÷15) + Fix((${agi}+17)×11÷47) + ${level} − 3`,
        MDMin: `Fix((${int_}−8)×7÷12) + Fix(${wis}÷7)`,
        MDMax: `Fix(${int_}×7÷12) + Fix(${wis}×0.31249) − 3`,
        HP: `Fix((52×${level}÷3×${simBandAt("hp_level_coefficient_by_level", level)}`
          + ` + ${b.Health}²×q + 115))`
          + (simBandAt("late_health_band_by_level", level)
            ? ` + level-50 Health bonus (band ${simBandAt("late_health_band_by_level", level)})` : ""),
        MP: `Fix(8×${level} + ${wis}²×q + ${wis} + 140)`
          + ` + ${level}×${simBandAt("mp_level_band_by_level", level)}×2`,
        Fire: `Fix(${int_} ÷ 9)`, Ice: `Fix(${int_} ÷ 9)`,
        Lightening: `Fix(${int_} ÷ 9)`
      };
    }

    function simSheetTable(build, sheet) {
      const working = simWorking(build, sheet);
      const order = state.combat.stat_slots;
      const rows = order.map(slot => {
        const base = sheet.base[slot] || 0;
        const gear = sheet.gear[slot] || 0;
        const buffs = sheet.buffs[slot] || 0;
        const final = sheet.final[slot] || 0;
        if (!base && !gear && !buffs && !final) return "";
        const alternatives = [];
        if (sheet.kalenc[slot] !== undefined && sheet.kalenc[slot] !== base) {
          alternatives.push(`KALENC-2011 would read ${prettyNumber(sheet.kalenc[slot])}`);
        }
        if (sheet.reimpl[slot] !== undefined && sheet.reimpl[slot] !== base) {
          alternatives.push(`REIMPL would read ${prettyNumber(sheet.reimpl[slot])}`);
        }
        const disagreement = alternatives.length
          ? `<br><small class="dim">${escapeHtml(alternatives.join(" · "))}</small>` : "";
        return `<tr>
          <td><strong>${escapeHtml(slot)}</strong>${disagreement}</td>
          <td>${prettyNumber(base)}</td>
          <td>${gear ? prettyNumber(gear) : "<span class=\"dim\">—</span>"}</td>
          <td><strong>${prettyNumber(final)}</strong></td>
          <td>${buffs ? prettyNumber(buffs) : "<span class=\"dim\">—</span>"}</td>
          <td><small class="mono dim">${escapeHtml(working[slot] || "")}</small></td>
        </tr>`;
      }).join("");
      return `<div class="table-wrap"><table>
        <thead><tr><th>Stat</th><th>Base</th><th>Gear</th><th>Final</th><th>Buffs</th><th>Working</th></tr></thead>
        <tbody>${rows}</tbody></table></div>`;
    }

    // What each file source would have said, against what play actually showed.
    function simDisagreementPanel(sheet) {
      const slots = ["PDMin", "PDMax", "MDMin", "MDMax", "OTP", "Evasion",
                     "NonElemental", "Curse"];
      const rows = slots.map(slot => {
        const measured = sheet.base[slot];
        if (measured === undefined) return null;
        const kalenc = sheet.kalenc[slot] !== undefined ? sheet.kalenc[slot]
          : (["NonElemental", "Curse"].includes(slot) ? null : measured);
        const reimpl = sheet.reimpl[slot] !== undefined ? sheet.reimpl[slot] : null;
        const kalencOff = kalenc !== null && kalenc !== measured;
        const reimplOff = reimpl !== null && reimpl !== measured;
        if (!kalencOff && !reimplOff && kalenc !== null && reimpl !== null) return null;
        return { slot, measured, kalenc, reimpl, kalencOff, reimplOff };
      }).filter(Boolean);

      if (!rows.length) {
        return `<div class="callout info"><strong>Both file sources agree with the measurement
          on every derived stat at this build.</strong> That agreement is the corroboration —
          the reimplementation was single-source until the 2011 simulator was read, and neither
          was checked against play until 2026-07-25.</div>`;
      }
      const cell = (value, wrong) => value === null
        ? "<span class=\"dim\">does not derive it</span>"
        : `${prettyNumber(value)}${wrong ? " <span class=\"tag gold\">off</span>" : ""}`;
      return `<div class="callout" style="margin-bottom:14px"><strong>Where the file sources
        part company, and which one play agreed with.</strong> The measured column is what the
        game showed on a naked level-38 Magician. Magic went to KalEncyclopedia; minimum physical
        damage and the two extra resistances went to the reimplementation. Neither source was
        right about everything.</div>
        <div class="table-wrap"><table>
        <thead><tr><th>Stat</th><th>Measured (used)</th><th>KALENC-2011</th><th>REIMPL</th></tr></thead>
        <tbody>${rows.map(row => `<tr>
          <td><strong>${escapeHtml(row.slot)}</strong></td>
          <td><strong>${prettyNumber(row.measured)}</strong></td>
          <td>${cell(row.kalenc, row.kalencOff)}</td>
          <td>${cell(row.reimpl, row.reimplOff)}</td>
        </tr>`).join("")}</tbody></table></div>
        <p class="dim"><small>PDMin only separates the two sources at Strength 8 and 9 across the
          whole 0–250 range. The observed character had Strength 8, which is the only reason one
          screenshot could settle it.</small></p>`;
    }

    const SIM_CORE_SLOTS = ["Boots", "Shorts", "Chest", "Hood / Helmet", "Gloves", "Weapon"];

    function simSlotLabel(rawSlot) {
      const labels = {
        boots: "Boots", lowerarmor: "Shorts", upperarmor: "Chest",
        helmet: "Hood / Helmet", gauntlet: "Gloves", wand: "Weapon",
        stick: "Weapon", bow: "Weapon", sword: "Weapon", weapon: "Weapon",
        necklace: "Necklace", ring: "Ring", trinket: "Trinket",
        mask: "Mask", standard: "Standard"
      };
      const key = normalizeName(rawSlot);
      return labels[key] || String(rawSlot || "Other").replace(/^./, letter => letter.toUpperCase());
    }

    function simCanonicalSlot(category, rawSlot) {
      if (normalizeName(category) === "weapon") return "Weapon";
      const label = simSlotLabel(rawSlot);
      return SIM_CORE_SLOTS.includes(label) ? label : `Other · ${label}`;
    }

    function simWearable(item, build) {
      return (!item.cls || item.cls === "All"
        || normalizeName(item.cls) === normalizeName(build.cls)
        || (build.cls === "Magician" && normalizeName(item.cls) === "mage"))
        && (!item.levelLimit || item.levelLimit <= Number(build.level));
    }

    function simStatsSignature(item) {
      return Object.entries(item.stats || {})
        .sort(([left], [right]) => left.localeCompare(right))
        .map(([slot, value]) => `${slot}:${value}`).join("|");
    }

    function simGroupedOptions(build, slot, filter = () => true) {
      const armour = slot !== "Weapon" && SIM_CORE_SLOTS.includes(slot);
      const groups = new Map();
      state.indexes.equippableItems
        .filter(item => item.slot === slot && simWearable(item, build) && filter(item))
        .forEach(item => {
          const grade = displayGrade(item.grade);
          const identity = armour
            ? `${grade}|${simStatsSignature(item)}`
            : `${grade}|${normalizeName(item.name)}|${simStatsSignature(item)}`;
          if (!groups.has(identity)) groups.set(identity, []);
          groups.get(identity).push(item);
        });
      const options = [...groups.values()].map(items => ({
        items,
        item: items[0],
        grade: items[0].gradeNumber,
        gradeLabel: displayGrade(items[0].grade)
      })).sort((left, right) =>
        left.grade - right.grade || left.item.name.localeCompare(right.item.name));
      const variantsByGrade = new Map();
      options.forEach(option => variantsByGrade.set(option.gradeLabel,
        (variantsByGrade.get(option.gradeLabel) || 0) + 1));
      return options.map(option => ({
        ...option,
        label: armour && variantsByGrade.get(option.gradeLabel) === 1
          ? option.gradeLabel
          : variantsByGrade.get(option.gradeLabel) === 1
            ? option.gradeLabel
            : `${option.gradeLabel} — ${option.item.name}`
      }));
    }

    function simSlotControl(build, slot, options, label = slot) {
      const chosen = String(build.items[slot] || "");
      const chosenInOptions = options.some(option =>
        option.items.some(item => item.id === chosen));
      const chosenItem = chosenInOptions ? state.indexes.equippableById.get(chosen) : null;
      if (!options.length && !chosenItem) return "";
      return `<div class="slot" data-sim-slot="${escapeAttr(slot)}">
        <div class="slot-icon">${iconTag(chosenItem ? chosenItem.icon : "",
          chosenItem ? chosenItem.name : `${label} — empty`)}</div>
        <div class="slot-body"><span>${escapeHtml(label)}</span>
        <select data-sim-item="${escapeAttr(slot)}">
          <option value="">— none —</option>
          ${options.map(option => {
            const selected = option.items.some(item => item.id === chosen);
            const value = selected ? chosen : option.item.id;
            return `<option value="${escapeAttr(value)}"${selected ? " selected" : ""}>${
              escapeHtml(option.label)}</option>`;
          }).join("")}
        </select></div></div>`;
    }

    function simGearControls(build) {
      const ix = state.indexes;
      if (!ix.equippableItems || !ix.equippableItems.length) {
        return `<div class="callout"><strong>No decoded item vectors.</strong>
          The current Bango equipment table was not found, so only manual overrides are available.</div>`;
      }
      const definitions = [
        ["Hood / Helmet", "Hood / Helmet"], ["Other · Necklace", "Protection talisman"],
        ["Pet", "Pet"], ["Chest", "Chest"], ["Weapon", "Weapon"],
        ["Other · Shield", "Shield"], ["Gloves", "Gloves"], ["Other · Ring", "Ring"],
        ["Animal", "Animal"], ["Shorts", "Shorts"], ["Boots", "Boots"],
        ["Other · Trinket", "Trinket"]
      ];
      return `<div class="equipment-board">
        <p class="equipment-board-help"><strong>Right-click</strong> a slot to configure everything
          that belongs to it. Click is the touch and keyboard fallback.</p>
        <div class="equipment-slot-grid">${definitions.map(([slot, label]) =>
          characterEquipmentSlot(build, slot, label)).join("")}</div>
      </div>`;
    }

    function equipmentModifierSummary(mods) {
      if (!mods) return "";
      const parts = [];
      if (Number(mods.enhancementLevel)) parts.push(`EB +${mods.enhancementLevel}`);
      if (Number(mods.otp)) parts.push(`+${mods.otp} OTP`);
      if (Number(mods.physical)) parts.push(`+${mods.physical} atk`);
      if (Number(mods.magical)) parts.push(`+${mods.magical} m.atk`);
      if (Number(mods.defense)) parts.push(`+${mods.defense} def`);
      if (mods.stone) parts.push(`${mods.stone} Lv${mods.stoneLevel || 1}`);
      if (mods.equip) parts.push(mods.equip);
      if (mods.dragonName) {
        parts.push(mods.dragonStat
          ? `${mods.dragonName} +${mods.dragonPercent || 0}% / +${mods.dragonRStat || 0} ${mods.dragonStat}`
          : mods.dragonName);
      }
      if (mods.animal) parts.push(`${mods.animal}${mods.animalGrade ? ` G${mods.animalGrade}` : ""}`);
      if (mods.pet) parts.push(mods.pet);
      return parts.join(" · ");
    }

    /* Every slot needs a picture even when it is empty, and the virtual slots
       (animal, pet) have no equippable item to take one from — so they fall
       back to the client's own animal and pet icons. */
    const SLOT_PLACEHOLDER_ICONS = {
      "Hood / Helmet": "slotbg_helmet", "Chest": "slotbg_upper", "Gloves": "slotbg_gauntlet",
      "Shorts": "slotbg_lower", "Boots": "slotbg_boots", "Weapon": "slotbg_weapon",
      "Other · Shield": "slotbg_shield", "Animal": "slotbg_pet", "Pet": "slotbg_pet"
      // The client ships no empty-slot art for the three accessory slots, so
      // those stay blank rather than borrowing another slot's picture.
    };
    const ANIMAL_ICONS = {
      Bird: "pet002", Panther: "pet003", Tiger: "pet004", Eagle: "pet005"
    };

    function equipmentSlotIcon(build, slot) {
      const item = state.indexes.equippableById.get(String(build.items?.[slot] || ""));
      if (item?.icon) return item.icon;
      const mods = build.equipmentMods?.[slot] || {};
      if (slot === "Animal" && mods.animal) return ANIMAL_ICONS[mods.animal] || "pet001";
      if (slot === "Pet" && mods.pet) return "pet001";
      return SLOT_PLACEHOLDER_ICONS[slot] || "";
    }

    function characterEquipmentSlot(build, slot, label) {
      const item = state.indexes.equippableById.get(String(build.items?.[slot] || ""));
      const prefix = state.indexes.prefixById.get(String(build.prefixes?.[slot] || ""));
      const mods = build.equipmentMods?.[slot] || {};
      const name = item?.name || mods.animal || mods.pet || "";
      const detail = [
        item ? displayGrade(item.grade) : "",
        prefix ? prefix.name : "",
        equipmentModifierSummary(mods)
      ].filter(Boolean).join(" · ");
      return `<button class="equipment-slot${name ? " filled" : ""}" type="button"
          data-equipment-slot="${escapeAttr(slot)}"
          title="${escapeAttr([label, name, detail].filter(Boolean).join(" — "))}"
          aria-label="Configure ${escapeAttr(label)}">
        <span class="slot-icon">${iconTag(equipmentSlotIcon(build, slot),
          name || `${label} — empty`, 34)}</span>
        <span class="equipment-slot-body">
          <strong>${escapeHtml(name || label)}</strong>
          <small>${escapeHtml(name ? (detail || label) : "Empty")}</small>
        </span>
      </button>`;
    }

    function simManualControls(build) {
      return `<details><summary>Manual overrides — type totals the data cannot supply</summary>
        <div class="callout info" style="margin:12px 0">
          <strong>Use these for anything undecoded.</strong> <code>+N</code> enhancement, set
          bonuses and Beads of Fire are not decoded, so enhanced gear will under-report unless you
          enter the difference here. This mirrors KalEncyclopedia, whose own OTP, Defense and
          damage fields are typed in.</div>
        <div class="field-grid">${state.combat.stat_slots.map(slot => `
          <label class="field"><span>${escapeHtml(slot)}</span>
          <input type="number" step="1" data-sim-manual="${escapeAttr(slot)}"
            value="${escapeAttr(build.manual[slot] ?? "")}" placeholder="0"></label>`).join("")}
        </div></details>`;
    }

    function simNormalizeBuildItems(build) {
      const normalized = {};
      Object.entries(build.items || {}).forEach(([slot, itemId]) => {
        const item = state.indexes.equippableById.get(String(itemId));
        normalized[item ? item.slot : slot] = itemId;
      });
      build.items = normalized;
      return build;
    }

    function equipmentOptionsForSlot(build, slot) {
      if (slot === "Animal" || slot === "Pet") return [];
      return simGroupedOptions(build, slot, () => true);
    }

    function equipmentSelectOptions(build, slot) {
      const chosen = String(build.items?.[slot] || "");
      return equipmentOptionsForSlot(build, slot).map(option => {
        const selected = option.items.some(item => item.id === chosen);
        const value = selected ? chosen : option.item.id;
        const imperial = /\bimperial\b/i.test(option.item.name || "") ? " · Imperial" : "";
        return `<option value="${escapeAttr(value)}"${selected ? " selected" : ""}>${
          escapeHtml(`${option.label}${imperial}`)}</option>`;
      }).join("");
    }

    const ARMOR_EQUIPMENT_SLOTS = new Set([
      "Hood / Helmet", "Chest", "Gloves", "Shorts", "Boots", "Other · Shield"
    ]);
    const ACCESSORY_EQUIPMENT_SLOTS = new Set([
      "Other · Necklace", "Other · Ring", "Other · Trinket"
    ]);
    const PREFIX_STAT_LABELS = {
      Strength: "Strength", Health: "Health", Intelligence: "Intelligence",
      Wisdom: "Wisdom", Agility: "Agility", HP: "HP", MP: "MP", OTP: "OTP",
      Evasion: "Evasion", PDMin: "Min physical attack", PDMax: "Max physical attack",
      MDMin: "Min magical attack", MDMax: "Max magical attack",
      Defense: "Defense", Absorb: "Absorption"
    };

    function prefixEffectText(prefix) {
      return Object.entries(prefix.stats || {}).map(([stat, value]) =>
        `${PREFIX_STAT_LABELS[stat] || stat} ${Number(value) >= 0 ? "+" : ""}${prettyNumber(value)}`
      ).join(" · ");
    }

    function prefixGroupName(prefix) {
      const keys = Object.keys(prefix.stats || {});
      if (keys.includes("PDMin") || keys.includes("PDMax")) return "Physical attack";
      if (keys.includes("MDMin") || keys.includes("MDMax")) return "Magical attack";
      if (keys.length === 1) return PREFIX_STAT_LABELS[keys[0]] || keys[0];
      return "Multiple stats";
    }

    function prefixFamilyForSlot(slot) {
      if (slot === "Weapon") return {
        name: "Talisman of Intensification", ids: WEAPON_PREFIX_IDS
      };
      if (ARMOR_EQUIPMENT_SLOTS.has(slot)) return {
        name: "Talisman of Protection", ids: ARMOR_PREFIX_IDS
      };
      if (ACCESSORY_EQUIPMENT_SLOTS.has(slot)) return {
        name: "Talisman of Wonder", ids: ACCESSORY_PREFIX_IDS
      };
      return null;
    }

    function prefixOptionsForSlot(slot, item = null) {
      const family = prefixFamilyForSlot(slot);
      if (!family) return [];
      return state.indexes.prefixOptions.filter(prefix => {
        if (!family.ids.has(prefix.id)) return false;
        const group = prefixGroupName(prefix);
        if (slot === "Weapon" && item?.rawSlot === "wand" && group === "Physical attack") return false;
        if (slot === "Weapon" && item?.rawSlot !== "wand" && group === "Magical attack") return false;
        return true;
      });
    }

    function prefixOptionsHtml(slot, item, selectedId) {
      const groups = new Map();
      prefixOptionsForSlot(slot, item).forEach(prefix =>
        mapPush(groups, prefixGroupName(prefix), prefix));
      return [...groups.entries()].map(([group, prefixes]) => `
        <optgroup label="${escapeAttr(group)}">
          ${prefixes.map(prefix => `<option value="${escapeAttr(prefix.id)}"${
            String(selectedId || "") === prefix.id ? " selected" : ""
          }>${escapeHtml(prefix.name)} — ${escapeHtml(prefixEffectText(prefix))}</option>`).join("")}
        </optgroup>`).join("");
    }

    function talismanAmountOptions(value, unit) {
      return Array.from({ length: 11 }, (_, amount) => `<option value="${amount}"${
        Number(value || 0) === amount ? " selected" : ""
      }>${amount ? `+${amount} ${escapeHtml(unit)}` : "— none —"}</option>`).join("");
    }

    function equipmentDialogHtml(build, slot) {
      const item = state.indexes.equippableById.get(String(build.items?.[slot] || ""));
      const mods = build.equipmentMods?.[slot] || {};
      const virtual = slot === "Animal" || slot === "Pet";
      const prefixFamily = prefixFamilyForSlot(slot);
      const isWeapon = slot === "Weapon";
      const isArmor = ARMOR_EQUIPMENT_SLOTS.has(slot);
      const isMagicWeapon = isWeapon && (item?.rawSlot === "wand"
        || (!item && build.cls === "Magician"));
      const label = slot.replace(/^Other · /, "");
      const dragonNames = ["Imoogi", "Shadow Dragon", "Sky Dragon", "Ancient Dragon",
        "Storm Dragon", "Violent Dragon", "Thunder Dragon"];
      const animalNames = ["Bird", "Panther", "Tiger", "Eagle"];
      const petNames = ["Black Tortoise", "Blue Dragon", "Red Bird", "White Tiger",
        "Zamogeon — Field Pet", "Zamogeon — PvP Pet",
        "KalCash — Field Pet", "KalCash — PvP Pet"];
      const modifierFields = isWeapon ? `
        <label class="field"><span>Talisman of Accuracy</span>
          <select data-equipment-mod="otp">${talismanAmountOptions(mods.otp, "OTP")}</select></label>
        ${isMagicWeapon ? `
          <label class="field"><span>Talisman of Magic</span>
            <select data-equipment-mod="magical">${talismanAmountOptions(mods.magical, "min/max magical attack")}</select></label>
        ` : `
          <label class="field"><span>Talisman of Attack</span>
            <select data-equipment-mod="physical">${talismanAmountOptions(mods.physical, "min/max physical attack")}</select></label>
        `}
      ` : (isArmor ? `
        <label class="field"><span>Talisman of Defense</span>
          <select data-equipment-mod="defense">${talismanAmountOptions(mods.defense, "Defense")}</select></label>
      ` : "");
      const animalField = slot === "Animal" ? `
        <label class="field"><span>Animal</span><select data-equipment-mod="animal">
          <option value="">— no animal —</option>
          ${animalNames.map(name => `<option value="${escapeAttr(name)}"${
            mods.animal === name ? " selected" : ""}>${escapeHtml(name)}</option>`).join("")}
        </select></label>` : "";
      const petField = slot === "Pet" ? `
        <label class="field"><span>Pet</span><select data-equipment-mod="pet">
          <option value="">— no pet —</option>
          ${petNames.map(name => `<option value="${escapeAttr(name)}"${
            mods.pet === name ? " selected" : ""}>${escapeHtml(name)}</option>`).join("")}
        </select></label>` : "";
      return `<div class="equipment-config">
        <div class="equipment-config-summary">
          <span class="slot-icon">${iconTag(item?.icon || "", item?.name || `${label} — empty`, 52)}</span>
          <div><strong>${escapeHtml(item?.name || label)}</strong><br>
            <span class="dim">${item
              ? `${displayGrade(item.grade)} · required level ${item.levelLimit || "—"}`
              : "No item selected"}</span></div>
        </div>
        ${virtual ? "" : `<label class="field"><span>Grade / version${
          slot === "Weapon" ? " / Imperial" : ""}</span>
          <select data-equipment-item="${escapeAttr(slot)}">
            <option value="">— none —</option>${equipmentSelectOptions(build, slot)}
          </select></label>
        <label class="field"><span>${escapeHtml(prefixFamily?.name || "Talisman")} — prefix and exact effect</span>
          <select data-equipment-prefix="${escapeAttr(slot)}">
            <option value="">— no prefix —</option>
            ${prefixOptionsHtml(slot, item, build.prefixes?.[slot])}
          </select></label>`}
        ${animalField}${petField}
        <div class="equipment-modifier-grid">
          ${modifierFields}
          ${!isWeapon ? "" : `<label class="field"><span>EB level</span>
            <select data-equipment-mod="enhancementLevel">
              ${Array.from({ length: 16 }, (_, level) => `<option value="${level}"${
                Number(mods.enhancementLevel || 0) === level ? " selected" : ""
              }>+${level}</option>`).join("")}
            </select></label>
          <label class="field"><span>Elemental enhancement</span>
            <select data-equipment-mod="element">
              ${["", "Fire", "Ice", "Lightning"].map(name => `<option value="${name}"${
                mods.element === name ? " selected" : ""
              }>${name || "— none —"}</option>`).join("")}
            </select></label>
          <label class="field"><span>Element level</span>
            <select data-equipment-mod="elementLevel">
              ${[0, 1, 2, 3].map(level => `<option value="${level}"${
                Number(mods.elementLevel || 0) === level ? " selected" : ""
              }>${level ? `Level ${level}` : "—"}</option>`).join("")}
            </select></label>
          <label class="field"><span>Dragon scroll</span>
            <select data-equipment-mod="dragonName">
              <option value="">— no scroll —</option>
              ${dragonNames.map(name => `<option value="${escapeAttr(name)}"${
                mods.dragonName === name ? " selected" : ""}>${escapeHtml(name)}</option>`).join("")}
            </select></label>
          <label class="field"><span>Dragon scroll stat</span>
            <select data-equipment-mod="dragonStat">
              <option value="">—</option>
              ${PRIMARY_STATS.map(name => `<option value="${escapeAttr(name)}"${
                mods.dragonStat === name ? " selected" : ""}>${escapeHtml(name)}</option>`).join("")}
            </select></label>`}
        </div>
        ${virtual ? `<div class="callout info"><strong>Legacy selector.</strong> The choices above
          reproduce the KalEncyclopedia list. Bango pet/animal stat mappings are not registered, so
          the selection is saved but does not change totals.</div>` : `
        <div class="callout info"><strong>KalEncyclopedia hierarchy.</strong> Prefix choices are
          filtered to ${escapeHtml(prefixFamily?.name || "this equipment category")} and every name
          shows its decoded stat effect. Accuracy, Attack, Magic and Defense talismans change the
          sheet by the selected amount. EB, elemental and dragon-scroll controls exist only on the
          weapon; those three choices remain excluded from totals until their Bango application
          mapping is registered.</div>`}
      </div>`;
    }

    /* ===================================================================
       Equipment slot menu

       KalEncyclopedia configures a slot through a cascading right-click
       menu, and that is the interaction being reproduced here — not a form.
       The tree per slot, recovered from frmSkills:

         Weapon   Grade > <grade> > <weapon>, Prefix > <family> > <prefix>,
                  On target point > +0..+7, Phys./Mag. attack > +0..+18,
                  EB Lvl > 0..18, Elemental stones > Lvl 1|2|3 > <stone>,
                  DragonScroll > <scroll> > <percentage and stat>
         Armor    Grade, Prefix, Defense > +0..+10, Equip > Bead of Fire,
                  DragonScroll
         Accessory  Prefix > <family> > <prefix>, and the item list
         Animal   Grade > 1..80, then the four animals
         Pet      the eight pets

       Only the leaves write to the build; a branch just opens.
       =================================================================== */
    const ELEMENTAL_STONE_LEVELS = [1, 2, 3];
    const DRAGON_SCROLLS = ["Imoogi", "Shadow Dragon", "Sky Dragon", "Ancient Dragon",
      "Storm Dragon", "Violent Dragon", "Thunder Dragon"];
    // Resistance-stat bonus per scroll tier. Weapons and chest reach 5 at
    // Thunder; shorts share the chest percentages but not its top tier; the
    // remaining pieces cap at 4.
    const DRAGON_SCROLL_RSTAT = {
      weapon: [1, 1, 2, 2, 3, 3, 5],
      chest: [1, 1, 2, 2, 3, 3, 5],
      shorts: [1, 1, 1, 2, 2, 3, 5],
      other: [1, 1, 1, 2, 2, 3, 4]
    };
    const ANIMALS = ["Bird", "Panther", "Tiger", "Eagle"];
    const PETS = ["Black Tortoise", "Blue Dragon", "Red Bird", "White Tiger",
      "Zamogeon — Field Pet", "Zamogeon — PvP Pet",
      "KalCash — Field Pet", "KalCash — PvP Pet"];

    function elementalStones() {
      return (state.optional.legacyItems || []).filter(row => String(row.ita_itype) === "9");
    }

    function dragonScrollRow(slot) {
      if (slot === "Weapon") return "weapon";
      if (slot === "Chest") return "chest";
      if (slot === "Shorts") return "shorts";
      return "other";
    }

    /* Weapons carry two percentage steps per scroll tier; armor carries the
       next two. The stat bonus comes from the per-slot ladder above. */
    function dragonScrollLeaves(slot, scrollIndex) {
      const isWeapon = slot === "Weapon";
      const first = isWeapon ? scrollIndex * 2 + 1 : scrollIndex * 2 + 3;
      const rstat = DRAGON_SCROLL_RSTAT[dragonScrollRow(slot)][scrollIndex];
      const kind = isWeapon ? "Dmg" : "Def";
      return [first, first + 1].flatMap(percent => PRIMARY_STATS.map(stat => ({
        label: `+${percent}% ${kind} · +${rstat} ${stat}`,
        set: { dragonName: DRAGON_SCROLLS[scrollIndex], dragonStat: stat,
          dragonPercent: percent, dragonRStat: rstat }
      })));
    }

    function amountBranch(label, key, mods, max, format = value => `+${value}`) {
      return {
        label,
        children: Array.from({ length: max + 1 }, (_, value) => ({
          label: format(value),
          checked: Number(mods[key] || 0) === value,
          set: { [key]: value }
        }))
      };
    }

    function prefixBranchesForSlot(slot, item, selectedId) {
      const groups = new Map();
      prefixOptionsForSlot(slot, item).forEach(prefix =>
        mapPush(groups, prefixGroupName(prefix), prefix));
      return [
        { label: "— No prefix —", checked: !selectedId, prefix: "" },
        ...[...groups.entries()].map(([group, prefixes]) => ({
          label: group,
          children: prefixes.map(prefix => ({
            label: `${prefix.name} — ${prefixEffectText(prefix)}`,
            checked: String(selectedId || "") === prefix.id,
            prefix: prefix.id
          }))
        }))
      ];
    }

    function gradeBranchForSlot(build, slot, emptyLabel) {
      const chosen = String(build.items?.[slot] || "");
      const byGrade = new Map();
      equipmentOptionsForSlot(build, slot).forEach(option =>
        mapPush(byGrade, displayGrade(option.item.grade) || "—", option));
      const grades = [...byGrade.entries()].sort(([left], [right]) =>
        (gradeNumber(right) ?? -1) - (gradeNumber(left) ?? -1));
      return {
        label: "Grade",
        children: [
          { label: emptyLabel, checked: !chosen, item: "" },
          ...grades.map(([grade, options]) => {
            // A grade with one item needs no third level; several distinct
            // weapons in one grade do.
            if (options.length === 1) {
              const item = options[0].item;
              return { label: `${grade} — ${item.name}`, checked: item.id === chosen, item: item.id };
            }
            return {
              label: grade,
              marked: options.some(option => option.items.some(entry => entry.id === chosen)),
              children: options.map(option => ({
                label: option.item.name,
                checked: option.items.some(entry => entry.id === chosen),
                item: option.item.id
              }))
            };
          })
        ]
      };
    }

    function slotMenuModel(build, slot) {
      const item = state.indexes.equippableById.get(String(build.items?.[slot] || ""));
      const mods = build.equipmentMods?.[slot] || {};
      const isWeapon = slot === "Weapon";
      const isArmor = ARMOR_EQUIPMENT_SLOTS.has(slot);
      const isMagicWeapon = isWeapon && (item?.rawSlot === "wand"
        || (!item && build.cls === "Magician"));

      if (slot === "Animal") {
        return [
          {
            label: "Grade",
            children: Array.from({ length: 80 }, (_, index) => index + 1).map(grade => ({
              label: `G${String(grade).padStart(2, "0")}`,
              checked: Number(mods.animalGrade || 0) === grade,
              set: { animalGrade: grade }
            }))
          },
          { separator: true },
          { label: "— No animal —", checked: !mods.animal, set: { animal: "" } },
          ...ANIMALS.map(name => ({
            label: name, checked: mods.animal === name, set: { animal: name }
          }))
        ];
      }

      if (slot === "Pet") {
        return [
          { label: "— No pet —", checked: !mods.pet, set: { pet: "" } },
          ...PETS.map(name => ({
            label: name, checked: mods.pet === name, set: { pet: name }
          }))
        ];
      }

      const branches = [gradeBranchForSlot(build, slot,
        isWeapon ? "— No weapon —" : isArmor ? "— No armor —" : "— Nothing —")];

      const prefixFamily = prefixFamilyForSlot(slot);
      if (prefixFamily) {
        branches.push({
          label: prefixFamily.name,
          children: prefixBranchesForSlot(slot, item, build.prefixes?.[slot])
        });
      }

      if (isWeapon) {
        branches.push(amountBranch("On target point", "otp", mods, 7));
        branches.push(isMagicWeapon
          ? amountBranch("Mag. attack", "magical", mods, 18)
          : amountBranch("Phys. attack", "physical", mods, 18));
        branches.push(amountBranch("EB Lvl", "enhancementLevel", mods, 18, value => `+${value}`));
        branches.push({
          label: "Elemental stones",
          children: [
            { label: "— No stone —", checked: !mods.stone, set: { stone: "", stoneLevel: 0 } },
            ...ELEMENTAL_STONE_LEVELS.map(level => {
              // Level 3 is the two rare stones only; 1 and 2 are the standard set.
              const stones = elementalStones().filter(row => level === 3
                ? Number(row.ita_azon) >= 432 : Number(row.ita_azon) < 432);
              return {
                label: `Lvl ${level}`,
                marked: Number(mods.stoneLevel || 0) === level,
                children: stones.map(row => ({
                  label: `${row.ita_name} Lv${level}`,
                  checked: mods.stone === row.ita_name && Number(mods.stoneLevel) === level,
                  set: { stone: row.ita_name, stoneLevel: level }
                }))
              };
            })
          ]
        });
      } else if (isArmor) {
        branches.push(amountBranch("Defense", "defense", mods, 10));
        if (slot !== "Other · Shield") {
          branches.push({
            label: "Equip",
            children: [
              { label: "— Nothing —", checked: !mods.equip, set: { equip: "" } },
              {
                label: "Bead of Fire",
                checked: mods.equip === "Bead of Fire",
                // The original enables this only from G46 up.
                disabled: (gradeNumber(item?.grade) ?? 0) < 46,
                set: { equip: "Bead of Fire" }
              }
            ]
          });
        }
      }

      if (isWeapon || isArmor) {
        branches.push({
          label: "DragonScroll",
          children: [
            { label: "— No scroll —", checked: !mods.dragonName,
              set: { dragonName: "", dragonStat: "", dragonPercent: 0, dragonRStat: 0 } },
            ...DRAGON_SCROLLS.map((scroll, index) => ({
              label: scroll,
              marked: mods.dragonName === scroll,
              children: dragonScrollLeaves(slot, index).map(leaf => ({
                ...leaf,
                checked: mods.dragonName === scroll && mods.dragonStat === leaf.set.dragonStat
                  && Number(mods.dragonPercent) === leaf.set.dragonPercent
              }))
            }))
          ]
        });
      }

      return branches;
    }

    function slotMenuHtml(entries, prefix = "") {
      return `<ul class="slot-menu-list" role="menu">${entries.map((entry, index) => {
        if (entry.separator) return `<li class="slot-menu-sep" role="separator"></li>`;
        // The full branch path, not depth+index: three different branches all
        // have a first child, and a shared key makes the wrong one apply.
        const path = prefix ? `${prefix}.${index}` : String(index);
        if (entry.children) {
          return `<li class="slot-menu-item has-children${entry.marked ? " marked" : ""}"
            role="menuitem" aria-haspopup="true" tabindex="0">
            <span>${escapeHtml(entry.label)}</span><span class="slot-menu-arrow">▸</span>
            ${slotMenuHtml(entry.children, path)}</li>`;
        }
        return `<li class="slot-menu-item${entry.checked ? " checked" : ""}${
          entry.disabled ? " disabled" : ""}" role="menuitemradio"
          aria-checked="${entry.checked ? "true" : "false"}"
          ${entry.disabled ? "" : `data-slot-choice="${escapeAttr(path)}" tabindex="0"`}>
          <span class="slot-menu-tick">${entry.checked ? "✓" : ""}</span>
          <span>${escapeHtml(entry.label)}</span></li>`;
      }).join("")}</ul>`;
    }

    /* The rendered menu is a tree of <li>; the click handler needs the entry
       object back. Flattening in the same order the markup is generated keeps
       the two in step without embedding data in attributes. */
    function flattenSlotMenu(entries, prefix = "", into = new Map()) {
      entries.forEach((entry, index) => {
        if (entry.separator) return;
        const path = prefix ? `${prefix}.${index}` : String(index);
        if (entry.children) flattenSlotMenu(entry.children, path, into);
        else into.set(path, entry);
      });
      return into;
    }

    function openSlotMenu(slot, event) {
      const build = currentBuild();
      const model = slotMenuModel(build, slot);
      state.activeEquipmentSlot = slot;
      state.slotMenuChoices = flattenSlotMenu(model);

      closeSlotMenu();
      const host = document.createElement("div");
      host.className = "slot-menu";
      host.setAttribute("role", "menu");
      host.setAttribute("aria-label", `Configure ${slot.replace(/^Other · /, "")}`);
      host.innerHTML = `<div class="slot-menu-head">${escapeHtml(
        slot.replace(/^Other · /, ""))}</div>${slotMenuHtml(model)}`;
      document.body.appendChild(host);
      state.slotMenu = host;

      const anchor = event?.currentTarget?.getBoundingClientRect?.()
        || { left: event?.clientX || 40, bottom: event?.clientY || 40, top: 0 };
      const width = host.offsetWidth || 260;
      const left = Math.max(8, Math.min(window.innerWidth - width - 8, anchor.left));
      host.style.left = `${left}px`;
      host.style.top = `${Math.min(window.innerHeight - 40, anchor.bottom + 4)}px`;
      // Submenus cascade right by default; near the right edge there is no
      // room, so the whole menu flips them to the left instead.
      if (left + width + 340 > window.innerWidth) host.classList.add("flip");
      hydrateIcons(host);

      host.querySelectorAll("[data-slot-choice]").forEach(node => {
        node.onclick = viewEvent => {
          viewEvent.stopPropagation();
          applySlotChoice(node.dataset.slotChoice);
        };
        node.onkeydown = keyEvent => {
          if (keyEvent.key === "Enter" || keyEvent.key === " ") {
            keyEvent.preventDefault();
            applySlotChoice(node.dataset.slotChoice);
          }
        };
      });
    }

    function closeSlotMenu() {
      if (state.slotMenu?.remove) state.slotMenu.remove();
      state.slotMenu = null;
    }

    function applySlotChoice(path) {
      const entry = state.slotMenuChoices?.get(path);
      const slot = state.activeEquipmentSlot;
      if (!entry || !slot) return;
      const build = currentBuild();
      build.items ||= {};
      build.prefixes ||= {};
      build.equipmentMods ||= {};
      build.equipmentMods[slot] ||= {};

      if (entry.item !== undefined) {
        if (entry.item) build.items[slot] = entry.item;
        else delete build.items[slot];
        const selected = state.indexes.equippableById.get(String(entry.item || ""));
        const allowed = new Set(prefixOptionsForSlot(slot, selected).map(prefix => prefix.id));
        if (!allowed.has(String(build.prefixes[slot] || ""))) delete build.prefixes[slot];
        if (slot === "Weapon" && selected?.rawSlot === "wand") delete build.equipmentMods[slot].physical;
        if (slot === "Weapon" && selected?.rawSlot !== "wand") delete build.equipmentMods[slot].magical;
      } else if (entry.prefix !== undefined) {
        if (entry.prefix) build.prefixes[slot] = entry.prefix;
        else delete build.prefixes[slot];
      } else if (entry.set) {
        Object.assign(build.equipmentMods[slot], entry.set);
      }

      saveBuild();
      closeSlotMenu();
      refreshSimResults({ refreshGear: true });
    }

    document.addEventListener("click", event => {
      if (state.slotMenu && !state.slotMenu.contains(event.target)
          && !event.target.closest?.("[data-equipment-slot]")) closeSlotMenu();
    });
    document.addEventListener("keydown", event => {
      if (event.key === "Escape") closeSlotMenu();
    });

    function openEquipmentDialog(slot) {
      state.activeEquipmentSlot = slot;
      el.equipmentTitle.textContent = `Configure ${slot.replace(/^Other · /, "")}`;
      el.equipmentBody.innerHTML = equipmentDialogHtml(currentBuild(), slot);
      el.equipmentDialog.showModal();
      hydrateIcons(el.equipmentBody);
      wireEquipmentDialog();
    }

    function wireEquipmentDialog() {
      el.equipmentBody.querySelectorAll("[data-equipment-item],[data-equipment-prefix],[data-equipment-mod]")
        .forEach(control => { control.onchange = onEquipmentChange; control.oninput = onEquipmentChange; });
    }

    function onEquipmentChange(event) {
      const control = event.currentTarget;
      const build = currentBuild();
      const slot = state.activeEquipmentSlot;
      build.items ||= {};
      build.prefixes ||= {};
      build.equipmentMods ||= {};
      build.equipmentMods[slot] ||= {};
      if (control.dataset.equipmentItem) {
        if (control.value) build.items[slot] = control.value;
        else delete build.items[slot];
        const selected = state.indexes.equippableById.get(String(control.value || ""));
        const allowedPrefixIds = new Set(prefixOptionsForSlot(slot, selected).map(prefix => prefix.id));
        if (!allowedPrefixIds.has(String(build.prefixes[slot] || ""))) delete build.prefixes[slot];
        if (slot === "Weapon" && selected?.rawSlot === "wand") delete build.equipmentMods[slot].physical;
        if (slot === "Weapon" && selected?.rawSlot !== "wand") delete build.equipmentMods[slot].magical;
      } else if (control.dataset.equipmentPrefix) {
        if (control.value) build.prefixes[slot] = control.value;
        else delete build.prefixes[slot];
      } else {
        const key = control.dataset.equipmentMod;
        const numeric = ["otp", "physical", "magical", "defense",
          "enhancementLevel", "elementLevel"].includes(key);
        build.equipmentMods[slot][key] = numeric ? (Number(control.value) || 0) : control.value;
      }
      saveBuild();
      refreshSimResults({ refreshGear: true });
      el.equipmentBody.innerHTML = equipmentDialogHtml(build, slot);
      hydrateIcons(el.equipmentBody);
      wireEquipmentDialog();
    }

    function classSkillScope(cls) {
      return ({ Magician: "mage", Knight: "knight", Archer: "archer",
        Thief: "thief", Shaman: "shaman" })[cls] || normalizeName(cls);
    }

    function legacyClassId(cls) {
      return ({ Archer: "1", Knight: "2", Magician: "3", Thief: "4" })[cls] || "";
    }

    function characterPositionOptions(build) {
      return (state.indexes.positionsByClass.get(legacyClassId(build.cls)) || [])
        .filter(position => !/^free /i.test(position.po_megn || "")
          && (Number(position.po_lvl) || 0) <= Number(build.level))
        .sort((left, right) => (Number(left.po_lvl) || 0) - (Number(right.po_lvl) || 0)
          || (Number(left.po_azon) || 0) - (Number(right.po_azon) || 0));
    }

    function normalizeCharacterPosition(build) {
      const options = characterPositionOptions(build);
      if (options.some(position => position.po_megn === build.position)) return;
      const highestLevel = Math.max(0, ...options.map(position => Number(position.po_lvl) || 0));
      const highest = options.filter(position => (Number(position.po_lvl) || 0) === highestLevel);
      // At branching levels, keep the last unambiguous predecessor instead of
      // choosing a path on the player's behalf.
      build.position = highest.length === 1 ? highest[0].po_megn
        : options.filter(position => (Number(position.po_lvl) || 0) < highestLevel).at(-1)?.po_megn || "";
    }

    function characterTabLink(tab, label, active) {
      return `<a class="${tab === active ? "active" : ""}" href="#/build?tab=${tab}">${label}</a>`;
    }

    function characterTabs(active) {
      return `<nav class="character-tabs" aria-label="Character Creation sections">
        ${characterTabLink("stats", "Stats & gear", active)}
        ${characterTabLink("skills", "Skills", active)}
        ${characterTabLink("quests", "Quests", active)}
      </nav>`;
    }

    function characterBanner(profile) {
      return `<div class="character-banner">
        <label class="field"><span>Active character</span>
          <input data-character-name value="${escapeAttr(profile.name)}" maxlength="60"></label>
        <div class="character-banner-actions">
          <button type="button" class="button small" data-action="new-character">New</button>
          <button type="button" class="button small" data-action="duplicate-character">Duplicate</button>
          <button type="button" class="button small" data-action="delete-character"${
            state.profiles.characters.length <= 1 ? " disabled" : ""}>Delete</button>
        </div>
      </div>`;
    }

    /* The Stats tab is the whole character in one screen: the sheet first,
       because that is the answer the player came for; then the inputs that
       change it; then what every monster does to it. The left column is
       deliberately narrow so the sheet reads as one block instead of a row of
       half-empty cards. */
    function renderCharacterStatsHtml(profile, build) {
      return `<div class="sim-workspace">
          <div class="sim-column">
            <div id="simSheetPanel">${simSheetPanelHtml(build)}</div>
            ${panel("Character", `
              <div class="field-grid sim-character-fields">
                <label class="field"><span>Class</span><select data-sim-field="cls">
                  ${state.combat.class_order.map(name => `<option value="${escapeAttr(name)}"${
                    build.cls === name ? " selected" : ""}>${escapeHtml(name)}</option>`).join("")}
                </select></label>
                <label class="field"><span>Job</span>
                  <select data-sim-field="position">${characterPositionOptions(build).map(position =>
                    `<option value="${escapeAttr(position.po_megn)}"${
                      position.po_megn === build.position ? " selected" : ""}>${
                      escapeHtml(position.po_megn)}</option>`
                  ).join("")}</select></label>
                <label class="field"><span>Level</span>
                  <input type="number" min="1" max="${state.combat.max_level || 120}"
                    data-sim-field="level" value="${escapeAttr(build.level)}"></label>
                ${PRIMARY_STATS.map(stat => `<label class="field"><span>${escapeHtml(stat)}</span>
                  <input type="number" min="0" data-sim-field="${escapeAttr(stat)}"
                    value="${escapeAttr(build[stat])}"></label>`).join("")}
              </div>`)}
            <div id="simGearHost">${panel("Inventory", simGearControls(build))}</div>
            <div id="simBuffPanel">${simBuffPanelHtml(profile)}</div>
            ${panel("Advanced", `<details><summary>Percentages and manual stat overrides</summary>
              <p class="dim" style="margin:10px 0"><small>Use these only for something you have
                measured in play — enhancement, set bonuses and pet percentages are not decoded,
                so enhanced gear otherwise reads low.</small></p>
              <div class="field-grid">
                <label class="field"><span>Quest %</span><input type="number" data-sim-field="questPercent" value="${escapeAttr(build.questPercent)}"></label>
                <label class="field"><span>Pet damage %</span><input type="number" data-sim-field="petDamage" value="${escapeAttr(build.petDamage)}"></label>
                <label class="field"><span>Pet defence %</span><input type="number" data-sim-field="petDefense" value="${escapeAttr(build.petDefense)}"></label>
                <label class="field"><span>Pet evasion %</span><input type="number" data-sim-field="petEvasion" value="${escapeAttr(build.petEvasion)}"></label>
                <label class="field"><span>HP ×2</span><input type="checkbox" data-sim-field="doubleHp"${build.doubleHp ? " checked" : ""}></label>
              </div>
              <div style="margin-top:12px">${simManualControls(build)}</div>
            </details>`)}
          </div>
          <div class="sim-column sim-threat-column" id="simThreatPanel">
            ${simThreatPanelHtml(build)}
          </div>
        </div>
        <div id="simSupplemental">${simSupplementalHtml(build)}</div>`;
    }

    function parseSkillSchedule(schedule) {
      if (!schedule) return { bands: [], increments: [], max: 0 };
      const bands = parseJson(schedule.client_level_bands_json, []).map(Number);
      const increments = parseJson(schedule.client_incremental_grade_counts_json, []).map(Number);
      return { bands, increments, max: Number(schedule.client_max_grade) || 0 };
    }

    function availableSkillGrade(schedule, level) {
      const parsed = parseSkillSchedule(schedule);
      if (!parsed.bands.length || !parsed.increments.length) return 0;
      return Math.min(parsed.max, parsed.bands.reduce((total, band, index) =>
        total + (band <= Number(level) ? (parsed.increments[index] || 0) : 0), 0));
    }

    function skillUnlockLevel(schedule) {
      return parseSkillSchedule(schedule).bands[0] || Infinity;
    }

    function positionAllowsSkill(schedule, build) {
      if (!schedule?.legacy_position) return true;
      const position = state.indexes.positionsByName.get(normalizeName(build.position));
      if (!position) return false;
      const allowed = new Set([
        String(position.po_azon),
        ...String(position.po_skills || "").split(",").map(value => value.trim()).filter(Boolean)
      ]);
      return allowed.has(String(schedule.legacy_position));
    }

    function characterSkillRows(build) {
      const scope = classSkillScope(build.cls);
      return (state.indexes.playerSkillsByScope.get(scope) || [])
        .map(row => ({ row, schedule: state.indexes.skillSchedules.get(skillId(row)) }))
        .filter(entry => entry.schedule && skillUnlockLevel(entry.schedule) <= Number(build.level)
          && positionAllowsSkill(entry.schedule, build))
        .sort((left, right) =>
          skillUnlockLevel(left.schedule) - skillUnlockLevel(right.schedule)
          || Number(left.row.sk_order || 0) - Number(right.row.sk_order || 0)
          || String(left.row.sk_megn || "").localeCompare(String(right.row.sk_megn || "")));
    }

    function skillMinimumGrade(row) {
      // KalOnline_Knowledge_Base_v2.md, Skills System: Lightning Magic's
      // grade 1 is the free floor and cannot be unlearned.
      return normalizeName(row?.sk_megn) === "lightningmagic" ? 1 : 0;
    }

    function characterQuestTotals(profile) {
      let skillPoints = 0;
      let contribution = 0;
      for (const quest of state.tables.quests) {
        if (profile.quests?.[String(quest.que_id)] !== "finished") continue;
        skillPoints += Number(quest.bango_skill_points) || 0;
        contribution += Number(quest.bango_contribution) || 0;
      }
      return { skillPoints, contribution };
    }

    function characterSkillLedger(profile, build) {
      const levelPoints = Math.max(0, Number(build.level) - 1);
      const quest = characterQuestTotals(profile);
      const currentRows = (state.indexes.playerSkillsByScope.get(classSkillScope(build.cls)) || [])
        .filter(row => positionAllowsSkill(state.indexes.skillSchedules.get(skillId(row)), build));
      const scopeKeys = new Set(currentRows
        .map(row => String(row.bango_key)));
      const rowsByKey = new Map(currentRows
        .map(row => [String(row.bango_key), row]));
      const spent = Object.entries(profile.skills || {}).reduce((sum, [key, grade]) =>
        sum + (scopeKeys.has(key)
          ? Math.max(0, (Number(grade) || 0) - skillMinimumGrade(rowsByKey.get(key))) : 0), 0);
      const total = levelPoints + quest.skillPoints;
      return { levelPoints, questPoints: quest.skillPoints, contribution: quest.contribution,
        spent, total, available: total - spent };
    }

    function normalizeSkillAllocations(profile, build) {
      const scope = classSkillScope(build.cls);
      const rows = (state.indexes.playerSkillsByScope.get(scope) || [])
        .filter(row => positionAllowsSkill(state.indexes.skillSchedules.get(skillId(row)), build));
      const allowed = new Set(rows.map(row => String(row.bango_key)));
      Object.keys(profile.skills || {}).forEach(key => {
        if (!allowed.has(key)) delete profile.skills[key];
      });
      rows.forEach(row => {
        const key = String(row.bango_key);
        const schedule = state.indexes.skillSchedules.get(skillId(row));
        const max = availableSkillGrade(schedule, build.level);
        const minimum = max > 0 ? skillMinimumGrade(row) : 0;
        if ((Number(profile.skills[key]) || 0) < minimum) profile.skills[key] = minimum;
        if ((Number(profile.skills[key]) || 0) > max) profile.skills[key] = max;
        if ((Number(profile.skills[key]) || 0) <= 0) delete profile.skills[key];
      });
      rows.forEach(row => resetInvalidDependents(profile, String(row.bango_key)));
    }

    function skillPrerequisiteState(profile, row) {
      const edges = state.indexes.skillPrerequisites.get(String(row.bango_key)) || [];
      const missing = edges.filter(edge =>
        (Number(profile.skills?.[edge.prerequisite_skill_key]) || 0)
          < (Number(edge.required_grade) || 0));
      return { edges, missing };
    }

    function evaluateRpn(expression, grade, build) {
      const stack = [];
      const values = {
        skill_level: Number(grade) || 0,
        char_level: Number(build.level) || 1,
        char_str: Number(build.Strength) || 0,
        char_dex: Number(build.Agility) || 0,
        char_int: Number(build.Intelligence) || 0,
        char_wis: Number(build.Wisdom) || 0
      };
      for (const token of String(expression || "").trim().split(/\s+/).filter(Boolean)) {
        if (/^-?\d+(?:\.\d+)?$/.test(token)) stack.push(Number(token));
        else if (Object.prototype.hasOwnProperty.call(values, token)) stack.push(values[token]);
        else if (["+", "-", "*", "/"].includes(token)) {
          if (stack.length < 2) return null;
          const right = stack.pop();
          const left = stack.pop();
          stack.push(token === "+" ? left + right : token === "-" ? left - right
            : token === "*" ? left * right : right ? left / right : 0);
        } else return null;
      }
      return stack.length === 1 && Number.isFinite(stack[0]) ? Math.trunc(stack[0]) : null;
    }

    function skillFormulaLine(label, json, grade, build, unit = "") {
      const formulas = parseJson(json, []);
      if (!formulas.length) return "";
      const value = evaluateRpn(formulas[0], grade, build);
      return `<div><small>${escapeHtml(label)}: ${
        value == null ? `<span class="mono">${escapeHtml(formulas[0])}</span>`
          : `<strong>${prettyNumber(value)}${escapeHtml(unit)}</strong>`}</small></div>`;
    }

    function skillTooltipHtml(row, schedule, grade, build) {
      const available = availableSkillGrade(schedule, build.level);
      const prereq = skillPrerequisiteState(activeProfile(), row);
      const next = Math.min(available, grade + 1);
      return `<strong>${escapeHtml(row.sk_megn || row.bango_key)}</strong>
        <small>${escapeHtml(cleanText(row.sk_desc) || "No description in the Bango record.")}</small>
        <div class="tip-grade">[ Current Grade ${grade} / available ${available} ]</div>
        ${skillFormulaLine("Mana / energy", row.bango_mana_rpn_json, grade, build)}
        ${skillFormulaLine("Cast time", row.bango_cast_ms_rpn_json, grade, build, " ms")}
        ${skillFormulaLine("Cooldown", row.bango_cooldown_ms_rpn_json, grade, build, " ms")}
        ${grade < available ? `<div class="tip-next"><span class="tip-grade">[ Next Grade ${next} ]</span>
          ${skillFormulaLine("Mana / energy", row.bango_mana_rpn_json, next, build)}
          ${skillFormulaLine("Cast time", row.bango_cast_ms_rpn_json, next, build, " ms")}
          ${skillFormulaLine("Cooldown", row.bango_cooldown_ms_rpn_json, next, build, " ms")}</div>` : ""}
        ${prereq.edges.length ? `<div class="tip-next"><small>Requires ${
          prereq.edges.map(edge => `${escapeHtml(edge.prerequisite_skill_name)} G${escapeHtml(edge.required_grade)}`).join(", ")
        }</small></div>` : ""}
        <div class="tip-next"><small>Unlock level ${skillUnlockLevel(schedule)} · ${
          escapeHtml(schedule.verification_status || schedule.schedule_state)}</small></div>`;
    }

    function renderCharacterSkillsHtml(profile, build) {
      const ledger = characterSkillLedger(profile, build);
      const rows = characterSkillRows(build);
      return `${section("Skill points", `
        <div class="point-ledger">
          <div><span>Available</span><strong>${prettyNumber(ledger.available)}</strong></div>
          <div><span>Spent</span><strong>${prettyNumber(ledger.spent)}</strong></div>
          <div><span>From levels</span><strong>${prettyNumber(ledger.levelPoints)}</strong></div>
          <div><span>From quests</span><strong>${prettyNumber(ledger.questPoints)}</strong></div>
        </div>
