          : amountBranch("Phys. attack", "physical", mods, 18));
        branches.push(amountBranch("EB Lvl", "enhancementLevel", mods, 18, value => `+${value}`));
        branches.push({
          label: "Elemental stones",
          children: [
            { label: "— No stone —", checked: !mods.stone, set: { stone: "", stoneLevel: 0 } },
            ...ELEMENTAL_STONE_LEVELS.map(level => {
              // Level 3 is the two rare stones only; 1 and 2 are the standard set.
              const stones = elementalStones().filter(row => level === 3
                ? Number(row.ita_azon) >= 432 : Number(row.ita_azon) < 432);
              return {
                label: `Lvl ${level}`,
                marked: Number(mods.stoneLevel || 0) === level,
                children: stones.map(row => ({
                  label: `${row.ita_name} Lv${level}`,
                  checked: mods.stone === row.ita_name && Number(mods.stoneLevel) === level,
                  set: { stone: row.ita_name, stoneLevel: level }
                }))
              };
            })
          ]
        });
      } else if (isArmor) {
        branches.push(amountBranch("Defense", "defense", mods, 10));
        if (slot !== "Other · Shield") {
          branches.push({
            label: "Equip",
            children: [
              { label: "— Nothing —", checked: !mods.equip, set: { equip: "" } },
              {
                label: "Bead of Fire",
                checked: mods.equip === "Bead of Fire",
                // The original enables this only from G46 up.
                disabled: (gradeNumber(item?.grade) ?? 0) < 46,
                set: { equip: "Bead of Fire" }
              }
            ]
          });
        }
      }

      if (isWeapon || isArmor) {
        branches.push({
          label: "DragonScroll",
          children: [
            { label: "— No scroll —", checked: !mods.dragonName,
              set: { dragonName: "", dragonStat: "", dragonPercent: 0, dragonRStat: 0 } },
            ...DRAGON_SCROLLS.map((scroll, index) => ({
              label: scroll,
              marked: mods.dragonName === scroll,
              children: dragonScrollLeaves(slot, index).map(leaf => ({
                ...leaf,
                checked: mods.dragonName === scroll && mods.dragonStat === leaf.set.dragonStat
                  && Number(mods.dragonPercent) === leaf.set.dragonPercent
              }))
            }))
          ]
        });
      }

      return branches;
    }

    function slotMenuHtml(entries, prefix = "") {
      return `<ul class="slot-menu-list" role="menu">${entries.map((entry, index) => {
        if (entry.separator) return `<li class="slot-menu-sep" role="separator"></li>`;
        // The full branch path, not depth+index: three different branches all
        // have a first child, and a shared key makes the wrong one apply.
        const path = prefix ? `${prefix}.${index}` : String(index);
        if (entry.children) {
          return `<li class="slot-menu-item has-children${entry.marked ? " marked" : ""}"
            role="menuitem" aria-haspopup="true" tabindex="0">
            <span>${escapeHtml(entry.label)}</span><span class="slot-menu-arrow">▸</span>
            ${slotMenuHtml(entry.children, path)}</li>`;
        }
        return `<li class="slot-menu-item${entry.checked ? " checked" : ""}${
          entry.disabled ? " disabled" : ""}" role="menuitemradio"
          aria-checked="${entry.checked ? "true" : "false"}"
          ${entry.disabled ? "" : `data-slot-choice="${escapeAttr(path)}" tabindex="0"`}>
          <span class="slot-menu-tick">${entry.checked ? "✓" : ""}</span>
          <span>${escapeHtml(entry.label)}</span></li>`;
      }).join("")}</ul>`;
    }

    /* The rendered menu is a tree of <li>; the click handler needs the entry
       object back. Flattening in the same order the markup is generated keeps
       the two in step without embedding data in attributes. */
    function flattenSlotMenu(entries, prefix = "", into = new Map()) {
      entries.forEach((entry, index) => {
        if (entry.separator) return;
        const path = prefix ? `${prefix}.${index}` : String(index);
        if (entry.children) flattenSlotMenu(entry.children, path, into);
        else into.set(path, entry);
      });
      return into;
    }

    function openSlotMenu(slot, event) {
      const build = currentBuild();
      const model = slotMenuModel(build, slot);
      state.activeEquipmentSlot = slot;
      state.slotMenuChoices = flattenSlotMenu(model);

      closeSlotMenu();
      const host = document.createElement("div");
      host.className = "slot-menu";
      host.setAttribute("role", "menu");
      host.setAttribute("aria-label", `Configure ${slot.replace(/^Other · /, "")}`);
      host.innerHTML = `<div class="slot-menu-head">${escapeHtml(
        slot.replace(/^Other · /, ""))}</div>${slotMenuHtml(model)}`;
      document.body.appendChild(host);
      state.slotMenu = host;

      const anchor = event?.currentTarget?.getBoundingClientRect?.()
        || { left: event?.clientX || 40, bottom: event?.clientY || 40, top: 0 };
      const width = host.offsetWidth || 260;
      const height = host.offsetHeight || 240;
      const left = Math.max(8, Math.min(window.innerWidth - width - 8, anchor.left));
      host.style.left = `${left}px`;
      host.style.top = `${Math.max(8,
        Math.min(anchor.bottom + 4, window.innerHeight - height - 8))}px`;
      hydrateIcons(host);
      wireSlotSubmenus(host);

      host.querySelectorAll("[data-slot-choice]").forEach(node => {
        node.onclick = viewEvent => {
          viewEvent.stopPropagation();
          applySlotChoice(node.dataset.slotChoice);
        };
        node.onkeydown = keyEvent => {
          if (keyEvent.key === "Enter" || keyEvent.key === " ") {
            keyEvent.preventDefault();
            applySlotChoice(node.dataset.slotChoice);
          }
        };
      });
    }

    /* Each cascade level is opened by hand rather than by :hover, because the
       submenus are position:fixed and CSS cannot compute where they go. Moving
       the pointer from a branch into its own submenu does not fire mouseleave,
       since the submenu is still a DOM child of that branch. */
    function wireSlotSubmenus(host) {
      if (typeof host.querySelectorAll !== "function") return;
      host.querySelectorAll(".slot-menu-item.has-children").forEach(branch => {
        branch.onmouseenter = () => openSubmenu(branch);
        branch.onfocusin = () => openSubmenu(branch);
        branch.onmouseleave = () => closeSubmenu(branch);
      });
    }

    function closeSubmenu(branch) {
      if (!branch.classList) return;
      branch.classList.remove("open");
      branch.querySelectorAll?.(".slot-menu-item.has-children.open")
        .forEach(child => child.classList.remove("open"));
    }

    function openSubmenu(branch) {
      const list = branch.querySelector?.(":scope > .slot-menu-list");
      if (!list || !branch.classList) return;
      // Only one branch per level stays open, or two cascades overlap.
      branch.parentElement?.querySelectorAll(":scope > .slot-menu-item.open")
        .forEach(sibling => { if (sibling !== branch) closeSubmenu(sibling); });
      branch.classList.add("open");

      const anchor = branch.getBoundingClientRect();
      const width = list.offsetWidth || 220;
      const height = list.offsetHeight || 200;
      // Cascade right; flip to the left only when the right side has no room.
      let left = anchor.right - 2;
      if (left + width > window.innerWidth - 8) left = anchor.left - width + 2;
      list.style.left = `${Math.max(8, Math.min(left, window.innerWidth - width - 8))}px`;
      list.style.top = `${Math.max(8,
        Math.min(anchor.top - 5, window.innerHeight - height - 8))}px`;
    }

    function closeSlotMenu() {
      if (state.slotMenu?.remove) state.slotMenu.remove();
      state.slotMenu = null;
    }

    function applySlotChoice(path) {
      const entry = state.slotMenuChoices?.get(path);
      const slot = state.activeEquipmentSlot;
      if (!entry || !slot) return;
      const build = currentBuild();
      build.items ||= {};
      build.prefixes ||= {};
      build.equipmentMods ||= {};
      build.equipmentMods[slot] ||= {};

      if (entry.item !== undefined) {
        if (entry.item) build.items[slot] = entry.item;
        else delete build.items[slot];
        const selected = state.indexes.equippableById.get(String(entry.item || ""));
        const allowed = new Set(prefixOptionsForSlot(slot, selected).map(prefix => prefix.id));
        if (!allowed.has(String(build.prefixes[slot] || ""))) delete build.prefixes[slot];
        if (slot === "Weapon" && selected?.rawSlot === "wand") delete build.equipmentMods[slot].physical;
        if (slot === "Weapon" && selected?.rawSlot !== "wand") delete build.equipmentMods[slot].magical;
      } else if (entry.prefix !== undefined) {
        if (entry.prefix) build.prefixes[slot] = entry.prefix;
        else delete build.prefixes[slot];
      } else if (entry.set) {
        Object.assign(build.equipmentMods[slot], entry.set);
      }

      saveBuild();
      closeSlotMenu();
      refreshSimResults({ refreshGear: true });
    }

    document.addEventListener("click", event => {
      if (state.slotMenu && !state.slotMenu.contains(event.target)
          && !event.target.closest?.("[data-equipment-slot]")) closeSlotMenu();
    });
    document.addEventListener("keydown", event => {
      if (event.key !== "Escape") return;
      closeSlotMenu();
      document.querySelectorAll(".zoom-frame.zoomed")
        .forEach(frame => frame.classList.remove("zoomed"));
    });

    function openEquipmentDialog(slot) {
      state.activeEquipmentSlot = slot;
      el.equipmentTitle.textContent = `Configure ${slot.replace(/^Other · /, "")}`;
      el.equipmentBody.innerHTML = equipmentDialogHtml(currentBuild(), slot);
      el.equipmentDialog.showModal();
      hydrateIcons(el.equipmentBody);
      wireEquipmentDialog();
    }

    function wireEquipmentDialog() {
      el.equipmentBody.querySelectorAll("[data-equipment-item],[data-equipment-prefix],[data-equipment-mod]")
        .forEach(control => { control.onchange = onEquipmentChange; control.oninput = onEquipmentChange; });
    }

    function onEquipmentChange(event) {
      const control = event.currentTarget;
      const build = currentBuild();
      const slot = state.activeEquipmentSlot;
      build.items ||= {};
      build.prefixes ||= {};
      build.equipmentMods ||= {};
      build.equipmentMods[slot] ||= {};
      if (control.dataset.equipmentItem) {
        if (control.value) build.items[slot] = control.value;
        else delete build.items[slot];
        const selected = state.indexes.equippableById.get(String(control.value || ""));
        const allowedPrefixIds = new Set(prefixOptionsForSlot(slot, selected).map(prefix => prefix.id));
        if (!allowedPrefixIds.has(String(build.prefixes[slot] || ""))) delete build.prefixes[slot];
        if (slot === "Weapon" && selected?.rawSlot === "wand") delete build.equipmentMods[slot].physical;
        if (slot === "Weapon" && selected?.rawSlot !== "wand") delete build.equipmentMods[slot].magical;
      } else if (control.dataset.equipmentPrefix) {
        if (control.value) build.prefixes[slot] = control.value;
        else delete build.prefixes[slot];
      } else {
        const key = control.dataset.equipmentMod;
        const numeric = ["otp", "physical", "magical", "defense",
          "enhancementLevel", "elementLevel", "animalGrade"].includes(key);
        build.equipmentMods[slot][key] = numeric ? (Number(control.value) || 0) : control.value;
      }
      saveBuild();
      refreshSimResults({ refreshGear: true });
      el.equipmentBody.innerHTML = equipmentDialogHtml(build, slot);
      hydrateIcons(el.equipmentBody);
      wireEquipmentDialog();
    }

    function classSkillScope(cls) {
      return ({ Magician: "mage", Knight: "knight", Archer: "archer",
        Thief: "thief", Shaman: "shaman" })[cls] || normalizeName(cls);
    }

    function legacyClassId(cls) {
      return ({ Archer: "1", Knight: "2", Magician: "3", Thief: "4" })[cls] || "";
    }

    function characterPositionOptions(build) {
      return (state.indexes.positionsByClass.get(legacyClassId(build.cls)) || [])
        .filter(position => !/^free /i.test(position.po_megn || "")
          && (Number(position.po_lvl) || 0) <= Number(build.level))
        .sort((left, right) => (Number(left.po_lvl) || 0) - (Number(right.po_lvl) || 0)
          || (Number(left.po_azon) || 0) - (Number(right.po_azon) || 0));
    }

    function normalizeCharacterPosition(build) {
      const options = characterPositionOptions(build);
      if (options.some(position => position.po_megn === build.position)) return;
      const highestLevel = Math.max(0, ...options.map(position => Number(position.po_lvl) || 0));
      const highest = options.filter(position => (Number(position.po_lvl) || 0) === highestLevel);
      // At branching levels, keep the last unambiguous predecessor instead of
      // choosing a path on the player's behalf.
      build.position = highest.length === 1 ? highest[0].po_megn
        : options.filter(position => (Number(position.po_lvl) || 0) < highestLevel).at(-1)?.po_megn || "";
    }

    function characterTabLink(tab, label, active) {
      return `<a class="${tab === active ? "active" : ""}" href="#/build?tab=${tab}">${label}</a>`;
    }

    function characterTabs(active) {
      return `<nav class="character-tabs" aria-label="Character Creation sections">
        ${characterTabLink("stats", "Stats & gear", active)}
        ${characterTabLink("skills", "Skills", active)}
        ${characterTabLink("quests", "Quests", active)}
      </nav>`;
    }

    function characterBanner(profile) {
      return `<div class="character-banner">
        <label class="field"><span>Active character</span>
          <input data-character-name value="${escapeAttr(profile.name)}" maxlength="60"></label>
        <div class="character-banner-actions">
          <button type="button" class="button small" data-action="new-character">New</button>
          <button type="button" class="button small" data-action="duplicate-character">Duplicate</button>
          <button type="button" class="button small" data-action="delete-character"${
            state.profiles.characters.length <= 1 ? " disabled" : ""}>Delete</button>
        </div>
      </div>`;
    }

    /* The Stats tab is the whole character in one screen: the sheet first,
       because that is the answer the player came for; then the inputs that
       change it; then what every monster does to it. The left column is
       deliberately narrow so the sheet reads as one block instead of a row of
       half-empty cards. */
    function renderCharacterStatsHtml(profile, build) {
      return `<div class="sim-workspace${state.threatOpen ? "" : " threats-collapsed"}">
          <div class="sim-column">
            <div id="simSheetPanel">${simSheetPanelHtml(build)}</div>
            ${panel("Character", `
              <div class="field-grid sim-character-fields">
                <label class="field"><span>Class</span><select data-sim-field="cls">
                  ${state.combat.class_order.map(name => `<option value="${escapeAttr(name)}"${
                    build.cls === name ? " selected" : ""}>${escapeHtml(name)}</option>`).join("")}
                </select></label>
                <label class="field"><span>Job</span>
                  <select data-sim-field="position">${characterPositionOptions(build).map(position =>
                    `<option value="${escapeAttr(position.po_megn)}"${
                      position.po_megn === build.position ? " selected" : ""}>${
                      escapeHtml(position.po_megn)}</option>`
                  ).join("")}</select></label>
                <label class="field"><span>Level</span>
                  <input type="number" min="1" max="${state.combat.max_level || 120}"
                    data-sim-field="level" value="${escapeAttr(build.level)}"></label>
                ${PRIMARY_STATS.map(stat => `<label class="field"><span>${escapeHtml(stat)}</span>
                  <input type="number" min="0" data-sim-field="${escapeAttr(stat)}"
                    value="${escapeAttr(build[stat])}"></label>`).join("")}
              </div>`)}
            <div id="simStatPoints">${panel("Stat points", statLedgerHtml(build))}</div>
            <div id="simGearHost">${panel("Inventory", simGearControls(build))}</div>
            <div id="simBuffPanel">${simBuffPanelHtml(profile)}</div>
            ${panel("Advanced", `<details><summary>Percentages and manual stat overrides</summary>
              <p class="dim" style="margin:10px 0"><small>Use these only for something you have
                measured in play — enhancement, set bonuses and pet percentages are not decoded,
                so enhanced gear otherwise reads low.</small></p>
              <div class="field-grid">
                <label class="field"><span>Quest %</span><input type="number" data-sim-field="questPercent" value="${escapeAttr(build.questPercent)}"></label>
                <label class="field"><span>Pet damage %</span><input type="number" data-sim-field="petDamage" value="${escapeAttr(build.petDamage)}"></label>
                <label class="field"><span>Pet defence %</span><input type="number" data-sim-field="petDefense" value="${escapeAttr(build.petDefense)}"></label>
                <label class="field"><span>Pet evasion %</span><input type="number" data-sim-field="petEvasion" value="${escapeAttr(build.petEvasion)}"></label>
                <label class="field"><span>HP ×2</span><input type="checkbox" data-sim-field="doubleHp"${build.doubleHp ? " checked" : ""}></label>
              </div>
              <div style="margin-top:12px">${simManualControls(build)}</div>
            </details>`)}
          </div>
          <div class="sim-column sim-threat-column" id="simThreatPanel">
            ${simThreatPanelHtml(build)}
          </div>
        </div>
        <div id="simSupplemental">${simSupplementalHtml(build)}</div>`;
    }

    function parseSkillSchedule(schedule) {
      if (!schedule) return { bands: [], increments: [], max: 0 };
      const bands = parseJson(schedule.client_level_bands_json, []).map(Number);
      const increments = parseJson(schedule.client_incremental_grade_counts_json, []).map(Number);
      return { bands, increments, max: Number(schedule.client_max_grade) || 0 };
    }

    function availableSkillGrade(schedule, level) {
      const parsed = parseSkillSchedule(schedule);
      if (!parsed.bands.length || !parsed.increments.length) return 0;
      return Math.min(parsed.max, parsed.bands.reduce((total, band, index) =>
        total + (band <= Number(level) ? (parsed.increments[index] || 0) : 0), 0));
    }

    function skillUnlockLevel(schedule) {
      return parseSkillSchedule(schedule).bands[0] || Infinity;
    }

    function positionAllowsSkill(schedule, build) {
      const position = state.indexes.positionsByName.get(normalizeName(build.position));
      // An unrecognised job passes only skills that carry no gate at all —
      // the same behaviour as before, extended to the branch mask.
      if (!position) return branchGateAllows(schedule, new Set(), "");
      const allowed = new Set([
        String(position.po_azon),
        ...String(position.po_skills || "").split(",").map(value => value.trim()).filter(Boolean)
      ]);
      return branchGateAllows(schedule, allowed, position.po_class);
    }

    function characterSkillRows(build) {
      const scope = classSkillScope(build.cls);
      return (state.indexes.playerSkillsByScope.get(scope) || [])
        .map(row => ({ row, schedule: state.indexes.skillSchedules.get(skillId(row)) }))
        .filter(entry => entry.schedule && skillUnlockLevel(entry.schedule) <= Number(build.level)
          && positionAllowsSkill(entry.schedule, build))
        .sort((left, right) =>
          skillUnlockLevel(left.schedule) - skillUnlockLevel(right.schedule)
          || Number(left.row.sk_order || 0) - Number(right.row.sk_order || 0)
          || String(left.row.sk_megn || "").localeCompare(String(right.row.sk_megn || "")));
    }

    function skillMinimumGrade(row) {
      // KalOnline_Knowledge_Base_v2.md, Skills System: Lightning Magic's
      // grade 1 is the free floor and cannot be unlearned.
      return normalizeName(row?.sk_megn) === "lightningmagic" ? 1 : 0;
    }

    function characterQuestTotals(profile) {
      let skillPoints = 0;
      let contribution = 0;
      for (const quest of state.tables.quests) {
        if (profile.quests?.[String(quest.que_id)] !== "finished") continue;
        skillPoints += Number(quest.bango_skill_points) || 0;
        contribution += Number(quest.bango_contribution) || 0;
      }
      return { skillPoints, contribution };
    }

    function characterSkillLedger(profile, build) {
      const levelPoints = Math.max(0, Number(build.level) - 1);
      const quest = characterQuestTotals(profile);
      const currentRows = (state.indexes.playerSkillsByScope.get(classSkillScope(build.cls)) || [])
        .filter(row => positionAllowsSkill(state.indexes.skillSchedules.get(skillId(row)), build));
      const scopeKeys = new Set(currentRows
        .map(row => String(row.bango_key)));
      const rowsByKey = new Map(currentRows
        .map(row => [String(row.bango_key), row]));
      const spent = Object.entries(profile.skills || {}).reduce((sum, [key, grade]) =>
        sum + (scopeKeys.has(key)
          ? Math.max(0, (Number(grade) || 0) - skillMinimumGrade(rowsByKey.get(key))) : 0), 0);
      const total = levelPoints + quest.skillPoints;
      return { levelPoints, questPoints: quest.skillPoints, contribution: quest.contribution,
        spent, total, available: total - spent };
    }

    function normalizeSkillAllocations(profile, build) {
      const scope = classSkillScope(build.cls);
      const rows = (state.indexes.playerSkillsByScope.get(scope) || [])
        .filter(row => positionAllowsSkill(state.indexes.skillSchedules.get(skillId(row)), build));
      const allowed = new Set(rows.map(row => String(row.bango_key)));
      Object.keys(profile.skills || {}).forEach(key => {
        if (!allowed.has(key)) delete profile.skills[key];
      });
      rows.forEach(row => {
        const key = String(row.bango_key);
        const schedule = state.indexes.skillSchedules.get(skillId(row));
        const max = availableSkillGrade(schedule, build.level);
        const minimum = max > 0 ? skillMinimumGrade(row) : 0;
        if ((Number(profile.skills[key]) || 0) < minimum) profile.skills[key] = minimum;
        if ((Number(profile.skills[key]) || 0) > max) profile.skills[key] = max;
        if ((Number(profile.skills[key]) || 0) <= 0) delete profile.skills[key];
      });
      rows.forEach(row => resetInvalidDependents(profile, String(row.bango_key)));
    }

    function skillPrerequisiteState(profile, row) {
      const edges = state.indexes.skillPrerequisites.get(String(row.bango_key)) || [];
      const missing = edges.filter(edge =>
        (Number(profile.skills?.[edge.prerequisite_skill_key]) || 0)
          < (Number(edge.required_grade) || 0));
      return { edges, missing };
    }

    function evaluateRpn(expression, grade, build) {
      const stack = [];
      const values = {
        skill_level: Number(grade) || 0,
        char_level: Number(build.level) || 1,
        char_str: Number(build.Strength) || 0,
        char_dex: Number(build.Agility) || 0,
        char_int: Number(build.Intelligence) || 0,
        char_wis: Number(build.Wisdom) || 0
      };
      for (const token of String(expression || "").trim().split(/\s+/).filter(Boolean)) {
        if (/^-?\d+(?:\.\d+)?$/.test(token)) stack.push(Number(token));
        else if (Object.prototype.hasOwnProperty.call(values, token)) stack.push(values[token]);
        else if (["+", "-", "*", "/", "divint"].includes(token)) {
          if (stack.length < 2) return null;
          const right = stack.pop();
          const left = stack.pop();
          // `divint` appears in Weapon Mastery and is the client's own integer
          // division; `/` stays exact and is truncated once at the end.
          stack.push(token === "+" ? left + right : token === "-" ? left - right
            : token === "*" ? left * right
            : token === "divint" ? (right ? Math.trunc(left / right) : 0)
            : right ? left / right : 0);
        } else return null;
      }
      return stack.length === 1 && Number.isFinite(stack[0]) ? Math.trunc(stack[0]) : null;
    }

    function skillFormulaLine(label, json, grade, build, unit = "") {
      const formulas = parseJson(json, []);
      if (!formulas.length) return "";
      const value = evaluateRpn(formulas[0], grade, build);
      return `<div><small>${escapeHtml(label)}: ${
        value == null ? `<span class="mono">${escapeHtml(formulas[0])}</span>`
          : `<strong>${prettyNumber(value)}${escapeHtml(unit)}</strong>`}</small></div>`;
    }

    function skillTooltipHtml(row, schedule, grade, build) {
      const available = availableSkillGrade(schedule, build.level);
      const prereq = skillPrerequisiteState(activeProfile(), row);
      const next = Math.min(available, grade + 1);
      return `<strong>${escapeHtml(row.sk_megn || row.bango_key)}</strong>
        <small>${escapeHtml(cleanText(row.sk_desc) || "No description in the Bango record.")}</small>
        <div class="tip-grade">[ Current Grade ${grade} / available ${available} ]</div>
        ${skillFormulaLine("Mana / energy", row.bango_mana_rpn_json, grade, build)}
        ${skillFormulaLine("Cast time", row.bango_cast_ms_rpn_json, grade, build, " ms")}
        ${skillFormulaLine("Cooldown", row.bango_cooldown_ms_rpn_json, grade, build, " ms")}
        ${grade < available ? `<div class="tip-next"><span class="tip-grade">[ Next Grade ${next} ]</span>
          ${skillFormulaLine("Mana / energy", row.bango_mana_rpn_json, next, build)}
          ${skillFormulaLine("Cast time", row.bango_cast_ms_rpn_json, next, build, " ms")}
          ${skillFormulaLine("Cooldown", row.bango_cooldown_ms_rpn_json, next, build, " ms")}</div>` : ""}
        ${prereq.edges.length ? `<div class="tip-next"><small>Requires ${
          prereq.edges.map(edge => `${escapeHtml(edge.prerequisite_skill_name)} G${escapeHtml(edge.required_grade)}`).join(", ")
        }</small></div>` : ""}
        <div class="tip-next"><small>Unlock level ${skillUnlockLevel(schedule)} · ${
          escapeHtml(schedule.verification_status || schedule.schedule_state)}</small></div>`;
    }

    function renderCharacterSkillsHtml(profile, build) {
      const ledger = characterSkillLedger(profile, build);
      const rows = characterSkillRows(build);
      return `${section("Skill points", `
        <div class="point-ledger">
          <div><span>Available</span><strong>${prettyNumber(ledger.available)}</strong></div>
          <div><span>Spent</span><strong>${prettyNumber(ledger.spent)}</strong></div>
          <div><span>From levels</span><strong>${prettyNumber(ledger.levelPoints)}</strong></div>
          <div><span>From quests</span><strong>${prettyNumber(ledger.questPoints)}</strong></div>
        </div>
        <p class="dim"><small>One level point is granted at each level from 2 onward. Finished Bango
          quests supply the quest total. The omitted/free post-60 bands remain unverified for Bango
          and are not granted silently.</small></p>`)}
        ${(() => {
          const position = positionByName(build.position);
          const model = skillTreeModel(classSkillScope(build.cls), { position });
          // Counted over the tree, not over characterSkillRows: the tree also
          // carries the one job step ahead, which that helper deliberately omits.
          const reached = model.nodes.filter(node =>
            !Number.isFinite(node.level) || node.level <= Number(build.level)).length;
          const raisable = model.nodes.filter(node =>
            skillPrerequisiteState(profile, node.row).missing.length === 0
            && positionAllowsSkill(node.schedule, build)
            && (!Number.isFinite(node.level) || node.level <= Number(build.level))).length;
          const ahead = position ? nextPositions(position) : [];
          return section(`${build.cls} skill tree${
              position ? ` — ${escapeHtml(position.po_megn)}` : ""}`,
            `${position ? `<p class="dim" style="margin:0 0 10px"><small>Only the skills
              ${escapeHtml(position.po_megn)} can take${ahead.length === 1
                ? `, including the ${escapeHtml(ahead[0].po_megn)} step ahead of it`
                : ""}. ${ahead.length > 1
                ? `Choosing between <strong>${ahead.map(entry =>
                    escapeHtml(entry.po_megn)).join("</strong> and <strong>")}</strong>
                   at level ${escapeHtml(ahead[0].po_lvl)} is the next decision, and neither
                   branch is shown until it is made.`
                : ""}</small></p>` : ""}
            ${skillTreeHtml(model, { interactive: true, profile, build, ledger })}`,
            `<span class="panel-aside">${prettyNumber(reached)} of ${prettyNumber(
              model.nodes.length)} reach level ${escapeHtml(String(build.level))} ·
              ${prettyNumber(raisable)} can be raised now</span>`);
        })()}
        <p class="dim"><small>The whole class path is shown so the shape of it is visible.
          A dimmed skill is one this character cannot take yet — its level is not reached, its
          prerequisite is not raised far enough, or the chosen position does not grant it.</small></p>`;
    }

    function questState(profile, questId) {
      return profile.quests?.[String(questId)] || "not-started";
    }

    /* Whether *this character* could legitimately have done the quest yet.
       It gates the Character Creation checklist, where the point is to model a
       real character, and the "finish all available" sweep. It deliberately
       does not gate the quest pages: a player ticking off what they have
       already done is recording history, not asking permission, and their
       character record here may simply be out of date. */
    function questCanChange(profile, quest, build) {
      if ((Number(quest.que_lvl) || 0) > Number(build.level)) return false;
      const prerequisite = String(quest.bango_prerequisite || "");
      return !prerequisite || questState(profile, prerequisite) === "finished";
    }

    // Finished quests the character is not high enough level for. Not corrected
    // — the player may be recording a character this profile has not caught up
    // with — but not hidden either.
    function questsFinishedAboveLevel(profile, build) {
      return state.indexes.questsSorted.filter(quest =>
        questState(profile, quest.que_id) === "finished"
        && (Number(quest.que_lvl) || 0) > Number(build.level));
    }

    function questStatusButton(profile, quest, compact = false, enforceLevel = false) {
      const status = questState(profile, quest.que_id);
      const allowed = !enforceLevel || questCanChange(profile, quest, currentBuild());
      const symbol = status === "finished" ? "✓" : status === "progress" ? "•" : "";
      const title = status === "finished" ? "Finished" : status === "progress"
        ? "In progress" : "Not started";
      return `<button type="button" class="quest-status ${
        status === "progress" ? "progress" : status === "finished" ? "finished" : ""}"
        data-quest-status="${escapeAttr(quest.que_id)}" title="${title}; click to change"
        aria-label="${title}; click to change"${
          allowed ? "" : " disabled"}>${symbol || (compact ? "○" : "")}</button>`;
    }

    /* The quests that change a build. A quest paying only experience is worth
       doing and worth ticking off, but it is not a decision this workspace can
       help with — so the checklist here carries the skill-point quests only,
       and everything else is ticked on the quest pages. */
    function skillPointQuests() {
      return state.indexes.questsSorted
        .filter(quest => Number(quest.bango_skill_points) > 0);
    }

    function renderCharacterQuestsHtml(profile, build) {
      const totals = characterQuestTotals(profile);
      const visible = skillPointQuests();
      const finished = visible.filter(quest => questState(profile, quest.que_id) === "finished").length;
      const available = visible.reduce((sum, quest) =>
        sum + (Number(quest.bango_skill_points) || 0), 0);
      const overLevel = questsFinishedAboveLevel(profile, build);
      return `${section("Quest points", `
        <div class="point-ledger quest-ledger">
          <div><span>Finished</span><strong>${prettyNumber(finished)} / ${
            prettyNumber(visible.length)}</strong></div>
          <div><span>Skill points</span><strong>${prettyNumber(totals.skillPoints)} / ${
            prettyNumber(available)}</strong></div>
          <div><span>Contribution</span><strong>${prettyNumber(totals.contribution)}</strong></div>
          <div><span>Character level</span><strong>${prettyNumber(build.level)}</strong></div>
        </div>
        <div class="tag-row">
          <button type="button" class="button small" data-action="finish-available-quests">Finish all available</button>
          <button type="button" class="button small ghost" data-action="reset-all-quests">Set all to not started</button>
          <span class="tag">○ not started</span><span class="tag gold">• in progress</span>
          <span class="tag accent">✓ finished</span>
        </div>
        <p class="dim" style="margin:10px 0 0"><small>Contribution counts every finished quest,
          including the ones not listed below. Quests that award no skill point are ticked on the
          <a href="#/quests">quest pages</a>.</small></p>`)}
        ${overLevel.length ? `<div class="callout warn" style="margin-bottom:14px">
          <strong>${prettyNumber(overLevel.length)} finished quest${
            overLevel.length === 1 ? " is" : "s are"} above level ${
            escapeHtml(String(build.level))}.</strong> ${overLevel.length === 1
              ? "Its reward is" : "Their rewards are"} counted as ${
              overLevel.length === 1 ? "it stands" : "they stand"}.
          Either the character's level here is behind, or ${overLevel.length === 1 ? "it was" : "they were"}
          ticked in advance: ${overLevel.slice(0, 6).map(quest =>
            `${entityLink("quest", quest.que_id, quest.que_name)} (Lv ${escapeHtml(quest.que_lvl)})`
          ).join(", ")}${overLevel.length > 6
            ? ` and ${prettyNumber(overLevel.length - 6)} more` : ""}.
        </div>` : ""}
        ${section(`Skill-point quests — ${prettyNumber(available)} points across ${
          prettyNumber(visible.length)} quests`,
          `<div class="quest-checklist">${visible.map(quest => {
          const future = !questCanChange(profile, quest, build)
            && questState(profile, quest.que_id) === "not-started";
          return `<div class="quest-check${future ? " future" : ""}">
            ${questStatusButton(profile, quest, false, true)}
            <div><strong>[${escapeHtml(quest.que_lvl || "—")}] ${entityLink("quest", quest.que_id, quest.que_name)}</strong>
              <small>${prettyNumber(quest.bango_skill_points)} SP · ${prettyNumber(quest.bango_contribution)} contribution${
                quest.bango_prerequisite ? ` · requires quest ${escapeHtml(quest.bango_prerequisite)}` : ""}</small></div>
          </div>`;
        }).join("")}</div>`)}`;
    }

    function buffEffectLabel(definition, grade, build) {
      if (definition.displayOnly) return definition.displayOnly;
      const effects = registeredBuffEffects(definition, grade, build);
      const text = Object.entries(effects).map(([stat, value]) =>
        `${PREFIX_STAT_LABELS[stat] || stat} ${Number(value) >= 0 ? "+" : ""}${prettyNumber(value)}`
      ).join(" · ");
      return text || "No current-sheet effect could be resolved.";
    }

    /* Buffs live on the Stats tab, beside the sheet they change. Each one is
       its own icon button with a grade selector, small enough that the whole
       set fits under the inventory rather than needing a tab of its own. */
    function simBuffPanelHtml(profile) {
      const groups = new Map();
      const build = currentBuild();
      const classGroup = ({ Magician: "Mage", Knight: "Knight", Archer: "Archer" })[build.cls] || "";
      REGISTERED_BUFFS.forEach(definition => mapPush(groups, definition.group, definition));
      const ordered = [...groups.entries()].sort(([left], [right]) =>
        (right === classGroup) - (left === classGroup) || left.localeCompare(right));
      const activeCount = REGISTERED_BUFFS
        .filter(definition => activeBuffState(profile, definition.key).enabled).length;

      // The Mage group is open whatever the character is: those are the party
      // buffs — Strength, Health, Agility, Intelligence — that a mage casts on
      // everyone else, so they are the set a player actually reaches for.
      return panel("Buffs", ordered.map(([group, definitions]) => `
        <details class="buff-group"${group === classGroup || group === "Mage" ? " open" : ""}>
          <summary>${escapeHtml(group)}
            <span class="dim">${definitions.length}</span></summary>
          <div class="buff-grid">${definitions.map(definition => {
            const skill = registeredBuffSkill(definition);
            const selected = activeBuffState(profile, definition.key);
            const maxGrade = registeredBuffMaxGrade(definition);
            const grade = Math.max(1, Math.min(maxGrade, Number(selected.grade) || 1));
            const name = definition.name || skill?.sk_megn || definition.key;
            const effect = buffEffectLabel(definition, grade, build);
            return `<div class="buff-card${selected.enabled ? " active" : ""}"
                title="${escapeAttr(`${name} — ${effect}`)}">
              <label class="buff-toggle">
                <input type="checkbox" data-buff-field="enabled" data-buff-key="${escapeAttr(definition.key)}"${
                  selected.enabled ? " checked" : ""}>
                <span class="buff-icon">${iconTag(
                  definition.icon || skill?.sk_pic || skillIconFallback(skill),
                  name, 30, definition.icon ? (skill?.sk_pic || skillIconFallback(skill)) : ""
                )}</span>
                <span class="buff-name">${escapeHtml(name)}</span>
              </label>
              <select class="buff-grade" data-buff-field="grade"
                data-buff-key="${escapeAttr(definition.key)}" aria-label="${escapeAttr(`${name} grade`)}">
                ${Array.from({ length: maxGrade }, (_, index) => index + 1).map(value =>
                  `<option value="${value}"${grade === value ? " selected" : ""}>G${value}</option>`
                ).join("")}
              </select>
              <div class="buff-effect">${escapeHtml(effect)}</div>
            </div>`;
          }).join("")}</div>
        </details>`).join(""),
        { aside: `<span class="panel-aside">${activeCount} active</span>` });
    }

    function renderBuild() {
      if (!simReady()) {
        el.main.innerHTML = pageHeader({ eyebrow: "Character Creation", title: "Character Creation" })
          + simMissing("The combat fixture was not found or is incomplete.");
        return;
      }
      loadProfiles();
      const params = routeInfo().query;
      if (params.get("b")) {
        try {
          const shared = decodeBuild(params.get("b"));
          activeProfile().build = shared.build;
          // A link with no skills clears the ones already on the profile, so
          // the reader sees the shared character and not a blend of two.
          activeProfile().skills = shared.skills ? cloneJson(shared.skills) : {};
          state.build = activeProfile().build;
          saveBuild();
        } catch (error) { /* a malformed share link falls back to the stored build */ }
      }
      // `?monsters=open` opens the comparison straight away, so a link can
      // point at it and a test can reach the table it renders. `?monster=`
      // carries the search with it, because the list shows the first sixty by
      // level and anything above them is only reachable by searching.
      if (params.get("monsters") === "open") state.threatOpen = true;
      if (params.has("monster")) {
        state.monsterQuery = params.get("monster");
        if (state.monsterQuery.trim()) state.threatOpen = true;
      }
      const tab = CHARACTER_TABS.includes(params.get("tab")) ? params.get("tab") : "stats";
      const profile = activeProfile();
      const build = simNormalizeBuildItems(currentBuild());
      normalizeCharacterPosition(build);
      normalizeSkillAllocations(profile, build);
      persistProfiles();
      const body = tab === "skills" ? renderCharacterSkillsHtml(profile, build)
        : tab === "quests" ? renderCharacterQuestsHtml(profile, build)
        : renderCharacterStatsHtml(profile, build);

      el.main.innerHTML = `
        ${pageHeader({
          eyebrow: "Character Creation",
          title: profile.name,
          lede: `${escapeHtml(build.cls)} · level ${prettyNumber(build.level)}${
            build.position ? ` · ${escapeHtml(build.position)}` : ""}`,
          crumbs: [["Overview", "#/home"], ["Character Creation", ""]]
        })}
        ${characterBanner(profile)}
        ${characterTabs(tab)}
        ${body}`;
      wireCharacterWorkspace(tab);
      // renderBuild is also called directly — by a skill step, a quest tick or
      // a class/level change — and not only through renderRoute. Without this
      // the redrawn markup keeps its empty <img data-icon> tags and every icon
      // on the tab disappears until the next navigation.
      hydrateIcons(el.main);
    }

    function wireCharacterWorkspace(tab) {
      if (typeof el.main.querySelector !== "function"
          || typeof el.main.querySelectorAll !== "function") return;
      const nameInput = el.main.querySelector("[data-character-name]");
      if (nameInput) nameInput.oninput = event => {
        activeProfile().name = event.currentTarget.value.trimStart() || "Unnamed character";
        persistProfiles();
        renderProfileSwitcher();
      };
      if (tab === "stats") {
        wireSimControls();
        el.main.querySelectorAll("[data-equipment-slot]").forEach(control => {
          control.onclick = event => openSlotMenu(control.dataset.equipmentSlot, event);
          control.oncontextmenu = event => {
            event.preventDefault();
            openSlotMenu(control.dataset.equipmentSlot, event);
          };
        });
        el.main.querySelectorAll("[data-buff-field]").forEach(control => {
          control.oninput = onBuffChange;
          control.onchange = onBuffChange;
        });
        el.main.querySelectorAll("[data-armor-fill]").forEach(control => {
          control.onchange = event => {
            const key = event.currentTarget.dataset.armorFill;
            const value = event.currentTarget.value;
            const fill = armorFillState();
            if (key === "defense") fill.defense = Number(value) || 0;
            else if (key === "bead") fill.bead = value === "yes";
            else fill[key] = value;
            state.armorFillOpen = true;
            // The grade decides whether Bead of Fire is even offered, so the
            // block has to redraw rather than just remember the choice.
            if (key === "grade") refreshSimResults({ refreshGear: true });
          };
        });
        el.main.querySelectorAll("details.armor-fill").forEach(node => {
          node.ontoggle = () => { state.armorFillOpen = Boolean(node.open); };
        });
        const armorApply = el.main.querySelector("[data-armor-fill-apply]");
        if (armorApply) armorApply.onclick = applyArmorFill;
      } else if (tab === "skills") {
        el.main.querySelectorAll("[data-skill-up]").forEach(control => {
          control.onclick = () => changeSkillGrade(control.dataset.skillUp, 1);
        });
        el.main.querySelectorAll("[data-skill-down]").forEach(control => {
          control.onclick = () => changeSkillGrade(control.dataset.skillDown, -1);
        });
        el.main.querySelectorAll("[data-skill-card]").forEach(card => {
          card.onmouseenter = event => showSkillTooltip(event.currentTarget, event);
          card.onmousemove = event => positionSkillTooltip(event);
          card.onmouseleave = hideSkillTooltip;
          card.onfocusin = event => showSkillTooltip(event.currentTarget, event);
          card.onfocusout = hideSkillTooltip;
        });
      }
    }

    function showSkillTooltip(card, event) {
      el.skillTooltip.innerHTML = card.dataset.skillTip || "";
      if (el.skillTooltip.classList) el.skillTooltip.classList.remove("hidden");
      else el.skillTooltip.className = "";
      positionSkillTooltip(event);
    }

    function positionSkillTooltip(event) {
      if (el.skillTooltip.classList?.contains("hidden")
          || String(el.skillTooltip.className || "").includes("hidden")) return;
      const x = Math.min(window.innerWidth - el.skillTooltip.offsetWidth - 12,
        (event.clientX || 20) + 16);
      const y = Math.min(window.innerHeight - el.skillTooltip.offsetHeight - 12,
        (event.clientY || 20) + 16);
      el.skillTooltip.style.left = `${Math.max(12, x)}px`;
      el.skillTooltip.style.top = `${Math.max(12, y)}px`;
    }

    function hideSkillTooltip() {
      if (el.skillTooltip.classList) el.skillTooltip.classList.add("hidden");
      else el.skillTooltip.className = "skill-tooltip hidden";
    }

    function resetInvalidDependents(profile, prerequisiteKey) {
      const edges = state.indexes.skillDependents.get(String(prerequisiteKey)) || [];
      edges.forEach(edge => {
        const dependentKey = String(edge.skill_key);
        if (!(Number(profile.skills?.[dependentKey]) > 0)) return;
        if ((Number(profile.skills?.[prerequisiteKey]) || 0) >= Number(edge.required_grade)) return;
        profile.skills[dependentKey] = 0;
        resetInvalidDependents(profile, dependentKey);
      });
    }

    function changeSkillGrade(key, direction) {
      const profile = activeProfile();
      const build = currentBuild();
      const row = skillByKey(key);
      if (!row) return;
      const current = Number(profile.skills?.[key]) || 0;
      const minimum = skillMinimumGrade(row);
      if (direction > 0) {
        const schedule = state.indexes.skillSchedules.get(skillId(row));
        const max = availableSkillGrade(schedule, build.level);
        const ledger = characterSkillLedger(profile, build);
        const prerequisites = skillPrerequisiteState(profile, row);
        if (current >= max || ledger.available <= 0 || prerequisites.missing.length) return;
        profile.skills[key] = current + 1;
      } else {
        if (current <= minimum) return;
        profile.skills[key] = current - 1;
        resetInvalidDependents(profile, key);
      }
      persistProfiles();
      renderBuild();
    }

    function cycleQuestStatus(questId) {
      const profile = activeProfile();
      const quest = state.indexes.questsById.get(String(questId));
      if (!quest) return;
      const current = questState(profile, questId);
      profile.quests[String(questId)] = current === "not-started" ? "progress"
        : current === "progress" ? "finished" : "not-started";
      if (profile.quests[String(questId)] === "not-started") {
        delete profile.quests[String(questId)];
      }
      // Marking a quest done is itself the instruction to fold it away, so a
      // manual expand from before the change is dropped rather than obeyed.
      state.questCardOpen.delete(String(questId));
      persistProfiles();
      renderRoute();
    }

    function finishAvailableQuests() {
      const profile = activeProfile();
      let changed = true;
      while (changed) {
        changed = false;
        for (const quest of state.indexes.questsSorted) {
          if (questState(profile, quest.que_id) === "finished") continue;
          if (!questCanChange(profile, quest, currentBuild())) continue;
          profile.quests[String(quest.que_id)] = "finished";
          changed = true;
        }
      }
      persistProfiles();
      renderBuild();
    }

    function resetAllQuests() {
      activeProfile().quests = {};
      // The walkthrough's own batch ticks are quest progress too, so a reset
      // that left them set would leave the two views disagreeing.
      activeProfile().walkthrough = {};
      persistProfiles();
      // Called from the character workspace and from the walkthrough; only the
      // former is a build tab, so redraw whatever route is actually showing.
      if (routeInfo().section === "build") renderBuild();
      else renderRoute();
    }

    function onBuffChange(event) {
      const profile = activeProfile();
      const key = event.currentTarget.dataset.buffKey;
      const field = event.currentTarget.dataset.buffField;
      let buff = profile.buffs.find(entry => entry.key === key);
      if (!buff) {
        buff = { key, enabled: false, grade: 1 };
        profile.buffs.push(buff);
      }
      buff[field] = field === "enabled" ? event.currentTarget.checked
        : field === "grade" ? (Number(event.currentTarget.value) || 1)
        : event.currentTarget.value;
      persistProfiles();
      // Buffs sit beside the sheet now, so only the panels change — a full
      // re-render would collapse the group the player is working in.
      refreshSimResults({ refreshBuffs: true });
    }

    function onSimInput(event) {
      const target = event.currentTarget;
      const build = currentBuild();
      const field = target.dataset.simField;
      let refreshGear = false;
      if (field) {
        if (target.type === "checkbox") build[field] = target.checked;
        else if (field === "cls" || field === "position") build[field] = target.value;
        else build[field] = Number(target.value) || 0;
        refreshGear = field === "cls" || field === "level";
        if (field === "cls") build.position = "";
        if (refreshGear || field === "position") {
          normalizeCharacterPosition(build);
          normalizeSkillAllocations(activeProfile(), build);
        }
      } else if (target.dataset.simItem) {
        if (target.value) build.items[target.dataset.simItem] = target.value;
        else delete build.items[target.dataset.simItem];
        refreshGear = true;
      } else if (target.dataset.simPrefix) {
        if (target.value) build.prefixes[target.dataset.simPrefix] = target.value;
        else delete build.prefixes[target.dataset.simPrefix];
      } else if (target.dataset.simManual) {
        const value = Number(target.value);
        if (target.value === "" || !Number.isFinite(value) || value === 0) {
          delete build.manual[target.dataset.simManual];
        } else {
          build.manual[target.dataset.simManual] = value;
        }
      }
      saveBuild();
      if (refreshGear || field === "position") {
        renderBuild();
        return;
      }
      refreshSimResults({ refreshGear });
    }

    function refreshSimResults({ refreshGear = false, refreshBuffs = false } = {}) {
      const build = simNormalizeBuildItems(currentBuild());
      const gearHost = document.getElementById("simGearHost");
      const buffHost = document.getElementById("simBuffPanel");
      const sheetHost = document.getElementById("simSheetPanel");
      const threatHost = document.getElementById("simThreatPanel");
      const supplementalHost = document.getElementById("simSupplemental");
      const statPointHost = document.getElementById("simStatPoints");
      // Re-rendering the buff panel would close every open group, so its
      // markup is left alone unless the caller asks for it.
      const openBuffGroups = buffHost
        ? [...buffHost.querySelectorAll("details.buff-group")].map(node => node.open) : [];
      if (refreshGear && gearHost) {
        gearHost.innerHTML = panel("Inventory", simGearControls(build));
      }
      if (refreshBuffs && buffHost) {
        buffHost.innerHTML = simBuffPanelHtml(activeProfile());
        buffHost.querySelectorAll("details.buff-group").forEach((node, index) => {
          if (openBuffGroups[index] !== undefined) node.open = openBuffGroups[index];
        });
      }
      if (statPointHost) statPointHost.innerHTML = panel("Stat points", statLedgerHtml(build));
      if (sheetHost) sheetHost.innerHTML = simSheetPanelHtml(build);
      if (threatHost) threatHost.innerHTML = simThreatPanelHtml(build);
      if (supplementalHost) supplementalHost.innerHTML = simSupplementalHtml(build);
      wireCharacterWorkspace("stats");
      [gearHost, buffHost, sheetHost, threatHost, supplementalHost, statPointHost]
        .forEach(host => hydrateIcons(host));
    }

    /* Every modifier the character is carrying, said in one place: what it
       added, and — the half that matters more — what it did not and why. A
       choice that is stored but cannot change the sheet has to say so on the
       page, or it reads as counted. */
    function simModifierLedger(build, sheet) {
      const stat = entries => Object.entries(entries)
        .map(([slot, value]) => `${escapeHtml(PREFIX_STAT_LABELS[slot] || slot)} ${
          value > 0 ? "+" : ""}${prettyNumber(value)}`).join(" · ");
      const counted = [];
      const not = [];

      emptySlotChoices(build).forEach(entry => not.push(`<b>${escapeHtml(entry.slot)}</b>
        holds no item, so the ${entry.details.map(escapeHtml).join(", ")} stored on it
        ${entry.details.length === 1 ? "adds" : "add"} nothing. Equipping an item there
        brings ${entry.details.length === 1 ? "it" : "them"} back.`));

      const bead = beadVector(build);
      bead.scored.forEach(piece => counted.push(
        `<b>Bead of Fire</b> on ${escapeHtml(piece.slot)} (G${piece.grade}) — ${
          BEAD_STATS.map(name => `${name} +${piece.amount}`).join(" · ")}`));
      if (bead.set.kind === "full" || bead.set.kind === "half") {
        counted.push(`<b>${bead.set.kind === "full" ? "Full" : "Half"} G${bead.set.grade
          } set bonus</b> — ${BEAD_STATS.map(name =>
            `${name} +${bead.set.amount}`).join(" · ")}${bead.set.kind === "half"
              ? " (Boots, Gloves and Shorts)" : ""}`);
      } else if (bead.set.kind === "half-unscored") {
        not.push(`<b>Half G${bead.set.grade} set bonus</b> — the source table records the
          half-set amount for G46, G50, G55, G60, G65 and G70 only, so this grade has no
          value to read. Not zero because the set does nothing; zero because nothing was
          recorded.`);
      }
      bead.unscored.forEach(piece => not.push(
        piece.grade != null && piece.grade < BEAD_OF_FIRE_MIN_GRADE
          ? `<b>Bead of Fire</b> on ${escapeHtml(piece.slot)} (G${piece.grade}) — the
            original only offers a Bead of Fire from G46 up, so this piece cannot carry
            one and it is ignored here.`
          : `<b>Bead of Fire</b> on ${escapeHtml(piece.slot)}${
              piece.grade == null ? "" : ` (G${piece.grade})`} — the source
            table has rows for G46, G50, G55, G60, G65 and G70 only, so this grade has no
            value to read. Not zero because the bead does nothing; zero because nothing was
            recorded.`));

      const stones = stoneVector(build);
      stones.applied.forEach(entry => counted.push(`<b>${escapeHtml(entry.stone)} Lv${
        entry.level}</b> on ${escapeHtml(entry.slot)} — ${stat(entry.stats)}`));
      stones.unread.forEach(entry => not.push(`<b>${escapeHtml(entry.stone)} Lv${entry.level
        }</b> writes ${entry.value == null ? "" : `${entry.value} to `}a slot past the 27 this
        sheet names. KalEncyclopedia's own vector is 28 wide and its sheet does not read that
        slot either, so the value is shown rather than folded into a neighbour.`));

      const scrolls = dragonScrollVector(build);
      scrolls.applied.forEach(entry => {
        if (Object.keys(entry.stats).length) {
          counted.push(`<b>${escapeHtml(entry.name)}</b> on ${escapeHtml(entry.slot)} — ${
            stat(entry.stats)}`);
        }
      });
      scrolls.idle.forEach(entry => not.push(`<b>${escapeHtml(entry.name)}</b> on ${
        escapeHtml(entry.slot)} — its +${entry.percent}% is a percentage of the item's own
        damage or defence, and ${escapeHtml(entry.reason)}.`));

      const animal = animalVector(build);
      if (Object.keys(animal.stats).length) {
        counted.push(`<b>${escapeHtml(animal.animal)} G${animal.grade}</b> — ${
          stat(animal.stats)}`);
      } else if (animal.animal && !animal.grade) {
        not.push(`<b>${escapeHtml(animal.animal)}</b> — no grade is set, and an egg's three
          numbers come from its grade.`);
      }

      (sheet.passiveDetail?.applied || []).forEach(entry => counted.push(
        `<b>${escapeHtml(entry.row.sk_megn || entry.row.bango_key)} G${entry.grade}</b>
         (passive) — ${stat(entry.stats)}`));
      (sheet.passiveDetail?.unmodelled || []).forEach(entry => {
        const values = (entry.values || []).filter(value => value != null);
        not.push(`<b>${escapeHtml(entry.row.sk_megn || entry.row.bango_key)} G${entry.grade}</b>
          (passive) — ${values.length
            ? `the client gives ${values.map(prettyNumber).join(" / ")}, but its effect is`
            : "its effect is"} a chance, a percentage or a duration that this sheet has no slot
          for, so it is not added to anything.`);
      });

      const weaponEb = Number(build.equipmentMods?.Weapon?.enhancementLevel) || 0;
      if (weaponEb) {
        not.push(`<b>EB +${weaponEb}</b> on the weapon — the original does not put enhancement on
          the character sheet either, and the recovered Bango +1…+15 grid does not say which of
          its three bands applies here. The <a href="#/weapon-calculator">weapon calculator</a>
          does model it.`);
      }

      if (!counted.length && !not.length) return "";
      const list = items => `<ul class="modifier-ledger">${
        items.map(item => `<li>${item}</li>`).join("")}</ul>`;
      return `<details class="sheet-breakdown"><summary>What the sheet is counting${
          not.length ? ` — and ${prettyNumber(not.length)} thing${
            not.length === 1 ? "" : "s"} it is not` : ""}</summary>
        <div style="margin-top:10px">
          ${counted.length ? `<h4>Counted</h4>${list(counted)}` : ""}
          ${not.length ? `<h4>Not counted</h4>${list(not)}` : ""}
        </div></details>`;
    }

    function simSheetPanelHtml(build) {
      const sheet = simSheet(build);
      return simCharacterSheet(build, sheet)
        + simModifierLedger(build, sheet) + `
        <details class="sheet-breakdown"><summary>Full stat breakdown</summary>
          <div style="margin-top:10px">${simSheetTable(build, sheet)}</div>
        </details>`;
    }

    /* Collapsed to its title and search box by default. The comparison is a
       reference you consult, not something you read while building, so the
       width it used to hold permanently now goes to the character panels;
       typing a monster name opens it without a second click. */
    function simThreatPanelHtml(build) {
      const open = Boolean(state.threatOpen);
      const sheet = simSheet(build);
      const threats = threatRows(sheet, build);
      return `<section class="panel threat-panel${open ? " open" : ""}">
        <h3>
          <button type="button" class="threat-toggle" id="simThreatToggle"
            aria-expanded="${open ? "true" : "false"}" aria-controls="simMonsterList">
            <span class="threat-caret" aria-hidden="true">▸</span>
            <span>Monsters versus this build</span>
          </button>
          <span class="panel-aside">${prettyNumber(threats.rows.length)} with stats</span>
        </h3>
        <input class="monster-search" type="search" id="simMonsterSearch"
          placeholder="Search monsters — e.g. Devil Soldier"
          value="${escapeAttr(state.monsterQuery || "")}" aria-label="Search monsters">
        <div id="simMonsterList"${open ? "" : ` class="hidden"`}>${
          open ? simMonsterList(sheet, build, state.monsterQuery || "") : ""}</div>
      </section>`;
    }

    // The workspace is two columns while the comparison is open and one wide
    // column of flowing panels while it is shut.
    function applyThreatLayout() {
      const workspace = el.main.querySelector?.(".sim-workspace");
      if (workspace?.classList) {
        workspace.classList.toggle("threats-collapsed", !state.threatOpen);
      }
    }

    function setThreatPanelOpen(open) {
      if (Boolean(state.threatOpen) === Boolean(open)) return;
      state.threatOpen = Boolean(open);
      applyThreatLayout();
      const host = document.getElementById("simThreatPanel");
      if (!host) return;
      const build = currentBuild();
      host.innerHTML = simThreatPanelHtml(build);
      wireSimControls();
      const search = document.getElementById("simMonsterSearch");
      // Re-rendering replaces the input the player is typing into.
      if (search && state.threatOpen && typeof search.focus === "function") {
        search.focus();
        if (typeof search.setSelectionRange === "function") {
          const end = String(search.value || "").length;
          search.setSelectionRange(end, end);
        }
      }
    }

    function simSupplementalHtml(build) {
      const sheet = simSheet(build);
      return provenanceFooter(`
        <p>The character sheet is measured: every formula reproduces a real level-38 Magician
          sheet exactly. The hit and damage numbers use the original 2006 combat engine against
          a legacy monster export — neither of those is Bango, so anything involving a monster
          is an estimate for this server, not a fact about it.</p>
        <p>Share this build: <code class="mono">#/build?b=${escapeHtml(
          encodeBuild(build, activeProfile().skills))}</code></p>
        <div>${simDisagreementPanel(sheet)}</div>`);
    }

    // The four readings Rafael asked for, per monster, both directions.
    function simMonsterList(sheet, build, query) {
      const needle = String(query || "").trim().toLowerCase();
      let rows = threatRows(sheet, build).rows;
      if (needle) rows = rows.filter(row =>
        `${row.bango.text} ${row.label || ""}`.toLowerCase().includes(needle));
      rows.sort((a, b) => a.monsterLevel - b.monsterLevel);
      if (!rows.length) {
        return emptyState(needle
          // emptyState escapes its whole message; escaping here as well
          // rendered a search for "A&B" as "A&amp;B".
          ? `No monster with combat stats matches “${query}”.`
          : "No monster resolves to a legacy row with combat stats.");
      }
      const shown = rows.slice(0, 60);
      return `<div class="table-wrap"><table>
        <thead><tr>
          <th>Monster</th><th>Lv</th>
          <th>You evade</th><th>It deals you</th>
          <th>You hit</th><th>You deal (melee)</th><th>You deal (magic)</th>
        </tr></thead>
        <tbody>${shown.map(row => `<tr>
          <td>${entityLink("monster", row.bango.message_id, row.label || row.bango.text)}</td>
          <td>${prettyNumber(row.monsterLevel)}</td>
          <td><strong>${prettyNumber(row.evasion)}%</strong>
            <br><small class="dim">it hits ${prettyNumber(row.incomingHit)}%</small></td>
          <td>${prettyNumber(row.physicalMin)}–${prettyNumber(row.physicalMax)}
            <br><small class="dim">avg ${row.perSwing.toFixed(1)}/swing</small></td>
          <td><strong>${prettyNumber(row.outgoingHit)}%</strong></td>
          <td>${prettyNumber(row.dealtPhysicalMin)}–${prettyNumber(row.dealtPhysicalMax)}
            <br><small class="dim">avg ${row.dealtPhysicalExpected.toFixed(1)}/swing</small></td>
          <td>${row.bestMagicElement
            ? `${prettyNumber(row.bestMagicMin)}–${prettyNumber(row.bestMagicMax)}
               <br><small class="dim">${escapeHtml(row.bestMagicElement)}, no miss</small>`
            : "<span class=\"dim\">no resistance data</span>"}</td>
        </tr>`).join("")}</tbody></table></div>
        ${rows.length > shown.length ? `<p class="dim"><small>Showing the first
          ${prettyNumber(shown.length)} of ${prettyNumber(rows.length)} matches, by level.
          Narrow the search to see the rest.</small></p>` : ""}`;
    }

    function wireSimControls() {
      if (typeof el.main.querySelectorAll !== "function") return;
      el.main.querySelectorAll("[data-sim-field],[data-sim-item],[data-sim-prefix],[data-sim-manual]")
        .forEach(control => { control.oninput = onSimInput; });
      const toggle = document.getElementById("simThreatToggle");
      if (toggle) toggle.onclick = () => setThreatPanelOpen(!state.threatOpen);
      const search = document.getElementById("simMonsterSearch");
      if (search) {
        search.oninput = event => {
          state.monsterQuery = event.currentTarget.value;
          if (state.monsterQuery.trim() && !state.threatOpen) {
            setThreatPanelOpen(true);
            return;
          }
          const host = document.getElementById("simMonsterList");
          if (!host || !state.threatOpen) return;
          const build = currentBuild();
          host.innerHTML = simMonsterList(simSheet(build), build, state.monsterQuery);
        };
      }
    }

    /* The old standalone threat-table page (#/threats) was never reachable —
       the router always sent it to Character Creation, whose collapsible
       comparison superseded it. The route stays as a redirect that opens the
       comparison; the ~90-line renderer it pointed at is gone. */

    function monsterCombatPanel(bangoRow, variants, chosen = 0) {
      if (!simReady()) return simMissing("The combat fixture was not found.");
      const usable = [variants].flat().filter(monsterHasCombatStats);
      if (!usable.length) {
        return emptyState("This monster has no combat stats in any registered source, so nothing is computed for it.");
      }
      // A family's variants are a level ladder with different stats, so one is
      // picked by the reader rather than silently by this function.
      const index = Math.min(Math.max(Number(chosen) || 0, 0), usable.length - 1);
      const legacy = usable[index];
      const picker = usable.length < 2 ? "" : `<div class="tag-row" style="margin:-2px 0 12px">
        ${usable.map((variant, position) => `<a class="button ghost${
          position === index ? " active" : ""}" href="${routeHref("monster",
          bangoRow.message_id, `variant=${position}`)}">${escapeHtml(variant.mon_name)}
          <small class="dim">Lv ${escapeHtml(variant.mon_lvl)}</small></a>`).join("")}
      </div>
      <p class="dim" style="margin:-4px 0 10px;font-size:12px">The legacy export records
        ${prettyNumber(usable.length)} of this monster at different levels and the client does
        not say which one you are looking at, so each is kept and none is chosen for you.</p>`;
      const build = currentBuild();
      const sheet = simSheet(build);
      const versus = simVersus(sheet, build, legacy);
      const magicTable = rows => `<div class="table-wrap"><table>
        <thead><tr><th>Element</th><th class="num">Resistance</th><th class="num">Damage</th></tr></thead>
        <tbody>${rows.map(([element, entry]) => `<tr>
          <td>${escapeHtml(element)}</td><td class="num">${prettyNumber(entry.resist)}%</td>
          <td class="num">${prettyNumber(entry.min)}–${prettyNumber(entry.max)}</td></tr>`).join("")}</tbody>
        </table></div>`;
      return `
        <p class="dim" style="margin:-2px 0 10px;font-size:12px">Against
          <a href="${routeHref("build")}">${escapeHtml(build.cls)} level ${prettyNumber(build.level)}</a>
          · <a href="#/build?monsters=open">compare every monster</a></p>
        ${picker}
        <div class="versus-grid">
          <div>
            <h4>It attacks you</h4>
            ${statLines([
              ["You evade", `${prettyNumber(versus.evasion)}%`],
              ["It hits you", `${prettyNumber(versus.incomingHit)}%`],
              ["Damage per hit", `${prettyNumber(versus.physicalMin)}–${prettyNumber(versus.physicalMax)}`],
              ["Average per swing", versus.perSwing.toFixed(1)],
              ["Average per second", versus.perSecond === null ? "—" : versus.perSecond.toFixed(1)],
              ["Swings to kill you", versus.survivalSwings === null ? "never" : String(Math.floor(versus.survivalSwings))]
            ])}
          </div>
          <div>
            <h4>You attack it</h4>
            ${statLines([
              ["You hit it", `${prettyNumber(versus.outgoingHit)}%`],
              ["Attack type", escapeHtml(versus.attackType)],
              ["Damage per hit", `${prettyNumber(versus.dealtPhysicalMin)}–${prettyNumber(versus.dealtPhysicalMax)}`],
              ["Average per swing", versus.dealtPhysicalExpected.toFixed(1)],
              // The figure the damage above actually used: ranged attackers
              // meet mon_def2, everyone else mon_def1 (simVersus).
              ["Its defence", prettyNumber(Number(
                versus.attackType === "ranged" ? legacy.mon_def2 : legacy.mon_def1) || 0)],
              ["Its absorb", `${prettyNumber(Number(legacy.mon_absorb) || 0)}%`]
            ])}
          </div>
        </div>
        ${Object.keys(versus.dealtMagic).length ? `<h4>Your magic against it</h4>
          ${magicTable(Object.entries(versus.dealtMagic))}` : ""}
        ${versus.magic ? `<h4>Its magic against you</h4>
          ${magicTable(Object.entries(versus.magic))}
          <p class="dim" style="margin:8px 0 0"><small>Its element is not recorded, so all three
            of your resistances are shown.</small></p>` : ""}`;
    }

    function renderMonster(id, query = new URLSearchParams()) {
      const row = state.indexes.monstersById.get(String(id));
      if (!row) return renderNotFound("monster", id);
      const definitions = state.indexes.monsterDefinitions.get(String(id)) || [];
      const drops = state.indexes.dropsByMonster.get(String(id)) || [];
      const variants = legacyMonsterVariantsForRecord(id, row.text);
      const questRefs = state.indexes.monsterQuestsByMonster.get(String(id)) || [];
      const zones = state.indexes.monsterZones.get(String(id)) || [];
      const uniqueZones = [...new Map(zones.map(zone => [zone.id, zone])).values()];
      const documented = documentedDropEvidence(row.text);
      const articles = relatedArticles("monster", id, row.text);
      // The guide's world maps mark where eight named bosses stand. Seven of
      // them are a client monster by exact name, so those pages get the same
      // map an NPC page gets; every other monster is placed by zone, not pin.
      const pins = pinsForEntity("monster", id);

      // Ranges, not a pick: several rows can sit behind one Bango name.
      const level = legacyVariantRange(variants, "mon_lvl");
      const headline = [
        level ? `level ${escapeHtml(level)}` : "",
        legacyVariantRange(variants, "mon_hp", prettyNumber) &&
          `${legacyVariantRange(variants, "mon_hp", prettyNumber)} HP`,
        legacyVariantRange(variants, "mon_exp", prettyNumber) &&
          `${legacyVariantRange(variants, "mon_exp", prettyNumber)} XP`
      ].filter(Boolean).join(" · ");

      el.main.innerHTML = `
        ${pageHeader({
          eyebrow: "Monster",
          title: row.text,
          lede: [headline, `${prettyNumber(drops.length)} drop${drops.length === 1 ? "" : "s"}`]
            .filter(Boolean).join(" · "),
          crumbs: [["Overview", "#/home"], ["Monsters", "#/monsters"], [row.text, ""]]
        })}
        <div class="detail-grid">
          <div>
            ${panel("Drops", bangoDropTable(drops, "monster"),
              { aside: `<span class="panel-aside">Click a column to sort</span>` })}
            ${panel("Against your build",
              monsterCombatPanel(row, variants, query.get("variant") || 0))}
            ${pins.length ? questMapPanel(pins[0].city, {
              title: "Where it stands",
              onlyMaps: new Set(pins.map(entry => entry.city)),
              highlight: new Set(pins.map(entry => `${entry.city}-${entry.pin}`)),
              aside: `<span class="panel-aside">The guide marks this one by hand</span>`
            }) : ""}
          </div>
          <div class="detail-side">
            <div class="entity-hero${monsterFallbackPicture(row.text)
                && !monsterPortraitName(id, row.text) ? " portrait-art" : ""}">
              <span class="entity-portrait">${monsterIconTag(id, row.text, 64)}</span>
              <div>
                <strong>${escapeHtml(row.text)}</strong>
                ${headline ? `<br><span class="dim">${headline}</span>` : ""}
              </div>
            </div>
            ${panel("Stats", variants.length
              ? variants.map(variant => `${variants.length > 1
                  || normalizeName(variant.mon_name) !== normalizeName(row.text)
                  ? `<h4 style="margin:14px 0 6px">${escapeHtml(variant.mon_name)}</h4>` : ""}
                ${legacyMonsterStats(variant)}`).join("")
              : `<p class="dim" style="margin:0">No combat stats are recorded for this monster.</p>`)}
            ${uniqueZones.length ? panel("Found in", `<ul class="link-list">${uniqueZones.map(zone =>
              `<li><a href="${routeHref("zone", zone.id)}">Zone ${escapeHtml(zone.id)}</a>
                <small class="dim">[${escapeHtml(zone.coordinates)}] ${escapeHtml(zone.description)}</small></li>`
              ).join("")}</ul>`) : ""}
            ${questRefs.length ? panel("Quests", `<ul class="link-list">${questRefs.map(ref => {
              const quest = state.indexes.questsById.get(String(ref.quest_id));
              // An indicator with no quest of that id is kept as an
              // unnamed row rather than dropped, so nothing disappears.
              return quest
                ? `<li>${entityLink("quest", quest.que_id, quest.que_name)}</li>`
                : `<li class="dim">Unnamed quest ${escapeHtml(ref.quest_id)}</li>`;
            }).join("")}</ul>`) : ""}
            ${articles ? panel("Guides", articles) : ""}
          </div>
        </div>
        ${provenanceFooter(`
          <p>Names and drop associations come from the current Bango client tables.
            Drop chances come from the KalEncyclopedia database, which is confirmed to match
            Bango's rates. Combat stats below the name are a legacy export of an earlier game
            version and are <strong>not</strong> confirmed for Bango.
            ${monsterPictureCredit(row.text)}</p>
          ${definitions.length > 1 ? `<p>This name resolves to ${definitions.length} client string
            definitions.</p>` : ""}
          ${pins.length ? `<p>The map pin is the route guide author's own marking on his world
            map, joined to this monster by its exact client name.</p>` : ""}
          ${documented && !/class="empty"/.test(documented)
            ? `<div>${documented}</div>` : ""}`)}`;
      wireQuestMaps();
    }

    /* Skill costs are stored as reverse-Polish expressions over the grade.
       A bare number is the value; anything longer depends on the grade and is
       shown as the expression rather than a wrong single number. The internal
       verification status becomes a plain "not confirmed" note. */
    function formulaField(label, value, status = "") {
      const parsed = parseJson(value, []);
      if (!parsed.length) return "";
      const literal = parsed.length === 1 && Number.isFinite(Number(parsed[0]));
      const unconfirmed = String(status).includes("unverified");
      return `<div class="definition"><dt>${escapeHtml(label)}</dt><dd>${
        literal ? `<b>${prettyNumber(parsed[0])}</b>`
          : `<span class="mono">${escapeHtml(parsed.join(" "))}</span>`
      }${unconfirmed ? `<br><small class="dim">not confirmed</small>` : ""}</dd></div>`;
    }

    function renderSkill(id) {
      const row = state.indexes.skillsById.get(String(id));
      if (!row) return renderNotFound("skill", id);
      const schedule = state.indexes.skillSchedules.get(String(id));
      const prerequisites = state.indexes.skillPrerequisites.get(String(row.bango_key)) || [];
      const dependents = state.indexes.skillDependents.get(String(row.bango_key)) || [];
      const scope = scopeForSkill(row);
      const labelStatus = parseJson(row.bango_compare_label_status_json, {});
      const nativeParameters = parseJson(row.bango_parameters_json, []);
      const parameterRpn = parseJson(row.bango_parameter_rpn_json, []);

      const bands = parseJson(schedule?.client_level_bands_json, []);
      const increments = parseJson(schedule?.client_incremental_grade_counts_json, []);
      const articles = relatedArticles("skill", id, row.sk_megn || "");

      el.main.innerHTML = `
        ${pageHeader({
          eyebrow: "Skill",
          title: row.sk_megn || row.bango_key,
          lede: `${escapeHtml(scope)}${schedule?.client_max_grade
            ? ` · up to grade ${escapeHtml(schedule.client_max_grade)}` : ""}`,
          crumbs: [["Overview", "#/home"], ["Skills", "#/skills"], [row.sk_megn || row.bango_key, ""]]
        })}
        <div class="detail-grid">
          <div>
            ${cleanText(row.sk_desc) ? panel("What it does",
              `<p style="white-space:pre-line;margin:0">${escapeHtml(cleanText(row.sk_desc))}</p>`) : ""}
            ${panel("Cost and timing", `<div class="definition-grid">
              ${formulaField("Energy", row.bango_mana_rpn_json, labelStatus["1"] || "")}
              ${formulaField("Range", row.bango_range_rpn_json, labelStatus["2"] || "")}
              ${formulaField("Cast time", row.bango_cast_ms_rpn_json, labelStatus["3"] || "")}
              ${formulaField("Cooldown", row.bango_cooldown_ms_rpn_json, labelStatus["4"] || "")}
              ${formulaField("Lasts", row.sk_lasting ? JSON.stringify([row.sk_lasting]) : "[]")}
            </div>`)}
            ${bands.length ? panel("When each grade unlocks", `
              <div class="table-wrap"><table>
                <thead><tr><th class="num">From level</th><th class="num">Grades gained</th>
                  <th class="num">Grade reached</th></tr></thead>
                <tbody>${bands.map((band, index) => {
                  const reached = increments.slice(0, index + 1)
                    .reduce((total, value) => total + (Number(value) || 0), 0);
                  return `<tr><td class="num">${escapeHtml(band)}</td>
                    <td class="num">+${escapeHtml(increments[index] ?? 0)}</td>
                    <td class="num">${reached}</td></tr>`;
                }).join("")}</tbody></table></div>`) : ""}
            ${prerequisites.length ? panel("Needs first", `
              <ul class="link-list">${prerequisites.map(edge => {
                const target = skillByKey(edge.prerequisite_skill_key);
                return `<li>${target
                  ? entityLink("skill", skillId(target), edge.prerequisite_skill_name || target.sk_megn)
