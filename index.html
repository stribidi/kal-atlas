    /* ===================================================================
       Talismans

       Reproduces KalEncyclopedia's "Database - Items - Talizmans" page.
       The talisman list is ITEMS where ita_itype = 6. Everything else is
       recovered from frmTalis:

         Name / Effective    literal, switched on the first token of ita_type
         Props               ita_rev verbatim for the four enchant ladders;
                             for a paired talisman, ita_rev is
                             prefixA|chanceA|prefixB|chanceB and each prefix's
                             pre_rev decodes through the 27-slot stat vector
         Chance              a literal ladder for TaoA/TaoM/ToA/ToD, and the
                             two per-roll percentages out of ita_rev otherwise
         Icon                imgOthers.Images(ita_pic), exported as
                             kalenc-talisman-00N.png

       One deliberate deviation: the original compares Left(ita_type, 4)
       against 'ToW' and so never matches any real Talisman of Wonder row,
       leaving the previous selection's name, target and chance on screen.
       Matching on the first token fixes that.
       =================================================================== */
    const TALISMAN_FAMILIES = {
      TaoA: { name: "Talisman of Attack", effective: "Weapons",
        chance: [100, 100, 100, 100, 92, 82, 70, 56, 40, 32, 23, 15, 7, 2, 1, 0.2, 0.05, 0.01] },
      TaoM: { name: "Talisman of Magic", effective: "Weapons",
        chance: [100, 100, 100, 100, 92, 82, 70, 56, 40, 32, 23, 15, 7, 2, 1, 0.2, 0.05, 0.01] },
      ToA: { name: "Talisman of Accuracy", effective: "Weapons",
        chance: [100, 67, 38, 15, 9, 0.5, 0.1] },
      ToD: { name: "Talisman of Defense", effective: "Armor",
        chance: [100, 89, 53, 33, 20, 12, 8, 4, 2, 0.5, 0.1, 0.01] },
      ToI: { name: "Talisman of Intensification", effective: "Weapons" },
      ToP: { name: "Talisman of Protection", effective: "Armor" },
      ToW: { name: "Talisman of Wonder", effective: "Accessories" }
    };

    function talismanRows() {
      if (state.indexes.talismans) return state.indexes.talismans;
      const prefixesByAzon = new Map((state.optional.legacyPrefixes || [])
        .map(row => [String(row.pre_azon), row]));
      const slots = state.combat?.stat_slots || [];

      const decodePrefix = azon => {
        const prefix = prefixesByAzon.get(String(azon));
        if (!prefix) return null;
        const effects = String(prefix.pre_rev || "").split("|")
          .map((value, index) => [slots[index] || `slot ${index}`, value])
          .filter(([, value]) => value !== "" && value != null)
          .map(([stat, value]) => ({ stat, value: Number(value) }));
        return { azon: String(azon), name: prefix.pre_name, grade: prefix.pre_grd, effects };
      };

      state.indexes.talismans = (state.optional.legacyItems || [])
        .filter(row => String(row.ita_itype) === "6")
        .map(row => {
          const familyKey = String(row.ita_type || "").trim().split(/\s+/)[0];
          const family = TALISMAN_FAMILIES[familyKey] || {};
          const subtype = String(row.ita_type || "").trim().slice(familyKey.length).trim();
          const parts = String(row.ita_rev || "").includes("|")
            ? String(row.ita_rev).split("|") : null;
          const rolls = parts ? [
            { prefix: decodePrefix(parts[0]), chance: Number(parts[1]) },
            { prefix: decodePrefix(parts[2]), chance: Number(parts[3]) }
          ].filter(roll => roll.prefix) : [];
          return {
            id: String(row.ita_azon),
            type: row.ita_type || "",
            familyKey,
            subtype,
            listName: row.ita_name || "",
            name: family.name || row.ita_name || "",
            effective: family.effective || "",
            icon: `kalenc-talisman-${String(Number(row.ita_pic) || 0).padStart(3, "0")}`,
            // The four enchant ladders keep ita_rev as written; it is display
            // text, not a vector.
            propsText: parts ? "" : String(row.ita_rev || ""),
            rolls,
            chance: parts ? rolls.map(roll => roll.chance) : (family.chance || [])
          };
        })
        .sort((left, right) => left.type.localeCompare(right.type, "en")
          || Number(left.id) - Number(right.id));
      return state.indexes.talismans;
    }

    function talismanEffectText(effects) {
      return effects.map(effect =>
        `${escapeHtml(effect.stat)} ${effect.value >= 0 ? "+" : ""}${prettyNumber(effect.value)}`
      ).join(" · ");
    }

    function formatChanceList(values) {

    function dropPairKey(monsterName, itemName) {
      return `${normalizeName(monsterName)}~${normalizeName(itemName)}`;
    }

    function currentRateRows(bangoDrop) {
      // A Forest/dungeon collision record joins through its own legacy row —
      // record 205's rates are "Devil Troop of Desire D1"'s, not the Forest
      // monster's. See buildD1Overrides.
      const override = state.indexes.legacyVariantsByRecordId?.get(String(bangoDrop.drp_monst));
      const rows = state.indexes.legacyDropsByPairName?.get(
        dropPairKey(override ? override[0].mon_name : bangoDrop.bango_monster_name,
          bangoDrop.bango_item_name)
      ) || [];
      // A money drop (Zamogeon, joined through legacy "Geons") stores the
      // dropped amount in the legacy row's drp_rev; a Bango row is one
      // amount, so only the legacy row for that amount is its rate.
      if (state.indexes.amountMatchedAliasNames?.has(normalizeName(bangoDrop.bango_item_name))) {
        return rows.filter(row =>
          String(row.drp_rev ?? "").trim() === String(bangoDrop.bango_value ?? "").trim());
      }
      return rows;
    }

    function legacyRate(row) {
      const chance1 = Number(row.drp_chance1);
      const chance2 = Number(row.drp_chance2);
      if (!Number.isFinite(chance1) || !Number.isFinite(chance2)) return null;
      return chance1 * chance2 / 100;
    }

    function formatPercent(value) {
      if (!Number.isFinite(value)) return "—";
      const precision = value >= 10 ? 2 : value >= 1 ? 3 : 5;
      return `${Number(value.toFixed(precision)).toLocaleString("en-US")}%`;
    }

    const LEGACY_TALISMAN_ALIASES = {
      wonderingknights: "wanderingknights",
      wonderingarchers: "wanderingarchers"
    };

    function talismanForRateRow(rateRow) {
      const raw = String(rateRow.drp_rev || "").trim();
      if (!raw || /^\d+$/.test(raw)) return null;
      const normalized = normalizeName(raw);
      return state.indexes.prefixesByName.get(
        LEGACY_TALISMAN_ALIASES[normalized] || normalized
      ) || null;
    }

    function dropVariantCell(rateRow) {
      const raw = String(rateRow.drp_rev || "").trim();
      if (!raw) return `<span class="dim">plain</span>`;

      const talisman = talismanForRateRow(rateRow);
      if (talisman) return entityLink("prefix", talisman.pre_azon, talisman.pre_name);
      if (/^\d+$/.test(raw)) return `<span class="dim">plain</span>`;
      return escapeHtml(raw);
    }

    /* ── Sortable tables ───────────────────────────────────────────────
       A column is {key, label, cell(row), sort(row), align, width}. `sort`
       returns the value to order by; a missing one makes the column inert.
       Numbers sort numerically, everything else alphabetically, and blanks
       always sink to the bottom whichever direction is active. */
    function sortableTable(id, columns, rows, options = {}) {
      state.sortableTables.set(id, {
        columns, rows,
        sort: state.sortableTables.get(id)?.sort
          || (options.defaultSort ? { ...options.defaultSort } : null)
      });
      return `<div class="table-wrap" id="${escapeAttr(id)}">${sortableTableInner(id)}</div>`;
    }

    function sortableCompare(left, right) {
      const leftBlank = left === null || left === undefined || left === "";
      const rightBlank = right === null || right === undefined || right === "";
      if (leftBlank || rightBlank) return leftBlank && rightBlank ? 0 : (leftBlank ? 1 : -1);
      if (typeof left === "number" && typeof right === "number") return left - right;
      return String(left).localeCompare(String(right), "en", { numeric: true });
    }

    function sortableTableInner(id) {
      const table = state.sortableTables.get(id);
      if (!table) return "";
      const { columns, rows, sort } = table;
      let ordered = rows;
      if (sort) {
        const column = columns.find(entry => entry.key === sort.key);
        if (column?.sort) {
          // Blank-sinking is direction-independent, so reverse only the
          // comparisons between two present values.
          ordered = rows.map((row, index) => ({ row, index })).sort((left, right) => {
            const a = column.sort(left.row);
            const b = column.sort(right.row);
            const blank = value => value === null || value === undefined || value === "";
            if (blank(a) || blank(b)) return sortableCompare(a, b) || left.index - right.index;
            return (sort.dir === "desc" ? -1 : 1) * sortableCompare(a, b)
              || left.index - right.index;
          }).map(entry => entry.row);
        }
      }
      return `<table class="sortable">
        <thead><tr>${columns.map(column => {
          if (!column.sort) {
            return `<th${column.align ? ` class="num"` : ""}>${escapeHtml(column.label)}</th>`;
          }
          const active = sort?.key === column.key;
          const next = active && sort.dir === "asc" ? "desc" : "asc";
          return `<th${column.align ? ` class="num"` : ""}>
            <button type="button" class="sort-head${active ? ` sorted ${sort.dir}` : ""}"
              data-sort-table="${escapeAttr(id)}" data-sort-key="${escapeAttr(column.key)}"
              data-sort-dir="${next}"
              aria-label="Sort by ${escapeAttr(column.label)}, ${next === "asc" ? "ascending" : "descending"}">
              ${escapeHtml(column.label)}<span class="sort-mark" aria-hidden="true"></span>
            </button></th>`;
        }).join("")}</tr></thead>
        <tbody>${ordered.map(row => `<tr>${columns.map(column =>
          `<td${column.align ? ` class="num"` : ""}>${column.cell(row)}</td>`).join("")}</tr>`).join("")}
        </tbody></table>`;
    }

    function applyTableSort(id, key, dir) {
      const table = state.sortableTables.get(id);
      if (!table) return;
      table.sort = { key, dir };
      const host = document.getElementById(id);
      if (!host) return;
      host.innerHTML = sortableTableInner(id);
      hydrateIcons(host);
    }

    /* The client's own attribute keys, given the names the game shows the
       player. Anything not listed keeps its raw key rather than receiving an
       invented label. */
    const ITEM_ATTRIBUTE_LABELS = {
      Attack: "Attack", Magic: "Magic attack", defense: "Defense", absorb: "Absorption",
      hit: "On target point", dodge: "Evasion", aspeed: "Attack speed",
      mspeed: "Movement speed", hp: "HP", mp: "MP",
      Str: "Strength", Hth: "Health", Int: "Intelligence", Wis: "Wisdom", Dex: "Agility",
      resistfire: "Fire resistance", resistice: "Ice resistance",
      resistlitning: "Lightning resistance", resistpalsy: "Paralysis resistance",
      resistcurse: "Curse resistance",
      buff: "Grants buff", quest: "Quest item", refresh: "Restores",
      teleport: "Teleports to", charming: "Special effect", protect: "Protects",
      repair: "Repairs", revival: "Revives", haveItems: "Contains"
    };

    /* Attributes the player has no use for on an item page: they describe how
       the client wires the item up, not what it does. */
    const HIDDEN_ITEM_ATTRIBUTES = new Set(["Changeprefix", "gstate", "MonsterSpawn"]);

    function itemAttributeLabel(attribute) {
      return ITEM_ATTRIBUTE_LABELS[attribute] || attribute;
    }

    function gradeNumber(value) {
      const match = /(\d+)/.exec(String(value || ""));
      return match ? Number(match[1]) : null;
    }

    /* One row per drop variant. The Bango table proves the association and the
       matched KalEncyclopedia pair supplies each base/talisman variant's rate
       (AGENTS.md standing rule 11). */
    function bangoDropTable(rows, perspective) {
      if (!rows.length) return emptyState("Nothing is known to drop here.");
      const entries = rows.flatMap(row => {
        const rateRows = currentRateRows(row);
        return rateRows.length
          ? rateRows.map(rateRow => ({ row, rateRow, rate: legacyRate(rateRow) }))
          : [{ row, rateRow: null, rate: null }];
      });

      const rateColumn = {
        key: "rate", label: "Chance", align: true,
        sort: entry => (Number.isFinite(entry.rate) ? entry.rate : ""),
        cell: entry => entry.rate === null
          ? `<span class="dim" title="This pairing has no confirmed rate.">—</span>`
          : `<b>${formatPercent(entry.rate)}</b>`
      };
      const talismanColumn = {
        key: "talisman", label: "Talisman",
        sort: entry => entry.rateRow ? (talismanForRateRow(entry.rateRow)?.pre_name || "") : "",
        cell: entry => entry.rateRow ? dropVariantCell(entry.rateRow) : `<span class="dim">—</span>`
      };

      if (perspective === "monster") {
        const itemFor = entry => state.indexes.itemsById.get(String(entry.row.drp_item));
        return sortableTable("dropTable", [
          {
            key: "item", label: "Item",
            sort: entry => entry.row.bango_item_name || "",
            cell: entry => {
              const item = itemFor(entry);
              return `<span class="cell-icon">${iconTag(item?.bango_image || "",
                entry.row.bango_item_name || "", 24)}${entityLink("item", entry.row.drp_item,
                entry.row.bango_item_name || `Item ${entry.row.drp_item}`)}</span>`;
            }
          },
          {
            key: "class", label: "Class",
            sort: entry => itemFor(entry)?.ita_class || "",
            cell: entry => escapeHtml(itemFor(entry)?.ita_class || "—")
          },
          {
            key: "grade", label: "Grade", align: true,
            sort: entry => gradeNumber(itemFor(entry)?.ita_grade),
            cell: entry => {
              const grade = itemFor(entry)?.ita_grade;
              return grade ? `<span class="tag gold">${displayGrade(grade)}</span>`
                : `<span class="dim">—</span>`;
            }
          },
          {
            key: "level", label: "Req. level", align: true,
            sort: entry => Number(itemFor(entry)?.ita_lvllim) || "",
            cell: entry => escapeHtml(itemFor(entry)?.ita_lvllim || "—")
          },
          talismanColumn,
          rateColumn
        ], entries, { defaultSort: { key: "grade", dir: "desc" } });
      }

      const monsterFor = entry =>
        legacyMonsterVariantsForRecord(entry.row.drp_monst, entry.row.bango_monster_name);
      return sortableTable("dropTable", [
        {
          key: "monster", label: "Monster",
          sort: entry => entry.row.bango_monster_name || "",
          cell: entry => `<span class="cell-icon">${monsterIconTag(entry.row.drp_monst,
            entry.row.bango_monster_name, 24)}${entityLink("monster", entry.row.drp_monst,
            entry.row.bango_monster_name || `Monster ${entry.row.drp_monst}`)}</span>`
        },
        {
          key: "level", label: "Level", align: true,
          sort: entry => Number(monsterFor(entry)[0]?.mon_lvl) || "",
          cell: entry => escapeHtml(legacyVariantRange(monsterFor(entry), "mon_lvl") || "—")
        },
        talismanColumn,
        rateColumn
      ], entries, { defaultSort: { key: "rate", dir: "desc" } });
    }

    function articlesMentioning(exactName) {
      if (String(exactName).length < 6) return [];
      const needle = String(exactName).toLowerCase();
      return state.articles.filter(article => article.text.toLowerCase().includes(needle));
    }

    function relatedArticles(kind, id, exactName = "") {
      const indexed = state.indexes.articleMentions.get(`${kind}:${id}`) || [];
      const unique = [...new Map([...indexed, ...articlesMentioning(exactName)].map(article => [article.path, article])).values()];
      if (!unique.length) return "";
      return `<ul class="link-list">${unique.map(article => `
        <li><a href="${routeHref("article", article.path)}">${escapeHtml(article.title)}</a></li>`
      ).join("")}</ul>`;
    }

    function extractDropDocumentation(article) {
      const lines = article.text.split(/\r?\n/);
      const sections = [];
      for (let index = 0; index < lines.length; index += 1) {
        const heading = lines[index].match(/^(#{1,6})\s+(.+)$/);
        if (!heading || !/\b(drop|loot)\b/i.test(heading[2])) continue;
        const level = heading[1].length;
        const block = [lines[index]];
        index += 1;
        while (index < lines.length) {
          const next = lines[index].match(/^(#{1,6})\s+/);
          if (next && next[1].length <= level) {
            index -= 1;
            break;
          }
          block.push(lines[index]);
          index += 1;
        }
        sections.push(block.join("\n").trim());
      }
      return sections.filter(Boolean);
    }

    function renderDropEvidenceBlocks(evidence, emptyMessage) {
      const unique = [...new Map(evidence.map(entry => [`${entry.article.path}~${entry.markdown}`, entry])).values()];
      if (!unique.length) return emptyState(emptyMessage);
      return unique.map(({ article, markdown }) => `
        <div class="callout info" style="margin-bottom:14px">
          <strong>${escapeHtml(article.title)}</strong>
          <div class="article">${renderMarkdown(markdown, article.path)}</div>
          <p>${entityLink("article", article.path, "Open full source article →")}</p>
        </div>`).join("");
    }

    function documentedDropEvidence(exactName) {
      const evidence = articlesMentioning(exactName).flatMap(article =>
        extractDropDocumentation(article).map(markdown => ({ article, markdown }))
      );
      return renderDropEvidenceBlocks(
        evidence,
        "No registered Bango article both names this entity and contains a drop/loot section."
      );
    }

    function documentedItemDropEvidence(item, drops) {
      const direct = articlesMentioning(item.ita_name || "").flatMap(article =>
        extractDropDocumentation(article).map(markdown => ({ article, markdown }))
      );
      const itemTokens = String(item.ita_name || "").toLowerCase()
        .match(/[a-z0-9]+/g)?.filter(token => token.length >= 4 && !["with", "from"].includes(token)) || [];
      const viaDroppers = [];

      for (const drop of drops) {
        const monster = state.indexes.monstersById.get(String(drop.drp_monst));
        if (!monster) continue;
        for (const article of articlesMentioning(monster.text)) {
          for (const markdown of extractDropDocumentation(article)) {
            const sectionTokens = markdown.toLowerCase().match(/[a-z0-9]+/g) || [];
            const matches = itemTokens.filter(itemToken =>
              sectionTokens.some(sectionToken => sectionToken.startsWith(itemToken) || itemToken.startsWith(sectionToken))
            );
            const threshold = itemTokens.length === 1 ? 1 : 2;
            if (matches.length >= threshold) viaDroppers.push({ article, markdown });
          }
        }
      }

      return renderDropEvidenceBlocks(
        [...direct, ...viaDroppers],
        "No registered Bango drop/loot section can be joined to this item by exact item mention or by a documented Bango dropper plus item-name tokens."
      );
    }

    function renderItem(id) {
      const row = state.indexes.itemsById.get(String(id));
      if (!row) return renderNotFound("item", id);
      const attributes = state.indexes.itemAttributes.get(String(id)) || [];
      const drops = state.indexes.dropsByItem.get(String(id)) || [];
      const questRefs = state.indexes.questsByItem.get(String(id)) || [];
      const legacyItem = legacyItemForBango(row);
      const previewName = kalencItemPreviewName(row, legacyItem);
      const classes = parseJson(row.bango_class_json, []);
      const codes = parseJson(row.bango_code_json, []);
      const limits = parseJson(row.bango_limit_json, []);
      const specialties = parseJson(row.bango_specialty_json, []);

      const documented = documentedItemDropEvidence(row, drops);
      const articles = relatedArticles("item", id, row.ita_name || "");
      const isArmorSet = previewName?.startsWith("kalenc-armor-preview-");
      const model = modelForItem(id);
      const headline = [
        row.ita_class || classes.join(" / "),
        row.ita_grade ? displayGrade(row.ita_grade) : "",
        row.ita_lvllim ? `level ${escapeHtml(row.ita_lvllim)}+` : ""
      ].filter(Boolean).join(" · ");

      el.main.innerHTML = `
        ${pageHeader({
          eyebrow: "Item",
          title: row.ita_name || `Item ${id}`,
          lede: headline,
          crumbs: [["Overview", "#/home"], ["Items", "#/items"], [row.ita_name || String(id), ""]]
        })}
        <div class="detail-grid">
          <div>
            ${panel("Stats", `${statLines([
              ["Class", escapeHtml(row.ita_class || classes.join(" / ") || "")],
              ["Grade", row.ita_grade ? displayGrade(row.ita_grade) : ""],
              ["Required level", escapeHtml(row.ita_lvllim || "")],
              ["Buy price", row.ita_price ? prettyNumber(row.ita_price) : ""],
              ["Sell value", row.bango_sell ? prettyNumber(row.bango_sell) : ""],
              ["Endurance", escapeHtml(row.bango_endurance || "")],
              ...attributes
                .filter(attribute => !HIDDEN_ITEM_ATTRIBUTES.has(attribute.attribute))
                .map(attribute => [itemAttributeLabel(attribute.attribute),
                  escapeHtml(parseJson(attribute.values_json, []).join(" / "))])
            ])}${row.bango_description
              ? `<p class="item-flavour">${escapeHtml(cleanText(row.bango_description))}</p>` : ""}`)}
            ${panel("Dropped by", bangoDropTable(drops, "item"),
              { aside: `<span class="panel-aside">Click a column to sort</span>` })}
            ${questRefs.length ? panel("Used in quests", `
              <div class="table-wrap"><table>
                <thead><tr><th>Quest</th><th class="num">Step</th><th class="num">Count</th></tr></thead>
                <tbody>${questRefs.map(ref => {
                  const quest = state.indexes.questsById.get(String(ref.que_id));
                  return `<tr><td>${quest
                    ? entityLink("quest", quest.que_id, quest.que_name)
                    : escapeHtml(`Quest ${ref.que_id}`)}</td>
                    <td class="num">${escapeHtml(ref.step_index)}</td>
                    <td class="num">${escapeHtml(ref.count)}</td></tr>`;
                }).join("")}</tbody></table></div>`) : ""}
          </div>
          <div class="detail-side">
            <div class="entity-hero${isArmorSet ? " tall" : ""}">
              <span class="entity-portrait">${previewImageTag(previewName,
                row.bango_image || "", row.ita_name || "")}</span>
              ${isArmorSet ? "" : `<div><strong>${escapeHtml(row.ita_name || "")}</strong>
                ${headline ? `<br><span class="dim">${headline}</span>` : ""}</div>`}
            </div>
            ${model ? panel("3D model", modelViewerHtml(model),
              { aside: `<span class="panel-aside">Drag to turn</span>` }) : ""}
            ${articles ? panel("Guides", articles) : ""}
          </div>
        </div>
        ${provenanceFooter(`
          <p>Item stats come from the current Bango client tables. Drop chances come from the
            KalEncyclopedia database, which is confirmed to match Bango's rates.</p>
          ${isArmorSet ? `<p>Armor pieces are shown as the full set portrait for this class and
            grade, which is how the original KalEncyclopedia displayed them.</p>` : ""}
          ${legacyItem ? `<p>A same-name KalEncyclopedia item exists
            (grade ${escapeHtml(legacyItem.ita_grade || "—")},
            type ${escapeHtml(legacyItem.ita_type || "—")}).</p>` : ""}
          ${state.indexes.aliasLegacyNameByBangoName?.get(normalizeName(row.ita_name)) ? `<p>The
            KalEncyclopedia database records this item as
            &ldquo;${escapeHtml(state.indexes.aliasLegacyNameByBangoName.get(normalizeName(row.ita_name)))}&rdquo;;
            its drop rates are joined under that name.</p>` : ""}
          ${specialties.length ? `<details><summary>Client record</summary><pre>${
            escapeHtml(JSON.stringify(specialties, null, 2))}</pre></details>` : ""}
          ${codes.length || limits.length ? `<p>Client codes ${escapeHtml(codes.join(" · ") || "—")};
            native limits ${escapeHtml(limits.join(" · ") || "—")}.</p>` : ""}
          ${documented && !/class="empty"/.test(documented) ? `<div>${documented}</div>` : ""}`)}`;
      if (model) wireModelViewer(el.main, model);
    }

    /* One Bango monster name can cover several legacy rows — see the family
       join in buildIndexes. These four helpers are the only way the rest of
       the app reaches them, so nothing can go back to assuming one row. */

    function legacyVariantRank(row) {
      return Number(String(row?.mon_name ?? "").trim().match(/\s(\d+)$/)?.[1]) || 0;
    }

    function legacyMonsterVariants(name) {
      return state.indexes.legacyMonsterVariants?.get(normalizeName(name)) || [];
    }

    /* Record-aware resolution: the 14 Forest/dungeon collisions are keyed by
       the Bango record id (see buildD1Overrides); everything else falls back
       to the name family. Callers that know which record they hold must come
       through here, or record 205 wears record 52's legacy row again. */
    function legacyMonsterVariantsForRecord(recordId, name) {
      return state.indexes.legacyVariantsByRecordId?.get(String(recordId))
        || legacyMonsterVariants(name);
    }

    /* Splits the Forest/dungeon pairs that share one Bango display name where
       the legacy export keeps a trailing "D1". The rule is deliberately
       narrow: exactly one plain legacy row, exactly one "X D1" row and
       exactly two Bango records, assigned by whichever record-to-legacy
       pairing has the larger total drop-list overlap — and only when that
       strictly beats the swapped pairing, so a tie decides nothing. The same
       rule runs in Python with the row-level evidence and the quest-indicator
       corroboration in tools\monster_d1_disambiguation\; the dungeon records
       are the contiguous Bango block 198–211. */
    function buildD1Overrides(ix, t, o, monsterMessages) {
      const overrides = new Map();
      const d1Rows = (o.legacyMonsters || [])
        .filter(row => /\s+D1$/.test(String(row.mon_name ?? "").trim()));
      if (!d1Rows.length) return overrides;
      const recordsByName = new Map();
      (monsterMessages || []).forEach(row =>
        mapPush(recordsByName, normalizeName(row.text), String(row.message_id)));
      const dropSet = (map, key) => {
        if (!map.has(key)) map.set(key, new Set());
        return map.get(key);
      };
      const bangoDropItems = new Map();
      (t.drops || []).forEach(row =>
        dropSet(bangoDropItems, String(row.drp_monst)).add(normalizeName(row.bango_item_name)));
      const legacyDropItems = new Map();
      (o.legacyDrops || []).forEach(row => {
        const item = ix.legacyItemsById.get(String(row.drp_item));
        if (item) dropSet(legacyDropItems, String(row.drp_monst)).add(normalizeName(item.ita_name));
      });
      const overlap = (left, right) => {
        let count = 0;
        for (const value of left || []) if (right?.has(value)) count += 1;
        return count;
      };
      for (const d1 of d1Rows) {
        const base = String(d1.mon_name).trim().replace(/\s+D1$/, "");
        const baseKey = normalizeName(base);
        const plainRows = (ix.legacyMonsterVariants.get(baseKey) || [])
          .filter(row => normalizeName(row.mon_name) === baseKey);
        const records = (recordsByName.get(baseKey) || [])
          .slice().sort((left, right) => Number(left) - Number(right));
        if (plainRows.length !== 1 || records.length !== 2) continue;
        const plain = plainRows[0];
        const [low, high] = records;
        const straight = overlap(bangoDropItems.get(low), legacyDropItems.get(String(plain.mon_azon)))
          + overlap(bangoDropItems.get(high), legacyDropItems.get(String(d1.mon_azon)));
        const swapped = overlap(bangoDropItems.get(low), legacyDropItems.get(String(d1.mon_azon)))
          + overlap(bangoDropItems.get(high), legacyDropItems.get(String(plain.mon_azon)));
        if (straight === swapped) continue;
        overrides.set(straight > swapped ? low : high, [plain]);
        overrides.set(straight > swapped ? high : low, [d1]);
      }
      return overrides;
    }

    // For the few things that genuinely do not vary between variants — the
    // portrait, whether any stats exist at all.
    function legacyMonsterFor(name) {
      return legacyMonsterVariants(name)[0] || null;
    }

    // The variants of a family differ on every stat, so a single number would
    // be a silent pick between them. Identical values collapse; different
    // ones stay a range. Nothing is invented and nothing is chosen.
    function legacyVariantRange(variants, field, format = value => String(value)) {
      const values = [variants].flat()
        .map(row => String(row?.[field] ?? "").trim()).filter(Boolean);
      if (!values.length) return "";
      const numbers = values.map(Number);
      if (numbers.every(Number.isFinite)) {
        const low = Math.min(...numbers);
        const high = Math.max(...numbers);
        return low === high ? format(low) : `${format(low)}–${format(high)}`;
      }
      const unique = [...new Set(values)];
      return unique.map(format).join(" / ");
    }

    /* Attack, on-target and evasion are shown derived, because the stored
       columns are additive macros (see simMonsterDerived). A row without
       Strength or Agility cannot be derived, so it shows the stored numbers
       and says they are the macro rather than quietly passing them off as the
       monster's real attack. */
    function legacyMonsterStats(row) {
      const derivable = ["mon_lvl", "mon_str", "mon_agi"]
        .every(field => String(row[field] ?? "").trim() !== "");
      const derived = derivable ? simMonsterDerived(row) : null;
      const attack = derived
        ? `${prettyNumber(derived.minAttack)}–${prettyNumber(derived.maxAttack)}`
        : (row.mon_minatt || row.mon_maxatt
            ? `${row.mon_minatt}–${row.mon_maxatt} (macro only)` : "");
      const fields = [
        ["Level", row.mon_lvl],
        ["HP", row.mon_hp && prettyNumber(row.mon_hp)],
        ["EXP", row.mon_exp && prettyNumber(row.mon_exp)],
        ["Attack", attack],
        ["On target point", derived ? prettyNumber(derived.hit) : ""],
        ["Evasion", derived ? prettyNumber(derived.dodge) : ""],
        ["Defense", row.mon_def1 || row.mon_def2 ? `${row.mon_def1} / ${row.mon_def2}` : ""],
        ["Absorb", row.mon_absorb ? `${row.mon_absorb}%` : ""],
        ["Attack speed", row.mon_attspd],
        ["Strength", row.mon_str],
        ["Health", row.mon_hea],
        ["Intelligence", row.mon_int],
        ["Wisdom", row.mon_wis],
        ["Agility", row.mon_agi]
      ];
      return statLines(fields.map(([label, value]) => [label, escapeHtml(String(value ?? ""))]))
        + (derived ? `<p class="dim" style="margin:8px 0 0"><small>Attack, on-target
          point and evasion are derived from Strength, Agility and level and then
          the stored value added — that stored value is an additive macro
          (${escapeHtml(`+${derived.macro.minAttack}/+${derived.macro.maxAttack} attack, `
            + `+${derived.macro.hit} on target, +${derived.macro.dodge} evasion`)}),
          not the monster's finished stat.</small></p>` : "");
    }

    /* ===================================================================
       Build simulator and combat model.

       Three sources meet here and the UI must never blend them silently:
         character sheet ....... [KALENC-2011]  KalOnline_Simulator_Formulas.md
         hit / damage pipeline . [ORIG] 2006    KalOnline_Engine_Formulas.md
         monster stats ......... tier-5 legacy export, NOT Bango, and its
                                 hit/dodge/attack columns are additive macros
                                 finished by the [REIMPL] CMonster derivation

       Every lookup table and per-level band comes from COMBAT_FIXTURE.json,
       which is generated from the Python engine. No game constant is written
       in this file.
       =================================================================== */

    /* The starting example is the one character in this project that was
       actually measured in game — the naked level-38 Magician in
       `calibration\OBSERVED_SHEETS.csv`. It used to be an invented set of
       numbers, which now that the page shows a stat budget would greet every
       new visitor with a red "over budget" warning on a character that cannot
       exist. This one spends exactly 190 of its 190 points. */
    const DEFAULT_BUILD = {
      cls: "Magician", position: "", level: 38,
      Strength: 8, Health: 70, Intelligence: 77, Wisdom: 50, Agility: 8,
      items: {}, prefixes: {}, manual: {},
      questPercent: 0, petDamage: 0, petDefense: 0, petEvasion: 0,
      doubleHp: false
    };

    const PRIMARY_STATS = ["Strength", "Health", "Intelligence", "Wisdom", "Agility"];

    /* ── Stat points ────────────────────────────────────────────────────
       Everything here is read out of KalEncyclopedia's own character planner
       (frmSkills), not from a rule of thumb:

         lvl0Stats             the level-0 stat block per class, a 4x5 array
         CalcSTATP(level)      the point budget, 5 x level with three late steps
         txtCharLvl_TextChanged  the per-point cost loop and its two bands

       The five stat values in `data\PL_SAVE.csv` are the check: all eight saved
       builds come out spent to the point or within two of it, and none over
       budget — which would be impossible if any of the four tables were wrong.

       This agrees with the independent `[REIMPL]` reading in
       `KalOnline_Engine_Formulas.md` on both cost tables and on which stat each
       class gets cheap. Bango may have retuned any of it; nothing here is
       measured in play. */
    const STAT_BASE_BY_CLASS = {
      Archer:   { Strength: 14, Health: 10, Intelligence: 8,  Wisdom: 10, Agility: 18 },
      Knight:   { Strength: 18, Health: 16, Intelligence: 8,  Wisdom: 8,  Agility: 10 },
      Magician: { Strength: 8,  Health: 10, Intelligence: 18, Wisdom: 16, Agility: 8 },
      Thief:    { Strength: 14, Health: 10, Intelligence: 8,  Wisdom: 10, Agility: 18 }
    };
    // One stat per class costs less. Health and Wisdom are always full price.
    const DISCOUNTED_STAT_BY_CLASS = {
      Archer: "Agility", Knight: "Strength", Magician: "Intelligence", Thief: "Agility"
    };
    // Cost of the point that *reaches* this value; above the last band it is 7.
    const STAT_COST_BANDS = {
      standard:   [[50, 1], [70, 2], [90, 3], [110, 4], [130, 5], [150, 6]],
      discounted: [[60, 1], [90, 2], [120, 3], [150, 4], [180, 5], [210, 6]]
    };
    const STAT_COST_ABOVE_BANDS = 7;

    function statBaseFor(cls, stat) {
      return STAT_BASE_BY_CLASS[cls]?.[stat] ?? 0;
    }

    function statPointCost(value, discounted) {
      const bands = discounted ? STAT_COST_BANDS.discounted : STAT_COST_BANDS.standard;
      const band = bands.find(([limit]) => value <= limit);
      return band ? band[1] : STAT_COST_ABOVE_BANDS;
    }

    function statPointsSpent(cls, stat, value) {
      const base = statBaseFor(cls, stat);
      const discounted = DISCOUNTED_STAT_BY_CLASS[cls] === stat;
      let total = 0;
      for (let step = base + 1; step <= Number(value); step += 1) {
        total += statPointCost(step, discounted);
      }
      return total;
    }

    // CalcSTATP: 5 per level, plus a second point per level from 72, a third
    // from 76 and a fourth from 81.
    function statPointsAtLevel(level) {
      const value = Math.max(0, Number(level) || 0);
      let total = 5 * value;
      if (value >= 72) total += (value - 71) * 2;
      if (value >= 76) total += value - 75;
      if (value >= 81) total += value - 80;
      return total;
    }

    function characterStatLedger(build) {
      const cls = build.cls;
      const known = Boolean(STAT_BASE_BY_CLASS[cls]);
      const rows = PRIMARY_STATS.map(stat => {
        const value = Number(build[stat]) || 0;
        const base = statBaseFor(cls, stat);
        const discounted = DISCOUNTED_STAT_BY_CLASS[cls] === stat;
        return {
          stat, value, base, discounted,
          belowBase: known && value < base,
          spent: known ? statPointsSpent(cls, stat, value) : 0,
          next: known ? statPointCost(value + 1, discounted) : 0
        };
      });
      const spent = rows.reduce((total, row) => total + row.spent, 0);
      const total = statPointsAtLevel(build.level);
      return { known, rows, spent, total, available: total - spent,
        belowBase: rows.filter(row => row.belowBase) };
    }

    function statLedgerHtml(build) {
      const ledger = characterStatLedger(build);
      if (!ledger.known) {
        return `<div class="callout"><strong>No stat budget for ${escapeHtml(build.cls)}.</strong>
          The level-0 stat block was recovered for Archer, Knight, Magician and Thief only.</div>`;
      }
      const over = ledger.available < 0;
      return `<div class="point-ledger three${over ? " over-budget" : ""}">
          <div><span>Points left</span><strong>${prettyNumber(ledger.available)}</strong></div>
          <div><span>Spent</span><strong>${prettyNumber(ledger.spent)}</strong></div>

            prettyNumber(ledger.total)}</strong></div>

          prettyNumber(-ledger.available)} point${ledger.available === -1 ? "" : "s"}.</strong>

          raise the level.</div>` : ""}
        ${ledger.belowBase.length ? `<div class="callout warn"><strong>Below the starting
          block.</strong> ${escapeHtml(ledger.belowBase.map(row =>

        <div class="table-wrap"><table class="stat-cost-table">
          <thead><tr><th>Stat</th><th class="num">Start</th><th class="num">Now</th>
            <th class="num">Points</th><th class="num">Next</th></tr></thead>
          <tbody>${ledger.rows.map(row => `<tr>
            <td>${escapeHtml(row.stat)}${row.discounted
              ? ` <small class="dim">cheap</small>` : ""}</td>
            <td class="num">${prettyNumber(row.base)}</td>
            <td class="num${row.belowBase ? " danger" : ""}">${prettyNumber(row.value)}</td>

          A point costs more the higher the stat already is; ${escapeHtml(build.cls)} pays the

          Read out of KalEncyclopedia's planner — not measured on Bango.</small></p>`;
    }
    // Buffs used to be a tab of their own. They belong next to the sheet they
    // change, so they now live inside Stats.
    const CHARACTER_TABS = ["stats", "skills", "quests"];
    const REGISTERED_BUFFS = [
      { key: "archer-7", group: "Archer", icon: "kalenc-buff-chkcc", displayOnly: "Fatal Blow chance and power; the current sheet has no fatal-blow stat slot." },

        ] },

        { stat: "MDMin", parameter: 1 }, { stat: "MDMax", parameter: 1 }
      ] },

      { key: "mage-48", group: "Mage", icon: "kalenc-buff-chkstr", effects: [{ stat: "Strength", parameter: 0 }] },

      { key: "mage-50", group: "Mage", icon: "kalenc-buff-chkagi", effects: [{ stat: "Agility", parameter: 0 }] },
      { key: "mage-51", group: "Mage", icon: "kalenc-buff-chkint", effects: [{ stat: "Intelligence", parameter: 0 }] }
    ];

    /* ===================================================================
       Passive skills that change the sheet.

       The Skills tab has always let a character allocate grades; none of it
       reached the character sheet. Bango's own client carries the per-grade
       formula for each of these as reverse-Polish in
       `bango_parameter_rpn_json`, so the value is read from the client rather
       than restated here — only the mapping from a formula slot to a sheet
       slot lives below, keyed by the skill's `bango_key` suffix so one entry
       covers every class that has the skill.

       A passive is registered ONLY where its own effect text names a stat this
       sheet has a slot for. Everything else — proc chances (Fatal Blow,
       Perfect Evasion, Critical Hit, Acrobatic), percentage effects with no
       slot (Shrewdness' evasion percent, Knight's short/long-distance defence,
       Blessing of Son of the Sky), range, healing and mana regeneration — is
       listed as unmodelled with the number it would give, rather than being
       pushed into whichever slot looks closest.

       `HP%` is a real slot in the 27-slot vector and `simMaxHp` already
       consumes it, so Life Extension's "Hp Revision: N %" is modelled there.
       =================================================================== */
    const PASSIVE_SHEET_EFFECTS = {
      // Suffix of the bango_key -> which formula slot feeds which sheet stat.
      "2": { byScope: {
        thief: [{ stat: "PDMax", parameter: 0 }, { stat: "PDMin", parameter: 1 }],
        archer: [{ stat: "PDMin", parameter: 0 }, { stat: "PDMax", parameter: 1 }],
        knight: [{ stat: "OTP", parameter: 0 },
                 { stat: "PDMin", parameter: 1 }, { stat: "PDMax", parameter: 1 }]
      } },
      "3": { scopes: ["thief"], effects: [{ stat: "OTP", parameter: 0 }] },
      "5": { scopes: ["archer"], effects: [{ stat: "OTP", parameter: 0 }] },
      "11": { scopes: ["mage"], effects: [{ stat: "MDMax", parameter: 0 }] },
      "15": { effects: [{ stat: "HP%", parameter: 0 }] },
      "17": { scopes: ["shaman"], effects: [{ stat: "MP", parameter: 0 }] },
      "23": { scopes: ["shaman"], effects: [{ stat: "Intelligence", parameter: 0 }] },
      "30": { effects: [{ stat: "HP%", parameter: 0 }] },
      "32": { scopes: ["mage"], effects: [{ stat: "HP%", parameter: 0 }] },
      "85": { effects: [{ stat: "OTP", parameter: 0 }] },
      "86": { effects: [{ stat: "Evasion", parameter: 0 }] },
      "87": { effects: [{ stat: "Defense", parameter: 0 }] }
    };

    function passiveSheetEffects(row) {
      const key = String(row?.bango_key || "");
      const [scope, suffix] = [key.split("-")[0], key.split("-").slice(1).join("-")];
      const entry = PASSIVE_SHEET_EFFECTS[suffix];
      if (!entry) return null;
      if (entry.byScope) return entry.byScope[scope] || null;
      if (entry.scopes && !entry.scopes.includes(scope)) return null;
      return entry.effects;
    }

    function skillIsPassive(row) {
      return /"passive"/.test(String(row?.bango_type_json || ""));
    }

    /* What the character's allocated passive grades add to the sheet, plus the
       passives that are allocated and deliberately not counted. */
    function passiveSkillVector(profile, build) {
      const stats = {};
      const applied = [];
      const unmodelled = [];
      const rows = state.indexes.playerSkillsByScope?.get(classSkillScope(build.cls)) || [];
      rows.forEach(row => {
        if (!skillIsPassive(row)) return;
        const grade = Number(profile?.skills?.[String(row.bango_key)]) || 0;
        if (grade <= 0) return;
        const formulas = parseJson(row.bango_parameter_rpn_json, []);
        const effects = passiveSheetEffects(row);
        if (!effects) {
          unmodelled.push({ row, grade,
            values: formulas.map(formula => evaluateRpn(formula, grade, build)) });
          return;
        }
        const entry = { row, grade, stats: {} };
        let resolved = 0;
        effects.forEach(effect => {
          const value = evaluateRpn(formulas[effect.parameter], grade, build);
          if (value == null || !Number.isFinite(value) || value === 0) return;
          resolved += 1;
          stats[effect.stat] = (stats[effect.stat] || 0) + value;
          entry.stats[effect.stat] = (entry.stats[effect.stat] || 0) + value;
        });
        if (resolved) applied.push(entry);
        else unmodelled.push({ row, grade, values: [], unreadable: true });
      });
      return { stats, applied, unmodelled };
    }

    function profileId() {
      if (globalThis.crypto?.randomUUID) return crypto.randomUUID();
      return `character-${Date.now()}-${Math.random().toString(16).slice(2)}`;
    }

    function cloneJson(value) {
      return JSON.parse(JSON.stringify(value));
    }

    function newCharacterProfile(name = "Character 1", build = null) {
      const id = profileId();
      return {
        id,
        name,
        build: Object.assign({}, cloneJson(DEFAULT_BUILD), build || {}, {
          items: cloneJson(build?.items || {}),
          prefixes: cloneJson(build?.prefixes || {}),
          manual: cloneJson(build?.manual || {}),
          equipmentMods: cloneJson(build?.equipmentMods || {})
        }),
        skills: {},
        quests: {},
        // Route rows the guide writes as a batch of several quests have no
        // single client quest to own their status, so they are ticked here.
        walkthrough: {},
        buffs: [],
        createdAt: new Date().toISOString(),
        updatedAt: new Date().toISOString()
      };
    }

    function loadProfiles() {
      if (state.profiles) return state.profiles;
      let saved = null;
      try { saved = JSON.parse(localStorage.getItem(PROFILE_STORAGE_KEY) || "null"); }
      catch (error) { saved = null; }
      if (!saved || saved.version !== 1 || !Array.isArray(saved.characters)
          || !saved.characters.length) {
        let oldBuild = null;
        try { oldBuild = JSON.parse(localStorage.getItem(BUILD_STORAGE_KEY) || "null"); }
        catch (error) { oldBuild = null; }
        const first = newCharacterProfile("Character 1", oldBuild);
        saved = { version: 1, activeId: first.id, characters: [first] };
      }
      saved.characters = saved.characters.map((profile, index) => {
        const normalized = Object.assign(newCharacterProfile(`Character ${index + 1}`), profile);
        normalized.build = Object.assign({}, cloneJson(DEFAULT_BUILD), profile.build || {}, {
          items: cloneJson(profile.build?.items || {}),
          prefixes: cloneJson(profile.build?.prefixes || {}),
          manual: cloneJson(profile.build?.manual || {}),
          equipmentMods: cloneJson(profile.build?.equipmentMods || {})
        });
        normalized.skills = cloneJson(profile.skills || {});
        normalized.quests = cloneJson(profile.quests || {});
        normalized.walkthrough = cloneJson(profile.walkthrough || {});
        normalized.buffs = Array.isArray(profile.buffs) ? cloneJson(profile.buffs) : [];
        return normalized;
      });
      if (!saved.characters.some(profile => profile.id === saved.activeId)) {
        saved.activeId = saved.characters[0].id;
      }
      state.profiles = saved;
      state.build = activeProfile().build;
      persistProfiles();
      renderProfileSwitcher();
      return saved;
    }

    function activeProfile() {
      const profiles = state.profiles || loadProfiles();
      return profiles.characters.find(profile => profile.id === profiles.activeId)
        || profiles.characters[0];
    }

    function persistProfiles() {
      if (!state.profiles) return;
      const profile = state.profiles.characters.find(item => item.id === state.profiles.activeId);
      if (profile) profile.updatedAt = new Date().toISOString();
      try { localStorage.setItem(PROFILE_STORAGE_KEY, JSON.stringify(state.profiles)); }
      catch (error) { /* private mode: profiles remain in memory for this visit */ }
    }

    function renderProfileSwitcher() {
      if (!el.profileSwitcher) return;
      const profiles = state.profiles || loadProfiles();
      const active = activeProfile();
      el.profileSwitcher.innerHTML = `
        <label for="activeCharacter">Playing as</label>
        <select id="activeCharacter" data-character-switch aria-label="Active character">
          ${profiles.characters.map(profile => `<option value="${escapeAttr(profile.id)}"${
            profile.id === active.id ? " selected" : ""}>${escapeHtml(profile.name)}</option>`).join("")}
        </select>`;
      const select = document.getElementById("activeCharacter");
      if (select) select.onchange = event => {
        profiles.activeId = event.currentTarget.value;
        state.build = activeProfile().build;
        persistProfiles();
        renderProfileSwitcher();
        if (state.ready) renderRoute();
      };
    }

    function createCharacter(copyActive = false) {
      const profiles = loadProfiles();
      const number = profiles.characters.length + 1;
      const source = copyActive ? cloneJson(activeProfile()) : null;
      const created = source
        ? Object.assign(source, {
            id: profileId(), name: `${source.name} copy`,
            createdAt: new Date().toISOString(), updatedAt: new Date().toISOString()
          })
        : newCharacterProfile(`Character ${number}`);
      profiles.characters.push(created);
      profiles.activeId = created.id;
      state.build = created.build;
      persistProfiles();
      renderProfileSwitcher();
      renderRoute();
    }

    function deleteActiveCharacter() {
      const profiles = loadProfiles();
      if (profiles.characters.length <= 1) return;
      const index = profiles.characters.findIndex(profile => profile.id === profiles.activeId);
      profiles.characters.splice(index, 1);
      profiles.activeId = profiles.characters[Math.max(0, index - 1)].id;
      state.build = activeProfile().build;
      persistProfiles();
      renderProfileSwitcher();
      renderRoute();
    }

    function simReady() { return Boolean(state.combat); }

    function simFix(value) { return Math.trunc(value); }
    function simCdiv(a, b) { return Math.trunc(a / b); }

    function simBandAt(arrayName, level) {
      const table = state.combat[arrayName];
      const index = Math.max(0, Math.min(table.length - 1, Math.trunc(level)));
      return table[index];
    }

    function simClassIndex(name) {
      const index = state.combat.class_order.indexOf(name);
      if (index < 0) throw new Error(`unknown class ${name}`);
      return index;
    }

    // --- Character sheet ------------------------------------------------
    //
    // [BANGO-MEASURED], tier 2 — the highest authority the project holds.
    // Each line is the formula that reproduced a real character sheet on
    // 2026-07-25 (level 38 Magician, naked). Where the two file sources
    // disagreed, the measurement chose:
    //   PDMin  -> REIMPL   (KALENC-2011 reads 1 high at Strength 8 and 9)
    //   MDMin, MDMax -> KALENC-2011  (REIMPL reads 3 high on both ends)
    //   Curse, NonElemental -> REIMPL  (KALENC-2011 derives neither)
    // See engine/bango_measured.py and calibration/OBSERVED_SHEETS.csv.

    function simDerived(str, hea, int_, wis, agi, level) {
      return {
        OTP: simFix(0.2777777777777778 * str) + simFix(agi / 8),
        Evasion: simFix(agi / 3),
        PDMin: 1 + simFix((11 * str - 80) / 30) + simFix((agi - 5) / 11)
             + simFix(7 * level / 10),
        PDMax: simFix((str - 5) * 8 / 15) + simFix((agi + 17) * 11 / 47)
             + level - 3,
        MDMin: simFix((int_ - 8) * 7 / 12) + simFix(wis / 7),
        MDMax: simFix(int_ * 7 / 12) + simFix(wis * 0.31249) - 3,
        Fire: simFix(int_ / 9),
        Ice: simFix(int_ / 9),
        Lightening: simFix(int_ / 9),
        NonElemental: simFix(hea / 9),
        Curse: simFix(wis / 9)
      };
    }

    // The 2011 simulator's own reading, kept only to show where it was beaten.
    function simKalencDerived(str, hea, int_, wis, agi, level) {
      return {
        PDMin: simFix((str - 10) * 11 / 30) + simFix((agi - 5) / 11)
             + simFix(level * 7 / 10) + 2
      };
    }

    // Kept so the disagreement is shown rather than resolved silently. Curse
    // and NonElemental exist only here: KalEncyclopedia derives neither.
    function simReimplDerived(str, hea, int_, wis, agi, level) {
      return {
        OTP: simFix(agi / 8) + simFix(15 * str / 54),
        Evasion: simFix(agi / 3),
        PDMin: 1 + simFix((11 * str - 80) / 30) + simFix((agi - 5) / 11)
             + simFix(7 * level / 10),
        PDMax: simFix((8 * str - 25) / 15) + simFix(18 * agi / 77) + level,
        MDMin: simFix((7 * int_ - 20) / 12) + simFix(wis / 7),
        MDMax: simFix(7 * int_ / 12) + simFix(14 * wis / 45),
        Fire: simFix(int_ / 9), Ice: simFix(int_ / 9),
        Lightening: simFix(int_ / 9),
        Curse: simFix(wis / 9), NonElemental: simFix(hea / 9)
      };
    }

    function simMaxHp(level, health, cls, hpPercent = 0, doubleFlag = false) {
      const quadratic = state.combat.hp_quadratic[simClassIndex(cls)];
      const core = 52 * level / 3 * simBandAt("hp_level_coefficient_by_level", level)
        + health * health * quadratic + 115;
      const base = simFix(core * (1 + hpPercent / 100)) * (doubleFlag ? 2 : 1);
      const band = simBandAt("late_health_band_by_level", level);
      const bonus = band
        ? simFix(simFix(health * health * quadratic) * (0.14 + 0.1 * band))
        : 0;
      return base + bonus;
    }

    function simMaxMp(level, wisdom, cls, manaPercent = 0) {
      const quadratic = state.combat.mp_quadratic[simClassIndex(cls)];
      const core = 8 * level + wisdom * wisdom * quadratic + wisdom + 140;
      return simFix(core * (1 + manaPercent / 100))
        + level * simBandAt("mp_level_band_by_level", level) * 2;
    }

    function simApplyMultipliers(value, questPercent = 0, petPercent = 0) {
      return simFix(simFix(value * (100 + questPercent) / 100)
        * (100 + petPercent) / 100);
    }

    // Sum of every equipped item vector, prefix vector and manual override.
    function simGearVector(build) {
      const gear = {};
      const add = (slot, value) => {
        const amount = Number(value);
        if (!Number.isFinite(amount) || amount === 0) return;
        gear[slot] = (gear[slot] || 0) + amount;
      };
      const items = state.indexes.equippableById || new Map();
      const prefixes = state.indexes.prefixById || new Map();
      Object.values(build.items || {}).forEach(itemId => {
        const item = items.get(String(itemId));
        if (item) Object.entries(item.stats).forEach(([slot, value]) => add(slot, value));
      });
      // A prefix or talisman amount belongs to the item in its slot; with the
      // item removed it stays stored — putting the item back restores it —
      // but an empty slot adds nothing, and the ledger says so.
      Object.entries(build.prefixes || {}).forEach(([slot, prefixId]) => {
        if (!build.items?.[slot]) return;
        const prefix = prefixes.get(String(prefixId));
        if (prefix) Object.entries(prefix.stats).forEach(([stat, value]) => add(stat, value));
      });
      Object.entries(build.equipmentMods || {}).forEach(([slot, mods]) => {
        if (!build.items?.[slot]) return;
        add("OTP", mods.otp);
        add("PDMin", mods.physical);
        add("PDMax", mods.physical);
        add("MDMin", mods.magical);
        add("MDMax", mods.magical);
        add("Defense", mods.defense);
      });
      // The four that used to be stored and then dropped on the floor. EB level
      // is deliberately not here: KalEncyclopedia does not put it on the sheet
      // either — it belongs to the weapon calculator, which does model it.
      [beadVector(build), stoneVector(build), dragonScrollVector(build),
        animalVector(build)].forEach(source => {
        Object.entries(source.stats).forEach(([slot, value]) => add(slot, value));
      });
      Object.entries(build.manual || {}).forEach(([slot, value]) => add(slot, value));
      return gear;
    }

    /* The choices stored on slots that currently hold no item. They are kept —
       equipping an item restores them — but nothing on an empty slot reaches
       the sheet, and the ledger names them instead of dropping them quietly.
       Dragon scrolls are not listed here: dragonScrollVector already reports
       an idle scroll itself. */
    function emptySlotChoices(build) {
      const orphans = [];
      const slots = new Set([
        ...Object.keys(build.prefixes || {}),
        ...Object.keys(build.equipmentMods || {})
      ]);
      for (const slot of slots) {
        if (build.items?.[slot]) continue;
        const details = [];
        const prefix = state.indexes.prefixById?.get(String(build.prefixes?.[slot] || ""));
        if (prefix) details.push(`${prefix.name} talisman`);
        const mods = build.equipmentMods?.[slot] || {};
        if (Number(mods.otp)) details.push(`accuracy +${mods.otp}`);
        if (Number(mods.physical)) details.push(`attack +${mods.physical}`);
        if (Number(mods.magical)) details.push(`magic attack +${mods.magical}`);
        if (Number(mods.defense)) details.push(`defense +${mods.defense}`);
        if (mods.stone) details.push(`${mods.stone} Lv${Math.max(1, Number(mods.stoneLevel) || 1)}`);
        if (mods.equip === "Bead of Fire") details.push("Bead of Fire");
        if (details.length) orphans.push({ slot, details });
      }
      return orphans.sort((left, right) => left.slot.localeCompare(right.slot));
    }

    /* ===================================================================
       Elemental stone, DragonScroll and the animal — the other three
       equipment choices the sheet used to store and then ignore.
       All three are [KALENC-2011], read out of `frmSkills`.
       =================================================================== */

    /* `MenuItem_Weapon_Stone_Click` looks the stone up by name, splits its own
       `ita_rev` on commas and takes the part at `level - 1`, then adds that
       pipe-positional vector to the gear stats. So the commas this project had
       recorded as "two vectors, meaning to confirm" are the stone's per-level
       vectors, selected by the stone's level — the standard 27-slot order, not
       the 28-slot Mix order. Stone of Flame writes Flame dmg, Stone of Ice
       writes Ice dmg, and so on for all five elemental stones, which is what
       settles the order.

       Two stones (Strength, Skill) write one slot past the 27 the sheet names.
       KalEncyclopedia's own vector is 28 wide and its character sheet never
       reads that last slot either, so the value is carried and reported rather
       than folded into a neighbour. */
    function stoneVector(build) {
      const stats = {};
      const applied = [];
      const unread = [];
      const slots = state.combat?.stat_slots || [];
      Object.entries(build.equipmentMods || {}).forEach(([slot, mods]) => {
        if (!mods?.stone) return;
        // A stone on an empty slot adds nothing; the ledger's empty-slot
        // line discloses it.
        if (!build.items?.[slot]) return;
        const level = Math.max(1, Number(mods.stoneLevel) || 1);
        const row = elementalStones().find(entry => entry.ita_name === mods.stone);
        if (!row) return;
        const parts = String(row.ita_rev || "").split(",");
        const vector = parts[level - 1];
        if (vector == null) {
          unread.push({ slot, stone: mods.stone, level, reason: "no vector at this level" });
          return;
        }
        const values = vector.split("|");
        const entry = { slot, stone: mods.stone, level, stats: {} };
        values.forEach((raw, index) => {
          const value = Number(String(raw).trim());
          if (!Number.isFinite(value) || value === 0) return;
          const stat = slots[index];
          if (!stat) {
            unread.push({ slot, stone: mods.stone, level, index, value });
            return;
          }
          stats[stat] = (stats[stat] || 0) + value;
          entry.stats[stat] = (entry.stats[stat] || 0) + value;
        });
        applied.push(entry);
      });
      return { stats, applied, unread };
    }

    /* `DS_Text_to_Stats` reads the percentage off the chosen leaf and applies
       it to the item's OWN Defense, PDMin, PDMax, MDMin and MDMax —
       `Fix(itemStat x percent / 100)` — then adds the leaf's flat bonus to the
       primary stat named on it. A scroll on an empty slot therefore does
       nothing, which is the original's behaviour too: the percentage has
       nothing to be a percentage of. */
    const DRAGON_SCROLL_PERCENT_SLOTS = ["Defense", "PDMin", "PDMax", "MDMin", "MDMax"];

    function dragonScrollVector(build) {
      const stats = {};
      const applied = [];
      const idle = [];
      Object.entries(build.equipmentMods || {}).forEach(([slot, mods]) => {
        if (!mods?.dragonName) return;
        const item = state.indexes.equippableById.get(String(build.items?.[slot] || ""));
        // No item, no scroll: the flat bonus rides the scroll on the item
        // just as the percentage does, so an empty slot applies neither.
        if (!item) {
          idle.push({ slot, name: mods.dragonName,
            percent: Number(mods.dragonPercent) || 0, reason: "no item in the slot" });
          return;
        }
        const percent = Number(mods.dragonPercent) || 0;
        const flat = Number(mods.dragonRStat) || 0;
        const entry = { slot, name: mods.dragonName, percent, flat,
          stat: mods.dragonStat, stats: {} };
        if (flat && mods.dragonStat) {
          stats[mods.dragonStat] = (stats[mods.dragonStat] || 0) + flat;
          entry.stats[mods.dragonStat] = flat;
        }
        let scaled = 0;
        DRAGON_SCROLL_PERCENT_SLOTS.forEach(stat => {
          const base = Number(item?.stats?.[stat]) || 0;
          const value = simFix(base * percent / 100);
          if (!value) return;
          scaled += 1;
          stats[stat] = (stats[stat] || 0) + value;
          entry.stats[stat] = (entry.stats[stat] || 0) + value;
        });
        if (percent && !scaled) {
          idle.push({ slot, name: mods.dragonName, percent,
            reason: item ? "this item has no damage or defence to take a percentage of"
                         : "no item in the slot" });
        }
        applied.push(entry);
      });
      return { stats, applied, idle };
    }

    /* `MenuItem_Animal_Click` adds the animal's stat vector at its grade. The
       three numbers on an `LVL_EGGS` row are named per animal, not universally
       — Tiger Str/Hea/Agi, Panther Agi/Str/Hea, Bird Int/Agi/Hea, Eagle
       Hea/Wis/Agi — so the same row means different things to different
       animals. An animal with no grade set contributes nothing rather than
       defaulting to grade 1. */
    function animalVector(build) {
      const mods = build.equipmentMods?.Animal || {};
      const grade = Number(mods.animalGrade) || 0;
      if (!mods.animal || !grade) {
        return { stats: {}, animal: mods.animal || "", grade, rows: null };
      }
      const animal = eggAnimal(mods.animal);
      const row = eggGradeRows(animal).find(entry => entry.grade === grade);
      if (!row) return { stats: {}, animal: animal.name, grade, rows: null };
      const stats = {};
      Object.entries(row.stats).forEach(([stat, raw]) => {
        const value = Number(String(raw).trim());
        if (Number.isFinite(value) && value !== 0) stats[stat] = value;
      });
      return { stats, animal: animal.name, grade, rows: row };
    }

    function registeredBuffSkill(definition) {
      return skillByKey(definition.skillKey || definition.key);
    }

    function registeredBuffMaxGrade(definition) {
      if (definition.fixedGrades) return definition.fixedGrades.length;
      const skill = registeredBuffSkill(definition);
      const schedule = skill ? state.indexes.skillSchedules.get(skillId(skill)) : null;
      return Math.max(1, Number(schedule?.client_max_grade) || 1);
    }

    function registeredBuffEffects(definition, grade, build) {
      if (definition.fixedGrades) return definition.fixedGrades[Math.max(0,
        Math.min(definition.fixedGrades.length - 1, grade - 1))] || {};
      if (definition.fixed) return { ...definition.fixed };
      const skill = registeredBuffSkill(definition);
      const formulas = parseJson(skill?.bango_parameter_rpn_json, []);
      const result = {};
      (definition.effects || []).forEach(effect => {
        const formula = formulas[effect.parameter];
        const value = formula == null ? null : evaluateRpn(formula, grade, build);
        if (value == null || !Number.isFinite(value) || value === 0) return;
        result[effect.stat] = (result[effect.stat] || 0) + value;
      });
      return result;
    }

    function activeBuffState(profile, key) {
      return (profile.buffs || []).find(buff => buff.key === key)
        || { key, enabled: false, grade: 1 };
    }

    function simBuffVector(build) {
      const result = {};
      if (!state.profiles) return result;
      const profile = activeProfile();
      REGISTERED_BUFFS.forEach(definition => {
        const selected = activeBuffState(profile, definition.key);
        if (!selected.enabled) return;
        const grade = Math.max(1, Math.min(registeredBuffMaxGrade(definition),
          Number(selected.grade) || 1));
        Object.entries(registeredBuffEffects(definition, grade, build)).forEach(([stat, value]) => {
          result[stat] = (result[stat] || 0) + value;
        });
      });
      return result;
    }

    function simPassiveVector(build) {
      if (!state.profiles) return { stats: {}, applied: [], unmodelled: [] };
      return passiveSkillVector(activeProfile(), build);
    }

    function simSheet(build) {
      const gear = simGearVector(build);
      const buffs = simBuffVector(build);
      const passiveDetail = simPassiveVector(build);
      const passives = passiveDetail.stats;
      const level = Number(build.level) || 1;
      const finalPrimary = {};
      PRIMARY_STATS.forEach(stat => {
        finalPrimary[stat] = (Number(build[stat]) || 0) + (gear[stat] || 0)
          + (buffs[stat] || 0) + (passives[stat] || 0);
      });
      // HP% and Mana% are real slots, so anything that writes them belongs in
      // the same percentage the maximum-HP form already takes from gear.
      const hpPercent = (gear["HP%"] || 0) + (buffs["HP%"] || 0) + (passives["HP%"] || 0);
      const manaPercent = (gear["Mana%"] || 0) + (buffs["Mana%"] || 0)
        + (passives["Mana%"] || 0);

      const base = simDerived(finalPrimary.Strength, finalPrimary.Health,
        finalPrimary.Intelligence, finalPrimary.Wisdom, finalPrimary.Agility, level);
      PRIMARY_STATS.forEach(stat => { base[stat] = Number(build[stat]) || 0; });
      base.HP = simMaxHp(level, base.Health, build.cls, 0, build.doubleHp);
      base.MP = simMaxMp(level, base.Wisdom, build.cls, 0);
      base.Defense = 0;
      base.Absorb = 0;

      const final = {};
      state.combat.stat_slots.forEach(slot => {
        final[slot] = (base[slot] || 0) + (gear[slot] || 0) + (buffs[slot] || 0)
          + (passives[slot] || 0);
      });
      PRIMARY_STATS.forEach(stat => { final[stat] = finalPrimary[stat]; });
      final.HP = simMaxHp(level, finalPrimary.Health, build.cls,
        hpPercent, build.doubleHp) + (gear.HP || 0) + (buffs.HP || 0)
        + (passives.HP || 0);
      final.MP = simMaxMp(level, finalPrimary.Wisdom, build.cls,
        manaPercent) + (gear.MP || 0) + (buffs.MP || 0) + (passives.MP || 0);

      ["PDMin", "PDMax", "MDMin", "MDMax"].forEach(slot => {
        final[slot] = simApplyMultipliers(final[slot],
          Number(build.questPercent) || 0, Number(build.petDamage) || 0);
      });
      final.Defense = simApplyMultipliers(final.Defense,
        Number(build.questPercent) || 0, Number(build.petDefense) || 0);
      final.Evasion = simApplyMultipliers(final.Evasion, 0,
        Number(build.petEvasion) || 0);

      const reimpl = simReimplDerived(finalPrimary.Strength, finalPrimary.Health,
        finalPrimary.Intelligence, finalPrimary.Wisdom, finalPrimary.Agility, level);
      const kalenc = simKalencDerived(finalPrimary.Strength, finalPrimary.Health,
        finalPrimary.Intelligence, finalPrimary.Wisdom, finalPrimary.Agility, level);
      return { base, gear, buffs, passives, passiveDetail, final, reimpl, kalenc, level };
    }

    // --- Combat pipeline, [ORIG] ---------------------------------------

    function simLevelHitTerm(difference) {
      const table = state.combat.tables.add_otp_by_level;
      const clamped = Math.max(-100, Math.min(100, difference));
      const value = table[Math.min(Math.abs(clamped), table.length - 1)];
      return clamped < 0 ? -value : value;
    }

    function simHitChanceFromTotal(total) {
      const table = state.combat.tables.hit_chance;
      const clamped = Math.max(-41, Math.min(41, total));
      return clamped < 0 ? 100 - table[Math.abs(clamped)] : table[clamped];
    }

    function simHitChance(attackerLevel, defenderLevel, attackerHit, defenderDodge) {
      return simHitChanceFromTotal(
        simLevelHitTerm(attackerLevel - defenderLevel) + attackerHit - defenderDodge);
    }

    function simPhysicalFinal(damage, attackerLevel, defenderLevel, defense, absorb) {
      const table = state.combat.tables.add_defense_by_level;
      const difference = attackerLevel - defenderLevel;
      const value = table[Math.min(Math.abs(difference), table.length - 1)];
      let revised = damage + (difference < 0 ? -value : value);
      revised -= defense;
      if (revised <= 0) return 0;
      revised -= simCdiv(revised * absorb, 100);
      return Math.max(0, revised);
    }

    function simMagicFinal(value, attackerLevel, defenderLevel, resistPercent) {
      const difference = attackerLevel - defenderLevel;
      const effective = Math.max(0,
        resistPercent - simCdiv(difference * Math.abs(difference), 6));
      const multiplier = effective >= 100 ? 0 : 100 - effective;
      let revised = simCdiv(multiplier * value, 100);
      revised += simCdiv(difference * Math.abs(difference), 4);
      return Math.max(0, revised);
    }

    // --- Build state ----------------------------------------------------

    function currentBuild() {
      loadProfiles();
      state.build = activeProfile().build;
      return state.build;
    }

    function saveBuild() {
      const profile = activeProfile();
      profile.build = state.build || profile.build;
      persistProfiles();
      // Retain the old single-build key as a backward-compatible export for
      // builds saved by earlier Kal Atlas versions.
      try { localStorage.setItem(BUILD_STORAGE_KEY, JSON.stringify(profile.build)); }
      catch (error) { /* private mode: the build simply does not persist */ }
    }

    /* A shared build carries its skill allocation with it. It did not before,
       and that mattered once passive skills started changing the sheet: a link
       that dropped them handed the reader a different character from the one
       that was shared. `skills` rides alongside the build rather than inside
       it, because it belongs to the profile, not to the build record. */
    function encodeBuild(build, skills = null) {
      const payload = skills && Object.keys(skills).length
        ? Object.assign({}, build, { skills }) : build;
      const json = JSON.stringify(payload);
      return btoa(String.fromCharCode(...new TextEncoder().encode(json)))
        .replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
    }

    function decodeBuild(text) {
      const padded = text.replace(/-/g, "+").replace(/_/g, "/");
      const binary = atob(padded + "=".repeat((4 - padded.length % 4) % 4));
      const bytes = Uint8Array.from(binary, char => char.charCodeAt(0));
      const payload = JSON.parse(new TextDecoder().decode(bytes));
      const skills = payload.skills && typeof payload.skills === "object"
        ? payload.skills : null;
      delete payload.skills;
      return { build: Object.assign({}, DEFAULT_BUILD, payload), skills };
    }

    // --- Monsters -------------------------------------------------------

    const MONSTER_COMBAT_FIELDS = ["mon_otp", "mon_eva", "mon_minatt", "mon_maxatt",
      "mon_def1", "mon_def2", "mon_absorb", "mon_attspd", "mon_lvl",
      // Strength and Agility are required, not optional: the four columns above
      // are additive macros and the derivation below cannot run without them.
      "mon_str", "mon_agi"];

    function monsterHasCombatStats(row) {
      return Boolean(row) && MONSTER_COMBAT_FIELDS.every(field =>
        String(row[field] ?? "").trim() !== "");
    }

    /* A monster's on-target point, evasion and attack are DERIVED, not read.
       `mon_otp`, `mon_eva`, `mon_minatt` and `mon_maxatt` in the legacy export
       are the raw additive `(hit)` / `(dodge)` / `(attack)` macros of an
       InitMonster record — identical to the 2006 originals on 175 of 175 rows
       that signature-match one — and CMonster adds the same Str/Agi/Level
       derivation a player gets before any of them is used. Reading the macro as
       a final value understated every monster's hit and damage, and so
       overstated the evasion chance shown against it.

       `mon_hp` is the one column that is already materialized, so it stays a
       final value. Mirrors engine/kal_engine.py monster_hit/dodge/min/max. */
    function simMonsterDerived(legacy) {
      const level = Number(legacy.mon_lvl) || 0;
      const str = Number(legacy.mon_str) || 0;
      const agi = Number(legacy.mon_agi) || 0;
      const macro = {
        hit: Number(legacy.mon_otp) || 0,
        dodge: Number(legacy.mon_eva) || 0,
        minAttack: Number(legacy.mon_minatt) || 0,
        maxAttack: Number(legacy.mon_maxatt) || 0
      };
      return {
        macro,
        hit: simCdiv(agi, 8) + simCdiv(15 * str, 54) + macro.hit,
        dodge: simCdiv(agi, 3) + macro.dodge,
        minAttack: Math.max(0, 1 + simCdiv(11 * str - 80, 30)
          + simCdiv(agi - 5, 11) + simCdiv(7 * level, 10) + macro.minAttack),
        maxAttack: Math.max(0, simCdiv(8 * str - 25, 15)
          + simCdiv(18 * agi, 77) + level + macro.maxAttack)
      };
    }

    function simVersus(sheet, build, legacy) {
      const monsterLevel = Number(legacy.mon_lvl);
      const level = sheet.level;
      const monster = simMonsterDerived(legacy);
      const incomingHit = simHitChance(monsterLevel, level,
        monster.hit, sheet.final.Evasion);
      const rawMin = monster.minAttack;
      const rawMax = monster.maxAttack;
      const landed = [rawMin, rawMax].map(raw => simPhysicalFinal(
        raw, monsterLevel, level, sheet.final.Defense, sheet.final.Absorb));
      const physicalMin = Math.min(...landed);
      const physicalMax = Math.max(...landed);
      const average = (physicalMin + physicalMax) / 2;
      const cooldown = Number(legacy.mon_attspd) || 0;
      const perSwing = average * incomingHit / 100;

      const result = {
        legacy, monsterLevel, monster,
        incomingHit, evasion: 100 - incomingHit,
        physicalMin, physicalMax, average, perSwing, cooldown,
        perSecond: cooldown > 0 ? perSwing * 1000 / cooldown : null,
        outgoingHit: simHitChance(level, monsterLevel, sheet.final.OTP,
          monster.dodge),
        survivalSwings: perSwing > 0 ? sheet.final.HP / perSwing : null
      };

      // What you deal to it. Archers strike at range so they meet mon_def2;
      // everyone else meets mon_def1 (KalOnline_Engine_Formulas.md section 3).
      const farAttacker = build.cls === "Archer";
      const monsterDefense = Number(farAttacker ? legacy.mon_def2 : legacy.mon_def1) || 0;
      const monsterAbsorb = Number(legacy.mon_absorb) || 0;
      result.attackType = farAttacker ? "ranged" : "melee";
      const dealt = [sheet.final.PDMin, sheet.final.PDMax].map(value =>
        simPhysicalFinal(value, level, monsterLevel, monsterDefense, monsterAbsorb));
      result.dealtPhysicalMin = Math.min(...dealt);
      result.dealtPhysicalMax = Math.max(...dealt);
      result.dealtPhysicalAverage = (result.dealtPhysicalMin + result.dealtPhysicalMax) / 2;
      result.dealtPhysicalExpected = result.dealtPhysicalAverage * result.outgoingHit / 100;

      // Magic ignores defence and absorb; only the monster's resistance in the
      // chosen element applies. mon_res1..5 are stored points, divided by 10 by
      // the original final-resist accessor before use.
      result.dealtMagic = {};
      [["fire", "mon_res1"], ["ice", "mon_res2"], ["lightning", "mon_res3"],
       ["non-elemental", "mon_res4"], ["curse", "mon_res5"]].forEach(([element, column]) => {
        const raw = String(legacy[column] ?? "").trim();
        if (raw === "") return;
        const resist = simCdiv(Number(raw), 10);
        const values = [sheet.final.MDMin, sheet.final.MDMax].map(value =>
          simMagicFinal(value, level, monsterLevel, resist));
        result.dealtMagic[element] = {
          resist, min: Math.min(...values), max: Math.max(...values)
        };
      });
      const best = Object.entries(result.dealtMagic)
        .sort((a, b) => b[1].max - a[1].max)[0];
      if (best) {
        result.bestMagicElement = best[0];
        result.bestMagicMin = best[1].min;
        result.bestMagicMax = best[1].max;
        // No hit-chance term: CMagic::Excute never calls CheckHit, so magic
        // does not miss. Resistance is the whole mitigation.
        result.bestMagicAverage = (best[1].min + best[1].max) / 2;
      }

      const magicMin = String(legacy.mon_mag1 ?? "").trim();
      const magicMax = String(legacy.mon_mag2 ?? "").trim();
      if (magicMin !== "" && magicMax !== "" && Number(magicMax) > 0) {
        result.magic = {};
        [["Fire", "Fire"], ["Ice", "Ice"], ["Lightning", "Lightening"]]
          .forEach(([label, slot]) => {
            const resist = sheet.final[slot] || 0;
            const values = [Number(magicMin), Number(magicMax)].map(value =>
              simMagicFinal(value, monsterLevel, level, resist));
            result.magic[label] = {
              resist, min: Math.min(...values), max: Math.max(...values)
            };
          });
        const worst = Object.values(result.magic)
          .reduce((a, b) => (b.max > a.max ? b : a));
        result.magicWorstMax = worst.max;
      }
      return result;
    }

    /* Every Bango monster that resolves to a legacy row carrying combat stats.

       Once per monster *name*, not once per client record. Several records do
       share a name and are not the same creature — they carry different drop
       tables, which is why the zone roster keeps them apart — but the legacy
       stats this ranking is built from are keyed by name, so every record
       under one name computes to the identical row. Ranking 496 rows of which
       305 are copies of another row ranks nothing; the zone and monster pages
       are where the records are told apart.

       Once per recorded variant, though, because a family's variants are a
       level ladder with their own stats, and collapsing those would mean
       choosing one of them without saying so. */
    function threatRows(sheet, build) {
      const out = [];
      const seen = new Set();
      let unresolved = 0;
      let covered = 0;
