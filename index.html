              <td class="number">${prettyNumber((state.indexes.dropsByItem.get(String(row.ita_azon)) || []).length)}</td>
              <td>${provenanceTag(row)}</td>
            </tr>`).join("")}</tbody>
        </table></div><div class="section-body">${pagination(rows.length, page, pageSize, "items", query)}</div></section>`;
    }

    function renderMonsters(query) {
      const q = normalizeName(query.get("q") || "");
      const legacy = query.get("legacy") || "";
      const rows = state.indexes.monsters.filter(row => {
        const hasLegacy = legacyMonsterVariantsForRecord(row.message_id, row.text).length > 0;
        return (!q || normalizeName(`${row.text} ${row.message_id}`).includes(q)) &&
          (!legacy || (legacy === "yes" ? hasLegacy : !hasLegacy));
      });
      const pageSize = 80;
      const page = Number(query.get("page") || 1);
      const shown = rows.slice((page - 1) * pageSize, page * pageSize);
      el.main.innerHTML = `
        ${pageHeader({
          eyebrow: "Bango monster strings",
          title: "Monsters",
          lede: "Bango IDs and names are authoritative. Combat stats appear only where a same-name KalEncyclopedia fallback exists.",
          crumbs: [["Overview", "#/home"], ["Monsters", ""]]
        })}
        ${filterToolbar("monsters", query, {
          selectName: "legacy", selectLabel: "Legacy stats", allLabel: "All records",
          selectOptions: ["yes", "no"], placeholder: "Monster name or Bango ID…"
        })}
        <section class="section"><div class="table-wrap"><table>
          <thead><tr><th class="icon-col"></th><th>Bango ID</th><th>Monster</th><th>Drop rows</th><th>Quests</th><th>Zones</th><th>Legacy stats</th></tr></thead>
          <tbody>${shown.map(row => {
            const id = String(row.message_id);
            const variants = legacyMonsterVariantsForRecord(id, row.text);
            return `<tr>
              <td class="icon-col">${monsterIconTag(id, row.text, 30)}</td>
              <td class="mono">${escapeHtml(id)}</td>
              <td>${entityLink("monster", id, row.text)}</td>
              <td class="number">${prettyNumber((state.indexes.dropsByMonster.get(id) || []).length)}</td>
              <td class="number">${prettyNumber((state.indexes.monsterQuestsByMonster.get(id) || []).length)}</td>
              <td class="number">${prettyNumber((state.indexes.monsterZones.get(id) || []).length)}</td>
              <td>${variants.length
                ? `<span class="tag gold">available · non-Bango</span>${variants.length > 1
                  ? ` <small class="dim">${variants.length} variants</small>` : ""}`
                : `<span class="dim">—</span>`}</td>
            </tr>`;
          }).join("")}</tbody>
        </table></div><div class="section-body">${pagination(rows.length, page, pageSize, "monsters", query)}
          ${monsterPictureCredit(shown.map(row => row.text))
            ? `<p class="map-credit">${monsterPictureCredit(shown.map(row => row.text))}</p>` : ""}
        </div></section>`;
    }

    /* ===================================================================
       Skill trees

       The client's own scope names for the four animal transforms are
       transliterations nobody uses in play — `yungsang`, `tuguk`, `gunchi`,
       `gale`. They are shown as the animals they are, and the raw scope stays
       the route key so a link into the data still works.

       The diagram lays every skill of a scope out by the level it unlocks at:
       one row per unlock level, top to bottom, with a line drawn from each
       prerequisite to the skill it opens. Level is the axis because level is
       what a player actually spends — and because most skills have no
       prerequisite at all (68 edges across 536 skills), so a pure dependency
       tree would be 50 unconnected roots in a column.

       Positions are arithmetic, not measured from the page: the node box is a
       fixed size, so the SVG lines can be drawn from the same numbers that
       place the boxes. Nothing here needs a layout pass to be correct.
       =================================================================== */
    const SKILL_SCOPE_LABELS = {
      common: "Common", mage: "Mage", archer: "Archer", knight: "Knight",
      thief: "Thief", shaman: "Shaman",
      // The animals, by the names they are called in play.
      yungsang: "Tiger", tuguk: "Panther", gunchi: "Bird", gunchie: "Bird", gale: "Eagle",
      monster: "Monster abilities"
    };
    // The order the tabs are shown in: your own class first, then the shared
    // book, then the transforms. Monster abilities are not a player path and
    // are deliberately last and diagram-free.
    const SKILL_SCOPE_ORDER = ["common", "mage", "archer", "knight", "thief", "shaman",
      "yungsang", "tuguk", "gunchi", "gale", "monster"];
    const SKILL_NODE = { width: 148, height: 62, gapX: 14, gapY: 30, padding: 18 };

    function skillScopeLabel(scope) {
      return SKILL_SCOPE_LABELS[scope] || (scope
        ? scope[0].toUpperCase() + scope.slice(1) : "");
    }

    function skillScopes() {
      const present = new Set(state.tables.skills.map(scopeForSkill));
      return [...SKILL_SCOPE_ORDER.filter(scope => present.has(scope)),
        ...[...present].filter(scope => !SKILL_SCOPE_ORDER.includes(scope)).sort()];
    }

    /* One row per unlock level, and inside a row the skills in the client's own
       order. A skill with no recovered schedule has no level to be placed at,
       so it goes in a final row of its own rather than being guessed at. */
    /* ===================================================================
       Jobs

       `POSITIONS.csv` already answers "which skills does this job get": its
       `po_skills` column lists every position whose skills the job inherits.
       A Hermit carries `7,1,2,3` — Free Magician, Scholar, Literary Person and
       its own — and pointedly not `4`, the Chairperson branch it did not take.

       One deliberate addition: a job with exactly **one** possible successor
       also shows that successor's skills, because there is no choice to spoil
       and a player wants to see what the next step gives. A Scholar therefore
       sees Literary Person; a Literary Person sees neither Hermit nor
       Chairperson, because picking between them is the decision.
       =================================================================== */
    function positionByName(name) {
      return state.indexes.positionsByName?.get(normalizeName(name)) || null;
    }

    function positionSkillIds(position) {
      return String(position?.po_skills || "").split(",")
        .map(value => value.trim()).filter(Boolean);
    }

    /* The jobs reachable in one step: same class, inheriting everything this
       job has plus themselves and nothing else. */
    function nextPositions(position) {
      if (!position) return [];
      const mine = positionSkillIds(position);
      return (state.indexes.positionsByClass?.get(String(position.po_class)) || [])
        .filter(other => {
          if (String(other.po_azon) === String(position.po_azon)) return false;
          const theirs = positionSkillIds(other);
          return theirs.length === mine.length + 1
            && theirs[theirs.length - 1] === String(other.po_azon)
            && mine.every((value, index) => theirs[index] === value);
        });
    }

    function positionAllowedIds(position) {
      if (!position) return null;
      const allowed = new Set([String(position.po_azon), ...positionSkillIds(position)]);
      const next = nextPositions(position);
      // One successor is a formality, two is a choice. Only the formality is
      // shown ahead of time.
      if (next.length === 1) {
        next[0] && allowed.add(String(next[0].po_azon));
      }
      return allowed;
    }

    // scope -> the legacy class id POSITIONS.csv keys its jobs by.
    const SCOPE_CLASS_ID = { archer: "1", knight: "2", mage: "3", thief: "4" };

    /* Bango's own job gate. The first token of a skill record's grade field
       is a branch-availability mask, decoded and proven against the legacy
       planner's position column in tools\bango_branch_mask\: 170 of 173
       matched player skills agree, and the 3 that differ are Bango's own
       availability moves, which win under the authority ranking. 1 covers
       the Free/first-job tier, 3 the second job, 7/11 the third-job
       branches, 23/43 the fourth-job branches; 0 or absent means no branch
       gate (the level-81 Mystery passives) and falls back to the legacy
       position. Values are legacy po_azon ids, keyed by legacy class id.
       This is what keeps a Chairperson-only skill such as Increase of
       Critical Hit (mage-52, mask 11) off the Hermit tree even though its
       legacy twin — "Increase of Critical Hit (magician)" — never matched
       by name and left legacy_position empty. */
    const BRANCH_MASK_POSITIONS = {
      "1": { "1": ["21", "15"], "3": ["16"], "7": ["17"], "11": ["18"], "23": ["19"], "43": ["20"] },
      "2": { "1": ["14", "8"], "3": ["9"], "7": ["10"], "11": ["11"], "23": ["12"], "43": ["13"] },
      "3": { "1": ["7", "1"], "3": ["2"], "7": ["3"], "11": ["4"], "23": ["5"], "43": ["6"] },
      "4": { "1": ["28", "22"], "3": ["23"], "7": ["24"], "11": ["25"], "23": ["26"], "43": ["27"] }
    };

    function skillBranchMask(schedule) {
      if (!schedule) return "";
      return state.indexes.branchMaskBySkillKey?.get(
        `${schedule.bango_key}~${schedule.bango_definition_ordinal || 1}`) || "";
    }

    function branchGateAllows(schedule, allowedIds, classId) {
      const owning = BRANCH_MASK_POSITIONS[String(classId)]?.[skillBranchMask(schedule)];
      if (owning) return !allowedIds || owning.some(id => allowedIds.has(id));
      // No decoded mask: the legacy planner's position is the fallback gate.
      if (!schedule?.legacy_position) return true;
      return !allowedIds || allowedIds.has(String(schedule.legacy_position));
    }

    function skillBelongsToJob(schedule, allowedIds, classId) {
      return branchGateAllows(schedule, allowedIds, classId);
    }

    /* The jobs of a class, in the order a character passes through them, with
       the "Free <class>" placeholder dropped — it is the absence of a job, not
       one of them. */
    function skillScopeJobs(scope) {
      const classId = SCOPE_CLASS_ID[scope];
      if (!classId) return [];
      return (state.indexes.positionsByClass?.get(classId) || [])
        .filter(position => !/^free /i.test(position.po_megn || ""))
        .sort((left, right) => Number(left.po_lvl) - Number(right.po_lvl)
          || Number(left.po_azon) - Number(right.po_azon));
    }

    function jobTreeExplanation(job) {
      const inherited = positionSkillIds(job)
        .map(id => state.indexes.positionsById?.get(id))
        .filter(entry => entry && !/^free /i.test(entry.po_megn || ""))
        .map(entry => entry.po_megn);
      const ahead = nextPositions(job);
      const carried = inherited.length
        ? `Everything ${inherited.join(" and ")} already gives, plus this job's own.`
        : "This job's own skills, and the ones every character of the class shares.";
      if (ahead.length === 1) {
        return `${carried} ${ahead[0].po_megn} is next at level ${ahead[0].po_lvl} and there `
          + "is no alternative, so its skills are shown here too.";
      }
      if (ahead.length > 1) {
        return `${carried} At level ${ahead[0].po_lvl} the path splits between `
          + `${ahead.map(entry => entry.po_megn).join(" and ")}; pick a tab above to see `
          + "either, because a character can only ever hold one of them.";
      }
      return `${carried} This is the end of the class path.`;
    }

    function skillTreeModel(scope, options = {}) {
      const allowedIds = options.position ? positionAllowedIds(options.position) : null;
      const classId = options.position?.po_class || SCOPE_CLASS_ID[scope] || "";
      const rows = (state.tables.skills || [])
        .filter(row => scopeForSkill(row) === scope)
        .map(row => ({ row, schedule: state.indexes.skillSchedules.get(skillId(row)) }))
        // A job a character can never hold is not dimmed, it is absent: showing
        // a Chairperson's buffs on a Hermit's tree suggests a choice that does
        // not exist.
        .filter(entry => skillBelongsToJob(entry.schedule, allowedIds, classId));
      const levelOf = entry => {
        const level = skillUnlockLevel(entry.schedule);
        return Number.isFinite(level) ? level : Infinity;
      };
      const byLevel = new Map();
      rows.forEach(entry => mapPush(byLevel, levelOf(entry), entry));
      const levels = [...byLevel.keys()].sort((left, right) => left - right);
      const nodes = new Map();
      const laid = levels.map((level, rowIndex) => {
        const entries = byLevel.get(level).sort((left, right) =>
          Number(left.row.sk_order || 0) - Number(right.row.sk_order || 0)
          || String(left.row.sk_megn || "").localeCompare(String(right.row.sk_megn || "")));
        // A skill sits under the skill that unlocks it wherever the column is
        // free, so a chain reads as a chain instead of a long diagonal across
        // the diagram. Everything else fills the leftmost free column.
        const taken = new Set();
        const claim = wanted => {
          for (let distance = 0; distance < 64; distance += 1) {
            for (const column of [wanted + distance, wanted - distance]) {
              if (column >= 0 && !taken.has(column)) {
                taken.add(column);
                return column;
              }
            }
          }
          return taken.size;
        };
        const placed = entries.map(entry => {
          const edges = state.indexes.skillPrerequisites.get(String(entry.row.bango_key)) || [];
          const parent = edges.map(edge => nodes.get(String(edge.prerequisite_skill_key)))
            .find(Boolean);
          return { entry, wanted: parent ? parent.column : null };
        });
        placed.filter(item => item.wanted != null)
          .forEach(item => { item.column = claim(item.wanted); });
        placed.filter(item => item.column == null)
          .forEach(item => { item.column = claim(0); });
        placed.forEach(({ entry, column }) => {
          const node = {
            ...entry,
            key: String(entry.row.bango_key),
            level,
            column,
            x: SKILL_NODE.padding + column * (SKILL_NODE.width + SKILL_NODE.gapX),
            y: SKILL_NODE.padding + rowIndex * (SKILL_NODE.height + SKILL_NODE.gapY)
          };
          nodes.set(node.key, node);
        });
        return { level, entries, columns: Math.max(...placed.map(item => item.column)) + 1 };
      });
      /* Every card's grid cell, so a connector can be routed around them.
         Cards are the only obstacles: the gaps between rows and between columns
         are empty by construction, which is what makes the routing below sound
         rather than merely tidy. */
      const occupied = new Set();
      const rowIndexOf = new Map();
      laid.forEach((row, index) => rowIndexOf.set(row.level, index));
      for (const node of nodes.values()) {
        occupied.add(`${rowIndexOf.get(node.level)}:${node.column}`);
      }
      const columns = Math.max(1, ...laid.map(row => row.columns || row.entries.length));
      const columnX = column => SKILL_NODE.padding + column * (SKILL_NODE.width + SKILL_NODE.gapX);
      const rowY = index => SKILL_NODE.padding + index * (SKILL_NODE.height + SKILL_NODE.gapY);
      // The empty lane down the right-hand side of a column.
      const channelX = column => columnX(column) + SKILL_NODE.width + SKILL_NODE.gapX / 2;
      const channelUse = new Map();

      const edges = [];
      for (const node of nodes.values()) {
        for (const edge of state.indexes.skillPrerequisites.get(node.key) || []) {
          const parent = nodes.get(String(edge.prerequisite_skill_key));
          if (!parent) continue;
          const fromRow = rowIndexOf.get(parent.level);
          const toRow = rowIndexOf.get(node.level);
          const fromX = parent.x + SKILL_NODE.width / 2;
          const toX = node.x + SKILL_NODE.width / 2;
          const fromY = parent.y + SKILL_NODE.height;
          const toY = node.y;
          let clear = parent.column === node.column;
          for (let row = fromRow + 1; clear && row < toRow; row += 1) {
            if (occupied.has(`${row}:${parent.column}`)) clear = false;
          }
          if (clear) {
            edges.push({ parent, child: node, grade: edge.required_grade,
              points: [[fromX, fromY], [toX, toY]] });
            continue;
          }
          // Blocked: leave through the gap below the parent, run down the empty
          // lane beside the columns, and come back along the gap above the
          // child. Every segment sits in a gap, so the line passes under no card.
          const lane = Math.max(parent.column, node.column);
          const seen = (channelUse.get(lane) || 0);
          channelUse.set(lane, seen + 1);
          // Two connectors sharing a lane would draw as one; a few pixels apart
          // keeps them readable.
          const laneX = channelX(lane) + ((seen % 3) - 1) * 4;
          const exitY = rowY(fromRow) + SKILL_NODE.height + SKILL_NODE.gapY / 2;
          const enterY = rowY(toRow) - SKILL_NODE.gapY / 2;
          const points = [[fromX, fromY], [fromX, exitY], [laneX, exitY]];
          if (enterY > exitY) points.push([laneX, enterY]);
          points.push([toX, enterY], [toX, toY]);
          edges.push({ parent, child: node, grade: edge.required_grade, points });
        }
      }

      const rightMost = Math.max(
        SKILL_NODE.padding + columns * SKILL_NODE.width + (columns - 1) * SKILL_NODE.gapX,
        ...edges.flatMap(edge => edge.points.map(([x]) => x + SKILL_NODE.gapX)));
      return {
        scope,
        position: options.position || null,
        rows: laid,
        nodes: [...nodes.values()],
        edges,
        width: rightMost + SKILL_NODE.padding,
        height: SKILL_NODE.padding * 2 + laid.length * SKILL_NODE.height
          + Math.max(0, laid.length - 1) * SKILL_NODE.gapY
      };
    }

    /* An orthogonal polyline with its corners rounded off. Rounding is purely
       cosmetic; the corner never leaves the gap the segment runs in, because
       the radius is clamped to half the shorter of the two segments. */
    function orthogonalPath(points, radius = 7) {
      if (points.length < 2) return "";
      const parts = [`M ${points[0][0]} ${points[0][1]}`];
      for (let index = 1; index < points.length - 1; index += 1) {
        const [px, py] = points[index - 1];
        const [cx, cy] = points[index];
        const [nx, ny] = points[index + 1];
        const inLength = Math.hypot(cx - px, cy - py);
        const outLength = Math.hypot(nx - cx, ny - cy);
        const bend = Math.min(radius, inLength / 2, outLength / 2);
        if (bend < 1) {
          parts.push(`L ${cx} ${cy}`);
          continue;
        }
        parts.push(`L ${cx - Math.sign(cx - px) * bend} ${cy - Math.sign(cy - py) * bend}`);
        parts.push(`Q ${cx} ${cy} ${cx + Math.sign(nx - cx) * bend} ${cy + Math.sign(ny - cy) * bend}`);
      }
      const last = points[points.length - 1];
      parts.push(`L ${last[0]} ${last[1]}`);
      return parts.join(" ");
    }

    function skillTreeEdgesSvg(model) {
      if (!model.edges.length) return "";
      return `<svg class="skill-tree-edges" width="${model.width}" height="${model.height}"
          viewBox="0 0 ${model.width} ${model.height}" aria-hidden="true">
        ${model.edges.map(edge => {
          const end = edge.points[edge.points.length - 1];
          return `<path d="${orthogonalPath(edge.points)}"
            data-edge-from="${escapeAttr(edge.parent.key)}"
            data-edge-to="${escapeAttr(edge.child.key)}"
            data-points="${edge.points.map(point => point.join(",")).join(" ")}"></path>
          <circle class="skill-edge-head" cx="${end[0]}" cy="${end[1]}" r="2.6"
            data-edge-to="${escapeAttr(edge.child.key)}"></circle>`;
        }).join("")}
      </svg>`;
    }

    /* The same diagram serves both pages. On the Skills page nothing is
       greyed out — it is a reference, and every skill of the class exists.
       On Character Creation a node the character cannot take yet is dimmed and
       carries its grade stepper. */
    function skillTreeHtml(model, options = {}) {
      const { interactive = false, profile = null, build = null, ledger = null } = options;
      if (!model.nodes.length) return emptyState("No skill carries this scope.");
      return `<div class="skill-tree-wrap">
        <div class="skill-tree" style="width:${model.width}px;height:${model.height}px">
          ${skillTreeEdgesSvg(model)}
          ${model.rows.map((row, index) => `<div class="skill-tree-rail"
            style="top:${SKILL_NODE.padding + index * (SKILL_NODE.height + SKILL_NODE.gapY)
              - SKILL_NODE.gapY / 2}px"
            ><span>${Number.isFinite(row.level) ? `Lv ${row.level}` : "no schedule"}</span></div>`).join("")}
          ${model.nodes.map(node => {
            const grade = interactive ? Number(profile.skills?.[node.key]) || 0 : 0;
            const max = interactive ? availableSkillGrade(node.schedule, build.level)
              : Number(node.schedule?.client_max_grade) || 0;
            const prerequisites = interactive
              ? skillPrerequisiteState(profile, node.row) : { edges: [], missing: [] };
            const beyondLevel = interactive && Number.isFinite(node.level)
              && node.level > Number(build.level);
            const locked = interactive && (prerequisites.missing.length > 0 || beyondLevel
              || !positionAllowsSkill(node.schedule, build));
            const minimum = interactive ? skillMinimumGrade(node.row) : 0;
            return `<div class="skill-node${locked ? " locked" : ""}${
                interactive && grade ? " taken" : ""}"
                style="left:${node.x}px;top:${node.y}px"
                data-skill-node="${escapeAttr(node.key)}"
                data-skill-card="${escapeAttr(skillId(node.row))}"
                data-skill-tip="${escapeAttr(interactive
                  ? skillTooltipHtml(node.row, node.schedule, grade, build)
                  : skillReferenceTipHtml(node.row, node.schedule))}">
              ${skillIconTag(node.row, 26)}
              <span class="skill-node-name">${interactive
                ? escapeHtml(node.row.sk_megn || node.key)
                : entityLink("skill", skillId(node.row), node.row.sk_megn || node.key)}</span>
              ${interactive ? `<span class="skill-node-grade${grade ? "" : " zero"}">${
                  grade} / ${max}</span>
                <span class="skill-stepper">
                  <button class="small" type="button" data-skill-down="${escapeAttr(node.key)}"${
                    grade <= minimum ? " disabled" : ""}>−</button>
                  <button class="small" type="button" data-skill-up="${escapeAttr(node.key)}"${
                    grade >= max || locked || (ledger?.available ?? 0) <= 0 ? " disabled" : ""
                  }>+</button>
                </span>`
                : `<span class="skill-node-grade">${max ? `to G${max}` : "—"}</span>`}
              ${prerequisites.edges.length ? `<span class="skill-node-need${
                prerequisites.missing.length ? " missing" : ""}">after ${
                escapeHtml(prerequisites.edges.map(edge =>
                  `${edge.prerequisite_skill_name} G${edge.required_grade}`).join(", "))}</span>` : ""}
            </div>`;
          }).join("")}
        </div>
      </div>`;
    }

    function skillReferenceTipHtml(row, schedule) {
      const prerequisites = state.indexes.skillPrerequisites.get(String(row.bango_key)) || [];
      const unlock = skillUnlockLevel(schedule);
      return `<strong>${escapeHtml(row.sk_megn || row.bango_key)}</strong>
        <small>${escapeHtml(cleanText(row.sk_desc) || "No description in the Bango record.")}</small>
        <div class="tip-grade">[ Unlocks at level ${Number.isFinite(unlock) ? unlock : "—"}
          · up to grade ${escapeHtml(schedule?.client_max_grade || "—")} ]</div>
        ${schedule?.client_schedule_format ? `<div><small>Client schedule
          <span class="mono">${escapeHtml(schedule.client_schedule_format)}</span></small></div>` : ""}
        ${prerequisites.length ? `<div class="tip-next"><small>Requires ${
          prerequisites.map(edge => `${escapeHtml(edge.prerequisite_skill_name)}
            G${escapeHtml(edge.required_grade)}`).join(", ")}</small></div>` : ""}`;
    }

    function renderSkills(query) {
      const q = normalizeName(query.get("q") || "");
      const scopes = skillScopes();
      const scope = scopes.includes(query.get("scope")) ? query.get("scope")
        : (query.get("scope") ? "" : "common");
      // A search runs across every scope; the tabs are for browsing.
      const searching = Boolean(q);
      const rows = state.tables.skills.filter(row =>
        (!q || normalizeName(`${row.sk_megn} ${row.bango_key} ${cleanText(row.sk_desc)}`).includes(q)) &&
        (searching || !scope || scopeForSkill(row) === scope)
      );
      const pageSize = 80;
      const page = Number(query.get("page") || 1);
      const shown = rows.slice((page - 1) * pageSize, page * pageSize);
      // Monster abilities are not a path anyone walks, so they keep the table
      // and stay out of the diagram entirely.
      const asTree = !searching && scope && scope !== "monster";
      // A class splits into jobs, and a job is what actually decides which
      // skills a character can ever take. Each gets its own diagram.
      const jobs = skillScopeJobs(scope);
      const job = jobs.find(entry => String(entry.po_azon) === query.get("job"))
        || jobs[0] || null;
      const model = asTree ? skillTreeModel(scope, { position: job }) : null;

      el.main.innerHTML = `
        ${pageHeader({
          eyebrow: "Bango skill definitions",
          title: "Skills",
          lede: "Every skill of a class, laid out by the level it unlocks at, with a line from "
            + "each prerequisite to what it opens. Hover a skill for its description, schedule "
            + "and costs.",
          crumbs: [["Overview", "#/home"], ["Skills", ""]]
        })}
        <div class="scope-tabs" role="tablist">
          ${scopes.map(entry => {
            const params = new URLSearchParams();
            params.set("scope", entry);
            return `<a class="scope-tab${entry === scope && !searching ? " active" : ""}"
              role="tab" aria-selected="${entry === scope && !searching}"
              href="#/skills?${params}">${escapeHtml(skillScopeLabel(entry))}
              <span class="dim">${prettyNumber(state.tables.skills
                .filter(row => scopeForSkill(row) === entry).length)}</span></a>`;
          }).join("")}
        </div>
        ${asTree && jobs.length ? `<div class="scope-tabs job-tabs" role="tablist">
          <span class="job-tabs-label">Job</span>
          ${jobs.map(entry => {
            const params = new URLSearchParams();
            params.set("scope", scope);
            params.set("job", entry.po_azon);
            const active = job && String(entry.po_azon) === String(job.po_azon);
            return `<a class="scope-tab${active ? " active" : ""}" role="tab"
              aria-selected="${active}" href="#/skills?${params}"
              title="${escapeAttr(`Available from level ${entry.po_lvl}`)}"
              >${escapeHtml(entry.po_megn)}
              <span class="dim">Lv ${escapeHtml(entry.po_lvl)}</span></a>`;
          }).join("")}
        </div>` : ""}
        ${filterToolbar("skills", query, { placeholder: "Skill name, key or description…" })}
        ${searching ? `<p class="dim"><small>Searching every scope. Clear the search to go back
          to a class diagram.</small></p>` : ""}
        ${asTree ? section(`${skillScopeLabel(scope)} skill tree${
            job ? ` — ${escapeHtml(job.po_megn)}` : ""}`,
            `${job ? `<p class="dim" style="margin:0 0 10px"><small>${
              escapeHtml(jobTreeExplanation(job))}</small></p>` : ""}
            ${skillTreeHtml(model, { interactive: false })}`,
            `<span class="panel-aside">${prettyNumber(model.nodes.length)} skills ·
              ${prettyNumber(model.edges.length)} prerequisite link${
                model.edges.length === 1 ? "" : "s"}</span>`)
        : `<section class="section"><div class="table-wrap"><table>
          <thead><tr><th aria-label="Icon"></th><th>Skill</th><th>Scope</th><th>Key</th><th>Client schedule</th><th>Max grade</th><th>Prerequisites</th></tr></thead>
          <tbody>${shown.map(row => {
            const id = skillId(row);
            const schedule = state.indexes.skillSchedules.get(id);
            return `<tr>
              <td>${skillIconTag(row, 32)}</td>
              <td>${entityLink("skill", id, row.sk_megn || row.bango_key)}</td>
              <td>${entityLink("class", scopeForSkill(row), skillScopeLabel(scopeForSkill(row)))}</td>
              <td class="mono">${escapeHtml(id)}</td>
              <td class="mono">${escapeHtml(schedule?.client_schedule_format || schedule?.schedule_state || "—")}</td>
              <td>${escapeHtml(schedule?.client_max_grade || "—")}</td>
              <td class="number">${prettyNumber((state.indexes.skillPrerequisites.get(String(row.bango_key)) || []).length)}</td>
            </tr>`;
          }).join("")}</tbody>
        </table></div><div class="section-body">${pagination(rows.length, page, pageSize, "skills", query)}</div></section>`}`;
      wireSkillTooltips();
    }

    /* The hover card is the one from Character Creation; on the reference page
       it carries the schedule instead of a grade stepper. */
    function wireSkillTooltips(root = el.main) {
      if (!root || typeof root.querySelectorAll !== "function") return;
      root.querySelectorAll("[data-skill-tip]").forEach(card => {
        card.onmouseenter = event => showSkillTooltip(card, event);
        card.onmousemove = positionSkillTooltip;
        card.onmouseleave = hideSkillTooltip;
      });
    }

    /* ===================================================================
       Quest maps

       80 hand-placed pins across 9 maps, and the quest steps that name them.
       Pin x/y are percentages of the map image, which is what makes the pins
       stay correct at any width — but also means a pin is only right against
       its own artwork. Three maps travel with the data; the six town maps are
       third-party and absent, so those show their pin list instead of a
       broken image.

       The link runs both ways: a quest's map tag focuses its pin, and a pin
       focuses the quest steps that use it — cycling through them, because one
       NPC serves many quests.
       =================================================================== */
    function questMaps() {
      return state.questMaps?.maps || [];
    }

    async function loadQuestMaps() {
      try {
        const text = await state.source.read("analysis/quest_maps/QUEST_MAPS.json");
        state.questMaps = JSON.parse(text);
        // city-pin -> [{stage, quest, step}], in the order the guide lists them.
        const uses = new Map();
        state.questMaps.stages.forEach(stage => stage.quests.forEach(quest =>
          quest.steps.forEach((step, index) => {
            if (step.type !== "talk") return;
            mapPush(uses, `${step.city}-${step.pin}`, { stage, quest, step, index });
          })));
        state.questMaps.uses = uses;
      } catch (error) {
        state.questMaps = null;
      }
    }

    function questMapById(id) {
      return questMaps().find(entry => entry.id === id);
    }

    /* ===================================================================
       NPC photographs

       The guide's author photographed the NPCs he sends players to and cleared
       their use. The Bango client ships no NPC artwork at all, so these are the
       only pictures of them the project has.

       A photo belongs to a map pin, and a pin carries the author's own label
       for that NPC — "Master, Jin-Pyung", "Chief guard, Sea-Geun". Attaching it
       to a Bango NPC string therefore goes through the same identity rules as
       quest-text matching (standing rule 14): bracket or comma names first, the
       whole label only when it is unique, and a repeated bare role such as
       `Guard` or `Woman` gets nothing. A trailing parenthetical is the author's
       annotation of what the NPC is for ("Guard (G8 Chest)") and is not part of
       the name.
       =================================================================== */
    /* The names a pin label can be recognised by. A pin is one NPC standing in
       one place, so unlike a client string the whole label is usable — but the
       bracket and comma names come first because they are the actual name
       inside a role-plus-name label. */
    function pinLabelAliases(label) {
      const full = String(label);
      const raw = full.replace(/\s*\([^)]*\)\s*$/, "").trim();
      const bracketNames = [...raw.matchAll(/\[([^\]]+)\]/g)].map(match => match[1].trim());
      const commaName = raw.includes(",") ? raw.split(",").at(-1).replace(/[\[\]]/g, "").trim() : "";
      // The author uses a trailing parenthetical for both the character's name
      // ("Boatman (Gwang-Chun)") and a note about what the NPC is for
      // ("Guard (G8 Chest)"). Offering it as a candidate costs nothing: a note
      // matches no NPC string, and an ambiguous alias is discarded anyway.
      // Where he saw two spellings he writes them as a list — `Guard (Yang-Do /
      // "Jang-Do")` — so the parenthetical is offered whole and split, which is
      // reading what he wrote rather than guessing at it.
      const parenthetical = (full.match(/\(([^)]*)\)\s*$/) || [, ""])[1].trim();
      const parentheticals = [parenthetical, ...parenthetical.split("/")]
        .map(value => value.replace(/["“”]/g, "").trim());
      const whole = raw.replace(/[\[\]]/g, " ");
      return [...new Set([...bracketNames, commaName, ...parentheticals, whole]
        .map(normalizeName).filter(value => value.length >= 4))];
    }

    /* ===================================================================
       Pin -> entity

       A pin is one character standing in one place, so a pin label and a
       client string can be joined by the same identity rules that decide
       which photograph a player is shown (standing rule 14): the bracket or
       comma name first, the whole label only where it is unique, and a bare
       role such as `Guard` never. An alias answering to more than one client
       string is skipped rather than picked between.

       Eight of the guide's pins are not people at all — the world map marks
       where a named boss stands — so a label that no NPC string answers to is
       tried once against the monster table on its exact name (rule 17), which
       is what makes `Ma-Gwang (Monster 2)` open the monster's own page.

       79 of the 90 pins resolve. The 11 that do not are the four level-1
       guard quests no client table records, the pub's bare `Chief Guard`, and
       six places where the guide's spelling and the client's differ
       (`Ha-Wogoo` / `Ha-Woogo`, `Parent` / `Parents Who Lost Their Son`). Those
       stay plain text: a near-miss is not a match.
       =================================================================== */
    function pinEntityIndex() {
      if (state.pinEntities) return state.pinEntities;
      const byAlias = new Map();
      for (const npc of state.indexes.npcs) {
        for (const alias of npcAliases(npc, state.indexes.npcNameCounts)) {
          mapPush(byAlias, alias, npc);
        }
      }
      const byPin = new Map();
      const byEntity = new Map();
      for (const map of questMaps()) {
        for (const [pin, data] of Object.entries(map.pins || {})) {
          const label = String(data.name || "");
          let match = null;
          for (const alias of pinLabelAliases(label)) {
            const hits = byAlias.get(alias) || [];
            if (hits.length !== 1) continue;
            match = { kind: "npc", row: hits[0] };
            break;
          }
          if (!match) {
            // The trailing "(Monster 4)" is the guide's own numbering, not part
            // of any name, so it comes off before the exact-name lookup.
            const stem = normalizeName(label.replace(/\s*\([^)]*\)\s*$/, ""));
            const monster = stem ? state.indexes.monstersByName.get(stem) : null;
            if (monster) match = { kind: "monster", row: monster };
          }
          if (!match) continue;
          const entry = {
            kind: match.kind,
            row: match.row,
            id: String(match.row.message_id),
            name: match.kind === "npc" ? npcDisplayName(match.row) : match.row.text,
            city: map.id,
            cityLabel: map.label,
            mapName: map.name,
            pin,
            label
          };
          byPin.set(`${map.id}-${pin}`, entry);
          mapPush(byEntity, `${match.kind}~${entry.id}`, entry);
        }
      }
      state.pinEntities = { byPin, byEntity };
      return state.pinEntities;
    }

    function pinEntityFor(city, pin) {
      return pinEntityIndex().byPin.get(`${city}-${pin}`) || null;
    }

    function pinsForEntity(kind, id) {
      return pinEntityIndex().byEntity.get(`${kind}~${id}`) || [];
    }

    /* The number is the map reference and the name is the character: clicking
       the number finds the pin, clicking the name opens whoever is standing
       on it. A pin nothing answers to keeps its name as plain text. */
    function questPinNameHtml(city, pin, fallback = "") {
      const name = questPinName(city, pin) || fallback;
      if (!name) return "";
      const entry = pinEntityFor(city, pin);
      return entry ? entityLink(entry.kind, entry.id, name) : escapeHtml(name);
    }

    function npcPhotoIndex() {
      if (state.npcPhotos) return state.npcPhotos;
      const byAlias = new Map();
      for (const map of questMaps()) {
        for (const [pin, data] of Object.entries(map.pins || {})) {
          if (!data.photo) continue;
          const entry = {
            file: data.photo,
            thumb: data.photoThumb || data.photo,
            label: String(data.name || ""),
            city: map.id,
            cityLabel: map.label,
            pin
          };
          for (const alias of pinLabelAliases(data.name || "")) {
            // First pin wins, and a second NPC claiming the same alias is
            // dropped rather than overwriting: an ambiguous alias must not
            // decide which face a player is shown.
            if (byAlias.has(alias)) byAlias.set(alias, null);
            else byAlias.set(alias, entry);
          }
        }
      }
      state.npcPhotos = byAlias;
      return byAlias;
    }

    function npcPhotoFor(row) {
      const index = npcPhotoIndex();
      const identity = npcIdentity(row);
      if (!identity.named) return null;
      for (const alias of identity.aliases) {
        const entry = index.get(alias);
        if (entry) return entry;
      }
      return null;
    }

    /* `decorative` where the NPC's name is already written beside the picture:
       the alt text would then be read — and, if the image fails, drawn — twice. */
    function npcPhotoTag(row, height = 34, decorative = false) {
      const photo = npcPhotoFor(row);
      if (!photo) return "";
      return `<img class="npc-photo" data-project-file="${escapeAttr(photo.thumb)}"
        height="${height}" alt="${decorative ? "" : escapeAttr(photo.label)}"
        title="${escapeAttr(`${photo.label} — ${photo.cityLabel} #${photo.pin}`)}">`;
    }

    function npcPhotoCredit() {
      const credit = state.questMaps?.photo_credit;
      if (!credit?.name) return "";
      return `NPC photographs by ${escapeHtml(credit.name)}${
        credit.note ? ` — ${escapeHtml(credit.note)}` : ""}.`;
    }

    function questPinName(city, pin) {
      return questMapById(city)?.pins?.[pin]?.name || "";
    }

    /* `options.highlight` is a Set of `city-pin` keys the page is about — the
       stops of one quest, or the one pin an NPC stands on. The map shows every
       pin in the town either way, because a player reads a map to see what
       else is nearby; the highlight is what says which of them is the answer. */
    function questMapPanel(activeCity, options = {}) {
      const maps = questMaps();
      if (!maps.length) return "";
      const highlight = options.highlight || new Set();
      const isFocus = key => highlight.has(key);
      const current = maps.find(entry => entry.id === activeCity) || maps[0];
      const shown = options.onlyMaps
        ? maps.filter(entry => options.onlyMaps.has(entry.id)) : maps;
      if (!shown.length) return "";
      const map = shown.some(entry => entry.id === current.id) ? current : shown[0];

      return panel(options.title || "Map", `
        <div class="map-tabs" role="tablist">${shown.map(entry => `
          <button type="button" class="map-tab${entry.id === map.id ? " active" : ""}"
            role="tab" aria-selected="${entry.id === map.id}"
            data-map-tab="${escapeAttr(entry.id)}"
            title="${escapeAttr(entry.name)}">${escapeHtml(entry.label)}
            <span class="dim">${Object.keys(entry.pins).length}</span></button>`).join("")}
        </div>
        ${shown.map(entry => {
          const active = entry.id === map.id;
          const pins = Object.entries(entry.pins);
          return `<div class="map-view${active ? "" : " hidden"}" data-map-view="${escapeAttr(entry.id)}">
            <div class="map-name">${escapeHtml(entry.name)}</div>
            ${entry.image ? `
              <div class="map-wrap" style="aspect-ratio:${entry.image.width || 4}/${entry.image.height || 3}">
                <img data-project-file="${escapeAttr(entry.image.file)}"
                  alt="${escapeAttr(entry.name)}">
                ${pins.map(([pin, data]) => `<button type="button" class="map-pin${
                  isFocus(`${entry.id}-${pin}`) ? " focus" : ""}"
                  data-map-pin="${escapeAttr(`${entry.id}-${pin}`)}"
                  style="left:${data.x}%;top:${data.y}%"
                  title="${escapeAttr(`${data.name} — click to find its quest steps`)}"
                  >${escapeHtml(pin)}</button>`).join("")}
              </div>`
            : `<p class="map-missing">The image for this map is not included, so the pins
                below are listed instead of placed. They work the same way.</p>`}
            ${entry.image && entry.credit ? `<p class="map-credit">Map by ${
              entry.credit.url
                ? `<a href="${escapeAttr(entry.credit.url)}" target="_blank"
                     rel="noopener noreferrer">${escapeHtml(entry.credit.name)}</a>`
                : `<strong>${escapeHtml(entry.credit.name)}</strong>`}${
              entry.credit.note ? ` — ${escapeHtml(entry.credit.note)}` : ""}</p>` : ""}
            <ul class="map-legend">${pins.map(([pin, data]) => `
              <li${isFocus(`${entry.id}-${pin}`) ? ` class="focus"` : ""}><button type="button"
                class="map-legend-pin${isFocus(`${entry.id}-${pin}`) ? " focus" : ""}"
                data-map-pin="${escapeAttr(`${entry.id}-${pin}`)}">${escapeHtml(pin)}</button>
                ${data.photo ? `<img class="npc-photo" height="26"
                  data-project-file="${escapeAttr(data.photoThumb || data.photo)}"
                  alt="">` : ""}
                <span>${questPinNameHtml(entry.id, pin, data.name)}${data.teleport
                  ? ` <small class="dim">${escapeHtml(data.teleport)}</small>` : ""}</span></li>`).join("")}</ul>
            ${pins.some(([, data]) => data.photo) && npcPhotoCredit()
              ? `<p class="map-credit">${npcPhotoCredit()}</p>` : ""}
          </div>`;
        }).join("")}`, { aside: options.aside || "" });
    }

    function questPinTag(city, pin, label = "") {
      const map = questMapById(city);
      if (!map) return "";
      const name = questPinName(city, pin);
      return `<button type="button" class="pin-tag" data-pin-tag="${escapeAttr(`${city}-${pin}`)}"
        title="${escapeAttr(`${map.name} — ${name}`)}">
        <span class="pin-tag-city">${escapeHtml(map.label)}</span>#${escapeHtml(pin)}${
          label ? ` <span class="dim">${escapeHtml(label)}</span>` : ""}</button>`;
    }

    function showQuestMap(city) {
      el.main.querySelectorAll("[data-map-view]").forEach(view =>
        view.classList.toggle("hidden", view.dataset.mapView !== city));
      el.main.querySelectorAll("[data-map-tab]").forEach(tab => {
        const active = tab.dataset.mapTab === city;
        tab.classList.toggle("active", active);
        tab.setAttribute("aria-selected", String(active));
      });
    }

    /* Re-adding the class after a forced reflow is what lets the same target
       flash again on a second click. */
    function flashElement(node, duration = 2600) {
      if (!node) return;
      node.classList.remove("flash");
      void node.offsetWidth;
      node.classList.add("flash");
      setTimeout(() => node.classList.remove("flash"), duration);
      try { node.scrollIntoView({ behavior: "smooth", block: "center" }); }
      catch (error) { /* older browsers simply do not scroll */ }
    }

    function focusMapPin(key) {
      const [city] = key.split("-");
      showQuestMap(city);
      const pin = el.main.querySelector(`.map-pin[data-map-pin="${CSS.escape(key)}"]`)
        || el.main.querySelector(`.map-legend-pin[data-map-pin="${CSS.escape(key)}"]`);
      flashElement(pin);
    }

    /* Route name -> Bango quest id, the reverse of routeQuestForBango. A pin
       knows which route quests use it; this is what turns that into a page. */
    function bangoQuestIdForRouteName(name) {
      if (!state.questMaps) return "";
      state.questMaps.byRouteName ||= new Map(
        (state.optional.routeReconciliation || [])
          .filter(entry => entry.route_name && entry.bango_que_id)
          .map(entry => [entry.route_name, String(entry.bango_que_id)]));
      return state.questMaps.byRouteName.get(name) || "";
    }

    function focusPinTag(key) {
      const tags = [...el.main.querySelectorAll(`[data-pin-tag="${CSS.escape(key)}"]`)];
      state.pinCycle ||= new Map();
      if (tags.length) {
        const index = (state.pinCycle.get(key) || 0) % tags.length;
        state.pinCycle.set(key, index + 1);
        flashElement(tags[index]);
        return;
      }
      // Nothing on this page uses the pin — the quest list is paginated and
      // filtered, so that is the common case. Go to the quest instead of
      // silently doing nothing, cycling on repeated clicks the same way the
      // tags do.
      const uses = state.questMaps?.uses?.get(key) || [];
      const targets = [...new Set(uses.map(use => use.quest.name))]
        .map(name => bangoQuestIdForRouteName(name)).filter(Boolean);
      if (!targets.length) return;
      const index = (state.pinCycle.get(key) || 0) % targets.length;
      state.pinCycle.set(key, index + 1);
      location.hash = routeHref("quest", targets[index]).slice(1);
    }

    function wireQuestMaps(root = el.main) {
      if (!root || typeof root.querySelectorAll !== "function") return;
      root.querySelectorAll("[data-map-tab]").forEach(tab => {
        tab.onclick = () => showQuestMap(tab.dataset.mapTab);
      });
      root.querySelectorAll("[data-map-pin]").forEach(pin => {
        pin.onclick = () => focusPinTag(pin.dataset.mapPin);
      });
      root.querySelectorAll("[data-pin-tag]").forEach(tag => {
        tag.onclick = () => focusMapPin(tag.dataset.pinTag);
      });
    }

    /* The guide names its quests "Quest 35"; the Bango table names them
       properly. They are matched by the level and order they appear in, so a
       Bango quest page can show the route steps and the map that belong to
       it without inventing a link that is not there. */
    function routeQuestForBango(row) {
      if (!state.questMaps) return null;
      state.questMaps.byBango ||= (() => {
        const index = new Map();
        const reconciliation = state.optional.routeReconciliation || [];
        reconciliation.forEach(entry => {
          if (!entry.bango_que_id || !entry.route_name) return;
          index.set(String(entry.bango_que_id), entry.route_name);
        });
        return index;
      })();
      const routeName = state.questMaps.byBango.get(String(row.que_id));
      if (!routeName) return null;
      for (const stage of state.questMaps.stages) {
        const quest = stage.quests.find(entry => entry.name === routeName);
        if (quest) return { stage, quest };
      }
      return null;
    }

    /* ===================================================================
       Quest route diagram

       One small box per stop, left to right, in the order the quest is
       actually played: who you talk to and where, what you kill, what you do.
       The stops come from the player route where one exists, and from the
       Bango client's own step text where it does not.

       A quest monster belongs on the step where the hunting happens, so it is
       attached by three signals, strongest first:

         1. the step names the monster in full;
         2. the step asks for a quest item and the monster drops it — a join
            through the client's own drop table, and the signal that catches
            both Demon Escorts behind "collect 30 Escort Soldier's Heads",
            neither of which the step names;
         3. every word of the monster's name appears in the step, which catches
            the shorthand "Kill Demon Escort Archer/Soldier".

       None of these is a substring match on a partial name (standing rule 14):
       (1) and (3) need the whole name, and (2) is a data join. A monster the
       quest tags that no step can be tied to is named once under its own
       heading below the diagram, never as a step in the sequence — and if the
       quest has exactly one hunting step, that is where it goes, because there
       is nowhere else it could be.
       =================================================================== */
    function questMonsterRows(questId) {
      const rows = (state.indexes.monsterQuestsByQuest.get(String(questId)) || [])
        .map(ref => state.indexes.monstersById.get(String(ref.monster_id))
          || { message_id: ref.monster_id, text: ref.monster_name || "" })
        .filter(row => row.text);
      // Bango keeps several ids under one name — three separate "Wolf" records
      // sit behind Cloth Raise — and the diagram is about which creature you
      // are looking for, not how many rows carry it.
      return [...new Map(rows.map(row => [normalizeName(row.text), row])).values()];
    }

    /* Words worth matching on. Dropping the filler leaves the words that
       actually identify the creature, so "Kill Demon Escort Archer/Soldier for
       30x …" still resolves Demon Escort Soldier even though the slash means
       its full name never appears. */
    const MONSTER_WORD_NOISE = new Set(["of", "the", "a", "an", "and", "from"]);

    function monsterNameWords(name) {
      return String(name).toLowerCase().split(/[^a-z0-9]+/i)
        .filter(word => word.length > 2 && !MONSTER_WORD_NOISE.has(word));
    }

    /* Which of this quest's monsters drop a given item, by Bango item id. The
       drop table is the client's own, so this is a join and not a guess. */
    function monstersDroppingItem(itemId, candidates) {
      const drops = state.indexes.dropsByItem.get(String(itemId)) || [];
      const ids = new Set(drops.map(row => String(row.drp_monst)));
      const names = new Set(drops.map(row => normalizeName(row.bango_monster_name)));
      return candidates.filter(monster => ids.has(String(monster.message_id))
        || names.has(normalizeName(monster.text)));
    }

    /* Item ids a step asks for: the client step carries them as data, and the
       player route quotes the item by name in its action text. */
    function stepItemIds(step) {
      const ids = parseJson(step.items_json, [])
        .map(entry => String(entry.item_id || "")).filter(Boolean);
      const text = String(step.step_text || step.text || "");
      for (const [, quoted] of text.matchAll(/"([^"]{3,})"/g)) {
        const item = state.indexes.bangoItemsByName.get(normalizeName(quoted));
        if (item) ids.push(String(item.ita_azon));
      }
      return [...new Set(ids)];
    }

    function questDiagramStops(quest) {
      const monsters = questMonsterRows(quest.que_id);
      const used = new Set();
      const take = hits => {
        hits.forEach(monster => used.add(String(monster.message_id)));
        return hits;
      };
      /* One step, every signal. `step` is either a client QUEST_STEPS row or a
         player-route step; both are read through the same two accessors. */
      const stepMonsters = step => {
        const text = String(step.step_text || step.text || step.label || "");
        const needle = normalizeName(`${text} ${step.name || ""}`);
        const words = new Set(needle.length ? monsterNameWords(`${text} ${step.name || ""}`) : []);
        const named = monsters.filter(monster => {
          const key = normalizeName(monster.text);
          if (!key) return false;
          if (needle.includes(key)) return true;
          const parts = monsterNameWords(monster.text);
          return parts.length > 0 && parts.every(word => words.has(word));
        });
        const dropped = stepItemIds(step)
          .flatMap(itemId => monstersDroppingItem(itemId, monsters));
        return take([...new Map([...named, ...dropped]
          .map(monster => [String(monster.message_id), monster])).values()]);
      };

      const route = routeQuestForBango(quest);
      const stops = [];
      if (route?.quest.steps?.length) {
        route.quest.steps.forEach(step => {
          if (step.type === "talk") {
            stops.push({ kind: "talk", city: step.city, pin: step.pin,
              label: step.label, name: questPinName(step.city, step.pin) });
          } else if (step.type === "field") {
            stops.push({ kind: "field", label: step.label, name: step.name,
              monsters: stepMonsters(step) });
          } else {
            stops.push({ kind: "action", text: step.text || "",
              monsters: stepMonsters(step) });
          }
        });
      } else {
        (state.indexes.questSteps.get(String(quest.que_id)) || []).forEach(step => {
          stops.push({ kind: "action", text: cleanText(step.step_text) || "",
            monsters: stepMonsters(step) });
        });
      }

      const unplaced = monsters.filter(monster => !used.has(String(monster.message_id)));
      if (unplaced.length) {
        const hunting = stops.filter(stop => stop.kind === "action" || stop.kind === "field");
        // With one hunting step there is only one place the hunting can happen,
        // so put them there. With several, saying which would be an invention.
        if (hunting.length === 1) {
          hunting[0].monsters = [...(hunting[0].monsters || []), ...unplaced];
        } else {
          stops.push({ kind: "monsters", monsters: unplaced });
        }
      }
      return stops;
    }

    // Every monster on the step, not the first four: an incomplete row is what
    // made the old trailing box look careless.
    function questStopMonstersHtml(monsters) {
      if (!monsters?.length) return "";
      return `<div class="stop-mobs">${monsters.map(monster =>
        `<a class="stop-mob" href="${routeHref("monster", monster.message_id)}"
          title="${escapeAttr(monster.text)}">
          ${monsterIconTag(monster.message_id, monster.text, 44)}
          <span>${escapeHtml(monster.text)}</span></a>`).join("")}</div>`;
    }

    function questDiagramHtml(quest) {
      const stops = questDiagramStops(quest);
      if (!stops.length) return "";
      // Monsters that could not be tied to a step are not a stop in the route,
      // so they are rendered under the diagram rather than inside it.
      const sequence = stops.filter(stop => stop.kind !== "monsters");
      const loose = stops.filter(stop => stop.kind === "monsters")
        .flatMap(stop => stop.monsters);
      return `<div class="route-diagram">${sequence.map((stop, index) => {
        const arrow = index ? `<span class="stop-arrow" aria-hidden="true">→</span>` : "";
        if (stop.kind === "talk") {
          return `${arrow}<div class="stop talk">
            ${questPinTag(stop.city, stop.pin)
              || `<span class="stop-chip">${escapeHtml(questMapById(stop.city)?.label || "Go")}</span>`}
            <span class="stop-name">${questPinNameHtml(stop.city, stop.pin) || "—"}</span>
            <span class="stop-do">${escapeHtml(stop.label || "")}</span></div>`;
        }
        if (stop.kind === "field") {
          return `${arrow}<div class="stop kill">
            <span class="stop-chip kill">${escapeHtml(stop.label || "Field")}</span>
            ${questStopMonstersHtml(stop.monsters)}
            <span class="stop-name">${escapeHtml(stop.name || "")}</span></div>`;
        }
        const kill = stop.monsters?.length || /\bkill\b|\bcollect\b|\bfind\b/i.test(stop.text);
        return `${arrow}<div class="stop ${kill ? "kill" : "act"}">
          <span class="stop-chip${kill ? " kill" : ""}">${kill ? "Kill" : "Do"}</span>
          ${questStopMonstersHtml(stop.monsters)}
          <span class="stop-do" title="${escapeAttr(stop.text)}">${escapeHtml(stop.text)}</span></div>`;
      }).join("")}</div>${loose.length ? `<div class="route-loose">
        <span class="route-loose-label">Also tagged to this quest${
          sequence.length > 1 ? ", with more than one hunting step to choose from" : ""}</span>
        ${questStopMonstersHtml(loose)}</div>` : ""}`;
    }

    function questCardIsOpen(profile, quest) {
      const id = String(quest.que_id);
      if (state.questCardOpen.has(id)) return state.questCardOpen.get(id);
      return questState(profile, id) !== "finished";
    }

    function questCardHtml(profile, quest, build) {
      const id = String(quest.que_id);
      const finished = questState(profile, id) === "finished";
      const open = questCardIsOpen(profile, quest);
      const rewards = [
        Number(quest.bango_experience) ? `${prettyNumber(quest.bango_experience)} XP` : "",
        Number(quest.bango_skill_points) ? `${prettyNumber(quest.bango_skill_points)} SP` : "",
        Number(quest.bango_contribution)
          ? `${prettyNumber(quest.bango_contribution)} contribution` : ""
      ].filter(Boolean).join(" · ");
      const prerequisite = state.indexes.questsById.get(String(quest.bango_prerequisite));
      const diagram = open ? questDiagramHtml(quest) : "";
      return `<article class="qcard${finished ? " done" : ""}${open ? " open" : ""}"
          data-quest-card="${escapeAttr(id)}">
        <div class="qcard-head">
          ${questStatusButton(profile, quest, true)}
          <h4>${entityLink("quest", quest.que_id, quest.que_name)}</h4>
          <span class="qcard-lvl">Lv ${escapeHtml(quest.que_lvl || "—")}</span>
          ${rewards ? `<span class="qcard-rewards">${escapeHtml(rewards)}</span>` : ""}
          <button type="button" class="qcard-toggle" data-quest-toggle="${escapeAttr(id)}"
            aria-expanded="${open ? "true" : "false"}"
            aria-label="${open ? "Collapse" : "Expand"} ${escapeAttr(quest.que_name || "quest")}"
            >${open ? "▾" : "▸"}</button>
        </div>
        ${open ? `<div class="qcard-body">
          ${diagram || emptyState("No route or client steps are recorded for this quest.")}
          ${animalChoiceHtml(questAnimalChoices(quest))}
          <div class="qcard-foot">
            ${prerequisite ? `<span class="tag gold">after ${
              entityLink("quest", prerequisite.que_id, prerequisite.que_name)}</span>` : ""}
            ${Number(quest.que_lvl) > Number(build.level)
              ? `<span class="tag danger">needs level ${escapeHtml(quest.que_lvl)}</span>` : ""}
            <a class="button small ghost" href="${routeHref("quest", quest.que_id)}">Full quest page</a>
          </div>
        </div>` : ""}
      </article>`;
    }

    function toggleQuestCard(questId) {
      const id = String(questId);
      const quest = state.indexes.questsById.get(id);
      if (!quest) return;
      state.questCardOpen.set(id, !questCardIsOpen(activeProfile(), quest));
      renderRoute();
    }

    /* ===================================================================
       Quests: two ways in

       The same quests answer two different questions. "Which quest is this,
       what does it give me, have I done it?" is a directory — filterable,
       sortable, one card per quest. "What do I actually do next?" is a
       walkthrough — the player route in its own order, batched into stages,
       read top to bottom.

       Neither is a subset of the other, so both exist, behind one navigation
       link and one deliberate choice at the top of the page. The choice is
       remembered, and the switch stays where it was so it can never be missed.
       =================================================================== */
    const QUEST_VIEWS = ["list", "walkthrough"];
    const QUEST_VIEW_KEY = "kal-atlas-quest-view-v1";

    function storedQuestView() {
      try {
        const saved = localStorage.getItem(QUEST_VIEW_KEY);
        return QUEST_VIEWS.includes(saved) ? saved : "";
      } catch (error) {
        return "";
      }
    }

    function questView(query) {
      const asked = query.get("view");
      if (QUEST_VIEWS.includes(asked)) {
        try { localStorage.setItem(QUEST_VIEW_KEY, asked); }
        catch (error) { /* a browser with storage off just does not remember */ }
        return asked;
      }
      return storedQuestView() || "list";
    }

    function questViewSwitch(view, query) {
      const carried = new URLSearchParams();
      for (const key of ["q", "level", "map"]) {
        if (query.get(key)) carried.set(key, query.get(key));
      }
      const href = name => {
        const params = new URLSearchParams(carried);
        params.set("view", name);
        return `#/quests?${params}`;
      };
      const walkthroughReady = Boolean(state.questMaps?.stages?.length);
      return `<div class="view-switch" role="tablist" aria-label="How to read the quests">
        <a class="view-card${view === "list" ? " active" : ""}" role="tab"
          aria-selected="${view === "list"}" href="${href("list")}">
          <span class="view-card-icon" aria-hidden="true">▤</span>
          <span class="view-card-body">
            <strong>Quest list</strong>
            <small>Every quest as its own card. Filter by level or map, check the
              rewards, tick off what you have done.</small>
          </span>
        </a>
        <a class="view-card${view === "walkthrough" ? " active" : ""}${
            walkthroughReady ? "" : " disabled"}" role="tab"
          aria-selected="${view === "walkthrough"}" href="${href("walkthrough")}">
          <span class="view-card-icon" aria-hidden="true">➜</span>
          <span class="view-card-body">
            <strong>Walkthrough</strong>
            <small>${walkthroughReady
              ? "The efficient route in stages, in the order you play it — who to "
                + "talk to, what to farm, what stacks with what."
              : "Needs the player route guide, which is not loaded."}</small>
          </span>
        </a>
      </div>`;
    }

    /* The route names items and monsters in prose; the pictures come from our
       own licence-clean sources by resolving that prose to a real entity. A name
       that does not resolve keeps its text and gets no picture. */
    function guideItemFor(name) {
      const clean = String(name).replace(/^\s*\d+\s*x\s*/i, "").trim();
      return state.indexes.bangoItemsByName?.get(normalizeName(clean)) || null;
    }

    function guideMonsterFor(name) {
      const table = state.indexes.monstersByName;
      if (!table) return null;
      const key = normalizeName(name);
      // The route writes monsters in the plural — "Kill Demon Plunderers" —
      // where the client names one creature.
      for (const candidate of [key, key.replace(/es$/, ""), key.replace(/s$/, "")]) {
        const found = candidate && table.get(candidate);
        if (found) return found;
      }
      return null;
    }

    /* A picture you are trying to recognise mid-quest wants to be looked at, so
       it enlarges under the pointer and enlarges further when clicked. The
       picture itself is the zoom control and the name beside it stays the link,
       because a click that both navigated and zoomed could only do one. */
    function zoomFrame(inner, kind) {
      return `<button type="button" class="zoom-frame ${escapeAttr(kind)}"
        data-zoom aria-label="Enlarge">${inner}</button>`;
    }

    function guideAssetsHtml(entries, kind) {
      if (!entries?.length) return "";
      return `<div class="wt-assets">${entries.map(entry => {
        const label = String(entry.name || "");
        if (kind === "item") {
          const item = guideItemFor(label);
          return `<span class="wt-asset item">${item
            ? `${zoomFrame(iconTag(item.bango_image || "", item.ita_name || label, 56), "item")}
               ${entityLink("item", item.ita_azon, label)}`
            : `<span class="wt-asset-plain">${escapeHtml(label)}</span>`}</span>`;
        }
        const monster = guideMonsterFor(label);
        return `<span class="wt-asset monster">${monster
          ? `${zoomFrame(monsterIconTag(monster.message_id, monster.text, 92), "monster")}
             ${entityLink("monster", monster.message_id, label)}`
          : `<span class="wt-asset-plain">${escapeHtml(label)}</span>`}</span>`;
      }).join("")}</div>`;
    }

    /* ===================================================================
       "Which animal is which"

       The Egg Quest's turn-in offers three untranslated transliterations —
       `YoongSangGaeGoonJae`, `GunChiHyunRyungHwangSun`, `TooGeuk` — and the
       choice is permanent. The route guide's author worked out which animal
       each one hatches into; without that a player is picking blind.

       It is the same vocabulary the client uses for the transform skills, so
       each answer links to that animal's skill tree.
       =================================================================== */
    const ANIMAL_SCOPE_BY_NAME = { tiger: "yungsang", panther: "tuguk",
      bird: "gunchi", eagle: "gale" };

    function animalChoiceHtml(choices) {
      const rows = (choices || []).map(choice => (typeof choice === "string"
        ? { tag: choice, desc: "" }
        : { tag: String(choice.tag || ""), desc: String(choice.desc || "") }))
        .filter(choice => choice.tag || choice.desc);
      if (!rows.length) return "";
      return `<div class="callout info choice-note">
        <strong>Which animal is which.</strong> The turn-in names them as they appear
        in the client; this is what each one hatches into. The choice is permanent.
        <ul class="choice-list">${rows.map(choice => {
          const scope = ANIMAL_SCOPE_BY_NAME[normalizeName(choice.desc)];
          return `<li><span class="mono">${escapeHtml(choice.tag)}</span>
            <span class="choice-arrow" aria-hidden="true">→</span>
            ${choice.desc ? (scope
              ? `<a href="#/skills?scope=${escapeAttr(scope)}"><strong>${
                  escapeHtml(choice.desc)}</strong></a>`
              : `<strong>${escapeHtml(choice.desc)}</strong>`)
            : `<span class="dim">not identified</span>`}</li>`;
        }).join("")}</ul>
      </div>`;
    }

    /* The route guide's choices for a Bango quest, where one is matched. */
    function questAnimalChoices(quest) {
      return routeQuestForBango(quest)?.quest.choices || [];
    }

    function walkthroughStepHtml(step) {
      if (step.type === "talk") {
        const name = questPinName(step.city, step.pin);
        const pin = questMapById(step.city)?.pins?.[step.pin] || {};
        return `<li class="wt-step talk">
          ${questPinTag(step.city, step.pin)
            || `<span class="pin-tag field">${escapeHtml(step.city || "?")}</span>`}
          ${pin.photo ? zoomFrame(`<img class="npc-photo"
            data-project-file="${escapeAttr(pin.photoThumb || pin.photo)}"
            alt="" title="${escapeAttr(name)}">`, "photo") : ""}
          <span class="wt-step-text"><strong>${escapeHtml(step.label || "Talk")}</strong>
            ${name ? ` — ${questPinNameHtml(step.city, step.pin)}` : ""}${pin.teleport
              ? ` <small class="dim">${escapeHtml(pin.teleport)}</small>` : ""}</span>
        </li>`;
      }
      if (step.type === "field") {
        return `<li class="wt-step field">
          <span class="pin-tag field">🌲 ${escapeHtml(step.label || "Out of town")}</span>
          <span class="wt-step-text">${escapeHtml(step.name || "")}</span>
        </li>`;
      }
      return `<li class="wt-step action">
        <span class="pin-tag action">⚔</span>
        <span class="wt-step-text">${escapeHtml(step.text || "")}</span>
      </li>`;
    }

    /* A route row is one quest most of the time, and sometimes a batch of
       several ("Step 0 — Accept everything first" covers seven). Only a row
       that resolves to one Bango quest can share the profile's quest status;
       a batch keeps its own tick, stored beside it and labelled as its own. */
    function walkthroughRowStatus(profile, stageId, entry) {
      const questId = bangoQuestIdForRouteName(entry.name);
      const quest = questId && state.indexes.questsById.get(questId);
      if (quest) {
        return { kind: "quest", quest,
          done: questState(profile, quest.que_id) === "finished" };
      }
      const key = `${stageId}::${entry.name}`;
      return { kind: "batch", key, done: Boolean(profile.walkthrough?.[key]) };
    }

    function walkthroughQuestHtml(profile, stage, entry, build) {
      const status = walkthroughRowStatus(profile, stage.id, entry);
      const tick = status.kind === "quest"
        ? questStatusButton(profile, status.quest, true)
        : `<button type="button" class="quest-status${status.done ? " finished" : ""}"
            data-walkthrough-tick="${escapeAttr(status.key)}"
            title="Several quests at once — ticked here only"
            aria-pressed="${status.done ? "true" : "false"}">${status.done ? "✓" : "○"}</button>`;
      const title = status.kind === "quest"
        ? entityLink("quest", status.quest.que_id, status.quest.que_name)
        : escapeHtml(entry.name);
      return `<article class="wt-quest${status.done ? " done" : ""}">
        <div class="wt-quest-head">
          ${tick}
          <h5>${title}</h5>
          ${entry.level ? `<span class="qcard-lvl">${escapeHtml(entry.level)}</span>` : ""}
          ${status.kind === "quest" ? `<span class="wt-route-name"
            title="What the route guide calls it">${escapeHtml(entry.name)}</span>` : ""}
        </div>
        ${entry.note ? `<p class="wt-note">${escapeHtml(entry.note)}</p>` : ""}
        ${entry.startCity ? `<p class="wt-start">Start from
          <strong>${escapeHtml(questMapById(entry.startCity)?.name || entry.startCity)}</strong></p>` : ""}
        <ol class="wt-steps">${(entry.steps || []).map(walkthroughStepHtml).join("")}</ol>
        ${guideAssetsHtml(entry.mobs, "monster")}
        ${guideAssetsHtml(entry.items, "item")}
        ${animalChoiceHtml(entry.choices)}
        ${entry.reward ? `<p class="wt-reward"><span>Reward</span>
          ${escapeHtml(entry.reward)}</p>` : ""}
        ${status.kind === "quest" && Number(status.quest.que_lvl) > Number(build.level)
          ? `<p class="wt-warn">Your character is level ${escapeHtml(String(build.level))};
            the client requires ${escapeHtml(status.quest.que_lvl)}.</p>` : ""}
      </article>`;
    }

    function renderQuestWalkthrough(query) {
      const profile = activeProfile();
      const build = currentBuild();
      const stages = state.questMaps?.stages || [];
      const mapFilter = query.get("map") || "";
      const rows = stages.flatMap(stage => stage.quests.map(entry => ({ stage, entry })));
      const done = rows.filter(({ stage, entry }) =>
        walkthroughRowStatus(profile, stage.id, entry).done).length;
      const usedMaps = new Set();
      stages.forEach(stage => stage.quests.forEach(entry => (entry.steps || [])
        .forEach(step => { if (step.city) usedMaps.add(step.city); })));
      const teleports = (state.questMaps?.teleports || []);
      const percent = rows.length ? Math.round((done / rows.length) * 100) : 0;
      const revision = state.questMaps?.source_revision || "";

      el.main.innerHTML = `
        ${pageHeader({
          eyebrow: "Quests",
          title: "Walkthrough",
          lede: "The efficient route in the order it is played. Each stage says where "
            + "you are, what stacks with what, and every stop on the way.",
          crumbs: [["Overview", "#/home"], ["Quests", "#/quests"], ["Walkthrough", ""]]
        })}
        ${questViewSwitch("walkthrough", query)}
        <div class="wt-progress">
          <div class="wt-bar"><span style="width:${percent}%"></span></div>
          <span class="dim"><b>${prettyNumber(done)}</b> of ${prettyNumber(rows.length)}
            route entries done</span>
          <button type="button" class="small ghost" data-action="reset-quests">Reset</button>
        </div>
        <div class="quest-layout">
          <div>
            ${teleports.length ? section("Useful teleports",
              `<ul class="wt-teleports">${teleports.map(row => `<li>
                ${questPinTag(row.city, row.pin) || ""}
                <span>${questPinNameHtml(row.city, row.pin)}
                  — ${escapeHtml(row.dest || "")}</span></li>`).join("")}</ul>`) : ""}
            ${stages.length ? stages.map(stage => `
              <section class="wt-stage">
                <div class="wt-stage-head">
                  <h4>${escapeHtml(stage.title || stage.id)}</h4>
                  ${stage.level ? `<span class="wt-stage-lvl">${escapeHtml(stage.level)}</span>` : ""}
                </div>
                ${stage.where ? `<p class="wt-where">${escapeHtml(stage.where)}</p>` : ""}
                ${stage.combo ? `<div class="callout info wt-combo">
                  <strong>Farm cluster.</strong> ${cleanHtmlText(stage.combo)}</div>` : ""}
                ${stage.quests.map(entry =>
                  walkthroughQuestHtml(profile, stage, entry, build)).join("")}
              </section>`).join("")
            : emptyState("The player route guide is not loaded, so there is no walkthrough.")}
          </div>
          <div class="quest-map-column">
            ${questMapPanel(mapFilter || [...usedMaps][0], {
              title: "Where the quests are",
              aside: `<span class="panel-aside">Click a pin or a tag</span>`
            })}
          </div>
        </div>
        ${provenanceFooter(`
          <p>The route order, the stage batching and the notes are the player-authored
            guide's own work${revision ? ` (revision ${escapeHtml(revision)})` : ""}; its quest
            text and town maps come from
            <a href="https://mystic-city.de/System/viewpage.php?page_id=48" target="_blank"
               rel="noopener noreferrer">mystic-city.de</a>, with world map artwork by
            Vresko.com. Quest names, levels and rewards shown against a route entry come from
            the current Bango client tables and win wherever the two disagree.
            ${npcPhotoCredit()}</p>
          <p>A row the guide writes as a batch of several quests — the opening stage has
            five — cannot be one client quest, so it carries its own tick rather than
            pretending to be one.</p>`)}`;
      wireQuestMaps();
      if (typeof el.main.querySelectorAll === "function") {
        el.main.querySelectorAll("[data-walkthrough-tick]").forEach(button => {
          button.onclick = () => toggleWalkthroughTick(button.dataset.walkthroughTick);
        });
      }
    }

    function toggleWalkthroughTick(key) {
      const profile = activeProfile();
      profile.walkthrough ||= {};
      if (profile.walkthrough[key]) delete profile.walkthrough[key];
      else profile.walkthrough[key] = true;
      persistProfiles();
      renderRoute();
    }

    function renderQuests(query) {
      if (questView(query) === "walkthrough" && state.questMaps?.stages?.length) {
        return renderQuestWalkthrough(query);
      }
      const q = normalizeName(query.get("q") || "");
      const level = query.get("level") || "";
      const mapFilter = query.get("map") || "";
      const levels = [...new Set(state.tables.quests.map(row => row.que_lvl).filter(Boolean))]
        .sort((a, b) => Number(a) - Number(b));
      const rows = state.tables.quests.filter(row => {
        if (q && !normalizeName(`${row.que_name} ${row.que_id} ${row.que_text}`).includes(q)) return false;
        if (level && row.que_lvl !== level) return false;
        if (mapFilter) {
          const route = routeQuestForBango(row);
          if (!route?.quest.steps.some(step => step.city === mapFilter)) return false;
        }
        return true;
      });
      // Level order, because that is the order the quests are actually played.
      rows.sort((a, b) => (Number(a.que_lvl) || 0) - (Number(b.que_lvl) || 0)
        || Number(a.que_id) - Number(b.que_id));
      const pageSize = 20;
      const page = Number(query.get("page") || 1);
      const shown = rows.slice((page - 1) * pageSize, page * pageSize);
      const profile = activeProfile();
      const build = currentBuild();
      const done = rows.filter(row => questState(profile, row.que_id) === "finished").length;
      const usedMaps = new Set();
      shown.forEach(row => routeQuestForBango(row)?.quest.steps
        .forEach(step => { if (step.city) usedMaps.add(step.city); }));

      el.main.innerHTML = `
        ${pageHeader({
          eyebrow: "Quests",
          title: "Quests",
          lede: "Every quest as a route: who to talk to, where, and what to kill. "
            + "Tick one off and it folds away.",
          crumbs: [["Overview", "#/home"], ["Quests", ""]],
