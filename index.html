    async function connectWithDirectoryPicker() {
      if (!window.showDirectoryPicker) {
        el.folderInput.click();
        return;
      }
      try {
        const handle = await window.showDirectoryPicker({ mode: "read", id: "kal-atlas-project" });
        await rememberHandle(handle);
        await loadProject(new DirectorySource(handle), "folder handle");
      } catch (error) {
        if (error?.name !== "AbortError") renderConnect(error.message || String(error));
      }
    }

    async function tryReconnect() {
      const handle = await recalledHandle();
      if (!handle) return false;
      try {
        const permission = await handle.queryPermission({ mode: "read" });
        if (permission !== "granted") return false;
        await loadProject(new DirectorySource(handle), "remembered folder");
        return true;
      } catch {
        return false;
      }
    }

    async function readCsvFrom(source, path) {
      return parseCsv(await source.read(path));
    }

    async function loadProject(source, sourceKind) {
      state.ready = false;
      state.loading = true;
      state.source = source;
      state.sourceKind = sourceKind;
      state.tables = {};
      state.optional = {};
      state.combat = null;
      state.indexes = {};
      state.articles = [];
      state.zones = [];
      state.rawTables.clear();
      state.evidence.clear();
      state.loadWarnings = [];
      state.lastError = "";

      try {
        renderLoading("Indexing available CSV and reference files…", 4);
        state.availableFiles = await source.list();
        const requiredEntries = Object.entries(CORE_FILES);
        const optionalEntries = Object.entries(OPTIONAL_CSV_FILES);
        const total = requiredEntries.length + optionalEntries.length + 1;
        let completed = 0;

        for (const [key, path] of requiredEntries) {
          renderLoading(`Reading ${path}`, 5 + (completed / total) * 72);
          const rows = await readCsvFrom(source, path);
          state.tables[key] = rows;
          state.rawTables.set(path, rows);
          completed += 1;
          await new Promise(resolve => setTimeout(resolve, 0));
        }

        for (const [key, path] of optionalEntries) {
          renderLoading(`Checking ${path}`, 5 + (completed / total) * 72);
          try {
            const rows = await readCsvFrom(source, path);
            state.optional[key] = rows;
            state.rawTables.set(path, rows);
          } catch (error) {
            state.optional[key] = [];
            state.loadWarnings.push(`${path}: ${error.message}`);
          }
          completed += 1;
          await new Promise(resolve => setTimeout(resolve, 0));
        }

        renderLoading("Reading the combat fixture…", 79);
        await loadCombatFixture();
        await loadServerProfile();
        await loadQuestMaps();
        renderLoading("Reading registered reference articles…", 81);
        await loadArticles();
        renderLoading("Building reciprocal entity links…", 89);
        buildIndexes();
        renderLoading("Preparing search and routes…", 96);
        buildSearchIndex();

        state.ready = true;
        state.loading = false;
        state.snapshotLabel = `${prettyNumber(state.tables.drops.length)} Bango drop rows`;
        setStatus("Bango data connected", "ready");
        renderNavigation();
        if (!location.hash || location.hash === "#") location.hash = "#/home";
        renderRoute();
      } catch (error) {
        state.lastError = error?.message || String(error);
        renderConnect(state.lastError);
      }
    }

    /* Server rates live in one project file so they are set once, off the
       website, and every derived table follows. Absent or malformed, the
       defaults are the KalEncyclopedia baseline of 1× and nothing silently
       scales. */
    const DEFAULT_SERVER_PROFILE = {
      server_name: "", experience_rate: 1, experience_rate_confirmed: false,
      drop_rate_multiplier: 1, geons_rate: 1, egg_experience_per_day: 4800,
      egg_experience_per_day_confirmed: false
    };

    async function loadServerProfile() {
      state.server = { ...DEFAULT_SERVER_PROFILE };
      try {
        const text = await state.source.read("analysis/server_profile/SERVER_PROFILE.json");
        Object.assign(state.server, JSON.parse(text));
      } catch (error) {
        state.loadWarnings.push("analysis/server_profile/SERVER_PROFILE.json: using 1× defaults");
      }
    }

    function serverRate(field) {
      const value = Number(state.server?.[field]);
      return Number.isFinite(value) && value > 0 ? value : 1;
    }

    function unconfirmedRateNote(field, label) {
      const rate = serverRate(field);
      if (rate === 1) return "";
      const confirmed = state.server?.[`${field}_confirmed`];
      return `<p class="dim" style="margin:0 0 10px"><small>Scaled by the project's
        <strong>${prettyNumber(rate)}×</strong> ${escapeHtml(label)}${confirmed
          ? "" : ", which has not been confirmed in play"}.</small></p>`;
    }

    // The fixture carries the [ORIG] lookup tables and the per-level band
    // arrays. Nothing in this file restates a game constant: if the fixture is
    // missing, the build simulator says so and refuses to compute.
    async function loadCombatFixture() {
      try {
        const text = await state.source.read(COMBAT_FIXTURE_PATH);
        const parsed = JSON.parse(text);
        const required = ["tables", "class_order", "hp_quadratic", "mp_quadratic",
                          "stat_slots", "hp_level_coefficient_by_level",
                          "mp_level_band_by_level", "late_health_band_by_level"];
        const missing = required.filter(key => !parsed[key]);
        if (missing.length) throw new Error(`missing keys: ${missing.join(", ")}`);
        state.combat = parsed;
      } catch (error) {
        state.combat = null;
        state.loadWarnings.push(`${COMBAT_FIXTURE_PATH}: ${error.message}`);
      }
    }

    async function loadArticles() {
      const articlePaths = new Set(ROOT_ARTICLES);
      for (const path of state.availableFiles) {
        if (path.startsWith("research/bango_gitbook/pages/") && path.endsWith(".md")) {
          articlePaths.add(path);
        }
      }

      for (const path of [...articlePaths].sort()) {
        try {
          const text = await state.source.read(path);
          const heading = text.match(/^#\s+(.+)$/m)?.[1]?.trim();
          state.articles.push({
            path,
            title: heading || path.split("/").at(-1).replace(/\.md$/i, "").replaceAll("-", " "),
            text,
            kind: path.startsWith("research/bango_gitbook/") ? "Official Bango documentation" : "Project reference"
          });
        } catch (error) {
          if (ROOT_ARTICLES.includes(path)) state.loadWarnings.push(`${path}: ${error.message}`);
        }
      }

      const geography = state.articles.find(article => article.path === "Detailed_World_Geography_and_Navigation.md");
      state.zones = geography ? parseZones(geography.text) : [];
    }

    function parseZones(markdown) {
      const lines = String(markdown ?? "").split(/\r?\n/);
      const zones = [];
      for (let index = 0; index < lines.length; index += 1) {
        const match = lines[index].match(/^- \*\*Zone ([^\[]+)\[([^\]]+)\]:\*\*\s*(.+)$/);
        if (!match) continue;
        const mobLine = lines.slice(index + 1, index + 4).find(line => /\*Mobs:\*/.test(line)) || "";
        const mobText = mobLine.replace(/^.*\*Mobs:\*\s*/, "").replace(/\.$/, "");
        const mobLabels = /not provided/i.test(mobText)
          ? []
          : mobText.split(/,\s*/).map(value => value.trim()).filter(Boolean);
        zones.push({
          id: match[1].trim(),
          coordinates: match[2].trim(),
          description: match[3].trim(),
          mobText,
          mobLabels,
          sourcePath: geographyPath()
        });
      }
      return zones;
    }

    function geographyPath() {
      return "Detailed_World_Geography_and_Navigation.md";
    }

    function mapPush(map, key, value) {
      if (!map.has(key)) map.set(key, []);
      map.get(key).push(value);
    }

    function firstBy(rows, key) {
      const map = new Map();
      for (const row of rows) if (!map.has(String(row[key]))) map.set(String(row[key]), row);
      return map;
    }

    function groupedBy(rows, key) {
      const map = new Map();
      for (const row of rows) {
        const value = typeof key === "function" ? key(row) : row[key];
        mapPush(map, String(value), row);
      }
      return map;
    }

    function skillId(row) {
      return `${row.bango_key}~${row.bango_definition_ordinal || 1}`;
    }

    function skillByKey(key) {
      return state.indexes.skillsByKey.get(String(key))?.[0] || null;
    }

    function npcIdentity(row, nameCounts = state.indexes.npcNameCounts) {
      const raw = String(row?.text || "").trim();
      const normalized = normalizeName(raw);
      const bracketNames = [...raw.matchAll(/\[([^\]]+)\]/g)]
        .map(match => match[1].trim()).filter(Boolean);
      const commaName = raw.includes(",") ? raw.split(",").at(-1).replace(/[\[\]]/g, "").trim() : "";
      const aliases = new Set([...bracketNames, commaName].map(normalizeName)
        .filter(value => value.length >= 3));
      if (!aliases.size && normalized.length >= 5 && (nameCounts?.get(normalized) || 0) === 1) {
        aliases.add(normalized);
      }
      return {
        aliases: [...aliases],
        named: aliases.size > 0,
        display: aliases.size
          ? raw
          : `${raw || "Unnamed actor"} — generic actor (string ${row?.message_id || "?"})`
      };
    }

    function npcAliases(row, nameCounts) {
      return npcIdentity(row, nameCounts).aliases;
    }

    function npcDisplayName(row) {
      return npcIdentity(row).display;
    }

    function resolveZoneMonsters(label, monsters) {
      const original = normalizeName(label);
      const base = normalizeName(String(label).replace(/\([^)]*\)/g, "").replace(/^all\s+/i, ""));
      if (!base) return [];
      const exact = monsters.filter(monster => {
        const name = normalizeName(monster.text);
        return name === original || name === base;
      });
      if (exact.length) return exact;
      return monsters.filter(monster => {
        const name = normalizeName(monster.text);
        if (name.length < 6 || base.length < 6) return false;
        return name.endsWith(base) || base.includes(name) || name.includes(base);
      }).slice(0, 10);
    }

    // Bango names its item and prefix attributes in its own vocabulary. This is
    // the only place that vocabulary is translated into the project's 27 stat
    // slots. `Attack` and `Magic` carry a min/max pair; everything else is a
    // single value. Attributes with no stat meaning (buff, quest, teleport,
    // refresh, aspeed and the rest) are deliberately not mapped — they are not
    // dropped silently, they simply are not sheet stats.
    const BANGO_ATTRIBUTE_SLOTS = {
      Str: ["Strength"], Hth: ["Health"], Int: ["Intelligence"],
      Wis: ["Wisdom"], Dex: ["Agility"],
      hp: ["HP"], mp: ["MP"], hit: ["OTP"], dodge: ["Evasion"],
      defense: ["Defense"], absorb: ["Absorb"],
      resistfire: ["Fire"], resistice: ["Ice"], resistlitning: ["Lightening"],
      resistpalsy: ["NonElemental"], resistcurse: ["Curse"],
      Attack: ["PDMin", "PDMax"], Magic: ["MDMin", "MDMax"]
    };

    const WEAPON_PREFIX_IDS = new Set([
      ...Array.from({ length: 10 }, (_, index) => index + 1).filter(id => id !== 4),
      ...Array.from({ length: 10 }, (_, index) => index + 11).filter(id => id !== 14),
      ...Array.from({ length: 10 }, (_, index) => index + 21).filter(id => id !== 24),
      ...Array.from({ length: 10 }, (_, index) => index + 31).filter(id => id !== 34),
      ...Array.from({ length: 10 }, (_, index) => index + 41).filter(id => id !== 44),
      51, 52, 53, 54, 55, 58, 59, 60, 61, 62, 63, 64, 66, 67,
      ...Array.from({ length: 25 }, (_, index) => index + 68).filter(id =>
        ![83, 84, 85, 86, 87].includes(id))
    ].map(String));
    const ARMOR_PREFIX_IDS = new Set([56, 57, 65, 83, 84, 85, 86, 87].map(String));
    const ACCESSORY_PREFIX_IDS = new Set([
      1, 3, 4, 5, 6, 7, 11, 13, 14, 15, 16, 17,
      21, 23, 24, 25, 26, 27, 31, 33, 34, 35, 36, 37,
      41, 43, 44, 45, 46, 47, 93, 94, 95, 96, 97, 98, 99, 100, 101, 102
    ].map(String));

    function bangoAttributeStats(rows) {
      const stats = {};
      rows.forEach(row => {
        const slots = BANGO_ATTRIBUTE_SLOTS[row.attribute];
        if (!slots) return;
        const values = parseJson(row.values_json, []);
        slots.forEach((slot, index) => {
          const raw = Number(values[index]);
          if (!Number.isFinite(raw) || raw === 0) return;
          stats[slot] = (stats[slot] || 0) + raw;
        });
      });
      return stats;
    }

    function buildIndexes() {
      const t = state.tables;
      const o = state.optional;
      const ix = state.indexes = {};

      ix.itemsById = firstBy(t.items, "ita_azon");
      ix.itemAttributes = groupedBy(t.itemAttributes, "ita_azon");
      ix.dropsByItem = groupedBy(t.drops, "drp_item");
      ix.dropsByMonster = groupedBy(t.drops, "drp_monst");

      const monsterMessages = t.messages.filter(row => row.namespace === "monstername");
      const npcMessages = t.messages.filter(row => row.namespace === "npcname");
      ix.monsters = monsterMessages;
      ix.npcs = npcMessages;
      ix.monstersById = firstBy(monsterMessages, "message_id");
      ix.monsterDefinitions = groupedBy(monsterMessages, "message_id");
      ix.npcsById = firstBy(npcMessages, "message_id");
      ix.npcDefinitions = groupedBy(npcMessages, "message_id");
      ix.npcNameCounts = new Map();
      npcMessages.forEach(npc => {
        const key = normalizeName(npc.text);
        ix.npcNameCounts.set(key, (ix.npcNameCounts.get(key) || 0) + 1);
      });

      ix.skillsById = new Map(t.skills.map(row => [skillId(row), row]));
      ix.skillsByKey = groupedBy(t.skills, "bango_key");
      ix.skillSchedules = new Map(t.skillSchedules.map(row => [
        `${row.bango_key}~${row.bango_definition_ordinal || 1}`, row
      ]));
      ix.skillPrerequisites = groupedBy(t.skillPrerequisites, "skill_key");
      ix.skillDependents = groupedBy(t.skillPrerequisites, "prerequisite_skill_key");
      ix.playerSkillsByScope = groupedBy(
        t.skills.filter(row => ["common", "knight", "archer", "mage", "thief", "shaman"]
          .includes(scopeForSkill(row))),
        row => scopeForSkill(row)
      );

      ix.questsById = firstBy(t.quests, "que_id");
      ix.questsSorted = t.quests.slice().sort((left, right) =>
        (Number(left.que_lvl) || 0) - (Number(right.que_lvl) || 0)
        || String(left.que_name || "").localeCompare(String(right.que_name || "")));
      ix.questSteps = groupedBy(t.questSteps, "que_id");
      ix.questItems = groupedBy(t.questStepItems, "que_id");
      ix.questsByItem = groupedBy(t.questStepItems, "item_id");
      ix.monsterQuestsByMonster = groupedBy(t.monsterQuests, "monster_id");
      ix.monsterQuestsByQuest = groupedBy(t.monsterQuests, "quest_id");

      ix.prefixesById = firstBy(t.prefixes, "pre_azon");
      ix.prefixesByName = new Map(
        t.prefixes
          .filter(row => row.pre_name)
          .map(row => [normalizeName(row.pre_name), row])
      );
      ix.prefixAttributes = groupedBy(t.prefixAttributes, "pre_azon");
      ix.enhancementById = new Map(t.enhancementBonuses.map(row => [
        `${row.stat_family}~${row.application_band}~${row.enhancement_level}`, row
      ]));
      ix.enhancementGroups = groupedBy(t.enhancementBonuses, row =>
        `${row.stat_family}~${row.application_band}`);

      ix.legacyItemsById = firstBy(o.legacyItems || [], "ita_azon");
      ix.legacyMonstersById = firstBy(o.legacyMonsters || [], "mon_azon");
      ix.positionsByClass = groupedBy(o.positions || [], "po_class");
      ix.positionsByName = new Map((o.positions || [])
        .map(row => [normalizeName(row.po_megn), row]));
      ix.legacyItemsByName = new Map((o.legacyItems || []).map(row => [normalizeName(row.ita_name), row]));
      ix.legacyItemsGroupedByName = groupedBy(o.legacyItems || [], row => normalizeName(row.ita_name));
      ix.legacyArmorPreviewByClassGrade = new Map();
      (o.legacyItems || []).filter(row => normalizeName(row.ita_type) === "armor").forEach(row => {
        const model = String(row.ita_3d || "").split("#")[0];
        const code = model.match(/_([akmt]\d{2})\.gb$/i)?.[1]?.toLowerCase();
        if (code) ix.legacyArmorPreviewByClassGrade.set(
          `${normalizeName(row.ita_class)}~${displayGrade(row.ita_grade)}`, code);
      });
      ix.legacySkillPicByName = new Map((o.legacySkills || [])
        .filter(row => row.sk_megn && row.sk_pic !== "")
        .map(row => [normalizeName(row.sk_megn), String(row.sk_pic)]));
      // Item IDs are not shared between the two sources — Short Iron Sword is
      // Bango index 1 and legacy ID 174 — so the icon lookup for a legacy-keyed
      // equipment row has to go through the name, not the id.
      ix.bangoItemsByName = new Map(t.items.map(row => [normalizeName(row.ita_name), row]));
      ix.legacyMonstersByName = new Map((o.legacyMonsters || []).map(row => [normalizeName(row.mon_name), row]));
      // Decoded ita_rev / pre_rev vectors, grouped so one lookup gives an
      // item's whole stat block. Empty when the analysis folder is absent.
      ix.itemStatsById = groupedBy(o.itemStats || [], "ita_azon");
      ix.prefixStatsById = groupedBy(o.prefixStats || [], "pre_azon");

      // Equipment comes from the Bango tables, not the legacy decode: Bango is
      // the current authority for what exists, its ITEM_ATTRIBUTES carry the
      // full stat set, and every one of its items has an icon file.
      const attributesById = groupedBy(t.itemAttributes || [], "ita_azon");
      const prefixAttributesById = groupedBy(t.prefixAttributes || [], "pre_azon");
      const EQUIPPABLE = new Set(["weapon", "defense", "ornament"]);
      ix.equippableItems = t.items.map(row => {
        const classes = parseJson(row.bango_class_json, []);
        if (!EQUIPPABLE.has(String(classes[0] || ""))) return null;
        const rawSlot = String(classes[1] || classes[0] || "other");
        const category = String(classes[0] || "");
        return {
          id: String(row.ita_azon),
          name: row.ita_name,
          slot: simCanonicalSlot(category, rawSlot),
          rawSlot,
          category,
          cls: row.ita_class || "",
          grade: String(row.ita_grade || ""),
          gradeNumber: Number(String(row.ita_grade || "").replace(/[^\d]/g, "")) || 0,
          levelLimit: Number(row.ita_lvllim) || 0,
          icon: row.bango_image || "",
          stats: bangoAttributeStats(attributesById.get(String(row.ita_azon)) || [])
        };
      }).filter(Boolean).sort((a, b) => a.name.localeCompare(b.name));
      ix.equippableSlots = [...new Set(ix.equippableItems.map(item => item.slot))];
      ix.equippableById = new Map(ix.equippableItems.map(item => [item.id, item]));

      ix.prefixOptions = t.prefixes.map(row => ({
        id: String(row.pre_azon),
        name: row.pre_name || `Prefix ${row.pre_azon}`,
        stats: bangoAttributeStats(prefixAttributesById.get(String(row.pre_azon)) || [])
      })).filter(prefix => Object.keys(prefix.stats).length
          && !/^\+\d+$/.test(prefix.name)
          && !/^<unresolved prefixname:/i.test(prefix.name))
        .sort((a, b) => a.name.localeCompare(b.name));
      ix.prefixById = new Map(ix.prefixOptions.map(prefix => [prefix.id, prefix]));
      ix.legacyDropsByPairName = new Map();
      // Talismans have no Bango item id of their own to key on, so their drop
      // list is indexed inside the legacy id space they belong to.
      ix.legacyDropsByItemId = new Map();

      for (const row of o.legacyDrops || []) {
        const item = ix.legacyItemsById.get(String(row.drp_item));
        const monster = ix.legacyMonstersById.get(String(row.drp_monst));
        if (!item || !monster) continue;
        const enriched = { ...row, __item: item, __monster: monster,
          mon_name: monster.mon_name, mon_lvl: monster.mon_lvl };
        mapPush(ix.legacyDropsByPairName, dropPairKey(monster.mon_name, item.ita_name), enriched);
        mapPush(ix.legacyDropsByItemId, String(row.drp_item), enriched);
      }
      ix.rateMappedDropRows = t.drops.filter(row => currentRateRows(row).length).length;
      ix.rateVariantRows = t.drops.reduce((total, row) => total + currentRateRows(row).length, 0);

      ix.routeByBangoQuest = groupedBy(
        (o.routeReconciliation || []).filter(row => row.bango_que_id),
        "bango_que_id"
      );
      ix.routeStepsByOrdinal = groupedBy(o.routeSteps || [], "route_ordinal");
      ix.routeNpcs = o.routeNpcs || [];

      ix.questNpcs = new Map();
      ix.npcQuests = new Map();
      const npcMatchers = npcMessages
        .map(npc => ({ npc, aliases: npcAliases(npc, ix.npcNameCounts) }))
        .filter(matcher => matcher.aliases.length);
      for (const quest of t.quests) {
        const combined = normalizeName([
          quest.que_name,
          quest.que_text,
          ...(ix.questSteps.get(String(quest.que_id)) || []).map(step => step.step_text)
        ].join(" "));
        for (const matcher of npcMatchers) {
          if (matcher.aliases.some(alias => combined.includes(alias))) {
            mapPush(ix.questNpcs, String(quest.que_id), matcher.npc);
            mapPush(ix.npcQuests, String(matcher.npc.message_id), quest);
          }
        }
      }

      ix.monsterZones = new Map();
      for (const zone of state.zones) {
        zone.monsterMatches = [];
        for (const label of zone.mobLabels) {
          const matches = resolveZoneMonsters(label, monsterMessages);
          zone.monsterMatches.push({ label, matches });
          for (const monster of matches) mapPush(ix.monsterZones, String(monster.message_id), zone);
        }
      }

      ix.articleByPath = new Map(state.articles.map(article => [article.path, article]));
      // Article mentions are resolved on demand. Precomputing exact-name mentions
      // for every entity would repeatedly scan all documents during startup.
      ix.articleMentions = new Map();
    }

    function buildSearchIndex() {
      const ix = state.indexes;
      const docs = [];
      for (const row of state.tables.items) docs.push({
        type: "Item", title: row.ita_name || `Unresolved item ${row.ita_azon}`,
        subtitle: `ID ${row.ita_azon} · ${row.ita_class || "Any class"} · ${displayGrade(row.ita_grade)} · required level ${row.ita_lvllim || "—"}`,
        href: routeHref("item", row.ita_azon), search: `${row.ita_name} ${row.ita_azon} ${row.ita_class} ${row.ita_type}`
      });
      for (const row of ix.monsters) docs.push({
        type: "Monster", title: row.text, subtitle: `Bango monster ID ${row.message_id}`,
        href: routeHref("monster", row.message_id), search: `${row.text} ${row.message_id}`
      });
      for (const row of state.tables.skills) docs.push({
        type: "Skill", title: row.sk_megn || row.bango_key, subtitle: `${row.bango_key} · ${scopeForSkill(row)}`,
        href: routeHref("skill", skillId(row)), search: `${row.sk_megn} ${row.bango_key} ${scopeForSkill(row)} ${cleanText(row.sk_desc)}`
      });
      for (const row of state.tables.quests) docs.push({
        type: "Quest", title: row.que_name, subtitle: `Level ${row.que_lvl || "—"} · quest ${row.que_id}`,
        href: routeHref("quest", row.que_id), search: `${row.que_name} ${row.que_id} ${row.que_text}`
      });
      for (const row of ix.npcs) docs.push({
        type: "NPC", title: npcDisplayName(row), subtitle: `Bango NPC string ${row.message_id}`,
        href: routeHref("npc", row.message_id), search: `${row.text} ${row.message_id}`
      });
      for (const row of talismanRows()) docs.push({
        type: "Talisman", title: row.listName, subtitle: `${row.name} · ${row.effective}`,
        href: routeHref("talisman", row.id),
        search: `${row.listName} ${row.name} ${row.type} ${row.effective} ${row.propsText}
          ${row.rolls.map(roll => roll.prefix.name).join(" ")}`
      });
      for (const row of state.tables.prefixes) docs.push({
        type: "Prefix", title: row.pre_name || `Unresolved prefix ${row.pre_azon}`,
        subtitle: `Applied by a talisman`, href: routeHref("prefix", row.pre_azon),
        search: `${row.pre_name} ${row.pre_azon} ${row.bango_stats_json}`
      });
      for (const zone of state.zones) docs.push({
        type: "Zone", title: `Zone ${zone.id}`, subtitle: `${zone.coordinates} · ${zone.description}`,
        href: routeHref("zone", zone.id), search: `${zone.id} ${zone.coordinates} ${zone.description} ${zone.mobText}`
      });
      for (const article of state.articles) docs.push({
        type: "Article", title: article.title, subtitle: article.kind,
        href: routeHref("article", article.path), search: `${article.title} ${article.path} ${article.text.slice(0, 16000)}`
      });
      ix.searchDocs = docs.map(doc => ({ ...doc, normalized: normalizeName(doc.search) }));
    }

    function scopeForSkill(row) {
      const schedule = state.indexes.skillSchedules?.get(skillId(row));
      if (schedule?.scope) return schedule.scope;
      const limit = parseJson(row.bango_limit_json, []);
      return limit[0] || String(row.bango_key || "unknown").split("-")[0];
    }

    function routeInfo() {
      const raw = (location.hash || "#/home").slice(1);
      const [path, queryText = ""] = raw.split("?");
      const parts = path.replace(/^\/+/, "").split("/").filter(Boolean).map(decodeURIComponent);
      return { section: parts[0] || "home", id: parts[1] || "", parts, query: new URLSearchParams(queryText) };
    }

    function navGroups() {
      const ix = state.indexes;
      const counts = state.ready ? {
        items: state.tables.items.length,
        monsters: ix.monsters.length,
        skills: state.tables.skills.length,
        quests: state.tables.quests.length,
        npcs: ix.npcs.length,
        zones: state.zones.length,
        talismans: talismanRows().length,
        data: state.availableFiles.filter(path => path.endsWith(".csv")).length
      } : {};
      return [
        { label: "Explore", links: [
          ["home", "Overview", ""],
          ["search", "Global search", ""],
          ["articles", "Knowledge library", state.ready ? state.articles.length : ""]
        ]},
        { label: "Entities", links: [
          ["monsters", "Monsters", counts.monsters],
          ["items", "Items", counts.items],
          ["skills", "Skills", counts.skills],
          ["quests", "Quests", counts.quests],
          ["npcs", "NPCs", counts.npcs],
          ["zones", "Zones", counts.zones],
          ["talismans", "Talismans", counts.talismans]
        ]},
        { label: "Plan", links: [
          ["build", "Character Creation", ""],
          ["weapon-calculator", "Weapon calculator", ""],
          ["levels", "Levelling", ""],
          ["system", "Game system", ""]
        ]},
        { label: "Evidence", links: [
          ["sources", "Sources & authority", ""]
        ]}
      ];
    }

    function renderNavigation() {
      const current = routeInfo().section;
      el.desktopNav.innerHTML = navGroups().map(group => `
        <div class="nav-label">${escapeHtml(group.label)}</div>
        <nav class="nav">
          ${group.links.map(([route, label, count]) => `
            <a class="${current === route ? "active" : ""}" href="#/${route}">
              <span>${escapeHtml(label)}</span>
              ${count !== "" && count != null ? `<span class="nav-count">${prettyNumber(count)}</span>` : ""}
            </a>`).join("")}
        </nav>`).join("");
      el.mobileNav.innerHTML = navGroups().flatMap(group => group.links)
        .filter(([route]) => ["home", "monsters", "items", "skills", "quests", "npcs", "search"].includes(route))
        .map(([route, label]) => `<a class="${current === route ? "active" : ""}" href="#/${route}">${escapeHtml(label)}</a>`).join("");

      el.sidebarStatus.innerHTML = state.ready
        ? `<strong>Bango tables connected</strong>${escapeHtml(state.snapshotLabel)}<br>${prettyNumber(state.articles.length)} reference articles`
        : `<strong>Waiting for data</strong>Select the project folder to begin.`;
    }

    function breadcrumbs(entries) {
      return `<div class="breadcrumb">${entries.map(([label, href], index) => {
        const item = href ? `<a href="${href}">${escapeHtml(label)}</a>` : escapeHtml(label);
        return `${index ? "<span>/</span>" : ""}${item}`;
      }).join("")}</div>`;
    }

    function pageHeader({ eyebrow, title, lede = "", actions = "", crumbs = [] }) {
      return `
        ${crumbs.length ? breadcrumbs(crumbs) : ""}
        <header class="page-head">
          <div>
            ${eyebrow ? `<div class="eyebrow">${escapeHtml(eyebrow)}</div>` : ""}
            <h1>${escapeHtml(title)}</h1>
            ${lede ? `<p class="lede">${lede}</p>` : ""}
          </div>
          ${actions ? `<div class="page-actions">${actions}</div>` : ""}
        </header>`;
    }

    function section(title, body, actions = "") {
      return `<section class="section">
        <div class="section-head"><h2>${escapeHtml(title)}</h2>${actions}</div>
        <div class="section-body">${body}</div>
      </section>`;
    }

    function pagination(total, page, pageSize, sectionName, query) {
      const pages = Math.max(1, Math.ceil(total / pageSize));
      const current = Math.max(1, Math.min(page, pages));
      const params = new URLSearchParams(query);
      const href = target => {
        params.set("page", target);
        return `#/${sectionName}?${params}`;
      };
      return `<div class="pagination">
        <span>${prettyNumber(total)} results · page ${current} of ${pages}</span>
        <div>
          ${current > 1 ? `<a class="button small ghost" href="${href(current - 1)}">Previous</a>` : ""}
          ${current < pages ? `<a class="button small ghost" href="${href(current + 1)}">Next</a>` : ""}
        </div>
      </div>`;
    }

    function filterToolbar(route, query, options = {}) {
      const q = query.get("q") || "";
      const selectName = options.selectName || "";
      const selectValue = selectName ? query.get(selectName) || "" : "";
      const select = selectName ? `
        <select name="${escapeAttr(selectName)}" aria-label="${escapeAttr(options.selectLabel || selectName)}">
          <option value="">${escapeHtml(options.allLabel || "All")}</option>
          ${(options.selectOptions || []).map(value =>
            `<option value="${escapeAttr(value)}" ${String(value) === selectValue ? "selected" : ""}>${escapeHtml(value)}</option>`
          ).join("")}
        </select>` : "";
      return `<form class="toolbar" data-filter-route="${escapeAttr(route)}">
        <input class="filter-input" name="q" type="search" value="${escapeAttr(q)}" placeholder="${escapeAttr(options.placeholder || "Filter this list…")}">
        ${select}
        ${options.extra || ""}
        <button class="primary" type="submit">Apply</button>
      </form>`;
    }

    function renderSearch(query) {
      const q = query.get("q") || "";
      el.globalSearchInput.value = q;
      const normalized = normalizeName(q);
      const tokens = String(q).toLowerCase().trim().split(/\s+/).filter(Boolean);
      let results = [];
      if (normalized.length >= 2) {
        results = state.indexes.searchDocs.map(doc => {
          const title = normalizeName(doc.title);
          let score = 0;
          if (title === normalized) score += 100;
          else if (title.startsWith(normalized)) score += 45;
          else if (title.includes(normalized)) score += 24;
          if (doc.normalized.includes(normalized)) score += 8;
          score += tokens.filter(token => doc.search.toLowerCase().includes(token)).length * 2;
          return { ...doc, score };
        }).filter(doc => doc.score > 0)
          .sort((a, b) => b.score - a.score || a.title.localeCompare(b.title))
          .slice(0, 250);
      }
      el.main.innerHTML = `
        ${pageHeader({
          eyebrow: "Cross-entity lookup",
          title: q ? `Search: ${q}` : "Search the whole atlas",

    /* ===================================================================
       Quest maps

       80 hand-placed pins across 9 maps, and the quest steps that name them.
       Pin x/y are percentages of the map image, which is what makes the pins
       stay correct at any width — but also means a pin is only right against
       its own artwork. Three maps travel with the data; the six town maps are
       third-party and absent, so those show their pin list instead of a
       broken image.

       The link runs both ways: a quest's map tag focuses its pin, and a pin
       focuses the quest steps that use it — cycling through them, because one
       NPC serves many quests.
       =================================================================== */
    function questMaps() {
      return state.questMaps?.maps || [];
    }

    async function loadQuestMaps() {
      try {
        const text = await state.source.read("analysis/quest_maps/QUEST_MAPS.json");
        state.questMaps = JSON.parse(text);
        // city-pin -> [{stage, quest, step}], in the order the guide lists them.
        const uses = new Map();
        state.questMaps.stages.forEach(stage => stage.quests.forEach(quest =>
          quest.steps.forEach((step, index) => {
            if (step.type !== "talk") return;
            mapPush(uses, `${step.city}-${step.pin}`, { stage, quest, step, index });
          })));
        state.questMaps.uses = uses;
      } catch (error) {
        state.questMaps = null;
      }
    }

    function questMapById(id) {
      return questMaps().find(entry => entry.id === id);
    }

    function questPinName(city, pin) {
      return questMapById(city)?.pins?.[pin]?.name || "";
    }

    function questMapPanel(activeCity, options = {}) {
      const maps = questMaps();
      if (!maps.length) return "";
      const current = maps.find(entry => entry.id === activeCity) || maps[0];
      const shown = options.onlyMaps
        ? maps.filter(entry => options.onlyMaps.has(entry.id)) : maps;
      if (!shown.length) return "";
      const map = shown.some(entry => entry.id === current.id) ? current : shown[0];

      return panel(options.title || "Map", `
        <div class="map-tabs" role="tablist">${shown.map(entry => `
          <button type="button" class="map-tab${entry.id === map.id ? " active" : ""}"
            role="tab" aria-selected="${entry.id === map.id}"
            data-map-tab="${escapeAttr(entry.id)}"
            title="${escapeAttr(entry.name)}">${escapeHtml(entry.label)}
            <span class="dim">${Object.keys(entry.pins).length}</span></button>`).join("")}
        </div>
        ${shown.map(entry => {
          const active = entry.id === map.id;
          const pins = Object.entries(entry.pins);
          return `<div class="map-view${active ? "" : " hidden"}" data-map-view="${escapeAttr(entry.id)}">
            <div class="map-name">${escapeHtml(entry.name)}</div>
            ${entry.image ? `
              <div class="map-wrap" style="aspect-ratio:${entry.image.width || 4}/${entry.image.height || 3}">
                <img data-project-file="${escapeAttr(entry.image.file)}"
                  alt="${escapeAttr(entry.name)}">
                ${pins.map(([pin, data]) => `<button type="button" class="map-pin"
                  data-map-pin="${escapeAttr(`${entry.id}-${pin}`)}"
                  style="left:${data.x}%;top:${data.y}%"
                  title="${escapeAttr(`${data.name} — click to find its quest steps`)}"
                  >${escapeHtml(pin)}</button>`).join("")}
              </div>`
            : `<p class="map-missing">The image for this map is not included, so the pins
                below are listed instead of placed. They work the same way.</p>`}
            <ul class="map-legend">${pins.map(([pin, data]) => `
              <li><button type="button" class="map-legend-pin"
                data-map-pin="${escapeAttr(`${entry.id}-${pin}`)}">${escapeHtml(pin)}</button>
                ${escapeHtml(data.name)}</li>`).join("")}</ul>
          </div>`;
        }).join("")}`, { aside: options.aside || "" });
    }

    function questPinTag(city, pin, label = "") {
      const map = questMapById(city);
      if (!map) return "";
      const name = questPinName(city, pin);
      return `<button type="button" class="pin-tag" data-pin-tag="${escapeAttr(`${city}-${pin}`)}"
        title="${escapeAttr(`${map.name} — ${name}`)}">
        <span class="pin-tag-city">${escapeHtml(map.label)}</span>#${escapeHtml(pin)}${
          label ? ` <span class="dim">${escapeHtml(label)}</span>` : ""}</button>`;
    }

    function showQuestMap(city) {
      el.main.querySelectorAll("[data-map-view]").forEach(view =>
        view.classList.toggle("hidden", view.dataset.mapView !== city));
      el.main.querySelectorAll("[data-map-tab]").forEach(tab => {
        const active = tab.dataset.mapTab === city;
        tab.classList.toggle("active", active);
        tab.setAttribute("aria-selected", String(active));
      });
    }

    /* Re-adding the class after a forced reflow is what lets the same target
       flash again on a second click. */
    function flashElement(node, duration = 2600) {
      if (!node) return;
      node.classList.remove("flash");
      void node.offsetWidth;
      node.classList.add("flash");
      setTimeout(() => node.classList.remove("flash"), duration);
      try { node.scrollIntoView({ behavior: "smooth", block: "center" }); }
      catch (error) { /* older browsers simply do not scroll */ }
    }

    function focusMapPin(key) {
      const [city] = key.split("-");
      showQuestMap(city);
      const pin = el.main.querySelector(`.map-pin[data-map-pin="${CSS.escape(key)}"]`)
        || el.main.querySelector(`.map-legend-pin[data-map-pin="${CSS.escape(key)}"]`);
      flashElement(pin);
    }

    function focusPinTag(key) {
      const tags = [...el.main.querySelectorAll(`[data-pin-tag="${CSS.escape(key)}"]`)];
      if (!tags.length) return;
      state.pinCycle ||= new Map();
      const index = (state.pinCycle.get(key) || 0) % tags.length;
      state.pinCycle.set(key, index + 1);
      flashElement(tags[index]);
    }

    function wireQuestMaps(root = el.main) {
      if (!root || typeof root.querySelectorAll !== "function") return;
      root.querySelectorAll("[data-map-tab]").forEach(tab => {
        tab.onclick = () => showQuestMap(tab.dataset.mapTab);
      });
      root.querySelectorAll("[data-map-pin]").forEach(pin => {
        pin.onclick = () => focusPinTag(pin.dataset.mapPin);
      });
      root.querySelectorAll("[data-pin-tag]").forEach(tag => {
        tag.onclick = () => focusMapPin(tag.dataset.pinTag);
      });
    }

    /* The guide names its quests "Quest 35"; the Bango table names them
       properly. They are matched by the level and order they appear in, so a
       Bango quest page can show the route steps and the map that belong to
       it without inventing a link that is not there. */
    function routeQuestForBango(row) {
      if (!state.questMaps) return null;
      state.questMaps.byBango ||= (() => {
        const index = new Map();
        const reconciliation = state.optional.routeReconciliation || [];
        reconciliation.forEach(entry => {
          if (!entry.bango_que_id || !entry.route_name) return;
          index.set(String(entry.bango_que_id), entry.route_name);
        });
        return index;
      })();
      const routeName = state.questMaps.byBango.get(String(row.que_id));
      if (!routeName) return null;
      for (const stage of state.questMaps.stages) {
        const quest = stage.quests.find(entry => entry.name === routeName);
        if (quest) return { stage, quest };
      }
      return null;
    }

    function renderQuests(query) {
      const q = normalizeName(query.get("q") || "");
      const level = query.get("level") || "";
      const mapFilter = query.get("map") || "";
      const levels = [...new Set(state.tables.quests.map(row => row.que_lvl).filter(Boolean))]
        .sort((a, b) => Number(a) - Number(b));
      const rows = state.tables.quests.filter(row => {
        if (q && !normalizeName(`${row.que_name} ${row.que_id} ${row.que_text}`).includes(q)) return false;
        if (level && row.que_lvl !== level) return false;
        if (mapFilter) {
          const route = routeQuestForBango(row);
          if (!route?.quest.steps.some(step => step.city === mapFilter)) return false;
        }
        return true;
      });
      const pageSize = 60;
      const page = Number(query.get("page") || 1);
      const shown = rows.slice((page - 1) * pageSize, page * pageSize);
      const usedMaps = new Set();
      shown.forEach(row => routeQuestForBango(row)?.quest.steps
        .forEach(step => { if (step.city) usedMaps.add(step.city); }));

      el.main.innerHTML = `
        ${pageHeader({
          eyebrow: "Quests",
          title: "Quests",
          lede: "Levels, rewards, steps — and where on the map each one happens.",
          crumbs: [["Overview", "#/home"], ["Quests", ""]]
        })}
        ${filterToolbar("quests", query, { selectName: "level", selectLabel: "Level", allLabel: "All levels", selectOptions: levels, placeholder: "Quest name or text…" })}
        ${questMaps().length ? `<div class="map-filter-row">
          <span class="dim">Map</span>
          <a class="filter-chip${mapFilter ? "" : " active"}" href="#/quests${
            query.get("q") || level ? `?${new URLSearchParams([
              ...(query.get("q") ? [["q", query.get("q")]] : []),
              ...(level ? [["level", level]] : [])])}` : ""}">All</a>
          ${questMaps().map(entry => {
            const params = new URLSearchParams();
            if (query.get("q")) params.set("q", query.get("q"));
            if (level) params.set("level", level);
            params.set("map", entry.id);
            return `<a class="filter-chip${mapFilter === entry.id ? " active" : ""}"
              href="#/quests?${params}" title="${escapeAttr(entry.name)}">${escapeHtml(entry.label)}</a>`;
          }).join("")}
        </div>` : ""}
        <div class="quest-layout">
          <div>
            ${panel("", `<div class="table-wrap"><table>
              <thead><tr><th>${escapeHtml(activeProfile().name)}</th><th>Quest</th>
                <th class="num">Level</th><th class="num">XP</th><th class="num">SP</th>
                <th class="num">Contribution</th><th>Where</th></tr></thead>
              <tbody>${shown.map(row => {
                const route = routeQuestForBango(row);
                const pins = route ? [...new Map(route.quest.steps
                  .filter(step => step.type === "talk")
                  .map(step => [`${step.city}-${step.pin}`, step])).values()] : [];
                return `<tr>
                  <td>${questStatusButton(activeProfile(), row, true)}</td>
                  <td>${entityLink("quest", row.que_id, row.que_name)}</td>
                  <td class="num">${escapeHtml(row.que_lvl || "—")}</td>
                  <td class="num">${prettyNumber(row.bango_experience)}</td>
                  <td class="num">${prettyNumber(row.bango_skill_points)}</td>
                  <td class="num">${prettyNumber(row.bango_contribution)}</td>
                  <td>${pins.length
                    ? `<div class="pin-tag-row">${pins.map(step =>
                        questPinTag(step.city, step.pin)).join("")}</div>`
                    : `<span class="dim">—</span>`}</td>
                </tr>`;
              }).join("")}</tbody>
            </table></div>`, { wide: true })}
            ${pagination(rows.length, page, pageSize, "quests", query)}
          </div>
          <div class="quest-map-column">
            ${questMapPanel(mapFilter || [...usedMaps][0], {
              title: "Where the quests are",
              // Every map stays available even when the list is filtered, so
              // a tag for another map still has somewhere to jump to.
              aside: `<span class="panel-aside">Click a pin or a tag</span>`
            })}
          </div>
        </div>`;
      wireQuestMaps();
    }

          const matches = zone.monsterMatches.flatMap(group => group.matches);

            <strong>Zone ${escapeHtml(zone.id)} <span class="dim">[${escapeHtml(zone.coordinates)}]</span></strong>

            <span class="count">${prettyNumber(new Set(matches.map(row => row.message_id)).size)} Bango monster links</span>
          </a>`;

    }

    /* ===================================================================
       Talismans

       Reproduces KalEncyclopedia's "Database - Items - Talizmans" page.
       The talisman list is ITEMS where ita_itype = 6. Everything else is
       recovered from frmTalis:

         Name / Effective    literal, switched on the first token of ita_type
         Props               ita_rev verbatim for the four enchant ladders;
                             for a paired talisman, ita_rev is
                             prefixA|chanceA|prefixB|chanceB and each prefix's
                             pre_rev decodes through the 27-slot stat vector
         Chance              a literal ladder for TaoA/TaoM/ToA/ToD, and the
                             two per-roll percentages out of ita_rev otherwise
         Icon                imgOthers.Images(ita_pic), exported as
                             kalenc-talisman-00N.png

       One deliberate deviation: the original compares Left(ita_type, 4)
       against 'ToW' and so never matches any real Talisman of Wonder row,
       leaving the previous selection's name, target and chance on screen.
       Matching on the first token fixes that.
       =================================================================== */
    const TALISMAN_FAMILIES = {
      TaoA: { name: "Talisman of Attack", effective: "Weapons",
        chance: [100, 100, 100, 100, 92, 82, 70, 56, 40, 32, 23, 15, 7, 2, 1, 0.2, 0.05, 0.01] },
      TaoM: { name: "Talisman of Magic", effective: "Weapons",
        chance: [100, 100, 100, 100, 92, 82, 70, 56, 40, 32, 23, 15, 7, 2, 1, 0.2, 0.05, 0.01] },
      ToA: { name: "Talisman of Accuracy", effective: "Weapons",
        chance: [100, 67, 38, 15, 9, 0.5, 0.1] },
      ToD: { name: "Talisman of Defense", effective: "Armor",
        chance: [100, 89, 53, 33, 20, 12, 8, 4, 2, 0.5, 0.1, 0.01] },
      ToI: { name: "Talisman of Intensification", effective: "Weapons" },
      ToP: { name: "Talisman of Protection", effective: "Armor" },
      ToW: { name: "Talisman of Wonder", effective: "Accessories" }
    };

    function talismanRows() {
      if (state.indexes.talismans) return state.indexes.talismans;
      const prefixesByAzon = new Map((state.optional.legacyPrefixes || [])
        .map(row => [String(row.pre_azon), row]));
      const slots = state.combat?.stat_slots || [];

      const decodePrefix = azon => {
        const prefix = prefixesByAzon.get(String(azon));
        if (!prefix) return null;
        const effects = String(prefix.pre_rev || "").split("|")
          .map((value, index) => [slots[index] || `slot ${index}`, value])
          .filter(([, value]) => value !== "" && value != null)
          .map(([stat, value]) => ({ stat, value: Number(value) }));
        return { azon: String(azon), name: prefix.pre_name, grade: prefix.pre_grd, effects };
      };

      state.indexes.talismans = (state.optional.legacyItems || [])
        .filter(row => String(row.ita_itype) === "6")
        .map(row => {
          const familyKey = String(row.ita_type || "").trim().split(/\s+/)[0];
          const family = TALISMAN_FAMILIES[familyKey] || {};
          const subtype = String(row.ita_type || "").trim().slice(familyKey.length).trim();
          const parts = String(row.ita_rev || "").includes("|")
            ? String(row.ita_rev).split("|") : null;
          const rolls = parts ? [
            { prefix: decodePrefix(parts[0]), chance: Number(parts[1]) },
            { prefix: decodePrefix(parts[2]), chance: Number(parts[3]) }
          ].filter(roll => roll.prefix) : [];
          return {
            id: String(row.ita_azon),
            type: row.ita_type || "",
            familyKey,
            subtype,
            listName: row.ita_name || "",
            name: family.name || row.ita_name || "",
            effective: family.effective || "",
            icon: `kalenc-talisman-${String(Number(row.ita_pic) || 0).padStart(3, "0")}`,
            // The four enchant ladders keep ita_rev as written; it is display
            // text, not a vector.
            propsText: parts ? "" : String(row.ita_rev || ""),
            rolls,
            chance: parts ? rolls.map(roll => roll.chance) : (family.chance || [])
          };
        })
        .sort((left, right) => left.type.localeCompare(right.type, "en")
          || Number(left.id) - Number(right.id));
      return state.indexes.talismans;
    }

    function talismanEffectText(effects) {
      return effects.map(effect =>
        `${escapeHtml(effect.stat)} ${effect.value >= 0 ? "+" : ""}${prettyNumber(effect.value)}`
      ).join(" · ");
    }

    function formatChanceList(values) {

          {

            ${drops.length ? panel("Dropped by", sortableTable("talismanDropTable", [

          </div>
          <div class="detail-side">

    function enhancementValue(row) {
      return parseJson(row.bonus_json, []).map(entry => Array.isArray(entry) ? `${entry[0]} ${entry.slice(1).join(" / ")}` : entry).join(", ");

    function renderEnhancements(query) {

        <div class="callout"><strong>Known boundary:</strong> values are exact; which equipment group each application band targets is not named in the recovered English client data.</div>
        <section class="section" style="margin-top:16px"><div class="table-wrap"><table>
          <thead><tr><th>Stat family</th><th>Band</th><th>+ Level</th><th>Exact bonus</th><th>Prefix row</th></tr></thead>

    function dropPairKey(monsterName, itemName) {
      return `${normalizeName(monsterName)}~${normalizeName(itemName)}`;
    }

    function currentRateRows(bangoDrop) {
      return state.indexes.legacyDropsByPairName?.get(
        dropPairKey(bangoDrop.bango_monster_name, bangoDrop.bango_item_name)
      ) || [];
    }

    function legacyRate(row) {
      const chance1 = Number(row.drp_chance1);
      const chance2 = Number(row.drp_chance2);
      if (!Number.isFinite(chance1) || !Number.isFinite(chance2)) return null;
      return chance1 * chance2 / 100;
    }

    function formatPercent(value) {
      if (!Number.isFinite(value)) return "—";
      const precision = value >= 10 ? 2 : value >= 1 ? 3 : 5;
      return `${Number(value.toFixed(precision)).toLocaleString("en-US")}%`;
    }

    const LEGACY_TALISMAN_ALIASES = {
      wonderingknights: "wanderingknights",
      wonderingarchers: "wanderingarchers"
    };

    function talismanForRateRow(rateRow) {
      const raw = String(rateRow.drp_rev || "").trim();
      if (!raw || /^\d+$/.test(raw)) return null;
      const normalized = normalizeName(raw);
      return state.indexes.prefixesByName.get(
        LEGACY_TALISMAN_ALIASES[normalized] || normalized
      ) || null;
    }

    function dropVariantCell(rateRow) {
      const raw = String(rateRow.drp_rev || "").trim();
      if (!raw) return `<span class="dim">plain</span>`;

      const talisman = talismanForRateRow(rateRow);
      if (talisman) return entityLink("prefix", talisman.pre_azon, talisman.pre_name);
      if (/^\d+$/.test(raw)) return `<span class="dim">plain</span>`;
      return escapeHtml(raw);
    }

    /* ── Sortable tables ───────────────────────────────────────────────
       A column is {key, label, cell(row), sort(row), align, width}. `sort`
       returns the value to order by; a missing one makes the column inert.
       Numbers sort numerically, everything else alphabetically, and blanks
       always sink to the bottom whichever direction is active. */
    function sortableTable(id, columns, rows, options = {}) {
      state.sortableTables.set(id, {
        columns, rows,
        sort: state.sortableTables.get(id)?.sort
          || (options.defaultSort ? { ...options.defaultSort } : null)
      });
      return `<div class="table-wrap" id="${escapeAttr(id)}">${sortableTableInner(id)}</div>`;
    }

    function sortableCompare(left, right) {
      const leftBlank = left === null || left === undefined || left === "";
      const rightBlank = right === null || right === undefined || right === "";
      if (leftBlank || rightBlank) return leftBlank && rightBlank ? 0 : (leftBlank ? 1 : -1);
      if (typeof left === "number" && typeof right === "number") return left - right;
      return String(left).localeCompare(String(right), "en", { numeric: true });
    }

    function sortableTableInner(id) {
      const table = state.sortableTables.get(id);
      if (!table) return "";
      const { columns, rows, sort } = table;
      let ordered = rows;
      if (sort) {
        const column = columns.find(entry => entry.key === sort.key);
        if (column?.sort) {
          // Blank-sinking is direction-independent, so reverse only the
          // comparisons between two present values.
          ordered = rows.map((row, index) => ({ row, index })).sort((left, right) => {
            const a = column.sort(left.row);
            const b = column.sort(right.row);
            const blank = value => value === null || value === undefined || value === "";
            if (blank(a) || blank(b)) return sortableCompare(a, b) || left.index - right.index;
            return (sort.dir === "desc" ? -1 : 1) * sortableCompare(a, b)
              || left.index - right.index;
          }).map(entry => entry.row);
        }
      }
      return `<table class="sortable">
        <thead><tr>${columns.map(column => {
          if (!column.sort) {
            return `<th${column.align ? ` class="num"` : ""}>${escapeHtml(column.label)}</th>`;
          }
          const active = sort?.key === column.key;
          const next = active && sort.dir === "asc" ? "desc" : "asc";
          return `<th${column.align ? ` class="num"` : ""}>
            <button type="button" class="sort-head${active ? ` sorted ${sort.dir}` : ""}"
              data-sort-table="${escapeAttr(id)}" data-sort-key="${escapeAttr(column.key)}"
              data-sort-dir="${next}"
              aria-label="Sort by ${escapeAttr(column.label)}, ${next === "asc" ? "ascending" : "descending"}">
              ${escapeHtml(column.label)}<span class="sort-mark" aria-hidden="true"></span>
            </button></th>`;
        }).join("")}</tr></thead>
        <tbody>${ordered.map(row => `<tr>${columns.map(column =>
          `<td${column.align ? ` class="num"` : ""}>${column.cell(row)}</td>`).join("")}</tr>`).join("")}
        </tbody></table>`;
    }

    function applyTableSort(id, key, dir) {
      const table = state.sortableTables.get(id);
      if (!table) return;
      table.sort = { key, dir };
      const host = document.getElementById(id);
      if (!host) return;
      host.innerHTML = sortableTableInner(id);
      hydrateIcons(host);
    }

    /* The client's own attribute keys, given the names the game shows the
       player. Anything not listed keeps its raw key rather than receiving an
       invented label. */
    const ITEM_ATTRIBUTE_LABELS = {
      Attack: "Attack", Magic: "Magic attack", defense: "Defense", absorb: "Absorption",
      hit: "On target point", dodge: "Evasion", aspeed: "Attack speed",
      mspeed: "Movement speed", hp: "HP", mp: "MP",
      Str: "Strength", Hth: "Health", Int: "Intelligence", Wis: "Wisdom", Dex: "Agility",
      resistfire: "Fire resistance", resistice: "Ice resistance",
      resistlitning: "Lightning resistance", resistpalsy: "Paralysis resistance",
      resistcurse: "Curse resistance",
      buff: "Grants buff", quest: "Quest item", refresh: "Restores",
      teleport: "Teleports to", charming: "Special effect", protect: "Protects",
      repair: "Repairs", revival: "Revives", haveItems: "Contains"
    };

    /* Attributes the player has no use for on an item page: they describe how
       the client wires the item up, not what it does. */
    const HIDDEN_ITEM_ATTRIBUTES = new Set(["Changeprefix", "gstate", "MonsterSpawn"]);

    function itemAttributeLabel(attribute) {
      return ITEM_ATTRIBUTE_LABELS[attribute] || attribute;
    }

    function gradeNumber(value) {
      const match = /(\d+)/.exec(String(value || ""));
      return match ? Number(match[1]) : null;
    }

    /* One row per drop variant. The Bango table proves the association and the
       matched KalEncyclopedia pair supplies each base/talisman variant's rate
       (AGENTS.md standing rule 11). */
    function bangoDropTable(rows, perspective) {
      if (!rows.length) return emptyState("Nothing is known to drop here.");
      const entries = rows.flatMap(row => {
        const rateRows = currentRateRows(row);
        return rateRows.length
          ? rateRows.map(rateRow => ({ row, rateRow, rate: legacyRate(rateRow) }))
          : [{ row, rateRow: null, rate: null }];
      });

      const rateColumn = {
        key: "rate", label: "Chance", align: true,
        sort: entry => (Number.isFinite(entry.rate) ? entry.rate : ""),
        cell: entry => entry.rate === null
          ? `<span class="dim" title="This pairing has no confirmed rate.">—</span>`
          : `<b>${formatPercent(entry.rate)}</b>`
      };
      const talismanColumn = {
        key: "talisman", label: "Talisman",
        sort: entry => entry.rateRow ? (talismanForRateRow(entry.rateRow)?.pre_name || "") : "",
        cell: entry => entry.rateRow ? dropVariantCell(entry.rateRow) : `<span class="dim">—</span>`
      };

      if (perspective === "monster") {
        const itemFor = entry => state.indexes.itemsById.get(String(entry.row.drp_item));
        return sortableTable("dropTable", [
          {
            key: "item", label: "Item",
            sort: entry => entry.row.bango_item_name || "",
            cell: entry => {
              const item = itemFor(entry);
              return `<span class="cell-icon">${iconTag(item?.bango_image || "",
                entry.row.bango_item_name || "", 24)}${entityLink("item", entry.row.drp_item,
                entry.row.bango_item_name || `Item ${entry.row.drp_item}`)}</span>`;
            }
          },
          {
            key: "class", label: "Class",
            sort: entry => itemFor(entry)?.ita_class || "",
            cell: entry => escapeHtml(itemFor(entry)?.ita_class || "—")
          },
          {
            key: "grade", label: "Grade", align: true,
            sort: entry => gradeNumber(itemFor(entry)?.ita_grade),
            cell: entry => {
              const grade = itemFor(entry)?.ita_grade;
              return grade ? `<span class="tag gold">${displayGrade(grade)}</span>`
                : `<span class="dim">—</span>`;
            }
          },
          {
            key: "level", label: "Req. level", align: true,
            sort: entry => Number(itemFor(entry)?.ita_lvllim) || "",
            cell: entry => escapeHtml(itemFor(entry)?.ita_lvllim || "—")
          },
          talismanColumn,
          rateColumn
        ], entries, { defaultSort: { key: "grade", dir: "desc" } });
      }

      const monsterFor = entry => state.indexes.legacyMonstersByName?.get(
        normalizeName(entry.row.bango_monster_name));
      return sortableTable("dropTable", [
        {
          key: "monster", label: "Monster",
          sort: entry => entry.row.bango_monster_name || "",
          cell: entry => `<span class="cell-icon">${monsterIconTag(entry.row.drp_monst,
            entry.row.bango_monster_name, 24)}${entityLink("monster", entry.row.drp_monst,
            entry.row.bango_monster_name || `Monster ${entry.row.drp_monst}`)}</span>`
        },
        {
          key: "level", label: "Level", align: true,
          sort: entry => Number(monsterFor(entry)?.mon_lvl) || "",
          cell: entry => escapeHtml(monsterFor(entry)?.mon_lvl || "—")
        },
        talismanColumn,
        rateColumn
      ], entries, { defaultSort: { key: "rate", dir: "desc" } });
    }

    function articlesMentioning(exactName) {
      if (String(exactName).length < 6) return [];
      const needle = String(exactName).toLowerCase();
      return state.articles.filter(article => article.text.toLowerCase().includes(needle));
    }

    function relatedArticles(kind, id, exactName = "") {
      const indexed = state.indexes.articleMentions.get(`${kind}:${id}`) || [];
      const unique = [...new Map([...indexed, ...articlesMentioning(exactName)].map(article => [article.path, article])).values()];
      if (!unique.length) return "";
      return `<ul class="link-list">${unique.map(article => `
        <li><a href="${routeHref("article", article.path)}">${escapeHtml(article.title)}</a></li>`
      ).join("")}</ul>`;
    }

    function extractDropDocumentation(article) {
      const lines = article.text.split(/\r?\n/);
      const sections = [];
      for (let index = 0; index < lines.length; index += 1) {
        const heading = lines[index].match(/^(#{1,6})\s+(.+)$/);
        if (!heading || !/\b(drop|loot)\b/i.test(heading[2])) continue;
        const level = heading[1].length;
        const block = [lines[index]];
        index += 1;
        while (index < lines.length) {
          const next = lines[index].match(/^(#{1,6})\s+/);
          if (next && next[1].length <= level) {
            index -= 1;
            break;
          }
          block.push(lines[index]);
          index += 1;
        }
        sections.push(block.join("\n").trim());
      }
      return sections.filter(Boolean);
    }

    function renderDropEvidenceBlocks(evidence, emptyMessage) {
      const unique = [...new Map(evidence.map(entry => [`${entry.article.path}~${entry.markdown}`, entry])).values()];
      if (!unique.length) return emptyState(emptyMessage);
      return unique.map(({ article, markdown }) => `
        <div class="callout info" style="margin-bottom:14px">
          <strong>${escapeHtml(article.title)}</strong>
          <div class="article">${renderMarkdown(markdown, article.path)}</div>
          <p>${entityLink("article", article.path, "Open full source article →")}</p>
        </div>`).join("");
    }

    function documentedDropEvidence(exactName) {
      const evidence = articlesMentioning(exactName).flatMap(article =>
        extractDropDocumentation(article).map(markdown => ({ article, markdown }))
      );
      return renderDropEvidenceBlocks(
        evidence,
        "No registered Bango article both names this entity and contains a drop/loot section."
      );
    }

    function documentedItemDropEvidence(item, drops) {
      const direct = articlesMentioning(item.ita_name || "").flatMap(article =>
        extractDropDocumentation(article).map(markdown => ({ article, markdown }))
      );
      const itemTokens = String(item.ita_name || "").toLowerCase()
        .match(/[a-z0-9]+/g)?.filter(token => token.length >= 4 && !["with", "from"].includes(token)) || [];
      const viaDroppers = [];

      for (const drop of drops) {
        const monster = state.indexes.monstersById.get(String(drop.drp_monst));
        if (!monster) continue;
        for (const article of articlesMentioning(monster.text)) {
          for (const markdown of extractDropDocumentation(article)) {
            const sectionTokens = markdown.toLowerCase().match(/[a-z0-9]+/g) || [];
            const matches = itemTokens.filter(itemToken =>
              sectionTokens.some(sectionToken => sectionToken.startsWith(itemToken) || itemToken.startsWith(sectionToken))
            );
            const threshold = itemTokens.length === 1 ? 1 : 2;
            if (matches.length >= threshold) viaDroppers.push({ article, markdown });
          }
        }
      }

      return renderDropEvidenceBlocks(
        [...direct, ...viaDroppers],
        "No registered Bango drop/loot section can be joined to this item by exact item mention or by a documented Bango dropper plus item-name tokens."
      );
    }

    function renderItem(id) {

            escapeHtml(JSON.stringify(specialties, null, 2))}</pre></details>` : ""}

            native limits ${escapeHtml(limits.join(" · ") || "—")}.</p>` : ""}

    }

    function legacyMonsterStats(row) {
      const fields = [
        ["Level", row.mon_lvl],
        ["HP", row.mon_hp && prettyNumber(row.mon_hp)],

    /* ===================================================================
       Build simulator and combat model.

       Three sources meet here and the UI must never blend them silently:
         character sheet ....... [KALENC-2011]  KalOnline_Simulator_Formulas.md
         hit / damage pipeline . [ORIG] 2006    KalOnline_Engine_Formulas.md
         monster stats ......... tier-5 legacy export, NOT Bango

       Every lookup table and per-level band comes from COMBAT_FIXTURE.json,
       which is generated from the Python engine. No game constant is written
       in this file.
       =================================================================== */

    const DEFAULT_BUILD = {
      cls: "Magician", position: "", level: 38,
      Strength: 8, Health: 70, Intelligence: 80, Wisdom: 50, Agility: 45,
      items: {}, prefixes: {}, manual: {},
      questPercent: 0, petDamage: 0, petDefense: 0, petEvasion: 0,
      doubleHp: false
    };

    const PRIMARY_STATS = ["Strength", "Health", "Intelligence", "Wisdom", "Agility"];
    // Buffs used to be a tab of their own. They belong next to the sheet they
    // change, so they now live inside Stats.
    const CHARACTER_TABS = ["stats", "skills", "quests"];
    const REGISTERED_BUFFS = [
      { key: "archer-7", group: "Archer", icon: "kalenc-buff-chkcc", displayOnly: "Fatal Blow chance and power; the current sheet has no fatal-blow stat slot." },

      { key: "knight-24", group: "Knight", icon: "kalenc-buff-chkber", displayOnly: "Offensive power increase and defensive power decrease are percentage effects not yet represented by the current sheet vector." },

      { key: "knight-33", group: "Knight", icon: "kalenc-buff-chkes", fixed: { Defense: 350 }, legacy: true },
      { key: "mage-defensive-incantation", skillKey: "mage-16", name: "Defensive incantation", group: "Mage", icon: "kalenc-buff-chkdi",
        fixedGrades: [

      ] },

      { key: "mage-48", group: "Mage", icon: "kalenc-buff-chkstr", effects: [{ stat: "Strength", parameter: 0 }] },
      { key: "mage-49", group: "Mage", icon: "kalenc-buff-chkhea", effects: [{ stat: "Health", parameter: 0 }] },
      { key: "mage-50", group: "Mage", icon: "kalenc-buff-chkagi", effects: [{ stat: "Agility", parameter: 0 }] },
      { key: "mage-51", group: "Mage", icon: "kalenc-buff-chkint", effects: [{ stat: "Intelligence", parameter: 0 }] }
    ];

    function profileId() {
      if (globalThis.crypto?.randomUUID) return crypto.randomUUID();
      return `character-${Date.now()}-${Math.random().toString(16).slice(2)}`;
    }

    function cloneJson(value) {
      return JSON.parse(JSON.stringify(value));
    }

    function newCharacterProfile(name = "Character 1", build = null) {
      const id = profileId();
      return {
        id,
        name,
        build: Object.assign({}, cloneJson(DEFAULT_BUILD), build || {}, {
          items: cloneJson(build?.items || {}),
          prefixes: cloneJson(build?.prefixes || {}),
          manual: cloneJson(build?.manual || {}),
          equipmentMods: cloneJson(build?.equipmentMods || {})
        }),
        skills: {},
        quests: {},
        buffs: [],
        createdAt: new Date().toISOString(),
        updatedAt: new Date().toISOString()
      };
    }

    function loadProfiles() {
      if (state.profiles) return state.profiles;
      let saved = null;
      try { saved = JSON.parse(localStorage.getItem(PROFILE_STORAGE_KEY) || "null"); }
      catch (error) { saved = null; }
      if (!saved || saved.version !== 1 || !Array.isArray(saved.characters)
          || !saved.characters.length) {
        let oldBuild = null;
        try { oldBuild = JSON.parse(localStorage.getItem(BUILD_STORAGE_KEY) || "null"); }
        catch (error) { oldBuild = null; }
        const first = newCharacterProfile("Character 1", oldBuild);
        saved = { version: 1, activeId: first.id, characters: [first] };
      }
      saved.characters = saved.characters.map((profile, index) => {
        const normalized = Object.assign(newCharacterProfile(`Character ${index + 1}`), profile);
        normalized.build = Object.assign({}, cloneJson(DEFAULT_BUILD), profile.build || {}, {
          items: cloneJson(profile.build?.items || {}),
          prefixes: cloneJson(profile.build?.prefixes || {}),
          manual: cloneJson(profile.build?.manual || {}),
          equipmentMods: cloneJson(profile.build?.equipmentMods || {})
        });
        normalized.skills = cloneJson(profile.skills || {});
        normalized.quests = cloneJson(profile.quests || {});
        normalized.buffs = Array.isArray(profile.buffs) ? cloneJson(profile.buffs) : [];
        return normalized;
      });
      if (!saved.characters.some(profile => profile.id === saved.activeId)) {
        saved.activeId = saved.characters[0].id;
      }
      state.profiles = saved;
      state.build = activeProfile().build;
      persistProfiles();
      renderProfileSwitcher();
      return saved;
    }

    function activeProfile() {
      const profiles = state.profiles || loadProfiles();
      return profiles.characters.find(profile => profile.id === profiles.activeId)
        || profiles.characters[0];
    }

    function persistProfiles() {
      if (!state.profiles) return;
      const profile = state.profiles.characters.find(item => item.id === state.profiles.activeId);
      if (profile) profile.updatedAt = new Date().toISOString();
      try { localStorage.setItem(PROFILE_STORAGE_KEY, JSON.stringify(state.profiles)); }
      catch (error) { /* private mode: profiles remain in memory for this visit */ }
    }

    function renderProfileSwitcher() {
      if (!el.profileSwitcher) return;
      const profiles = state.profiles || loadProfiles();
      const active = activeProfile();
      el.profileSwitcher.innerHTML = `
        <label for="activeCharacter">Playing as</label>
        <select id="activeCharacter" data-character-switch aria-label="Active character">
          ${profiles.characters.map(profile => `<option value="${escapeAttr(profile.id)}"${
            profile.id === active.id ? " selected" : ""}>${escapeHtml(profile.name)}</option>`).join("")}
        </select>`;
      const select = document.getElementById("activeCharacter");
      if (select) select.onchange = event => {
        profiles.activeId = event.currentTarget.value;
        state.build = activeProfile().build;
        persistProfiles();
        renderProfileSwitcher();
        if (state.ready) renderRoute();
      };
    }

    function createCharacter(copyActive = false) {
      const profiles = loadProfiles();
      const number = profiles.characters.length + 1;
      const source = copyActive ? cloneJson(activeProfile()) : null;
      const created = source
        ? Object.assign(source, {
            id: profileId(), name: `${source.name} copy`,
            createdAt: new Date().toISOString(), updatedAt: new Date().toISOString()
          })
        : newCharacterProfile(`Character ${number}`);
      profiles.characters.push(created);
      profiles.activeId = created.id;
      state.build = created.build;
      persistProfiles();
      renderProfileSwitcher();
      renderRoute();
    }

    function deleteActiveCharacter() {
      const profiles = loadProfiles();
      if (profiles.characters.length <= 1) return;
      const index = profiles.characters.findIndex(profile => profile.id === profiles.activeId);
      profiles.characters.splice(index, 1);
      profiles.activeId = profiles.characters[Math.max(0, index - 1)].id;
      state.build = activeProfile().build;
      persistProfiles();
      renderProfileSwitcher();
      renderRoute();
    }

    function simReady() { return Boolean(state.combat); }

    function simFix(value) { return Math.trunc(value); }
    function simCdiv(a, b) { return Math.trunc(a / b); }

    function simBandAt(arrayName, level) {
      const table = state.combat[arrayName];
      const index = Math.max(0, Math.min(table.length - 1, Math.trunc(level)));
      return table[index];
    }

    function simClassIndex(name) {
      const index = state.combat.class_order.indexOf(name);
      if (index < 0) throw new Error(`unknown class ${name}`);
      return index;
    }

    // --- Character sheet ------------------------------------------------
    //
    // [BANGO-MEASURED], tier 2 — the highest authority the project holds.
    // Each line is the formula that reproduced a real character sheet on
    // 2026-07-25 (level 38 Magician, naked). Where the two file sources
    // disagreed, the measurement chose:
    //   PDMin  -> REIMPL   (KALENC-2011 reads 1 high at Strength 8 and 9)
    //   MDMin, MDMax -> KALENC-2011  (REIMPL reads 3 high on both ends)
    //   Curse, NonElemental -> REIMPL  (KALENC-2011 derives neither)
    // See engine/bango_measured.py and calibration/OBSERVED_SHEETS.csv.

    function simDerived(str, hea, int_, wis, agi, level) {
      return {
        OTP: simFix(0.2777777777777778 * str) + simFix(agi / 8),
        Evasion: simFix(agi / 3),
        PDMin: 1 + simFix((11 * str - 80) / 30) + simFix((agi - 5) / 11)
             + simFix(7 * level / 10),
        PDMax: simFix((str - 5) * 8 / 15) + simFix((agi + 17) * 11 / 47)
             + level - 3,
        MDMin: simFix((int_ - 8) * 7 / 12) + simFix(wis / 7),
        MDMax: simFix(int_ * 7 / 12) + simFix(wis * 0.31249) - 3,
        Fire: simFix(int_ / 9),
        Ice: simFix(int_ / 9),
        Lightening: simFix(int_ / 9),
        NonElemental: simFix(hea / 9),
        Curse: simFix(wis / 9)
      };
    }

    // The 2011 simulator's own reading, kept only to show where it was beaten.
    function simKalencDerived(str, hea, int_, wis, agi, level) {
      return {
        PDMin: simFix((str - 10) * 11 / 30) + simFix((agi - 5) / 11)
             + simFix(level * 7 / 10) + 2
      };
    }

    // Kept so the disagreement is shown rather than resolved silently. Curse
    // and NonElemental exist only here: KalEncyclopedia derives neither.
    function simReimplDerived(str, hea, int_, wis, agi, level) {
      return {
        OTP: simFix(agi / 8) + simFix(15 * str / 54),
        Evasion: simFix(agi / 3),
        PDMin: 1 + simFix((11 * str - 80) / 30) + simFix((agi - 5) / 11)
             + simFix(7 * level / 10),
        PDMax: simFix((8 * str - 25) / 15) + simFix(18 * agi / 77) + level,
        MDMin: simFix((7 * int_ - 20) / 12) + simFix(wis / 7),
        MDMax: simFix(7 * int_ / 12) + simFix(14 * wis / 45),
        Fire: simFix(int_ / 9), Ice: simFix(int_ / 9),
        Lightening: simFix(int_ / 9),
        Curse: simFix(wis / 9), NonElemental: simFix(hea / 9)
      };
    }

    function simMaxHp(level, health, cls, hpPercent = 0, doubleFlag = false) {
      const quadratic = state.combat.hp_quadratic[simClassIndex(cls)];
      const core = 52 * level / 3 * simBandAt("hp_level_coefficient_by_level", level)
        + health * health * quadratic + 115;
      const base = simFix(core * (1 + hpPercent / 100)) * (doubleFlag ? 2 : 1);
      const band = simBandAt("late_health_band_by_level", level);
      const bonus = band
        ? simFix(simFix(health * health * quadratic) * (0.14 + 0.1 * band))
        : 0;
      return base + bonus;
    }

    function simMaxMp(level, wisdom, cls, manaPercent = 0) {
      const quadratic = state.combat.mp_quadratic[simClassIndex(cls)];
      const core = 8 * level + wisdom * wisdom * quadratic + wisdom + 140;
      return simFix(core * (1 + manaPercent / 100))
        + level * simBandAt("mp_level_band_by_level", level) * 2;
    }

    function simApplyMultipliers(value, questPercent = 0, petPercent = 0) {
      return simFix(simFix(value * (100 + questPercent) / 100)
        * (100 + petPercent) / 100);
    }

    // Sum of every equipped item vector, prefix vector and manual override.
    function simGearVector(build) {
      const gear = {};
      const add = (slot, value) => {
        const amount = Number(value);
        if (!Number.isFinite(amount) || amount === 0) return;
        gear[slot] = (gear[slot] || 0) + amount;
      };
      const items = state.indexes.equippableById || new Map();
      const prefixes = state.indexes.prefixById || new Map();
      Object.values(build.items || {}).forEach(itemId => {
        const item = items.get(String(itemId));
        if (item) Object.entries(item.stats).forEach(([slot, value]) => add(slot, value));
      });
      Object.values(build.prefixes || {}).forEach(prefixId => {
        const prefix = prefixes.get(String(prefixId));
        if (prefix) Object.entries(prefix.stats).forEach(([slot, value]) => add(slot, value));
      });
      Object.values(build.equipmentMods || {}).forEach(mods => {
        add("OTP", mods.otp);
        add("PDMin", mods.physical);
        add("PDMax", mods.physical);
        add("MDMin", mods.magical);
        add("MDMax", mods.magical);
        add("Defense", mods.defense);
      });
      Object.entries(build.manual || {}).forEach(([slot, value]) => add(slot, value));
      return gear;
    }

    function registeredBuffSkill(definition) {
      return skillByKey(definition.skillKey || definition.key);
    }

    function registeredBuffMaxGrade(definition) {
      if (definition.fixedGrades) return definition.fixedGrades.length;
      const skill = registeredBuffSkill(definition);
      const schedule = skill ? state.indexes.skillSchedules.get(skillId(skill)) : null;
      return Math.max(1, Number(schedule?.client_max_grade) || 1);
    }

    function registeredBuffEffects(definition, grade, build) {
      if (definition.fixedGrades) return definition.fixedGrades[Math.max(0,
        Math.min(definition.fixedGrades.length - 1, grade - 1))] || {};
      if (definition.fixed) return { ...definition.fixed };
      const skill = registeredBuffSkill(definition);
      const formulas = parseJson(skill?.bango_parameter_rpn_json, []);
      const result = {};
      (definition.effects || []).forEach(effect => {
        const formula = formulas[effect.parameter];
        const value = formula == null ? null : evaluateRpn(formula, grade, build);
        if (value == null || !Number.isFinite(value) || value === 0) return;
        result[effect.stat] = (result[effect.stat] || 0) + value;
      });
      return result;
    }

    function activeBuffState(profile, key) {
      return (profile.buffs || []).find(buff => buff.key === key)
        || { key, enabled: false, grade: 1 };
    }

    function simBuffVector(build) {
      const result = {};
      if (!state.profiles) return result;
      const profile = activeProfile();
      REGISTERED_BUFFS.forEach(definition => {
        const selected = activeBuffState(profile, definition.key);
        if (!selected.enabled) return;
        const grade = Math.max(1, Math.min(registeredBuffMaxGrade(definition),
