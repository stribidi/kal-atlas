<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>Kal Atlas — Linked KalOnline Knowledge Base</title>
  <style>
    :root {
      --bg: #e9e5d9;
      --panel: #f8f5ec;
      --panel-2: #f1ecdf;
      --panel-3: #e8e1d2;
      --line: #c9c1ad;
      --line-soft: #ddd6c7;
      --text: #203029;
      --muted: #647168;
      --dim: #879087;
      --accent: #1f5a45;
      --accent-ink: #f8f5ec;
      --gold: #a86f3e;
      --danger: #b94e42;
      --blue: #2e7563;
      --shadow: 0 14px 34px rgba(34, 48, 40, .09);
      --radius: 13px;
      --radius-sm: 8px;
      --sidebar: 244px;
    }

    * { box-sizing: border-box; }

    html {
      min-height: 100%;
      background: var(--bg);
      scroll-behavior: smooth;
    }

    body {
      min-height: 100vh;
      margin: 0;
      color: var(--text);
      background: var(--bg);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 15px;
      line-height: 1.5;
    }

    button, input, select { font: inherit; }

    a {
      color: var(--text);
      text-decoration: none;
    }

    a:hover { color: var(--accent); }

    button, .button {
      min-height: 40px;
      border: 1px solid var(--line);
      border-radius: var(--radius-sm);
      padding: 8px 13px;
      color: var(--text);
      background: var(--panel-3);
      cursor: pointer;
      transition: border-color .14s ease, color .14s ease, background .14s ease, transform .14s ease;
    }

    button:hover, .button:hover {
      border-color: #5f785f;
      color: var(--accent);
    }

    button:active, .button:active { transform: translateY(1px); }

    button.primary, .button.primary {
      border-color: var(--accent);
      color: var(--accent-ink);
      background: var(--accent);
      font-weight: 750;
    }

    button.ghost, .button.ghost { background: transparent; }

    button.small, .button.small {
      min-height: 30px;
      padding: 4px 9px;
      font-size: 12px;
    }

    :focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }

    .app-shell {
      min-height: 100vh;
      display: grid;
      grid-template-columns: var(--sidebar) minmax(0, 1fr);
    }

    .sidebar {
      position: sticky;
      top: 0;
      align-self: start;
      height: 100vh;
      border-right: 1px solid var(--line-soft);
      padding: 24px 16px 18px;
      background: #0b100e;
      overflow-y: auto;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 11px;
      margin: 0 5px 24px;
    }

    .brand-mark {
      width: 38px;
      height: 38px;
      display: grid;
      place-items: center;
      border: 1px solid var(--accent);
      color: var(--accent);
      font-weight: 900;
      letter-spacing: -.08em;
      box-shadow: inset 0 0 0 4px #111a13;
    }

    .brand strong {
      display: block;
      font-size: 14px;
      letter-spacing: .18em;
    }

    .brand span {
      display: block;
      color: var(--muted);
      font-size: 10px;
      letter-spacing: .12em;
      text-transform: uppercase;
    }

    .nav-label {
      margin: 20px 9px 7px;
      color: var(--dim);
      font-size: 10px;
      font-weight: 800;
      letter-spacing: .13em;
      text-transform: uppercase;
    }

    .nav {
      display: grid;
      gap: 3px;
    }

    .nav a {
      display: flex;
      align-items: center;
      justify-content: space-between;
      min-height: 39px;
      border: 1px solid transparent;
      border-radius: var(--radius-sm);
      padding: 8px 10px;
      color: var(--muted);
      font-size: 13px;
      font-weight: 650;
    }

    .nav a:hover {
      border-color: var(--line);
      color: var(--text);
      background: var(--panel);
    }

    .nav a.active {
      border-color: #41513f;
      color: var(--accent);
      background: var(--panel-2);
    }

    .nav-count {
      color: var(--dim);
      font-size: 11px;
      font-variant-numeric: tabular-nums;
    }

    .sidebar-status {
      margin: 24px 5px 0;
      border-top: 1px solid var(--line-soft);
      padding-top: 15px;
      color: var(--dim);
      font-size: 11px;
    }

    .sidebar-status strong {
      display: block;
      margin-bottom: 3px;
      color: var(--muted);
      font-size: 12px;
    }

    .workspace {
      min-width: 0;
      display: flex;
      flex-direction: column;
    }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 20;
      min-height: 68px;
      display: grid;
      grid-template-columns: minmax(220px, 640px) auto;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      border-bottom: 1px solid var(--line-soft);
      padding: 12px 28px;
      background: rgba(8, 12, 11, .94);
      backdrop-filter: blur(12px);
    }

    .global-search {
      position: relative;
      display: flex;
      align-items: center;
    }

    .global-search input, .filter-input, select {
      width: 100%;
      min-height: 42px;
      border: 1px solid var(--line);
      border-radius: var(--radius-sm);
      padding: 9px 12px;
      color: var(--text);
      background: var(--panel);
    }

    .global-search input { padding-right: 86px; }

    .global-search button {
      position: absolute;
      right: 5px;
      min-height: 32px;
      padding: 4px 11px;
      border-color: transparent;
      color: var(--accent);
      background: transparent;
    }

    .top-actions {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 8px;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--dim);
    }

    .status-dot.ready { background: var(--accent); box-shadow: 0 0 0 4px rgba(214, 255, 99, .09); }
    .status-dot.error { background: var(--danger); }

    main {
      width: min(100%, 1540px);
      flex: 1;
      margin: 0 auto;
      padding: 30px clamp(20px, 3vw, 48px) 64px;
    }

    .page-head {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 24px;
      margin-bottom: 26px;
    }

    .eyebrow {
      margin-bottom: 6px;
      color: var(--accent);
      font-size: 11px;
      font-weight: 850;
      letter-spacing: .14em;
      text-transform: uppercase;
    }

    h1, h2, h3, h4 {
      margin-top: 0;
      color: var(--text);
      line-height: 1.15;
      letter-spacing: -.025em;
    }

    h1 {
      max-width: 900px;
      margin-bottom: 8px;
      font-size: clamp(30px, 4vw, 52px);
      font-weight: 790;
    }

    h2 {
      margin-bottom: 13px;
      font-size: 22px;
    }

    h3 {
      margin-bottom: 9px;
      font-size: 16px;
    }

    p { margin: 0 0 13px; }

    .lede {
      max-width: 860px;
      color: var(--muted);
      font-size: 16px;
    }

    .page-actions {
      display: flex;
      flex-wrap: wrap;
      justify-content: flex-end;
      gap: 8px;
    }

    .breadcrumb {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 7px;
      margin-bottom: 14px;
      color: var(--dim);
      font-size: 12px;
    }

    .breadcrumb a { color: var(--muted); }

    .metrics {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 12px;
      margin: 0 0 26px;
    }

    .metric {
      min-height: 112px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 18px;
      background: var(--panel);
      box-shadow: var(--shadow);
    }

    .metric strong {
      display: block;
      margin-bottom: 2px;
      color: var(--accent);
      font-size: 27px;
      font-variant-numeric: tabular-nums;
    }

    .metric span {
      color: var(--muted);
      font-size: 12px;
    }

    .section {
      margin: 0 0 22px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--panel);
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .section-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      border-bottom: 1px solid var(--line-soft);
      padding: 16px 18px;
      background: var(--panel-2);
    }

    .section-head h2, .section-head h3 { margin: 0; }

    .section-body { padding: 18px; }

    body.detail-route main { width: min(100%, 1320px); padding-top: 18px; }
    body.detail-route .breadcrumb { margin-bottom: 8px; }
    body.detail-route .page-head { gap: 14px; margin-bottom: 12px; }
    body.detail-route .page-head h1 {
      margin-bottom: 4px;
      font-size: clamp(25px, 2.7vw, 38px);
    }
    body.detail-route .lede { font-size: 14px; }
    body.detail-route .section { margin-bottom: 12px; }
    body.detail-route .section-head { padding: 10px 13px; }
    body.detail-route .section-head h2 { font-size: 17px; }
    body.detail-route .section-body { padding: 12px 13px; }
    body.detail-route .definition-grid { gap: 7px; }
    body.detail-route th, body.detail-route td { padding-top: 7px; padding-bottom: 7px; }

    .split {
      display: grid;
      grid-template-columns: minmax(0, 1.3fr) minmax(260px, .7fr);
      gap: 20px;
    }

    .directory-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 12px;
    }

    .directory-card {
      display: block;
      min-height: 132px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 17px;
      color: var(--text);
      background: var(--panel-2);
    }

    .directory-card:hover {
      border-color: #647b61;
      color: var(--text);
      background: var(--panel-3);
    }

    .directory-card strong {
      display: block;
      margin-bottom: 7px;
      font-size: 17px;
    }

    .directory-card p {
      margin: 0;
      color: var(--muted);
      font-size: 12px;
    }

    .directory-card .count {
      display: block;
      margin-top: 12px;
      color: var(--accent);
      font-size: 12px;
      font-weight: 750;
    }

    .toolbar {
      display: grid;
      grid-template-columns: minmax(190px, 1fr) repeat(2, minmax(140px, 220px)) auto;
      gap: 9px;
      margin-bottom: 15px;
    }

    .toolbar .button { display: inline-grid; place-items: center; }

    .table-wrap {
      width: 100%;
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
    }

    th {
      border-bottom: 1px solid var(--line);
      padding: 10px 11px;
      color: var(--dim);
      background: #0e1512;
      font-size: 10px;
      font-weight: 800;
      letter-spacing: .08em;
      text-align: left;
      text-transform: uppercase;
      white-space: nowrap;
    }

    td {
      border-bottom: 1px solid var(--line-soft);
      padding: 11px;
      color: var(--muted);
      vertical-align: top;
    }

    tr:last-child td { border-bottom: 0; }
    tbody tr:hover td { background: rgba(255, 255, 255, .015); }

    td a {
      color: var(--text);
      font-weight: 680;
    }

    .number {
      font-variant-numeric: tabular-nums;
      text-align: right;
    }

    .mono, code, pre {
      font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace;
    }

    .mono { font-size: 12px; }

    code {
      border: 1px solid var(--line-soft);
      border-radius: 5px;
      padding: 1px 5px;
      color: var(--gold);
      background: #0c120f;
      font-size: .92em;
    }

    pre {
      max-width: 100%;
      overflow: auto;
      border: 1px solid var(--line);
      border-radius: var(--radius-sm);
      padding: 14px;
      color: #cbd7cf;
      background: #090e0c;
      font-size: 12px;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    .tag-row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 6px;
    }

    /* Client icon set, converted from data\HyperText by tools\client_icons. */
    .icon {
      image-rendering: pixelated;
      vertical-align: middle;
      flex: none;
    }

    .icon-missing {
      opacity: 0.25;
      background: repeating-linear-gradient(45deg, #2a352f 0 3px, transparent 3px 6px);
      border-radius: 3px;
    }

    /* The character sheet, in the KalEncyclopedia idiom: warm leather panel,
       gold rules, label left / value right, two columns. */
    .sheet {
      --sheet-ink: #f3e4c0;
      --sheet-label: #c9a227;
      --sheet-rule: #6d5423;
      background:
        radial-gradient(120% 90% at 12% 0%, #3d3020 0%, #241c12 55%, #1a140d 100%);
      border: 1px solid #6d5423;
      border-radius: 10px;
      padding: 16px 18px;
      color: var(--sheet-ink);
      box-shadow: inset 0 0 0 1px #0d0a06, inset 0 1px 0 #7d6330;
      font-size: 0.9rem;
    }

    .sheet-head {
      display: flex;
      flex-wrap: wrap;
      gap: 8px 22px;
      padding-bottom: 10px;
      border-bottom: 1px solid var(--sheet-rule);
      margin-bottom: 12px;
    }

    .sheet-head b { color: #fff; font-weight: 600; }
    .sheet-head span { color: var(--sheet-label); }

    .sheet-bars { display: grid; gap: 7px; margin-bottom: 14px; }

    .sheet-bar {
      display: grid;
      grid-template-columns: 108px 1fr auto;
      align-items: center;
      gap: 10px;
    }

    .sheet-bar > span:first-child { color: var(--sheet-label); }

    .sheet-bar .track {
      height: 13px;
      border: 1px solid #0d0a06;
      border-radius: 7px;
      background: #120d08;
      overflow: hidden;
    }

    .sheet-bar .fill { height: 100%; border-radius: 6px; }
    .sheet-bar .fill.hp { background: linear-gradient(90deg, #6d1414, #c0392b); }
    .sheet-bar .fill.mp { background: linear-gradient(90deg, #14356d, #2b7ac0); }
    .sheet-bar b { color: #fff; font-variant-numeric: tabular-nums; }

    .sheet-cols {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
      gap: 4px 28px;
    }

    .sheet-line {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      padding: 3px 0;
      border-bottom: 1px dotted #4a3a1c;
    }

    .sheet-line > span { color: var(--sheet-label); }
    .sheet-line > b { color: #fff; font-weight: 600; font-variant-numeric: tabular-nums; }
    .sheet-line small { color: #9c8a63; font-weight: 400; }

    .sheet-section {
      margin-top: 14px;
      padding-top: 10px;
      border-top: 1px solid var(--sheet-rule);
    }

    .sheet-section h4 {
      margin: 0 0 8px;
      font-size: 0.72rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--sheet-label);
    }

    /* Equipment slots, icon first. */
    .slot-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
      gap: 10px;
    }

    .slot {
      display: flex;
      align-items: center;
      gap: 9px;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 7px 9px;
    }

    .slot-icon {
      width: 34px;
      height: 34px;
      display: grid;
      place-items: center;
      border: 1px solid #0d0a06;
      border-radius: 5px;
      background: #120d08;
      flex: none;
    }

    .slot-body { min-width: 0; flex: 1; }
    .slot-body span { display: block; font-size: 0.72rem; color: var(--muted, #8fa39a); }
    .slot-body select { width: 100%; margin-top: 3px; }

    .field-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(190px, 1fr));
      gap: 12px;
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 4px;
      font-size: 0.85rem;
    }

    .field > span {
      color: var(--muted, #8fa39a);
      letter-spacing: 0.02em;
    }

    .field input,
    .field select {
      background: var(--panel);
      color: inherit;
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 7px 9px;
      font: inherit;
      width: 100%;
    }

    .field input[type="checkbox"] {
      width: auto;
      align-self: flex-start;
    }

    .field input:focus,
    .field select:focus {
      outline: 2px solid var(--accent, #6fd3a6);
      outline-offset: 1px;
    }

    .tag {
      display: inline-flex;
      align-items: center;
      min-height: 24px;
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 2px 8px;
      color: var(--muted);
      background: var(--panel-2);
      font-size: 11px;
      white-space: nowrap;
    }

    .tag.accent { border-color: #53643c; color: var(--accent); }
    .tag.gold { border-color: #604d2e; color: var(--gold); }
    .tag.blue { border-color: #31536a; color: var(--blue); }
    .tag.danger { border-color: #693d38; color: var(--danger); }

    .definition-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 1px;
      border: 1px solid var(--line-soft);
      background: var(--line-soft);
    }

    .definition {
      min-height: 86px;
      padding: 13px;
      background: var(--panel);
    }

    .definition dt {
      margin-bottom: 4px;
      color: var(--dim);
      font-size: 10px;
      font-weight: 800;
      letter-spacing: .08em;
      text-transform: uppercase;
    }

    .definition dd {
      margin: 0;
      color: var(--text);
      overflow-wrap: anywhere;
    }

    .callout {
      border-left: 3px solid var(--gold);
      padding: 12px 14px;
      color: var(--muted);
      background: #17150f;
    }

    .callout strong { color: var(--gold); }
    .callout.info { border-left-color: var(--blue); background: #0e161a; }
    .callout.info strong { color: var(--blue); }
    .callout.error { border-left-color: var(--danger); background: #1b1010; }
    .callout.error strong { color: var(--danger); }

    .empty {
      border: 1px dashed var(--line);
      border-radius: var(--radius-sm);
      padding: 28px;
      color: var(--dim);
      text-align: center;
    }

    .pagination {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-top: 15px;
      color: var(--dim);
      font-size: 12px;
    }

    .pagination div {
      display: flex;
      gap: 6px;
    }

    .result-list { display: grid; gap: 8px; }

    .result {
      display: grid;
      grid-template-columns: 104px minmax(0, 1fr) auto;
      align-items: center;
      gap: 14px;
      border: 1px solid var(--line-soft);
      border-radius: var(--radius-sm);
      padding: 12px;
      background: var(--panel-2);
    }

    .result:hover { border-color: #4a5f4a; }

    .result-type {
      color: var(--dim);
      font-size: 10px;
      font-weight: 800;
      letter-spacing: .08em;
      text-transform: uppercase;
    }

    .result strong { color: var(--text); }
    .result small { color: var(--muted); }

    .article {
      max-width: 930px;
      color: #c3cec7;
    }

    .article h1, .article h2, .article h3, .article h4 {
      margin-top: 28px;
      scroll-margin-top: 90px;
    }

    .article h1 { font-size: 34px; }
    .article h2 { font-size: 24px; }
    .article h3 { font-size: 18px; }
    .article blockquote {
      margin: 16px 0;
      border-left: 3px solid var(--line);
      padding: 4px 16px;
      color: var(--muted);
    }

    .article li { margin-bottom: 5px; }
    .article img { max-width: 100%; border-radius: var(--radius-sm); }
    .article hr { border: 0; border-top: 1px solid var(--line); margin: 28px 0; }

    .connect {
      max-width: 760px;
      margin: clamp(40px, 9vh, 110px) auto 0;
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: clamp(24px, 5vw, 48px);
      background: var(--panel);
      box-shadow: var(--shadow);
    }

    .connect h1 { font-size: clamp(32px, 6vw, 58px); }

    .connect-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 9px;
      margin: 22px 0;
    }

    .connect-list {
      display: grid;
      gap: 8px;
      margin-top: 22px;
      color: var(--muted);
      font-size: 13px;
    }

    .connect-list div {
      display: grid;
      grid-template-columns: 24px 1fr;
      gap: 8px;
    }

    .progress {
      width: 100%;
      height: 4px;
      margin-top: 20px;
      background: var(--line-soft);
      overflow: hidden;
    }

    .progress span {
      display: block;
      height: 100%;
      width: 0;
      background: var(--accent);
      transition: width .18s ease;
    }

    .loading-line {
      margin-top: 9px;
      color: var(--dim);
      font-size: 12px;
    }

    dialog {
      width: min(720px, calc(100vw - 28px));
      max-height: min(82vh, 850px);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 0;
      color: var(--text);
      background: var(--panel);
      box-shadow: 0 24px 80px rgba(0, 0, 0, .7);
    }

    dialog::backdrop { background: rgba(0, 0, 0, .72); }

    .dialog-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      border-bottom: 1px solid var(--line);
      padding: 15px 18px;
      background: var(--panel-2);
    }

    .dialog-head h2 { margin: 0; font-size: 18px; }
    .dialog-body { max-height: 65vh; overflow: auto; padding: 18px; }

    .kv {
      display: grid;
      grid-template-columns: minmax(130px, .35fr) minmax(0, 1fr);
      gap: 1px;
      background: var(--line-soft);
    }

    .kv > div {
      min-height: 39px;
      padding: 9px 11px;
      background: var(--panel);
      overflow-wrap: anywhere;
    }

    .kv > div:nth-child(odd) {
      color: var(--dim);
      font-size: 11px;
      font-weight: 750;
    }

    .muted { color: var(--muted); }
    .dim { color: var(--dim); }
    .accent { color: var(--accent); }
    .danger { color: var(--danger); }
    .nowrap { white-space: nowrap; }
    .wrap-anywhere { overflow-wrap: anywhere; }
    .hidden { display: none !important; }

    /* Jade Archive: an ivory reading surface framed by a pine-jade rail.
       The faint geometry is decorative only and never sits behind data. */
    .sidebar {
      color: #f4efe2;
      background:
        linear-gradient(150deg, transparent 0 73%, rgba(185, 143, 91, .08) 73% 74%, transparent 74%),
        linear-gradient(30deg, transparent 0 78%, rgba(240, 232, 213, .05) 78% 79%, transparent 79%),
        #143d30;
      border-right-color: #0e2e24;
    }

    .brand-mark {
      border-color: #c49a67;
      color: #f4efe2;
      box-shadow: inset 0 0 0 4px #1d4b3b;
    }

    .brand strong, .sidebar .nav a:hover { color: #fffaf0; }
    .brand span, .sidebar .nav-label, .sidebar .nav-count,
    .sidebar-status, .sidebar-status strong { color: #b7c7bd; }

    .sidebar .nav a { color: #d8e1db; }
    .sidebar .nav a:hover {
      border-color: rgba(240, 232, 213, .22);
      background: rgba(255, 255, 255, .06);
    }
    .sidebar .nav a.active {
      border-color: rgba(196, 154, 103, .72);
      color: #fff7e8;
      background: #205440;
      box-shadow: inset 3px 0 0 #c49a67;
    }
    .sidebar-status { border-top-color: rgba(240, 232, 213, .16); }

    .topbar {
      background: rgba(248, 245, 236, .93);
      box-shadow: 0 7px 24px rgba(34, 48, 40, .06);
    }

    button:hover, .button:hover, .directory-card:hover, .result:hover {
      border-color: #668b78;
    }

    th { background: #ece6d8; color: #69756d; }
    tbody tr:hover td { background: rgba(31, 90, 69, .035); }
    code { color: #86592f; background: #eee7d9; }
    pre { color: #2b3b34; background: #eee9de; }
    .icon-missing {
      background: repeating-linear-gradient(45deg, #cbd3ca 0 3px, transparent 3px 6px);
    }

    .tag.accent { border-color: #8dac9b; }
    .tag.gold { border-color: #c5a47f; }
    .tag.blue { border-color: #8aafa3; }
    .tag.danger { border-color: #d6a29b; }
    .callout { background: #f2eadc; }
    .callout.info { background: #e8f0eb; }
    .callout.error { background: #f5e7e4; }
    .article { color: #405048; }
    dialog { box-shadow: 0 24px 80px rgba(22, 49, 37, .24); }
    dialog::backdrop { background: rgba(20, 48, 37, .54); }

    .sheet {
      --sheet-ink: #22362d;
      --sheet-label: #8a653d;
      --sheet-rule: #c8b18f;
      color: var(--sheet-ink);
      background:
        linear-gradient(135deg, rgba(31, 90, 69, .06), transparent 36%),
        #f2eadc;
      border-color: #b89b73;
      box-shadow: inset 0 0 0 1px #fffaf0, 0 9px 23px rgba(45, 56, 46, .09);
    }
    .sheet-head b, .sheet-bar b, .sheet-line > b { color: #203029; }
    .sheet-line { border-bottom-color: #d8c9b1; }
    .sheet-line small { color: #887b68; }
    .sheet-bar .track { border-color: #a59b8a; background: #ded7c9; }
    .sheet-bar .fill.mp { background: linear-gradient(90deg, #315e70, #5d94a3); }
    .slot-icon { border-color: #b8ad9c; background: #e7e0d4; }

    .item-identity {
      display: grid;
      grid-template-columns: 190px minmax(300px, 520px);
      gap: 14px;
      align-items: stretch;
      justify-content: start;
      margin-bottom: 14px;
    }
    .item-preview {
      min-height: 170px;
      display: grid;
      place-items: center;
      border: 1px solid #bfa77f;
      border-radius: var(--radius);
      background:
        linear-gradient(135deg, rgba(31, 90, 69, .08), transparent 55%),
        #eee7d9;
      box-shadow: inset 0 0 0 1px #fffaf0;
    }
    .item-preview .icon { width: 88px; height: 88px; }
    .kalenc-preview {
      display: block;
      max-width: 172px;
      max-height: 290px;
      width: auto;
      height: auto;
      object-fit: contain;
      image-rendering: auto;
    }
    .item-identity.armor-set .item-preview { min-height: 300px; }
    .item-preview-note {
      display: flex;
      flex-direction: column;
      justify-content: center;
      border-left: 3px solid #b78654;
      padding: 18px 20px;
      color: var(--muted);
      background: var(--panel);
    }
    .item-preview-note strong { color: var(--text); }

    .sim-workspace {
      display: grid;
      grid-template-columns: minmax(350px, .82fr) minmax(590px, 1.38fr);
      gap: 20px;
      align-items: start;
    }
    .sim-column { min-width: 0; }
    .sim-column > .section:last-child { margin-bottom: 0; }
    .sim-threat-column {
      position: sticky;
      top: 88px;
      max-height: calc(100vh - 108px);
      overflow: auto;
      scrollbar-gutter: stable;
    }
    .sim-character-fields {
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }
    .sim-character-fields .field:first-child { grid-column: 1 / -1; }
    .sim-core-slots {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 9px;
    }
    .sim-core-slots .slot:last-child:nth-child(odd) { grid-column: 1 / -1; }
    .sim-advanced { margin-top: 12px; }
    .sim-advanced .slot-grid { margin-top: 12px; }
    .sim-note {
      margin: 0 0 12px;
      color: var(--dim);
      font-size: 12px;
    }

    /* Character Creation: the denser, icon-led KalEncyclopedia workflow
       redrawn as a Jade Archive screen. */
    body {
      background:
        radial-gradient(circle at 84% 8%, rgba(173, 129, 70, .09), transparent 24rem),
        repeating-linear-gradient(135deg, transparent 0 42px, rgba(31, 90, 69, .018) 42px 43px),
        var(--bg);
    }

    .sidebar {
      isolation: isolate;
      overflow: hidden;
    }
    .sidebar::before {
      content: "";
      position: absolute;
      inset: 0;
      z-index: -1;
      pointer-events: none;
      background:
        linear-gradient(180deg, rgba(13, 45, 35, .38), rgba(13, 45, 35, .74) 54%, rgba(13, 45, 35, .26)),
        linear-gradient(90deg, rgba(11, 36, 29, .1), rgba(11, 36, 29, .4));
    }
    .sidebar-illustration {
      position: absolute;
      inset: 0;
      z-index: -2;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: 64% center;
      opacity: .74;
      filter: saturate(.9) contrast(1.04);
      pointer-events: none;
    }

    main::before {
      content: "";
      display: block;
      width: 96px;
      height: 8px;
      margin: -9px 0 21px;
      border-top: 1px solid #aa7c48;
      border-bottom: 1px solid #aa7c48;
      opacity: .7;
    }

    h1, h2, h3, .brand strong {
      font-family: Georgia, "Times New Roman", serif;
    }

    .profile-switcher {
      display: flex;
      align-items: center;
      gap: 7px;
      border-left: 1px solid var(--line-soft);
      padding-left: 12px;
    }
    .profile-switcher label {
      color: var(--muted);
      font-size: 11px;
      white-space: nowrap;
    }
    .profile-switcher select {
      min-width: 132px;
      min-height: 34px;
      padding: 5px 26px 5px 9px;
      color: #f8f5ec;
      background: #1f5a45;
      border-color: #8d704e;
      font-weight: 700;
    }

    .character-tabs {
      display: flex;
      gap: 4px;
      margin: 0 0 18px;
      border-bottom: 1px solid #b99b70;
      padding: 0 8px;
    }
    .character-tabs a {
      position: relative;
      min-width: 106px;
      border: 1px solid transparent;
      border-bottom: 0;
      padding: 10px 15px 9px;
      color: var(--muted);
      text-align: center;
      font-family: Georgia, "Times New Roman", serif;
      font-weight: 700;
    }
    .character-tabs a.active {
      margin-bottom: -1px;
      border-color: #b99b70;
      color: #1f5a45;
      background: var(--panel);
      box-shadow: inset 0 3px 0 #a96f3d;
    }

    .character-banner {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      align-items: end;
      gap: 18px;
      margin-bottom: 18px;
      border: 1px solid #b99b70;
      border-radius: var(--radius);
      padding: 16px 18px;
      background:
        linear-gradient(105deg, rgba(31, 90, 69, .95), rgba(31, 90, 69, .82) 58%, rgba(128, 85, 45, .86)),
        var(--accent);
      color: #fff8e9;
      box-shadow: var(--shadow);
    }
    .character-banner .field { max-width: 360px; }
    .character-banner .field > span { color: #d7dfd9; }
    .character-banner input {
      color: #fff8e9;
      background: rgba(10, 40, 30, .32);
      border-color: rgba(237, 214, 174, .58);
      font-family: Georgia, "Times New Roman", serif;
      font-size: 20px;
      font-weight: 700;
    }
    .character-banner-actions { display: flex; flex-wrap: wrap; gap: 7px; }
    .character-banner .button {
      border-color: rgba(237, 214, 174, .5);
      color: #fff8e9;
      background: rgba(10, 40, 30, .2);
    }

    .character-layout {
      display: grid;
      grid-template-columns: minmax(310px, .76fr) minmax(520px, 1.24fr);
      gap: 20px;
      align-items: start;
    }

    .equipment-board {
      position: relative;
      min-height: 392px;
      border: 1px solid #aa8a5f;
      border-radius: var(--radius);
      padding: 16px;
      background:
        radial-gradient(circle at 50% 40%, rgba(53, 103, 78, .13), transparent 34%),
        linear-gradient(135deg, rgba(255,255,255,.48), transparent 55%),
        #e9e1d3;
      box-shadow: inset 0 0 0 1px #fffaf0;
    }
    .equipment-board::before {
      content: "裝";
      position: absolute;
      inset: 82px 0 auto;
      color: rgba(31, 90, 69, .07);
      font-family: Georgia, serif;
      font-size: 148px;
      line-height: 1;
      text-align: center;
      pointer-events: none;
    }
    .equipment-board-help {
      margin-bottom: 13px;
      color: var(--muted);
      font-size: 12px;
      text-align: center;
    }
    .equipment-slot-grid {
      position: relative;
      display: grid;
      grid-template-columns: repeat(3, minmax(76px, 1fr));
      gap: 10px;
    }
    .equipment-slot {
      min-width: 0;
      border: 1px solid #bba98c;
      border-radius: 9px;
      padding: 8px 6px;
      color: var(--text);
      background: rgba(248, 245, 236, .88);
      text-align: center;
      cursor: context-menu;
      box-shadow: 0 4px 12px rgba(42, 52, 44, .06);
    }
    .equipment-slot:hover, .equipment-slot:focus-visible {
      border-color: #9a6a3a;
      background: #fffaf0;
    }
    .equipment-slot .slot-icon {
      width: 48px;
      height: 48px;
      margin: 0 auto 6px;
    }
    .equipment-slot .slot-icon .icon { width: 42px; height: 42px; }
    .equipment-slot strong {
      display: block;
      overflow: hidden;
      color: #29473a;
      font-size: 11px;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .equipment-slot small {
      display: block;
      overflow: hidden;
      color: var(--dim);
      font-size: 10px;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .equipment-config {
      display: grid;
      gap: 13px;
    }
    .equipment-config-summary {
      display: grid;
      grid-template-columns: 62px 1fr;
      gap: 13px;
      align-items: center;
      border-bottom: 1px solid var(--line-soft);
      padding-bottom: 13px;
    }
    .equipment-config-summary .slot-icon { width: 58px; height: 58px; }
    .equipment-config-summary .icon { width: 52px; height: 52px; }
    .equipment-modifier-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
    }

    .point-ledger {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 9px;
      margin-bottom: 16px;
    }
    .point-ledger > div {
      border: 1px solid #c9b99e;
      border-radius: 8px;
      padding: 11px 12px;
      background: #eee7d9;
    }
    .point-ledger span {
      display: block;
      color: var(--dim);
      font-size: 10px;
      font-weight: 800;
      letter-spacing: .08em;
      text-transform: uppercase;
    }
    .point-ledger strong {
      color: var(--accent);
      font-size: 22px;
    }

    .skill-columns {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(248px, 1fr));
      gap: 14px;
    }
    .skill-card {
      position: relative;
      display: grid;
      grid-template-columns: 42px minmax(0, 1fr) auto;
      align-items: center;
      gap: 10px;
      border: 1px solid #c4b59d;
      border-radius: 8px;
      padding: 8px;
      background: #eee8dc;
    }
    .skill-card.locked { opacity: .54; filter: saturate(.5); }
    .skill-card .icon { width: 38px; height: 38px; }
    .skill-card strong { display: block; font-size: 13px; }
    .skill-grade { color: var(--danger); font-size: 11px; font-weight: 800; }
    .skill-grade.zero { color: var(--dim); }
    .skill-stepper { display: flex; gap: 3px; }
    .skill-stepper button { min-height: 28px; min-width: 28px; padding: 2px 7px; }
    .skill-tooltip {
      position: fixed;
      z-index: 80;
      width: min(380px, calc(100vw - 24px));
      border: 1px solid #ad8759;
      border-radius: 7px;
      padding: 13px 15px;
      color: #f5ecda;
      background: rgba(34, 43, 36, .97);
      box-shadow: 0 16px 46px rgba(17, 26, 21, .34);
      pointer-events: none;
    }
    .skill-tooltip strong { display: block; color: #d9b168; }
    .skill-tooltip .tip-grade { color: #90b6ff; }
    .skill-tooltip .tip-next { margin-top: 8px; border-top: 1px solid #70644d; padding-top: 8px; }
    .skill-tooltip small { color: #c7d0ca; }

    .quest-ledger { margin-bottom: 13px; }
    .quest-checklist { columns: 3 300px; column-gap: 12px; }
    .quest-check {
      break-inside: avoid;
      display: grid;
      grid-template-columns: 30px minmax(0, 1fr);
      gap: 7px;
      margin: 0 0 7px;
      border: 1px solid #d2c6b4;
      border-radius: 6px;
      padding: 7px;
      background: #f1ebdf;
    }
    .quest-check.future { opacity: .52; }
    .quest-status {
      width: 25px;
      height: 25px;
      min-height: 25px;
      border-radius: 4px;
      padding: 0;
      color: var(--dim);
      background: #fffaf0;
    }
    .quest-status.progress { color: #97622f; background: #f3dfbd; }
    .quest-status.finished { color: #fff; background: #1f5a45; }
    .quest-check strong { display: block; font-size: 12px; }
    .quest-check small { color: var(--dim); font-size: 10px; }

    .buff-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
      gap: 9px;
      margin-bottom: 16px;
    }
    .buff-card {
      border: 1px solid #c7b89f;
      border-radius: 8px;
      padding: 10px;
      background: #eee7da;
    }
    .buff-card.active {
      border-color: #477c60;
      background: #e1ebdf;
      box-shadow: inset 0 0 0 1px rgba(31, 90, 69, .13);
    }
    .buff-group-title {
      margin: 4px 0 8px;
      color: #365343;
      font-family: Georgia, "Times New Roman", serif;
    }
    .buff-toggle {
      display: grid;
      grid-template-columns: auto 46px minmax(0, 1fr);
      align-items: center;
      gap: 8px;
      cursor: pointer;
    }
    .buff-toggle input { accent-color: var(--accent); }
    .buff-toggle strong, .buff-toggle small { display: block; }
    .buff-toggle small { color: var(--dim); font-size: 10px; }
    .buff-icon {
      width: 44px;
      height: 44px;
      display: grid;
      place-items: center;
      border: 1px solid #b5a58c;
      border-radius: 5px;
      background: #221a13;
    }
    .buff-icon .icon { width: 42px; height: 42px; }
    .buff-grade { margin-top: 9px; }
    .buff-effect {
      min-height: 35px;
      margin: 8px 0;
      border-left: 2px solid #b78654;
      padding: 5px 7px;
      color: #405149;
      background: rgba(255, 250, 240, .64);
      font-size: 11px;
    }
    .buff-card-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 9px;
      margin-bottom: 9px;
    }
    .buff-card-head input[type="checkbox"] { accent-color: var(--accent); }
    .buff-card .field-grid { grid-template-columns: minmax(0, 1fr) 92px; }

    .mobile-nav { display: none; }

    @media (max-width: 1100px) {
      .metrics { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .directory-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .definition-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .split { grid-template-columns: 1fr; }
      .sim-workspace { grid-template-columns: 1fr; }
      .character-layout { grid-template-columns: 1fr; }
      .sim-threat-column { position: static; max-height: none; overflow: visible; }
    }

    @media (max-width: 760px) {
      .app-shell { display: block; }
      .sidebar { display: none; }
      .mobile-nav {
        display: flex;
        gap: 6px;
        overflow-x: auto;
        border-bottom: 1px solid var(--line-soft);
        padding: 8px 14px;
        background: #143d30;
      }
      .mobile-nav a {
        flex: 0 0 auto;
        border: 1px solid var(--line);
        border-radius: 999px;
        padding: 7px 11px;
        color: var(--muted);
        font-size: 12px;
      }
      .topbar {
        grid-template-columns: 1fr;
        gap: 8px;
        padding: 10px 14px;
      }
      .top-actions { justify-content: space-between; }
      .profile-switcher { border-left: 0; padding-left: 0; }
      .profile-switcher label { display: none; }
      main { padding: 22px 14px 52px; }
      .page-head { display: block; }
      .page-actions { justify-content: flex-start; margin-top: 14px; }
      .metrics { grid-template-columns: 1fr 1fr; }
      .directory-grid { grid-template-columns: 1fr; }
      .toolbar { grid-template-columns: 1fr; }
      .definition-grid { grid-template-columns: 1fr; }
      .result { grid-template-columns: 1fr; gap: 4px; }
      .kv { grid-template-columns: 1fr; }
      .kv > div:nth-child(odd) { border-top: 1px solid var(--line); }
      .item-identity { grid-template-columns: 1fr; }
      .item-preview { min-height: 124px; }
      .sim-core-slots, .sim-character-fields { grid-template-columns: 1fr; }
      .character-tabs { overflow-x: auto; padding: 0; }
      .character-tabs a { flex: 0 0 auto; min-width: 92px; }
      .character-banner { grid-template-columns: 1fr; }
      .point-ledger { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .equipment-modifier-grid { grid-template-columns: 1fr; }
      .quest-checklist { columns: 1; }
      .sim-character-fields .field:first-child,
      .sim-core-slots .slot:last-child:nth-child(odd) { grid-column: auto; }
    }

    @media (max-width: 430px) {
      .metrics { grid-template-columns: 1fr; }
      .connect-actions { display: grid; }
    }

    /* ── Sortable tables ─────────────────────────────────────────────── */
    table.sortable th { padding: 0; }
    table.sortable th.num, table.sortable td.num { text-align: right; }
    .sort-head {
      display: flex;
      align-items: center;
      gap: 5px;
      width: 100%;
      min-height: 0;
      border: 0;
      border-radius: 0;
      padding: 9px 11px;
      color: inherit;
      background: none;
      font: inherit;
      font-size: 10px;
      font-weight: 800;
      letter-spacing: .08em;
      text-transform: uppercase;
      cursor: pointer;
    }
    th.num .sort-head { justify-content: flex-end; }
    .sort-head:hover { color: var(--accent); background: rgba(31, 90, 69, .06); }
    .sort-head .sort-mark {
      width: 8px;
      color: var(--accent);
      font-size: 9px;
      opacity: 0;
    }
    .sort-head:hover .sort-mark { opacity: .4; }
    .sort-head .sort-mark::before { content: "\25B2"; }
    .sort-head.sorted { color: var(--accent); }
    .sort-head.sorted .sort-mark { opacity: 1; }
    .sort-head.sorted.desc .sort-mark::before { content: "\25BC"; }

    /* ── Compact entity pages ────────────────────────────────────────── */
    .detail-grid {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(250px, 330px);
      gap: 14px;
      align-items: start;
    }
    .detail-grid > .detail-side { position: sticky; top: 78px; }
    @media (max-width: 1080px) {
      .detail-grid { grid-template-columns: 1fr; }
      .detail-grid > .detail-side { position: static; }
    }

    .panel {
      margin: 0 0 12px;
      border: 1px solid var(--line);
      border-radius: var(--radius-sm);
      padding: 12px 14px 13px;
      background: var(--panel);
    }
    .panel:last-child { margin-bottom: 0; }
    .panel > h3 {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 12px;
      margin: 0 0 9px;
      color: var(--gold);
      font-size: 10.5px;
      font-weight: 800;
      letter-spacing: .1em;
      text-transform: uppercase;
    }
    .panel > h3 .panel-aside {
      color: var(--dim);
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0;
      text-transform: none;
    }
    .panel .table-wrap { margin: 0 -14px -13px; }
    .panel .table-wrap th:first-child .sort-head,
    .panel .table-wrap td:first-child { padding-left: 14px; }
    .panel .table-wrap td:last-child { padding-right: 14px; }

    .stat-lines {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
      gap: 0 26px;
    }
    .stat-line {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 12px;
      border-bottom: 1px dotted var(--line-soft);
      padding: 3px 0;
    }
    .stat-line > span { color: var(--muted); font-size: 12.5px; }
    .stat-line > b {
      color: var(--text);
      font-weight: 650;
      font-variant-numeric: tabular-nums;
      text-align: right;
    }
    .stat-line small { color: var(--dim); font-weight: 400; }

    .provenance-foot {
      margin-top: 18px;
      border-top: 1px solid var(--line-soft);
      padding-top: 10px;
    }
    .provenance-foot > summary {
      color: var(--dim);
      font-size: 12px;
      cursor: pointer;
    }
    .provenance-foot > summary:hover { color: var(--accent); }
    .provenance-body {
      margin-top: 10px;
      color: var(--muted);
      font-size: 12.5px;
    }
    .provenance-body > * + * { margin-top: 8px; }

    .entity-hero {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 12px;
    }
    .entity-hero .entity-portrait {
      display: grid;
      place-items: center;
      width: 88px;
      height: 88px;
      flex: none;
      border: 1px solid #bfa77f;
      border-radius: var(--radius-sm);
      background: linear-gradient(135deg, rgba(31, 90, 69, .08), transparent 55%), #eee7d9;
    }
    .entity-hero .entity-portrait .icon { width: 64px; height: 64px; image-rendering: pixelated; }
    .entity-hero .entity-portrait .kalenc-preview { max-width: 84px; max-height: 84px; }
    .entity-hero.tall .entity-portrait { width: 176px; height: 250px; }
    .entity-hero.tall .entity-portrait .kalenc-preview { max-width: 168px; max-height: 242px; }

    .cell-icon {
      display: inline-flex;
      align-items: center;
      gap: 7px;
    }
    .cell-icon .icon { flex: none; image-rendering: pixelated; }
    .icon-monster-blank {
      display: inline-block;
      border: 1px dashed var(--line-soft);
      border-radius: 4px;
      opacity: .5;
    }
    .monster-icon {
      border-radius: 3px;
      object-fit: cover;
      image-rendering: auto;
      background: #ddd6c7;
    }
    .entity-hero .entity-portrait .monster-icon {
      width: auto;
      height: auto;
      max-width: 84px;
      max-height: 64px;
    }

    /* ── Character Creation: the artifact's density ─────────────────── */
    .sim-workspace {
      grid-template-columns: minmax(340px, 400px) minmax(0, 1fr);
      gap: 16px;
    }
    .sim-column > .panel { margin-bottom: 14px; }
    .sim-character-fields { gap: 8px; grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .sim-character-fields .field:first-child { grid-column: auto; }
    .sim-character-fields .field > span { font-size: 10.5px; }
    .sim-character-fields input, .sim-character-fields select { padding: 5px 7px; }
    .sim-threat-column { top: 78px; }
    #simSheetPanel .sheet { margin-bottom: 14px; }
    .sheet-breakdown { margin-top: 10px; }
    .sheet-breakdown > summary { color: var(--muted); font-size: 12px; cursor: pointer; }
    .monster-search { width: 100%; margin-bottom: 10px; }

    .equipment-board-help { display: none; }
    .equipment-board { padding: 0; }
    .equipment-board::before { display: none; }
    .equipment-slot-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(168px, 1fr));
      gap: 7px;
    }
    .equipment-slot {
      display: flex;
      align-items: center;
      gap: 8px;
      min-height: 0;
      padding: 5px 7px;
      text-align: left;
    }
    .equipment-slot .slot-icon {
      display: grid;
      place-items: center;
      width: 34px;
      height: 34px;
      flex: none;
      border-radius: 5px;
    }
    .equipment-slot .slot-icon .icon { width: 30px; height: 30px; image-rendering: pixelated; }
    .equipment-slot-body { min-width: 0; flex: 1; }
    .equipment-slot strong {
      display: block;
      overflow: hidden;
      color: var(--text);
      font-size: 12px;
      font-weight: 650;
      white-space: nowrap;
      text-overflow: ellipsis;
    }
    .equipment-slot small {
      display: block;
      overflow: hidden;
      color: var(--dim);
      font-size: 10.5px;
      white-space: nowrap;
      text-overflow: ellipsis;
    }
    .equipment-slot.filled strong { color: var(--accent); }

    /* ── Cascading slot menu ─────────────────────────────────────────── */
    .slot-menu {
      position: fixed;
      z-index: 60;
      min-width: 210px;
      max-width: 320px;
      border: 1px solid var(--line);
      border-radius: var(--radius-sm);
      background: var(--panel);
      box-shadow: 0 18px 42px rgba(34, 48, 40, .22);
      font-size: 12.5px;
    }
    .slot-menu-head {
      border-bottom: 1px solid var(--line-soft);
      padding: 7px 11px;
      color: var(--gold);
      font-size: 10px;
      font-weight: 800;
      letter-spacing: .1em;
      text-transform: uppercase;
    }
    .slot-menu-list { margin: 0; padding: 4px 0; list-style: none; }
    .slot-menu-list .slot-menu-list {
      position: absolute;
      z-index: 1;
      top: -4px;
      left: 100%;
      display: none;
      min-width: 190px;
      max-width: 330px;
      max-height: 74vh;
      overflow-y: auto;
      border: 1px solid var(--line);
      border-radius: var(--radius-sm);
      background: var(--panel);
      box-shadow: 0 16px 36px rgba(34, 48, 40, .22);
    }
    /* Submenus open on hover and on keyboard focus, and flip to the left when
       the cascade would otherwise run off the right edge. */
    .slot-menu-item.has-children:hover > .slot-menu-list,
    .slot-menu-item.has-children:focus-within > .slot-menu-list { display: block; }
    .slot-menu.flip .slot-menu-list .slot-menu-list { left: auto; right: 100%; }
    .slot-menu-item {
      position: relative;
      display: flex;
      align-items: center;
      gap: 7px;
      padding: 5px 11px;
      color: var(--text);
      cursor: pointer;
    }
    .slot-menu-item:hover, .slot-menu-item:focus-visible {
      color: var(--accent);
      background: rgba(31, 90, 69, .08);
      outline: none;
    }
    .slot-menu-item > span:not(.slot-menu-arrow):not(.slot-menu-tick) {
      flex: 1;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .slot-menu-arrow { color: var(--dim); font-size: 10px; }
    .slot-menu-tick { width: 11px; color: var(--accent); font-size: 11px; }
    .slot-menu-item.checked, .slot-menu-item.marked { color: var(--accent); font-weight: 650; }
    .slot-menu-item.marked > .slot-menu-arrow { color: var(--accent); }
    .slot-menu-item.disabled { color: var(--dim); cursor: not-allowed; opacity: .55; }
    .slot-menu-item.disabled:hover { background: none; }
    .slot-menu-sep { margin: 4px 0; border-top: 1px solid var(--line-soft); }

    /* ── Buffs, compact enough to sit under the inventory ───────────── */
    .buff-group + .buff-group { margin-top: 4px; }
    .buff-group > summary {
      padding: 4px 0;
      color: var(--muted);
      font-size: 11.5px;
      font-weight: 650;
      cursor: pointer;
    }
    .buff-group > summary .dim { margin-left: 6px; font-weight: 400; }
    .buff-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
      gap: 6px;
      margin: 6px 0 8px;
    }
    .buff-card {
      display: grid;
      grid-template-columns: 1fr auto;
      align-items: center;
      gap: 4px 6px;
      border: 1px solid var(--line-soft);
      border-radius: 6px;
      padding: 5px 7px;
      background: var(--panel-2);
    }
    .buff-card.active { border-color: var(--accent); background: rgba(31, 90, 69, .07); }
    .buff-toggle {
      display: flex;
      align-items: center;
      gap: 6px;
      min-width: 0;
      cursor: pointer;
    }
    .buff-toggle input { flex: none; accent-color: var(--accent); }
    .buff-icon { display: grid; place-items: center; width: 24px; height: 24px; flex: none; }
    .buff-icon .icon { width: 24px; height: 24px; image-rendering: pixelated; }
    .buff-name {
      overflow: hidden;
      font-size: 11px;
      font-weight: 600;
      white-space: nowrap;
      text-overflow: ellipsis;
    }
    select.buff-grade { min-height: 0; padding: 2px 4px; font-size: 10.5px; }
    .buff-effect {
      grid-column: 1 / -1;
      overflow: hidden;
      color: var(--dim);
      font-size: 10px;
      white-space: nowrap;
      text-overflow: ellipsis;
    }

    .panel.wide { padding: 0; }
    .panel.wide .table-wrap { margin: 0; }
    .panel.wide .table-wrap th:first-child .sort-head,
    .panel.wide .table-wrap td:first-child { padding-left: 14px; }

    /* ── Quest maps ──────────────────────────────────────────────────── */
    .quest-layout {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(300px, 420px);
      gap: 14px;
      align-items: start;
    }
    .quest-map-column { position: sticky; top: 78px; }
    @media (max-width: 1180px) {
      .quest-layout { grid-template-columns: 1fr; }
      .quest-map-column { position: static; }
    }

    .map-filter-row {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
      margin-bottom: 12px;
      font-size: 11px;
    }
    .filter-chip {
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 3px 11px;
      color: var(--muted);
      background: var(--panel);
      font-size: 11.5px;
    }
    .filter-chip:hover { border-color: var(--accent); color: var(--accent); }
    .filter-chip.active {
      border-color: var(--accent);
      color: var(--accent-ink);
      background: var(--accent);
    }

    .map-tabs { display: flex; gap: 4px; flex-wrap: wrap; margin-bottom: 9px; }
    .map-tab {
      min-height: 0;
      border-radius: 5px;
      padding: 3px 8px;
      font-size: 11px;
      font-weight: 600;
    }
    .map-tab.active { border-color: var(--accent); color: var(--accent-ink); background: var(--accent); }
    .map-tab.active .dim { color: rgba(248, 245, 236, .7); }
    .map-tab .dim { margin-left: 4px; font-weight: 400; }
    .map-view.hidden { display: none; }
    .map-name { margin-bottom: 7px; color: var(--muted); font-size: 12px; }
    .map-wrap {
      position: relative;
      overflow: hidden;
      width: 100%;
      border: 2px solid var(--gold);
      border-radius: 7px;
      background: #1a1710;
    }
    .map-wrap img { display: block; width: 100%; height: 100%; object-fit: contain; }
    /* A missing image must not collapse the box, or every percentage-placed
       pin piles up at the top of a zero-height container. */
    .map-wrap.image-missing img { display: none; }
    /* Pins are positioned by percentage so they stay correct at any width;
       the translate keeps the dot centred on the point, and must be repeated
       inside the flash keyframes or the animation would undo it. */
    .map-pin {
      position: absolute;
      display: grid;
      place-items: center;
      width: 19px;
      height: 19px;
      min-height: 0;
      padding: 0;
      transform: translate(-50%, -50%);
      border: 1px solid #fffaf0;
      border-radius: 50%;
      color: #fff;
      background: rgba(31, 90, 69, .88);
      font-size: 9px;
      font-weight: 700;
      line-height: 1;
    }
    .map-pin:hover { border-color: var(--gold); background: var(--gold); color: #241b12; }
    .map-pin.flash { z-index: 5; animation: pinFlash 2.6s ease-out; }
    @keyframes pinFlash {
      0%   { box-shadow: 0 0 0 0 rgba(168, 111, 62, 1);  background: var(--gold); color: #241b12; transform: translate(-50%, -50%) scale(1.7); }
      60%  { box-shadow: 0 0 0 20px rgba(168, 111, 62, 0); background: var(--gold); color: #241b12; transform: translate(-50%, -50%) scale(1.7); }
      100% { box-shadow: 0 0 0 0 rgba(168, 111, 62, 0);  background: rgba(31, 90, 69, .88); color: #fff; transform: translate(-50%, -50%) scale(1); }
    }
    .map-missing {
      margin: 0 0 9px;
      border: 1px dashed var(--line);
      border-radius: var(--radius-sm);
      padding: 10px 12px;
      color: var(--dim);
      font-size: 12px;
    }
    .map-legend {
      max-height: 210px;
      overflow-y: auto;
      margin: 9px 0 0;
      padding: 0;
      list-style: none;
      font-size: 12px;
    }
    .map-legend li {
      display: flex;
      align-items: baseline;
      gap: 7px;
      border-bottom: 1px dotted var(--line-soft);
      padding: 2px 0;
      color: var(--muted);
    }
    .map-legend-pin, .pin-tag {
      min-height: 0;
      border-radius: 4px;
      padding: 1px 6px;
      color: var(--accent);
      background: var(--panel-2);
      font-size: 10.5px;
      font-weight: 700;
    }
    .map-legend-pin.flash, .pin-tag.flash { animation: tagFlash 2.6s ease-out; }
    @keyframes tagFlash {
      0%   { box-shadow: 0 0 0 0 rgba(168, 111, 62, 1);  background: var(--gold); color: #241b12; }
      60%  { box-shadow: 0 0 0 11px rgba(168, 111, 62, 0); background: var(--gold); color: #241b12; }
      100% { box-shadow: 0 0 0 0 rgba(168, 111, 62, 0);  background: var(--panel-2); color: var(--accent); }
    }
    .pin-tag-row { display: flex; gap: 4px; flex-wrap: wrap; }
    .pin-tag-city { margin-right: 3px; color: var(--gold); }
    .pin-tag.field, .pin-tag.action {
      color: var(--dim);
      background: var(--panel-3);
      cursor: default;
    }

    .route-steps { margin: 0; padding-left: 20px; font-size: 13px; }
    .route-steps li {
      display: flex;
      align-items: baseline;
      gap: 8px;
      border-bottom: 1px dotted var(--line-soft);
      padding: 4px 0;
      color: var(--muted);
    }
    .route-steps li:last-child { border-bottom: 0; }
    .route-steps.plain { list-style: decimal; }
    .route-steps .tag-row { margin-top: 5px; }

    .xp-band {
      display: inline-block;
      min-width: 26px;
      border-radius: 3px;
      padding: 0 5px;
      font-weight: 700;
      text-align: center;
    }
    .xp-band.dead { color: var(--dim); background: rgba(135, 144, 135, .14); }
    .xp-band.cold { color: #35618c; background: rgba(53, 97, 140, .14); }
    .xp-band.cool { color: #2f7355; background: rgba(47, 115, 85, .14); }
    .xp-band.even { color: #8a6a1f; background: rgba(168, 132, 31, .18); }
    .xp-band.warm { color: #a2601f; background: rgba(162, 96, 31, .16); }
    .xp-band.hot  { color: #a8402f; background: rgba(168, 64, 47, .16); }
    .xp-band.peak { color: #7a3b8c; background: rgba(122, 59, 140, .16); }

    tr.total-row td { border-top: 2px solid var(--line); border-bottom: 0; }
    tr.current-row { background: rgba(31, 90, 69, .08); }
    tr.current-row td { color: var(--text); font-weight: 650; }

    .talisman-rolls {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
      gap: 12px;
    }
    .talisman-roll {
      border: 1px solid var(--line-soft);
      border-radius: var(--radius-sm);
      padding: 10px 12px;
      background: var(--panel-2);
    }
    .talisman-roll-head {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 6px;
    }
    .talisman-roll .stat-lines { grid-template-columns: 1fr; }
    .talisman-props {
      margin: 0;
      color: var(--text);
      font-size: 13px;
      white-space: pre-wrap;
    }

    .item-flavour {
      margin: 10px 0 0;
      color: var(--muted);
      font-size: 12.5px;
      font-style: italic;
    }

    .versus-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 4px 26px;
    }
    .panel h4 {
      margin: 12px 0 5px;
      color: var(--muted);
      font-size: 10.5px;
      font-weight: 800;
      letter-spacing: .09em;
      text-transform: uppercase;
    }
    .panel h4:first-child, .versus-grid h4 { margin-top: 0; }

    .link-list { margin: 0; padding: 0; list-style: none; }
    .link-list li { padding: 3px 0; border-bottom: 1px dotted var(--line-soft); font-size: 13px; }
    .link-list li:last-child { border-bottom: 0; }
    .link-list small { display: block; color: var(--dim); font-size: 11.5px; }
  </style>
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" aria-label="Primary navigation">
      <img class="sidebar-illustration" id="sidebarIllustration" alt="" aria-hidden="true">
      <a class="brand" href="#/home">
        <span class="brand-mark">K</span>
        <span><strong>KAL ATLAS</strong><span>Linked knowledge base</span></span>
      </a>
      <div id="desktopNav"></div>
      <div class="sidebar-status" id="sidebarStatus">
        <strong>Waiting for data</strong>
        Select the project folder to begin.
      </div>
    </aside>

    <div class="workspace">
      <nav class="mobile-nav" id="mobileNav" aria-label="Mobile navigation"></nav>
      <header class="topbar">
        <form class="global-search" id="globalSearch">
          <label class="hidden" for="globalSearchInput">Search every entity</label>
          <input id="globalSearchInput" name="q" type="search" autocomplete="off"
                 placeholder="Search monsters, items, quests, skills, NPCs…">
          <button type="submit">Search</button>
        </form>
        <div class="top-actions">
          <div class="profile-switcher" id="profileSwitcher"></div>
          <span class="status-dot" id="statusDot" aria-hidden="true"></span>
          <span class="dim" id="topStatus">Not connected</span>
          <button class="small ghost" type="button" data-action="reconnect">Reconnect</button>
        </div>
      </header>

      <main id="main" tabindex="-1"></main>
    </div>
  </div>

  <input class="hidden" id="folderInput" type="file" webkitdirectory multiple>

  <dialog id="evidenceDialog">
    <div class="dialog-head">
      <h2 id="evidenceTitle">Source evidence</h2>
      <button class="small ghost" type="button" data-action="close-dialog">Close</button>
    </div>
    <div class="dialog-body" id="evidenceBody"></div>
  </dialog>

  <dialog id="equipmentDialog">
    <div class="dialog-head">
      <h2 id="equipmentTitle">Configure equipment</h2>
      <button class="small ghost" type="button" data-action="close-equipment">Close</button>
    </div>
    <div class="dialog-body" id="equipmentBody"></div>
  </dialog>

  <div class="skill-tooltip hidden" id="skillTooltip" role="tooltip"></div>

  <script>
    "use strict";

    // The application intentionally reads the project's generated CSVs at runtime.
    // No game value is duplicated into this HTML file.

    const CORE_FILES = {
      items: "bango_data/ITEMS.csv",
      itemAttributes: "bango_data/ITEM_ATTRIBUTES.csv",
      drops: "bango_data/DROPS.csv",
      messages: "bango_data/MESSAGES.csv",
      skills: "bango_data/SKILLS.csv",
      skillSchedules: "bango_data/SKILL_GRADE_SCHEDULES.csv",
      skillPrerequisites: "bango_data/SKILL_PREREQUISITES.csv",
      quests: "bango_data/QUESTS.csv",
      questSteps: "bango_data/QUEST_STEPS.csv",
      questStepItems: "bango_data/QUEST_STEP_ITEMS.csv",
      monsterQuests: "bango_data/MONSTER_QUESTS.csv",
      prefixes: "bango_data/PREFIXES.csv",
      prefixAttributes: "bango_data/PREFIX_ATTRIBUTES.csv",
      enhancementBonuses: "bango_data/ENHANCEMENT_BONUSES.csv",
      authority: "bango_data/CSV_AUTHORITY.csv"
    };

    const OPTIONAL_CSV_FILES = {
      legacyItems: "data/ITEMS.csv",
      legacyMonsters: "data/MONSTERS.csv",
      legacyDrops: "data/DROPS.csv",
      legacyPrefixes: "data/PREFIXES.csv",
      legacySkills: "data/SKILLS.csv",
      positions: "data/POSITIONS.csv",
      levelPlayers: "data/LVL_PLAYERS.csv",
      levelEggs: "data/LVL_EGGS.csv",
      enhancementLadder: "data/EBS.csv",
      itemStats: "analysis/kalenc_stat_vectors/ITEM_STATS.csv",
      prefixStats: "analysis/kalenc_stat_vectors/PREFIX_STATS.csv",
      routeQuests: "analysis/quest_route_101/FRIEND_QUESTS.csv",
      routeSteps: "analysis/quest_route_101/FRIEND_QUEST_STEPS.csv",
      routeNpcs: "analysis/quest_route_101/NPC_CHAINS.csv",
      routeReconciliation: "analysis/quest_route_101/QUEST_RECONCILIATION.csv"
    };

    const ROOT_ARTICLES = [
      "KalOnline_Knowledge_Base_v2.md",
      "KalOnline_Quest_Progression_Guide.md",
      "Detailed_World_Geography_and_Navigation.md",
      "Mage_Attacker_Skill_Progression.md",
      "Imperial_Mixing_System_Guide.md",
      "KalOnline_Engine_Formulas.md",
      "KalOnline_Simulator_Formulas.md"
    ];

    const state = {
      ready: false,
      loading: false,
      source: null,
      sourceKind: "",
      tables: {},
      optional: {},
      indexes: {},
      articles: [],
      zones: [],
      availableFiles: [],

    function escapeHtml(value) {
      return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function escapeAttr(value) {
      return escapeHtml(value).replaceAll("`", "&#096;");
    }

    function normalizeName(value) {
      return String(value ?? "")
        .normalize("NFKD")
        .replace(/[\u0300-\u036f]/g, "")
        .toLowerCase()
        .replace(/[^a-z0-9]+/g, "");
    }

    function displayGrade(value) {
      const number = Number(String(value ?? "").replace(/[^\d]/g, ""));
      return number ? `G${number}` : "—";
    }

    function normalizePath(value) {
      return String(value ?? "").replaceAll("\\", "/").replace(/^\.?\//, "");
    }

    function prettyNumber(value) {
      const number = Number(value);
      return Number.isFinite(number) ? number.toLocaleString("en-US") : String(value ?? "—");
    }

    function cleanText(value) {
      return String(value ?? "")
        .replaceAll("#n", "\n")
        .replaceAll("&#x20;", " ")
        .trim();
    }

    function parseJson(value, fallback = []) {
      if (value === "" || value == null) return fallback;
      try { return JSON.parse(value); }
      catch { return fallback; }
    }

    function routeHref(type, id = "", query = "") {
      const suffix = id === "" ? "" : `/${encodeURIComponent(String(id))}`;
      return `#/${type}${suffix}${query ? `?${query}` : ""}`;
    }

    function entityLink(type, id, label, extraClass = "") {
      if (id == null || id === "") return escapeHtml(label || "Unknown");
      return `<a class="${escapeAttr(extraClass)}" href="${routeHref(type, id)}">${escapeHtml(label || id)}</a>`;
    }

    function sourceButton(row, label = "Evidence") {
      const id = `ev-${++state.evidenceCounter}`;
      state.evidence.set(id, row);
      return `<button class="small ghost" type="button" data-action="show-evidence" data-evidence-id="${id}">${escapeHtml(label)}</button>`;
    }

    function provenanceTag(row) {
      const value = row?.provenance || "derived view";
      const className = value === "bango-file" ? "accent" : value.includes("legacy") ? "gold" : "blue";
      return `<span class="tag ${className}">${escapeHtml(value)}</span>`;
    }

    function tags(values, className = "") {
      return values.filter(value => value !== "" && value != null)
        .map(value => `<span class="tag ${className}">${escapeHtml(value)}</span>`).join("");
    }

    /* ── Dense reading surfaces ─────────────────────────────────────────
       `section` wraps a heading and a body in a full card and is right for a
       table or a workspace. Most of what an entity page shows is a dozen
       short label/value pairs, and a card each turns that into a page of
       mostly empty boxes. `panel` and `statLines` are the compact pair:
       one light frame, values on a tight baseline grid. */
    function panel(title, body, options = {}) {
      if (!body) return "";
      return `<section class="panel${options.wide ? " wide" : ""}">
        ${title ? `<h3>${escapeHtml(title)}${options.aside || ""}</h3>` : ""}
        ${body}</section>`;
    }

    function statLines(entries) {
      const rows = entries
        .filter(([, value]) => value !== "" && value != null)
        .map(([label, value, note]) => `<div class="stat-line">
          <span>${escapeHtml(label)}</span>
          <b>${value}${note ? ` <small>${note}</small>` : ""}</b></div>`).join("");
      return rows ? `<div class="stat-lines">${rows}</div>` : "";
    }

    /* Everything a player does not need in order to play — source lines,
       join methods, authority notes — collapses into one disclosure at the
       foot of the page instead of interrupting the content. */
    function provenanceFooter(body) {
      if (!body) return "";
      return `<details class="provenance-foot">
        <summary>Where this data comes from</summary>
        <div class="provenance-body">${body}</div></details>`;
    }

    function definitionGrid(entries) {
      const cells = entries.filter(([, value]) => value !== "" && value != null).map(([label, value]) => `
        <div class="definition">
          <dt>${escapeHtml(label)}</dt>
          <dd>${value}</dd>
        </div>`).join("");
      return cells ? `<dl class="definition-grid">${cells}</dl>` : "";
    }

    function emptyState(message) {
      return `<div class="empty">${escapeHtml(message)}</div>`;
    }

    function safeId(value) {
      return String(value ?? "").toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "");
    }

    function parseCsv(text) {
      const source = String(text ?? "").replace(/^\uFEFF/, "");
      const rows = [];
      let row = [];
      let field = "";
      let quoted = false;

      for (let i = 0; i < source.length; i += 1) {
        const char = source[i];
        if (quoted) {
          if (char === '"') {
            if (source[i + 1] === '"') {
              field += '"';
              i += 1;
            } else {
              quoted = false;
            }
          } else {
            field += char;
          }
          continue;
        }

        if (char === '"' && field === "") {
          quoted = true;
        } else if (char === ",") {
          row.push(field);
          field = "";
        } else if (char === "\n") {
          row.push(field.replace(/\r$/, ""));
          rows.push(row);
          row = [];
          field = "";
        } else {
          field += char;
        }
      }

      if (field !== "" || row.length) {
        row.push(field.replace(/\r$/, ""));
        rows.push(row);
      }

      while (rows.length && rows[rows.length - 1].every(cell => cell === "")) rows.pop();
      if (!rows.length) return [];
      const headers = rows.shift().map(header => header.trim());
      return rows.map((cells, rowIndex) => {
        const result = { __rowIndex: rowIndex };
        headers.forEach((header, index) => { result[header] = cells[index] ?? ""; });
        return result;
      });
    }

    async function openDb() {
      if (!("indexedDB" in window)) return null;
      return new Promise((resolve, reject) => {
        const request = indexedDB.open("kal-atlas", 1);
        request.onupgradeneeded = () => request.result.createObjectStore("handles");
        request.onsuccess = () => resolve(request.result);
        request.onerror = () => reject(request.error);
      });
    }

    async function rememberHandle(handle) {
      try {
        const db = await openDb();
        if (!db) return;
        await new Promise((resolve, reject) => {
          const request = db.transaction("handles", "readwrite").objectStore("handles").put(handle, "project");
          request.onsuccess = resolve;
          request.onerror = () => reject(request.error);
        });
        db.close();
      } catch {
        // Persistence is a convenience only; folder input remains available.
      }
    }

    async function recalledHandle() {
      try {
        const db = await openDb();
        if (!db) return null;
        const handle = await new Promise((resolve, reject) => {
          const request = db.transaction("handles", "readonly").objectStore("handles").get("project");
          request.onsuccess = () => resolve(request.result || null);
          request.onerror = () => reject(request.error);
        });
        db.close();
        return handle;
      } catch {
        return null;
      }
    }

    class DirectorySource {
      constructor(handle) {
        this.handle = handle;
      }

      async read(path) {
        const parts = normalizePath(path).split("/").filter(Boolean);
        let current = this.handle;
        for (let index = 0; index < parts.length - 1; index += 1) {
          current = await current.getDirectoryHandle(parts[index]);
        }
        const fileHandle = await current.getFileHandle(parts.at(-1));
        const file = await fileHandle.getFile();
        return file.text();
      }

      // Binary reads for the client icon set. `read` navigates by path and does
      // not consult `list`, so icons need no place in the directory walk.
      async file(path) {
        const parts = normalizePath(path).split("/").filter(Boolean);
        let current = this.handle;
        for (let index = 0; index < parts.length - 1; index += 1) {
          current = await current.getDirectoryHandle(parts[index]);
        }
        return (await current.getFileHandle(parts.at(-1))).getFile();
      }

      async list() {
        const result = new Set();
        const walk = async (handle, prefix, depth = 0) => {
          if (depth > 6) return;
          for await (const [name, child] of handle.entries()) {
            const path = normalizePath(prefix ? `${prefix}/${name}` : name);
            if (child.kind === "file") {
              if (/\.(csv|md)$/i.test(name)) result.add(path);
            } else if (
              path === "bango_data" ||
              path === "data" ||
              path === "analysis" ||
              path === "analysis/quest_route_101" ||
              path === "research" ||
              path === "research/bango_gitbook" ||
              path === "research/bango_gitbook/pages" ||
              path.startsWith("research/bango_gitbook/pages/")
            ) {
              await walk(child, path, depth + 1);
            }
          }
        };
        await walk(this.handle, "");
        return [...result].sort();
      }
    }

    // Serving the same single file from any static host. There is no directory
    // enumeration over HTTP, so the file list ships as SITE_MANIFEST.json and
    // is generated by tools\knowledge_base_site\build_site_manifest.py.
    class HttpSource {
      constructor(base, files) {
        this.base = base;
        this.files = files;
      }

      url(path) {
        return this.base + normalizePath(path).split("/").map(encodeURIComponent).join("/");
      }

      async read(path) {
        const response = await fetch(this.url(path), { cache: "no-store" });
        if (!response.ok) throw new Error(`${response.status} ${response.statusText}`);
        return response.text();
      }

      async file(path) {
        const response = await fetch(this.url(path), { cache: "no-store" });
        if (!response.ok) throw new Error(`${response.status} ${response.statusText}`);
        return response.blob();
      }

      async list() {
        return this.files;
      }
    }

    // A deployed bundle puts index.html at the site root beside the data; in
    // the project it sits two levels down. Try both rather than hard-code one,
    // so the same file works either way.
    function httpBaseCandidates() {
      const here = new URL(".", location.href);
      return [here.href, new URL("../../", here).href];
    }

    async function tryHttpConnect() {
      if (!/^https?:$/.test(location.protocol)) return false;
      for (const base of httpBaseCandidates()) {
        try {
          const response = await fetch(base + "SITE_MANIFEST.json", { cache: "no-store" });
          if (!response.ok) continue;
          const manifest = await response.json();
          if (!Array.isArray(manifest.files) || !manifest.files.length) continue;
          await loadProject(new HttpSource(base, manifest.files), "web");
          return true;
        } catch (error) {
          // Try the next candidate; a missing manifest is not an error here.
        }
      }
      return false;
    }

    class FileListSource {
      constructor(files) {
        this.files = new Map();
        for (const file of files) {
          const raw = normalizePath(file.webkitRelativePath || file.name);
          const markers = ["bango_data/", "data/", "analysis/", "research/", "assets/"];
          const positions = markers.map(marker => raw.indexOf(marker)).filter(index => index >= 0);
          const path = positions.length ? raw.slice(Math.min(...positions)) : file.name;
          this.files.set(path, file);
        }
      }

      async read(path) {
        const file = this.files.get(normalizePath(path));
        if (!file) throw new Error(`Missing file: ${path}`);
        return file.text();
      }

      async file(path) {
        const file = this.files.get(normalizePath(path));
        if (!file) throw new Error(`Missing file: ${path}`);
        return file;
      }

      async list() {
        return [...this.files.keys()].filter(path => /\.(csv|md)$/i.test(path)).sort();
      }
    }

    function setStatus(message, mode = "") {
      el.topStatus.textContent = message;
      el.statusDot.className = `status-dot ${mode}`.trim();
    }

    function renderLoading(message, progress = 0) {
      state.loading = true;
      setStatus("Loading project data", "");
      el.main.innerHTML = `
        <section class="connect">
          <div class="eyebrow">Local data connection</div>
          <h1>Building the atlas</h1>
          <p class="lede">Reading the current generated tables directly from the selected project folder.</p>
          <div class="progress" aria-label="Loading progress"><span style="width:${Math.max(2, Math.min(100, progress))}%"></span></div>
          <div class="loading-line">${escapeHtml(message)}</div>
        </section>`;
    }

    function renderConnect(error = "") {
      state.loading = false;
      setStatus(error ? "Connection failed" : "Not connected", error ? "error" : "");
      el.main.innerHTML = `
        <section class="connect">
          <div class="eyebrow">One-file local encyclopedia</div>
          <h1>Your KalOnline data, fully connected.</h1>
          <p class="lede">Select the <strong>Kalonline Assistant</strong> project folder. Kal Atlas reads its current CSVs in place, so a Bango refresh appears here without rebuilding or copying the data into the site.</p>
          ${error ? `<div class="callout error"><strong>Could not load the folder.</strong><br>${escapeHtml(error)}</div>` : ""}
          <div class="connect-actions">
            <button class="primary" type="button" data-action="pick-folder">Select project folder</button>
            <button class="ghost" type="button" data-action="fallback-folder">Use compatibility picker</button>
          </div>
          <div class="connect-list">
            <div><span class="accent">01</span><span>Every monster, item, skill, quest, NPC, prefix, enhancement row and article receives a stable address.</span></div>
            <div><span class="accent">02</span><span>Bango-current fields stay separate from legacy fallback values and carry their source line.</span></div>
            <div><span class="accent">03</span><span>No upload occurs. The browser reads files only after you select the local folder.</span></div>
          </div>
        </section>`;
